---
ReportDefinitions:
- reportName: PT_Defaulters
  summary: Data for defaulter property_id
  version: 1.0.0
  moduleName: pdc
  additionalConfig:
    print:
      pdfPageSize: "A1"
  sourceColumns:
  - name: tenantid
    label: tenantid
    type: string
    source: pdc
    total: false
  - name: district
    label: district
    type: string
    source: pdc
    total: false
  - name: property_id
    label: property_id
    type: string
    source: pdc
    total: false
  - name: amount_paid
    label: amount_paid
    type: string
    source: pdc
    total: false
  - name: receipt_date
    label: receipt_date
    type: string
    source: pdc
    total: false
  - name: receiptnumber
    label: receiptnumber
    type: string
    source: pdc
    total: false
  - name: paymentstatus
    label: paymentstatus
    type: string
    source: pdc
    total: false
  - name: paymentmode
    label: paymentmode
    type: string
    source: pdc
    total: false
  searchParams:
  - name: fromDate
    label: fromDate
    type: epoch
    source: pt
    isMandatory: true
    searchClause: AND pd.receiptdate >= $fromDate
  - name: tenantid
    label: tenantid
    type: string
    source: pdc
    isMandatory: false
    searchClause: AND d.tenantid = $tenantid
  query: |
      -- Use CTE to force query plan, compute & use CTE later
      WITH defaulters AS (
       SELECT tenantid, property_id
         FROM public.pt_defaulter_ids
          ),
       bill_info AS (
       SELECT 
        b.id AS billid, b.tenantid, b.consumercode,
        pd.amountpaid, pd.receiptdate, pd.receiptnumber,
        p.paymentmode, p.paymentstatus
      FROM egcl_bill b
      JOIN egcl_paymentdetail pd ON b.id = pd.billid
      JOIN egcl_payment p ON pd.paymentid = p.id
      WHERE b.businessservice = 'PT'
      AND pd.amountpaid > 0
      AND pd.receiptdate IS NOT NULL
      AND pd.receiptdate > $fromDate
      ),
      ulb_mapped AS (
      SELECT ulb_code, district, name_of_ulb
        FROM ulb_data
       )
      SELECT DISTINCT ON (d.property_id, bi.receiptnumber)
      u.name_of_ulb AS tenantid, u.district,
      d.property_id, bi.amountpaid AS amount_paid,
      TO_TIMESTAMP(bi.receiptdate / 1000) AS receipt_date, bi.receiptnumber,
      bi.paymentstatus, bi.paymentmode
      FROM defaulters d
      LEFT JOIN bill_info bi  ON d.property_id = bi.consumercode AND d.tenantid = bi.tenantid
      LEFT JOIN ulb_mapped u  ON d.tenantid = u.ulb_code
      WHERE d.tenantid= $tenantid
  orderby: ORDER BY d.property_id, bi.receiptnumber, bi.receiptdate DESC;

- reportName: PT_Invalid_Defaulters
  summary: Data for defaulter property_id with no receipt number
  version: 1.0.0
  moduleName: pdc
  additionalConfig:
    print:
      pdfPageSize: "A1"
  sourceColumns:
  - name: tenantid
    label: tenantid
    type: string
    source: pdc
    total: false
  - name: district
    label: district
    type: string
    source: pdc
    total: false
  - name: property_id
    label: property_id
    type: string
    source: pdc
    total: false
  searchParams:
  - name: fromDate
    label: fromDate
    type: epoch
    source: pt
    isMandatory: true
    searchClause: AND billdate > $fromDate
  - name: tenantid
    label: tenantid
    type: string
    source: pt
    isMandatory: false
    searchClause: AND d.tenantid = $tenantid
  query: |
      -- Use CTE to force query plan, compute & use CTE later
      WITH defaulters AS (
      SELECT tenantid, property_id
      FROM public.pt_defaulter_ids
      ),
      bills_after_april AS (
      SELECT tenantid, consumercode AS property_id
      FROM egcl_bill
      WHERE businessservice = 'PT'
          AND billdate > $fromDate
       ),
      ulb_mapped AS (
      SELECT ulb_code, district, name_of_ulb
      FROM ulb_data
      )
      SELECT 
      COALESCE(u.name_of_ulb, d.tenantid) AS tenantid,
      COALESCE(u.district, 'UNKNOWN') AS district,d.property_id
      FROM defaulters d
      LEFT JOIN bills_after_april b ON d.property_id = b.property_id AND d.tenantid = b.tenantid
      LEFT JOIN ulb_mapped u ON TRIM(LOWER(d.tenantid)) = TRIM(LOWER(u.ulb_code))
      WHERE b.property_id IS NULL
  orderby: ORDER BY d.property_id DESC;
      
- reportName: Defaulter_report_with_taxdue
  summary: Defaulter report with tax due
  version: 1.0.0
  moduleName: pdc
  additionalConfig:
    print:
      pdfPageSize: "A1"
  sourceColumns:
  - name: propertyid_property
    label: Property ID
    type: string
    source: pdc
    total: false
  - name: owner_ids
    label: Owner Id
    type: string
    source: pdc
    total: false
  - name: localities
    label: Locality
    type: string
    source: pdc
    total: false
  - name: landarea
    label: Plot size
    type: string
    source: pdc
    total: false
  - name: usagecategory
    label: Propertyusagetype
    type: string
    source: pdc
    total: false
  - name: 2019-20
    label: 2019-20
    type: string
    source: pdc
    total: false
  - name: 2020-21
    label: 2020-21
    type: string
    source: pdc
    total: false
  - name: 2021-22
    label: 2021-22
    type: string
    source: pdc
    total: false
  - name: 2022-23
    label: 2022-23
    type: string
    source: pdc
    total: false
  - name: 2023-24
    label: 2023-24
    type: string
    source: pdc
    total: false
  - name: 2024-25
    label: 2024-25
    type: string
    source: pdc
    total: false                                
  searchParams:  
  - name: tenantid
    label: tenantid
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: pdc
    wrapper: true
    isMandatory: true
    searchClause: AND 1=1
  query: |
      WITH demand_with_details AS (
        SELECT
          dd.id AS demand_id,
          dd.consumercode,
          (to_timestamp(dd.taxperiodfrom::double precision / 1000) AT TIME ZONE 'UTC') + interval '5 hours 30 minutes' AS taxperiodfrom_ist,
          COALESCE(dtd.taxamount, 0)::numeric AS taxamount,
          COALESCE(dtd.collectionamount, 0)::numeric AS collectionamount
        FROM egbs_demanddetail_v1 AS dtd
        JOIN egbs_demand_v1 AS dd
          ON dtd.demandid = dd.id
        WHERE dd.tenantid = $tenantid
          AND dd.status = 'ACTIVE'
          AND dd.businessservice = 'PT'
      ),
      
      due_by_consumercode_fy AS (
        SELECT
          consumercode,
          CASE WHEN extract(month FROM taxperiodfrom_ist) >= 4
               THEN extract(year FROM taxperiodfrom_ist)::int
               ELSE (extract(year FROM taxperiodfrom_ist)::int - 1)
          END AS fy_start,
          SUM(taxamount) AS tax_sum,
          SUM(collectionamount) AS coll_sum
        FROM demand_with_details
        GROUP BY consumercode,
                 CASE WHEN extract(month FROM taxperiodfrom_ist) >= 4
                      THEN extract(year FROM taxperiodfrom_ist)::int
                      ELSE (extract(year FROM taxperiodfrom_ist)::int - 1)
                 END
      ),
      
      due_label AS (
        SELECT
          consumercode,
          fy_start,
          (fy_start::text || '-' || RIGHT((fy_start + 1)::text, 2)) AS fy_label,
          (tax_sum - coll_sum) AS due_amount
        FROM due_by_consumercode_fy
      ),
      
      minmax_by_consumercode AS (
        SELECT
          consumercode,
          MIN(fy_start) AS min_fy_start,
          MAX(fy_start) AS max_fy_start
        FROM due_label
        GROUP BY consumercode
      ),
      
      all_target_fys_labeled AS (
        SELECT generate_series(2013, 2024) AS fy_start,
               (generate_series(2013, 2024)::text || '-' || RIGHT((generate_series(2013, 2024) + 1)::text, 2)) AS fy_label
      ),
      
      property_base AS (
        SELECT
          p.propertyid AS propertyid_property,
          p.id,
          p.landarea,
          p.usagecategory,
          array_remove(array_agg(DISTINCT o.userid), NULL) AS owner_ids,
          array_remove(array_agg(DISTINCT a.locality), NULL) AS localities
        FROM eg_pt_property AS p
        LEFT JOIN eg_pt_owner AS o ON o.propertyid = p.id
        LEFT JOIN eg_pt_address AS a ON a.propertyid = p.id
        WHERE p.tenantid = $tenantid
          AND p.status = 'ACTIVE'
        GROUP BY p.propertyid, p.id, p.landarea, p.usagecategory
      ),
      
      props_with_demand AS (
        SELECT pb.*, mm.min_fy_start, mm.max_fy_start
        FROM property_base pb
        JOIN minmax_by_consumercode mm
          ON mm.consumercode = pb.propertyid_property
      ),
      
      prop_fy_rows_demand AS (
        SELECT
          pw.propertyid_property,
          pw.id,
          pw.landarea,
          pw.usagecategory,
          pw.owner_ids,
          pw.localities,
          atf.fy_start,
          atf.fy_label,
          COALESCE(dl.due_amount, NULL) AS numeric_due_amount,
          CASE
            WHEN dl.due_amount IS NOT NULL THEN dl.due_amount::text
            WHEN atf.fy_start BETWEEN pw.min_fy_start AND pw.max_fy_start THEN 'Demand not generated, hence not paid'
            ELSE NULL
          END AS fy_val_text
        FROM props_with_demand pw
        CROSS JOIN all_target_fys_labeled atf
        LEFT JOIN due_label dl
          ON dl.consumercode = pw.propertyid_property
         AND dl.fy_start = atf.fy_start
      ),
      
      prop_rows_no_demand AS (
        SELECT
          pb.propertyid_property,
          pb.id,
          pb.landarea,
          pb.usagecategory,
          pb.owner_ids,
          pb.localities,
          NULL::int AS fy_start,
          NULL::text AS fy_label,
          NULL::numeric AS numeric_due_amount,
          NULL::text AS fy_val_text
        FROM property_base pb
        WHERE NOT EXISTS (
          SELECT 1 FROM minmax_by_consumercode mm WHERE mm.consumercode = pb.propertyid_property
        )
      ),
      
      prop_fy_union AS (
        SELECT * FROM prop_fy_rows_demand
        UNION ALL
        SELECT * FROM prop_rows_no_demand
      ),
      
      pivoted AS (
        SELECT
          propertyid_property,
          id,
          landarea,
          usagecategory,
          owner_ids,
          localities,
          MAX(CASE WHEN fy_label = '2013-14' THEN fy_val_text END) AS "2013-14",
          MAX(CASE WHEN fy_label = '2014-15' THEN fy_val_text END) AS "2014-15",
          MAX(CASE WHEN fy_label = '2015-16' THEN fy_val_text END) AS "2015-16",
          MAX(CASE WHEN fy_label = '2016-17' THEN fy_val_text END) AS "2016-17",
          MAX(CASE WHEN fy_label = '2017-18' THEN fy_val_text END) AS "2017-18",
          MAX(CASE WHEN fy_label = '2018-19' THEN fy_val_text END) AS "2018-19",
          MAX(CASE WHEN fy_label = '2019-20' THEN fy_val_text END) AS "2019-20",
          MAX(CASE WHEN fy_label = '2020-21' THEN fy_val_text END) AS "2020-21",
          MAX(CASE WHEN fy_label = '2021-22' THEN fy_val_text END) AS "2021-22",
          MAX(CASE WHEN fy_label = '2022-23' THEN fy_val_text END) AS "2022-23",
          MAX(CASE WHEN fy_label = '2023-24' THEN fy_val_text END) AS "2023-24",
          MAX(CASE WHEN fy_label = '2024-25' THEN fy_val_text END) AS "2024-25"
        FROM prop_fy_union
        GROUP BY propertyid_property, id, landarea, usagecategory, owner_ids, localities
      ),
      
      is_defaulter_flag AS (
        SELECT
          pb.propertyid_property,
          CASE
            WHEN EXISTS (
              SELECT 1
              FROM generate_series(2019, 2024) AS y(fy_start)
              WHERE (
                EXISTS (
                  SELECT 1 FROM due_label dl2
                  WHERE dl2.consumercode = pb.propertyid_property
                    AND dl2.fy_start = y.fy_start
                    AND dl2.due_amount > 0
                )
                OR (
                  EXISTS (SELECT 1 FROM minmax_by_consumercode mm2 WHERE mm2.consumercode = pb.propertyid_property)
                  AND y.fy_start BETWEEN
                      (SELECT mm3.min_fy_start FROM minmax_by_consumercode mm3 WHERE mm3.consumercode = pb.propertyid_property)
                  AND (SELECT mm4.max_fy_start FROM minmax_by_consumercode mm4 WHERE mm4.consumercode = pb.propertyid_property)
                  AND NOT EXISTS (
                    SELECT 1 FROM due_label dl3
                    WHERE dl3.consumercode = pb.propertyid_property
                      AND dl3.fy_start = y.fy_start
                  )
                )
              )
            ) THEN 'Yes' ELSE 'No' END AS IsDefaulter
        FROM property_base pb
      )
      
      SELECT
        p.propertyid_property AS propertyid_property,
        p.id,
        p.landarea,
        p.usagecategory,
        p.owner_ids AS owner_ids,
        p.localities AS localities,
        p."2013-14", p."2014-15", p."2015-16", p."2016-17", p."2017-18",
        p."2018-19", p."2019-20", p."2020-21", p."2021-22", p."2022-23",
        p."2023-24", p."2024-25",
        d.IsDefaulter AS IsDefaulter
      FROM pivoted p
      JOIN is_defaulter_flag d
        ON d.propertyid_property = p.propertyid_property
        AND d.IsDefaulter = 'Yes'
  orderby: ORDER BY p.propertyid_property       

     
