ReportDefinitions:
- reportName: CollectionsReportProfessionalRegistration
  decryptionPathId: LAYOUTREPORTS
  summary: Collection report for Professional Registration
  version: 1.0.0
  moduleName: rainmaker-prof_reg
  additionalConfig:
    print:
      pdfPageSize: A1

  sourceColumns:
  - name: applicationnumber
    label: Application Number
    type: string
    source: obpas
  - name: name
    label: Applicant Name
    type: string
    source: obpas
  - name: mobilenumber
    label: Mobile Number
    type: string
    source: obpas
  - name: businessservice
    label: Service
    type: string
    source: obpas
  - name: status
    label: Application Status
    type: string
    source: obpas
  - name: collector_code
    label: Collector Code
    type: string
    source: obpas
  - name: cash_amount
    label: Cash Amount
    type: string
    source: obpas
    total: true
  - name: cheque_amount
    label: Cheque Amount
    type: string
    source: obpas
    total: true
  - name: card_amount
    label: Card Amount
    type: string
    source: obpas
    total: true
  - name: dd_amount
    label: DD Amount
    type: string
    source: obpas
    total: true
  - name: neft_amount
    label: NEFT Amount
    type: string
    source: obpas
    total: true
  - name: rtgs_amount
    label: RTGS Amount
    type: string
    source: obpas
    total: true
  - name: online_amount
    label: Online Amount
    type: string
    source: obpas
    total: true
  - name: amountpaid
    label: Amount Paid
    type: string
    source: obpas
    total: true
  - name: payment_date
    label: Payment Date
    type: string
    source: obpas

  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas
    isMandatory: false
    searchClause: and createdtime >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas
    isMandatory: false
    searchClause: and createdtime <= $toDate
  - name: tenant
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=.MdmsRes.tenant.tenants._.code\$.MdmsRes.tenant.tenants._.name
    source: obpas
    isMandatory: false
    searchClause: and tenant = $tenant

  query: >
    WITH current_holder AS (
      SELECT DISTINCT ON (wf.businessid)
        wf.businessid AS applicationno,
        u.name AS employee_name,
        wf.tenantid,
        e.code AS assignee_code,
        wf.businessservice,
        UPPER(st.applicationstatus) AS current_stage
      FROM eg_wf_processinstance_v2 wf
      JOIN eg_wf_state_v2 st ON wf.status = st.uuid
      LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
      LEFT JOIN eg_user u ON u.uuid = wa.assignee
      LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
      WHERE wf.businessservice IN ('ENGINEER','ARCHITECT','TOWNPLANNER','SUPERVISOR')
      ORDER BY wf.businessid, wf.lastmodifiedtime DESC
    ),
    unique_transactions AS (
      SELECT
        p.createdtime,
        split_part(p.tenantid,'.',2) AS tenant,
        pd.amountpaid,
        CASE WHEN upper(p.paymentmode) IN ('CASH','OFFLINE_CASH') THEN pd.amountpaid ELSE 0 END AS cash_amount,
        CASE WHEN upper(p.paymentmode) = 'CHEQUE' THEN pd.amountpaid ELSE 0 END AS cheque_amount,
        CASE WHEN upper(p.paymentmode) IN ('CARD','DEBIT_CARD','CREDIT_CARD','OFFLINE_CARD') THEN pd.amountpaid ELSE 0 END AS card_amount,
        CASE WHEN upper(p.paymentmode) = 'DD' THEN pd.amountpaid ELSE 0 END AS dd_amount,
        CASE WHEN upper(p.paymentmode) IN ('NEFT','OFFLINE_NEFT') THEN pd.amountpaid ELSE 0 END AS neft_amount,
        CASE WHEN upper(p.paymentmode) IN ('RTGS','OFFLINE_RTGS','NEFT_RTGS') THEN pd.amountpaid ELSE 0 END AS rtgs_amount,
        CASE WHEN upper(p.paymentmode) = 'ONLINE' THEN pd.amountpaid ELSE 0 END AS online_amount,
        COALESCE(emp.code,'SELF') AS collector_code,
        a.applicationnumber,
        a.status,
        u_applicant.name,
        u_applicant.mobilenumber
      FROM egcl_paymentdetail pd
      JOIN egcl_payment p ON pd.paymentid = p.id
      LEFT JOIN egcl_bill bill ON bill.id = pd.billid
      LEFT JOIN eg_tl_tradelicense a ON trim(bill.consumercode)=trim(a.applicationnumber)
      LEFT JOIN eg_user u_applicant ON u_applicant.uuid = a.accountid
      LEFT JOIN eg_user u ON u.id::text = p.createdby::text
      LEFT JOIN eg_hrms_employee emp ON emp.uuid::text = u.uuid::text
      WHERE pd.businessservice = 'BPAREG'
      AND upper(p.paymentstatus) != 'CANCELLED'
    )
    SELECT
      to_char(to_timestamp(createdtime/1000),'DD-MM-YYYY HH24:MI:SS') AS payment_date,
      applicationnumber,
      tenant,
      name,
      mobilenumber,
      'Professional Registration' AS businessservice,
      status,
      collector_code,
      cash_amount, cheque_amount, card_amount, dd_amount, neft_amount, rtgs_amount, online_amount, amountpaid
    FROM unique_transactions
    WHERE tenant != 'testing'

  orderby: ORDER BY payment_date DESC

- reportName: ReceiptRegisterProfessionalRegistration
  decryptionPathId: LAYOUTREPORTS
  summary: Receipt register for Professional Registration
  version: 1.0.0
  moduleName: rainmaker-prof_reg

  sourceColumns:
  - name: receiptno
    label: Receipt Number
    type: string
    source: obpas
  - name: applicationno
    label: Application Number
    type: string
    source: obpas
  - name: tenant
    label: ULB Name
    type: string
    source: obpas
  - name: receiptdate
    label: Receipt Date
    type: string
    source: obpas
  - name: transactiondate
    label: Transaction Date
    type: string
    source: obpas
  - name: transaction_id
    label: Transaction Id
    type: string
    source: obpas
  - name: ownername1
    label: Owner Name
    type: string
    source: obpas
  - name: amountpaid
    label: Amount Paid
    type: string
    source: obpas
  - name: paymentmode
    label: Payment Mode
    type: string
    source: obpas
  - name: paymentstatus
    label: Payment Status
    type: string
    source: obpas

  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas
    isMandatory: false
    searchClause: and pd.receiptdate >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas
    isMandatory: false
    searchClause: and pd.receiptdate <= $toDate

  query: >
    SELECT
      pd.receiptnumber AS receiptno,
      bill.consumercode AS applicationno,
      split_part(pd.tenantid,'.',2) AS tenant,
      TO_CHAR(TO_TIMESTAMP(pd.receiptdate/1000),'DD-MM-YYYY') AS receiptdate,
      TO_CHAR(TO_TIMESTAMP(payment.instrumentdate/1000),'DD-MM-YYYY') AS transactiondate,
      payment.instrumentnumber AS transaction_id,
      usr.name AS ownername1,
      pd.amountpaid,
      payment.paymentmode,
      payment.paymentstatus
    FROM egcl_paymentdetail pd
    INNER JOIN egcl_bill bill ON bill.id = pd.billid
    INNER JOIN egcl_payment payment ON payment.id = pd.paymentid
    LEFT JOIN eg_tl_tradelicense a ON bill.consumercode = a.applicationnumber
    LEFT JOIN eg_user usr ON usr.id = payment.createdby::integer
    WHERE pd.businessservice = 'BPAREG'
    AND payment.paymentstatus != 'CANCELLED'

  orderby: ORDER BY pd.receiptdate DESC


- reportName: officers_with_highest_pendency_professional
  summary: Top officers with highest pendency – Professional Registration
  version: 1.0.0
  moduleName: rainmaker-prof_reg

  sourceColumns:
  - name: ulb_name
    label: ULB Name
    type: string
  - name: businessservice
    label: Service
    type: string
  - name: Officer_Designation
    label: Officer Designation
    type: string
  - name: pending_files
    label: Pending Files
    type: string
    total: true

  query: >
    WITH latest_assignee AS (
      SELECT DISTINCT ON (wf.businessid)
        wf.businessid,
        wf.tenantid,
        wf.businessservice,
        d.name AS designation_code
      FROM eg_wf_processinstance_v2 wf
      JOIN eg_wf_state_v2 st ON wf.status = st.uuid
      LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
      LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
      INNER JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
      INNER JOIN designation d ON a.designation = d.code
      WHERE wf.businessservice IN ('ENGINEER','ARCHITECT','TOWNPLANNER','SUPERVISOR')
      ORDER BY wf.businessid, wf.lastmodifiedtime DESC
    )
    SELECT
      INITCAP(REPLACE(tenantid,'pb.','')) AS ulb_name,
      businessservice,
      designation_code AS Officer_Designation,
      COUNT(DISTINCT businessid) AS pending_files
    FROM latest_assignee 
  groupby:  group by tenantid,businessservice,designation_code
  orderby:  order by pending_files DESC


- reportName: officers_wise_pendency_professional
  summary: Officers wise pendency trend – Professional Registration
  version: 1.0.0
  moduleName: rainmaker-prof_reg

  sourceColumns:
  - name: officer_designation
    label: Officer Designation
    type: string
  - name: day0
    label: Day 0
    type: string
    total: true
  - name: day1
    label: Day 1
    type: string
    total: true
  - name: day2
    label: Day 2
    type: string
    total: true
  - name: day3
    label: Day 3
    type: string
    total: true
  - name: day4
    label: Day 4
    type: string
    total: true
  - name: day5
    label: Day 5
    type: string
    total: true
  - name: day6
    label: Day 6
    type: string
    total: true
  - name: day7
    label: Day 7
    type: string
    total: true

  searchParams:
  - name: fromDate
    label: Date
    type: epoch
    source: obpas
    isMandatory: true
    searchClause: AND 1=1   

  query: >
    WITH params AS (
      SELECT
        (to_timestamp($fromDate / 1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS base_dt
    ),
    latest_assignee AS (
      SELECT DISTINCT ON (wf.businessid)
        wf.businessid,
        d.name AS designation_code,
        (to_timestamp(wf.lastmodifiedtime/1000)::date) AS created_date
      FROM eg_wf_processinstance_v2 wf
      LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
      LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
      INNER JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
      INNER JOIN designation d ON d.code = a.designation
      ORDER BY wf.businessid, wf.lastmodifiedtime DESC
    )
    SELECT
      COALESCE(designation_code,'UNASSIGNED') AS officer_designation,
      SUM(CASE WHEN created_date = base_dt THEN 1 ELSE 0 END) AS day0,
      SUM(CASE WHEN created_date = base_dt - 1 THEN 1 ELSE 0 END) AS day1,
      SUM(CASE WHEN created_date = base_dt - 2 THEN 1 ELSE 0 END) AS day2,
      SUM(CASE WHEN created_date = base_dt - 3 THEN 1 ELSE 0 END) AS day3,
      SUM(CASE WHEN created_date = base_dt - 4 THEN 1 ELSE 0 END) AS day4,
      SUM(CASE WHEN created_date = base_dt - 5 THEN 1 ELSE 0 END) AS day5,
      SUM(CASE WHEN created_date = base_dt - 6 THEN 1 ELSE 0 END) AS day6,
      SUM(CASE WHEN created_date = base_dt - 7 THEN 1 ELSE 0 END) AS day7
    FROM latest_assignee, params where 1 = 1
    
  groupby:  GROUP BY designation_code

