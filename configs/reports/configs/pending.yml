ReportDefinitions:
  - reportName: PendencyReportMiscellaneous
    summary: Pendency Report Miscellaneous
    version: 1.0.0
    moduleName: rainmaker-misc
    sourceColumns:
      - name: tenantid
        label: tenantid
        type: string
        source: rainmaker-misc
        total: false
      - name: servicename
        label: servicename
        type: string
        source: rainmaker-misc
        total: false
      - name: total_application
        label: total_application
        type: string
        source: rainmaker-misc
        total: false
      - name: pending_application_out_of_sla
        label: pending_application_out_of_sla
        type: string
        source: rainmaker-misc
        total: false
      - name: pendingapplpercentage
        label: pendingapplpercentage
        type: string
        source: rainmaker-misc
        total: false
    searchParams:
      - name: serviceselected
        label: serviceselected
        type: singlevaluelist
        pattern: 'list://TL%:TL-Renewal,SW%:SW-Service,WS%:WS-Service,FN%:FireNoc,BS%:Bill Amendment'
        source: rainmaker-misc
        isMandatory: false
        searchClause: AND ta.servicename =$serviceselected
      - name: tenantselected
        label: tenantid
        type: singlevaluelist
        pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
        source: rainmaker-misc
        wrapper: true
        isMandatory: false
        searchClause: AND ta.tenantid =$tenantselected
      - name: financialyear
        label: Financial Year
        type: singlevaluelist
        pattern: 'list://1427846400000:2015-16,1459468800000:2016-17,1491004800000:2017-18,1522521000000:2018-19,1522540800000:2019-20,1554076800000:2020-21,1617215400000:2021-22,1648751400000:2022-23,1680287400000:2023-24,1711909800000:2024-25'
        source: rainmaker-misc
        isMandatory: false
        searchClause: and ta.financialyear not like concat('%',$financialyear,'%')
    query: |
        WITH ws_data AS (SELECT tenantid, applicationno, applicationstatus, createdtime,'WS-Service' AS servicename,
        CASE WHEN EXTRACT(MONTH FROM TO_TIMESTAMP(createdtime / 1000)) >= 4 THEN TO_CHAR(TO_TIMESTAMP(createdtime / 1000), 'YYYY') || '-' ||
        RIGHT(TO_CHAR(TO_TIMESTAMP(createdtime / 1000) + INTERVAL '1 year', 'YYYY'), 2) ELSE TO_CHAR(TO_TIMESTAMP(createdtime / 1000) - INTERVAL '1 year', 'YYYY') || '-' ||
        RIGHT(TO_CHAR(TO_TIMESTAMP(createdtime / 1000), 'YYYY'), 2) END AS financialyear
        FROM eg_ws_connection WHERE connectionno IS NULL),
        sw_data AS (SELECT tenantid, applicationno, applicationstatus, createdtime, 'SW-Service' AS servicename,
        CASE WHEN EXTRACT(MONTH FROM TO_TIMESTAMP(createdtime / 1000)) >= 4 THEN TO_CHAR(TO_TIMESTAMP(createdtime / 1000), 'YYYY') || '-' ||
        RIGHT(TO_CHAR(TO_TIMESTAMP(createdtime / 1000) + INTERVAL '1 year', 'YYYY'), 2) ELSE TO_CHAR(TO_TIMESTAMP(createdtime / 1000) - INTERVAL '1 year', 'YYYY') || '-' ||
        RIGHT(TO_CHAR(TO_TIMESTAMP(createdtime / 1000), 'YYYY'), 2) END AS financialyear
        FROM eg_sw_connection WHERE connectionno IS NULL),
        tl_data AS (SELECT tenantid, applicationnumber, status, createdtime, 'TL-Service' AS servicename,financialyear
        FROM eg_tl_tradelicense WHERE licensenumber IS NULL),
        fn_data AS (SELECT tenantid, applicationnumber, status, createdtime, 'FirezNOC' AS servicename, financialyear
        FROM eg_fn_firenocdetail WHERE firestationid IS NULL),
        total_appl AS (
        SELECT tenantid, servicename, COUNT(*) AS cnt, financialyear FROM ws_data GROUP BY tenantid, servicename, financialyear
        UNION ALL
        SELECT tenantid, servicename, COUNT(*) AS cnt, financialyear FROM sw_data GROUP BY tenantid, servicename, financialyear
        UNION ALL
        SELECT tenantid, servicename, COUNT(*) AS cnt, financialyear FROM tl_data GROUP BY tenantid, servicename, financialyear
        UNION ALL
        SELECT tenantid, servicename, COUNT(*) AS cnt, financialyear FROM fn_data GROUP BY tenantid, servicename, financialyear),
        pending_appl AS (SELECT tenantid, applicationstatus, servicename, COUNT(*) AS cnt, financialyear
        FROM ws_data WHERE applicationstatus NOT IN ('CONNECTION_ACTIVATED', 'INITIATED','REJECTED','PENDING_FOR_CONNECTION_ACTIVATION','PENDING_FOR_PAYMENT')
        AND createdtime < (EXTRACT(EPOCH FROM now()) * 1000 - 11 * 24 * 60 * 60 * 1000)
        GROUP BY tenantid, applicationstatus, servicename, financialyear
        UNION ALL
        SELECT tenantid, applicationstatus, servicename, COUNT(*) AS cnt, financialyear
        FROM sw_data WHERE applicationstatus NOT IN ('CONNECTION_ACTIVATED', 'INITIATED','REJECTED','PENDING_FOR_CONNECTION_ACTIVATION','PENDING_FOR_PAYMENT')
        AND createdtime < (EXTRACT(EPOCH FROM now()) * 1000 - 11 * 24 * 60 * 60 * 1000)
        GROUP BY tenantid, applicationstatus, servicename, financialyear
        UNION ALL
        SELECT tenantid, status AS applicationstatus, servicename, COUNT(*) AS cnt, financialyear
        FROM tl_data
        WHERE status NOT IN ('INITIATED','REJECTED','PENDINGPAYMENT' , 'APPLIED','CANCELLED','APPROVED','CITIZENACTIONREQUIRED')
        AND createdtime < (EXTRACT(EPOCH FROM now()) * 1000 - 18 * 24 * 60 * 60 * 1000)
        GROUP BY tenantid, status, servicename, financialyear
        UNION ALL
        SELECT tenantid, status AS applicationstatus, servicename, COUNT(*) AS cnt, financialyear
        FROM fn_data
        WHERE status NOT IN ('INITIATED','REJECTED','PENDINGPAYMENT','CANCELLED','APPROVED','CITIZENACTIONREQUIRED','CITIZENACTIONREQUIRED-DV')
        AND createdtime < (EXTRACT(EPOCH FROM now()) * 1000 - 20 * 24 * 60 * 60 * 1000)
        GROUP BY tenantid, status, servicename, financialyear)
        SELECT ta.tenantid as tenantid, ta.servicename as servicename, SUM(ta.cnt) AS total_application,
        COALESCE(SUM(pa.cnt), 0) AS pending_application_out_of_sla,
        ROUND(COALESCE(SUM(pa.cnt), 0) * 100.0 / SUM(ta.cnt),2) AS pendingpercentage
        FROM total_appl ta LEFT JOIN pending_appl pa ON pa.tenantid = ta.tenantid
        AND pa.servicename = ta.servicename
        AND pa.financialyear = ta.financialyear
        WHERE ta.tenantid NOT IN ('pb.testing')
        AND ta.financialyear = $financialyear
        AND ta.tenantid = $tenantid
        AND ta.servicename = $servicename
    groupby: GROUP BY ta.tenantid, ta.servicename;
          
