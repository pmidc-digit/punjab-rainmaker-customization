        label: authorityID
        type: string
        source: rainmaker-misc
        total: false
      - name: authorityName
        label: authorityName
        type: string
        source: rainmaker-misc
        total: false
      - name: departmentID
        label: departmentID
        type: string
        source: rainmaker-misc
        total: false
      - name: TotalApplicationReceived
        label: TotalApplicationReceived
        type: string
        source: rainmaker-misc
        total: false
      - name: PendingBeyondTimelineApplicationCount
        label: PendingBeyondTimelineApplicationCount
        type: string
        source: rainmaker-misc
        total: false
    searchParams:
      - name: tenantId
        label: tenantid
        type: singlevaluelist
        pattern: http://localhost:8094/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
        source: rainmaker-misc
        wrapper: true
        isMandatory: false
        searchClause: AND authorityid =$tenantid
    query: |
       SELECT authorityid,authorityname,departmentid,totalapplicationreceived,pendingbeyondtimelineapplicationcount
       FROM public.authority_pendency_report WHERE 1=1
        
