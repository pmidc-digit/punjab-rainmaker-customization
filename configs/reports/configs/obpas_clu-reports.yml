---
ReportDefinitions:
- reportName: ApplicationDetailReportCLU
  summary: Details of file for CLU  per ULB
  version: 1.0.0
  moduleName: rainmaker-obpas_clu
  sourceColumns:
  - name: tenantid
    label: ULB Name
    type: string
    source: obpas_clu
    total: false
  - name: applicationno
    label: Application Number
    type: string
    source: obpas_clu
    total: false
  - name: localized_status
    label: Application Status
    type: string
    source: obpas_clu
    total: false
  - name: vasikadate
    label: Vasika Date
    type: string
    source: obpas_clu
    total: false
  - name: vasikanumber
    label: Vasika Number
    type: string
    source: obpas_clu
    total: false
  - name: plot_no
    label: Plot Number
    type: string
    source: obpas_clu
    total: false
  - name: zone_name
    label: Zone Name
    type: string
    source: obpas_clu
    total: false
  - name: ward_no
    label: Ward Number
    type: string
    source: obpas_clu
    total: false
  - name: businessservice
    label: Service
    type: string
    source: obpas_clu
    total: false
  - name: ULB_Type
    label: ULB Type
    type: string
    source: obpas_clu
    total: false
  - name: site_address
    label: Site Address
    type: string
    source: obpas_clu
    total: false
  - name: district_name
    label: District Name
    type: number
    source: obpas_clu
    total: false
  - name: net_plot_area
    label: Net Plot Area
    type: number
    source: obpas_clu
    total: false
  - name: road_widening_area
    label: Area Left For Road Widening
    type: number
    source: obpas_clu
    total: false
  - name: road_width
    label: Road Width At Site
    type: number
    source: obpas_clu
    total: false
  - name: building_category
    label: Building Category
    type: string
    source: obpas_clu
    total: false
  - name: applicant_name
    label: Applicant Name
    type: string
    source: obpas_clu
    total: false
  - name: applicant_mobile
    label: Applicant Mobile
    type: string
    source: obpas_clu
    total: false
  - name: professional_name
    label: Professional Name
    type: string
    source: obpas_clu
    total: false
  - name: professional_reg_id
    label: Professional Registration ID
    type: string
    source: obpas_clu
    total: false
  - name: professional_mobile
    label: Professional Mobile
    type: string
    source: obpas_clu
    total: false
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_clu
    isMandatory: false
    searchClause: and c.createdtime >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_clu
    isMandatory: false
    searchClause: and c.createdtime <= $toDate
  - name: ulb
    label: ULB Name
    type: singlevaluelist 
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_clu
    wrapper: true
    isMandatory: false
    searchClause: AND c.tenantid = $ulb
  - name: ULB_Type
    label: ULB Type
    type: singlevaluelist
    pattern: list://Municipal Council:Municipal Council,Municipal Corporation:Municipal Corporation,Nagar Panchayat:Nagar Panchayat
    source: obpas_clu 
    wrapper: true
    isMandatory: false
    searchClause: AND ad.additionaldetails::jsonb -> 'siteDetails'->> 'ulbType' = $ULB_Type
  - name: district_name
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_clu
    wrapper: true
    isMandatory: false
    searchClause: AND u.district  = $district_name
  - name: applicationstatus
    label: Application Status
    type: singlevaluelist
    pattern: 'list://DOCUMENTVERIFY_JC:Document Verify JC,PROFESSIONALACTIONREQUIRED:Professional Action Required,ATP_VERIFICATION_PENDING:ATP Verification Pending,DOCUMENTVERIFY_MTP/ME:Document Verify MTP/ME, E-SIGNED:E-Signed,FIELDINSPECTION_INPROGRESS:Field Inspection InProgress,ATPHQ_APPROVAL_PENDING:ATPHQ Approval Pending,PENDINGPAYMENT:Pending Payment,APPROVAL_PENDING:Approval Pending,MTP_VERIFICATION_PENDING:MTP Verification Pending,DOCUMENTVERIFY_DM:Document Verify DM,DOCUMENTVERIFY_JE/BI:Document Verify JE/BI,INITIATED:Initiated,DOCUMENTVERIFY_EO:Document Verify EO,PENDINGAPPROVAL:Pending Approval,PENDINGSANCTIONPAYMENT:Pending Snaction Paymnet,CANCELLED:Cancelled,REJECTED:Rejected,APPROVED:Approved,ADC_VERIFICATION_PENDING:ADC Verification Pending,DOC_VERIFICATION_PENDING:Document Verification Pending,EO_VERIFICATION_PENDING:EO Verification Pending,STP_VERIFICATION_PENDING:STP Verification Pending,PENDINGAPPLICATIONPAYMENT:Application Payment Pending,INSPECTION_REPORT_PENDING:Inspection Report Pending'
    source: obpas_clu
    isMandatory: false
    searchClause: AND c.applicationstatus = LOWER($applicationstatus)
  query: >
        Select 
          c.applicationno,c.createdtime,
          split_part(c.tenantid,'.',2) AS tenantid,
          c.vasikanumber,c.vasikadate,
          CASE 
            WHEN c.applicationstatus = 'DOCUMENTVERIFY_JC' THEN 'Document Verify JC'
            WHEN c.applicationstatus = 'PROFESSIONALACTIONREQUIRED' THEN 'Professional Action Required'
            WHEN c.applicationstatus = 'ATP_VERIFICATION_PENDING' THEN 'ATP Verification Pending'
            WHEN c.applicationstatus = 'DOCUMENTVERIFY_MTP/ME' THEN 'Document Verify MTP/ME'
            WHEN c.applicationstatus = 'E-SIGNED' THEN 'E-Signed'
            WHEN c.applicationstatus = 'REJECTED' THEN 'Rejected'
            WHEN c.applicationstatus = 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In Progress'
            WHEN c.applicationstatus = 'ATPHQ_APPROVAL_PENDING' THEN 'ATPHQ Approval Pending'
            WHEN c.applicationstatus = 'PENDINGPAYMENT' THEN 'Pending Payment'
            WHEN c.applicationstatus = 'ATP_VERIFICATION_PENDING' THEN 'ATP Verification Pending'
            WHEN c.applicationstatus = 'APPROVAL_PENDING' THEN 'Approval Pending'
            WHEN c.applicationstatus = 'MTP_VERIFICATION_PENDING' THEN 'MTP Verification Pending'
            WHEN c.applicationstatus = 'DOCUMENTVERIFY_JE/BI' THEN 'Document Verify JE/BI'
            WHEN c.applicationstatus = 'INITIATED' THEN 'Initiated'
            WHEN c.applicationstatus = 'INSPECTION_REPORT_PENDING' THEN 'Inspection Report Pending'
            WHEN c.applicationstatus = 'PENDINGAPPLICATIONPAYMENT' THEN 'Application Payment Pending'
            WHEN c.applicationstatus = 'STP_VERIFICATION_PENDING' THEN 'STP Verification Pending'
            WHEN c.applicationstatus = 'EO_VERIFICATION_PENDING' THEN 'EO Verification Pending'
            WHEN c.applicationstatus = 'DOC_VERIFICATION_PENDING' THEN 'Document Verification Pending'
            WHEN c.applicationstatus = 'ADC_VERIFICATION_PENDING' THEN 'ADC Verification Pending'
            WHEN c.applicationstatus = 'APPROVED' THEN 'Approved'
            WHEN c.applicationstatus = 'REJECTED' THEN 'Rejected'
            WHEN c.applicationstatus = 'CANCELLED' THEN 'Cancelled'
            WHEN c.applicationstatus = 'PENDINGSANCTIONPAYMENT' THEN 'Sanction Payment Pending'
            WHEN c.applicationstatus = 'PENDINGAPPROVAL' THEN 'Pending Approval'
            WHEN c.applicationstatus = 'DOCUMENTVERIFY_EO' THEN 'EO Document Verification'
           ELSE c.applicationstatus
           END AS localized_status,
          ad.additionaldetails::jsonb -> 'siteDetails' -> 'zone' ->> 'name' AS zone_name,
          ad.additionaldetails::jsonb -> 'siteDetails' ->> 'plotNo' AS plot_no,
          ad.additionaldetails::jsonb -> 'siteDetails' ->> 'wardNo' AS ward_no,
          ad.additionaldetails::jsonb -> 'siteDetails' ->> 'businessService' AS businessservice,
          ad.additionaldetails::jsonb -> 'siteDetails' ->> 'hadbastNo' AS hadbast_no,
          ad.additionaldetails::jsonb -> 'siteDetails' -> 'ulbName' ->'city' ->> 'ddrName'  AS DDR_Name,
          ad.additionaldetails::jsonb -> 'siteDetails'->> 'ulbType'  AS ULB_Type,
          ad.additionaldetails::jsonb -> 'siteDetails' -> 'ulbName' ->'city'->> 'ulbGrade'  AS ULB_Grade,
          ad.additionaldetails::jsonb -> 'siteDetails' -> 'ulbName'->'city'->> 'regionName'  AS Region_Name,
          ad.additionaldetails::jsonb -> 'siteDetails' -> 'roadType' ->> 'name' AS road_type,
          ad.additionaldetails::jsonb -> 'siteDetails' ->> 'proposedSiteAddress' AS site_address,
          ad.additionaldetails::jsonb -> 'siteDetails' -> 'ulbName' ->'city'->>'districtName'  AS district_name,
          ad.additionaldetails::jsonb -> 'siteDetails' ->> 'specificationPlotArea' AS specification_plot_area,
          ad.additionaldetails::jsonb -> 'siteDetails' ->> 'netPlotAreaAfterWidening' AS net_plot_area,
          ad.additionaldetails::jsonb -> 'siteDetails' ->> 'areaLeftForRoadWidening' AS road_widening_area,
          ad.additionaldetails::jsonb -> 'siteDetails' ->> 'roadWidthAtSite' AS road_width,
          ad.additionaldetails::jsonb -> 'siteDetails' -> 'appliedCluCategory' ->> 'name' AS building_category,
          ad.additionaldetails::jsonb -> 'applicationDetails' -> 'owners' -> 0 ->> 'ownerOrFirmName' AS applicant_name,
          ad.additionaldetails::jsonb -> 'applicationDetails' -> 'owners' -> 0 ->> 'mobileNumber' AS applicant_mobile,
          ad.additionaldetails::jsonb -> 'applicationDetails' ->> 'professionalName' AS professional_name,
          ad.additionaldetails::jsonb -> 'applicationDetails' ->> 'professionalRegId' AS professional_reg_id,
          ad.additionaldetails::jsonb -> 'applicationDetails' ->> 'professionalMobileNumber' AS professional_mobile 
          from eg_clu c
         inner join eg_clu_details ad on c.id = ad.cluid
         inner join ulb_data u on u.ulb_code=c.tenantid
         where 1=1 and c.tenantid != 'pb.testing'
  groupby: GROUP BY c.applicationno,c.applicationstatus, c.vasikadate, c.vasikanumber,ad.additionaldetails,c.createdtime,c.tenantid
  orderby: ORDER BY c.createdtime ;      

- reportName: officers_with_highest_pendency
  summary: Top 7 officers with Highest Pendency
  version: 1.0.0
  moduleName: rainmaker-obpas_clu
  additionalConfig:
    print:
       pdfPageSize: A4
  sourceColumns:
  - name: ulb_type
    label: ULB Type
    type: string
    source: obpas_clu
    total: false
  - name: ulb_name
    label: ULB Name
    type: string
    source: obpas_clu
    total: false
  - name: Officer_Designation
    label: Officer Designation
    type: string
    source: obpas_clu
    total: false
  - name: pending_files
    label: Pending Files
    type: string
    source: obpas_clu
    total: true
  searchParams:
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_clu
    isMandatory: false
    searchClause: AND tenantid = $ulb
  - name: district_name
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_clu
    wrapper: true
    isMandatory: false
    searchClause: AND u.district  = $district_name
  - name: ULB_Type
    label: ULB Type
    type: singlevaluelist
    pattern: list://Municipal Council:Municipal Council,Municipal Corporation:Municipal Corporation,Nagar Panchayat:Nagar Panchayat
    source: obpas_clu 
    wrapper: true
    isMandatory: false
    searchClause: AND m.ulb_type = $ULB_Type
  query: >
      WITH latest_assignee AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid,st.applicationstatus,
          wf.tenantid,
          wf.businessservice,
          d.name AS designation_code
        FROM eg_wf_processinstance_v2 wf
        JOIN eg_wf_state_v2 st    ON wf.status = st.uuid
        LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
        LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
        inner JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
        inner join designation d on a.designation = d.code
         WHERE wf.businessservice in ('CLU_MC','CLU_MC_HIGH','CLU_MC_OTH','CLU_NP','CLU_NP_HIGH','CLU_NP_OTH')
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      ),    
      pending_files AS (
        SELECT
          c.id::text AS clu_id,
          c.applicationno,
          c.tenantid,
          c.status,
          ad.additionaldetails::jsonb -> 'siteDetails' ->> 'ulbType' AS ulb_type
         FROM eg_clu c
         INNER JOIN eg_clu_details ad ON c.id = ad.cluid
         WHERE c.status NOT IN ('INITIATED', 'CANCELLED')
      ),    
      merged AS (
        SELECT
          la.tenantid, p.ulb_type,
          INITCAP(REPLACE(la.tenantid, 'pb.', '')) AS ulb_name,
          la.designation_code,
          la.businessservice,
          COUNT(DISTINCT p.clu_id) AS pending_files
        FROM latest_assignee la
        LEFT JOIN pending_files p
          ON (
               p.clu_id = la.businessid
            OR p.applicationno = la.businessid
          )
        GROUP BY la.tenantid, INITCAP(REPLACE(la.tenantid, 'pb.', '')), la.designation_code, la.businessservice,p.ulb_type
      )      

      SELECT
        ROW_NUMBER() OVER (ORDER BY pending_files DESC) AS Serial_No,
        ulb_name ,businessservice,m.ulb_type,
        designation_code as Officer_Designation,
        pending_files 
      FROM merged  m
      inner join ulb_data u on u.name_of_ulb=m.ulb_name
      where  designation_code <> 'Clerk' and designation_code <> 'Accountant'
  orderby: ORDER BY pending_files DESC limit 7
    
- reportName: BeyondTimelineSummary
  summary: Summary of district-ulb wise application which breached its SLA
  version: 1.0.0
  moduleName: rainmaker-obpas_clu
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: ulb_type
    label: ULB Type
    type: string
    source: obpas_clu
    total: false
  - name: district
    label: District
    type: string
    source: obpas_clu
    total: false
  - name: name_of_ulb
    label: ULB Name
    type: string 
    source: obpas_clu
    total: false
  - name: beyond_timeline_count
    label: Beyond Timeline Count
    type: string
    source: obpas_clu
    total: false
  searchParams:
  - name: district
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_clu
    isMandatory: false
    searchClause: AND u.district = $district
  - name: ulb_name
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_clu
    isMandatory: false
    searchClause: AND u.ulb_code= $ulb_name
  - name: ULB_Type
    label: ULB Type
    type: singlevaluelist
    pattern: list://Municipal Council:Municipal Council,Municipal Corporation:Municipal Corporation,Nagar Panchayat:Nagar Panchayat
    source: obpas_clu 
    wrapper: true
    isMandatory: false
    searchClause: AND sc.ulb_type = $ULB_Type
  query: >
      WITH wf_detailed AS (
         SELECT
           wf.businessid AS uuid,
           wf.businessservice,UPPER(st.applicationstatus) AS applicationstatus,
           wf.tenantid,
           wf.createdtime,
           wf.lastmodifiedtime,
           st.state,
           st.sla AS state_sla
           FROM eg_wf_processinstance_v2 wf
           JOIN eg_wf_state_v2 st ON wf.status = st.uuid
           WHERE wf.businessservice IN ('CLU_MC','CLU_MC_HIGH','CLU_MC_OTH','CLU_NP','CLU_NP_HIGH','CLU_NP_OTH')
           and st.applicationstatus not in ('CANCELLED')         
       ),
      inspection_time AS (
          SELECT
           uuid,
             MAX(CASE  WHEN applicationstatus = 'FIELDINSPECTION_INPROGRESS'  THEN createdtime  END
              ) AS inspection_start
           FROM wf_detailed
          GROUP BY uuid
          ), 
      latest_status AS (
         SELECT DISTINCT ON (uuid)
           uuid,
           businessservice,
           tenantid,
           applicationstatus ,
           state AS current_state,
           lastmodifiedtime
           FROM wf_detailed
           ORDER BY uuid, lastmodifiedtime DESC
           ),
      sla_data AS (
         SELECT
           businessservice, businessservicesla
           FROM eg_wf_businessservice_v2
           WHERE businessservice IN ('CLU_MC','CLU_MC_HIGH','CLU_MC_OTH','CLU_NP','CLU_NP_HIGH','CLU_NP_OTH')
           ),
      sla_calc AS (
         SELECT
           ls.uuid,
           ls.tenantid,
           ls.businessservice,
           it.inspection_start,
           ls.lastmodifiedtime,
           sla.businessservicesla,ad.additionaldetails::jsonb -> 'siteDetails' ->> 'ulbType' AS ulb_type,
           CASE WHEN(ls.lastmodifiedtime - it.inspection_start) > sla.businessservicesla  THEN 'BREACHED' ELSE 'MET'
           END AS timeline_status
           FROM latest_status ls
           JOIN inspection_time it ON ls.uuid = it.uuid
           JOIN sla_data sla  ON sla.businessservice = ls.businessservice
           INNER JOIN eg_clu c ON c.applicationno = ls.uuid OR c.id::text = ls.uuid
           INNER JOIN eg_clu_details ad ON c.id = ad.cluid
           WHERE it.inspection_start IS NOT NULL
           )
       SELECT
          u.district,
          u.name_of_ulb,sc.ulb_type, 
          COUNT(CASE WHEN sc.timeline_status = 'MET' THEN 1 END) AS met_count,
          COUNT(CASE WHEN sc.timeline_status = 'BREACHED' THEN 1 END) AS beyond_timeline_count
          FROM sla_calc sc
          JOIN ulb_data u ON sc.tenantid = u.ulb_code
          WHERE 1=1 
  groupby: GROUP BY u.district, u.name_of_ulb,sc.ulb_type
  orderby: ORDER BY u.district, u.name_of_ulb ,sc.ulb_type DESC

