      WITH current_holder AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid AS applicationno,
          u.name AS employee_name,
          e.code AS assignee_code,
          UPPER(st.applicationstatus) AS current_stage
        FROM eg_wf_processinstance_v2 wf
        JOIN eg_wf_state_v2 st ON wf.status = st.uuid
        LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
        LEFT JOIN eg_user u ON u.uuid = wa.assignee
        LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
        WHERE  wf.businessservice in ('CLU_MC','CLU_MC_HIGH','CLU_MC_OTH','CLU_NP','CLU_NP_HIGH','CLU_NP_OTH')
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      ),
      
      unique_transactions AS (
        SELECT
          p.id AS transaction_id,
          p.createdtime, p.tenantid AS payment_tenant,
          pd.amountpaid,
          CASE WHEN upper(p.paymentmode) IN ('CASH','OFFLINE_CASH') THEN pd.amountpaid ELSE 0 END AS cash_amount,
          CASE WHEN upper(p.paymentmode) = 'CHEQUE' THEN pd.amountpaid ELSE 0 END AS cheque_amount,
          CASE WHEN upper(p.paymentmode) IN ('CARD','DEBIT_CARD','CREDIT_CARD','OFFLINE_CARD') THEN pd.amountpaid ELSE 0 END AS card_amount,
          CASE WHEN upper(p.paymentmode) = 'DD' THEN pd.amountpaid ELSE 0 END AS dd_amount,
          CASE WHEN upper(p.paymentmode) IN ('NEFT','OFFLINE_NEFT') THEN pd.amountpaid ELSE 0 END AS neft_amount,
          CASE WHEN upper(p.paymentmode) IN ('RTGS','OFFLINE_RTGS','NEFT_RTGS') THEN pd.amountpaid ELSE 0 END AS rtgs_amount,
          CASE WHEN upper(p.paymentmode) = 'ONLINE' THEN pd.amountpaid ELSE 0 END AS online_amount,
          COALESCE(emp.code, 'SELF') AS collector_code,
          a.id AS clu_id,
          a.applicationno,
          a.applicationstatus,
          u_applicant.name,
          u_applicant.mobilenumber,
          ch.employee_name AS assignee_employee,
          ch.assignee_code   AS assignee_code,
          bill.consumercode  AS bill_consumercode,
          CASE WHEN a.applicationno IS NULL THEN 'NO_MATCH_IN_EG_CLU' ELSE 'MATCHED' END AS match_status,
          d.additionaldetails::jsonb -> 'siteDetails' ->> 'ulbType' AS ulb_type
        FROM egcl_paymentdetail pd
        JOIN egcl_payment p ON pd.paymentid = p.id
        LEFT JOIN egcl_bill bill ON bill.id = pd.billid
        -- tolerant matching: try matching consumercode to applicationno OR to id (stringified)
        LEFT JOIN eg_clu a ON trim(bill.consumercode) = trim(a.applicationno)
                           OR trim(bill.consumercode) = trim(a.id::text)
        LEFT JOIN eg_clu_owner o ON o.cluid = a.id
        LEFT JOIN eg_user u_applicant ON u_applicant.uuid = o.uuid
        LEFT JOIN eg_clu_details d ON d.cluid = a.id
        LEFT JOIN eg_user u ON u.id::text = p.createdby::text
        LEFT JOIN eg_hrms_employee emp ON emp.uuid::text = u.uuid::text
        LEFT JOIN current_holder ch ON ch.applicationno = a.applicationno OR ch.applicationno = a.id::text
        WHERE pd.businessservice = 'clu'
          AND upper(p.paymentstatus) != 'CANCELLED'   
      ) 
      SELECT
        to_char(to_timestamp(ut.createdtime / 1000),'DD-MM-YYYY HH24:MI:SS') AS payment_date,
        ulb.name_of_ulb AS ulb_name,
        ut.ulb_type,
        ut.applicationno,
        ut.bill_consumercode,
        ut.name,
        ut.mobilenumber,
        'CLU' AS businessservice,
        ut.applicationstatus,
        ut.collector_code,
        ut.cash_amount, 
        ut.cheque_amount, 
        ut.card_amount, 
        ut.dd_amount, 
        ut.neft_amount, 
        ut.rtgs_amount, 
        ut.online_amount, 
        ut.amountpaid
        FROM unique_transactions ut
        LEFT JOIN ulb_data ulb ON ulb.ulb_code = ut.payment_tenant
       where 1=1 
  orderby: ORDER BY createdtime DESC 
  
- reportName: SLAReportCLU
  decryptionPathId: LAYOUTREPORTS
  summary: SLA report for clu service
  version: 1.0.0
  moduleName: rainmaker-obpas_clu
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: tenantid
    label: ULB Name
    type: string
    source: obpas_clu
    total: false
  - name: clu_application_no
    label: Application Number
    type: string
    source: obpas_clu
    total: false
  - name: document_verify_on
    label: Document Verified On
    type: string
    source: obpas_clu
    total: false
  - name: finalstatus_on
    label: Approval / Rejection On
    type: string
    source: obpas_clu
    total: false
  - name: final_status
    label: Application status
    type: string
    source: obpas_clu
    total: false
  - name: sla_status
    label: Sla Status
    type: string
    source: obpas_clu
    total: false
  - name: sla_days
    label: SLA Days 
    type: string
    source: obpas_clu
    total: false
  - name: employee_name
    label: Employee Name
    type: string
    source: obpas_clu
    total: false
  - name: employee_code
    label: Employee Code / Current Holder Code
    type: string
    source: obpas_clu
    total: false
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_clu
    isMandatory: false
    searchClause: AND n.createdtime >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_clu
    isMandatory: false
    searchClause: AND n.createdtime <= $toDate
  - name: ulb
    label: ULB Name
    type: singlevaluelist 
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_clu
    wrapper: true
    isMandatory: false
    searchClause: AND u_data.ulb_code = $ulb
  - name: district_name
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_clu
    wrapper: true
    isMandatory: false
    searchClause: AND u_data.district  = $district_name
  query: |
      WITH wf_detailed AS (
          SELECT 
              wf.businessid AS uuid,                                 
              UPPER(TRIM(st.applicationstatus)) AS applicationstatus,
              wf.createdtime,
              wf.lastmodifiedtime,
              wf.businessservicesla,
              wf.tenantid,
              wf.id AS processinstanceid
          FROM eg_wf_processinstance_v2 wf
          JOIN eg_wf_state_v2 st ON wf.status = st.uuid
          WHERE wf.businessservice IN (
              'CLU_MC','CLU_MC_HIGH','CLU_MC_OTH',
              'CLU_NP','CLU_NP_HIGH','CLU_NP_OTH'
          )
      ),
      status_times AS (
          SELECT
              uuid,
              MAX(CASE WHEN applicationstatus = 'FIELDINSPECTION_INPROGRESS' THEN createdtime END) AS docverify_time,
              MAX(CASE WHEN applicationstatus IN ('APPROVED','REJECTED','E-SIGNED','BLOCKED') THEN lastmodifiedtime END) AS final_time
          FROM wf_detailed
          GROUP BY uuid
      ),
      latest_status AS (
          SELECT uuid, applicationstatus
          FROM (
              SELECT
                  uuid,
                  applicationstatus,
                  lastmodifiedtime,
                  ROW_NUMBER() OVER (PARTITION BY uuid ORDER BY lastmodifiedtime DESC NULLS LAST) AS rn
              FROM wf_detailed
          ) x
          WHERE rn = 1
      ),
      sla_data AS (
          SELECT businessservice, businessservicesla
          FROM eg_wf_businessservice_v2
          WHERE businessservice IN (
              'CLU_MC','CLU_MC_HIGH','CLU_MC_OTH',
              'CLU_NP','CLU_NP_HIGH','CLU_NP_OTH'
          )
      ),
      assignee_details AS (
          SELECT DISTINCT ON (wf.businessid)
              wf.businessid,
              e.code AS employee_code,
              u.name AS employee_name
          FROM eg_wf_processinstance_v2 wf
          JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
          JOIN eg_hrms_employee e ON e.uuid = wa.assignee
          JOIN eg_user u ON e.uuid = u.uuid
          WHERE wf.businessservice IN (
              'CLU_MC','CLU_MC_HIGH','CLU_MC_OTH',
              'CLU_NP','CLU_NP_HIGH','CLU_NP_OTH'
          )
          ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      )
      SELECT DISTINCT ON (n.applicationno)
          split_part(n.tenantid, '.', 2) AS tenantid,
          n.applicationno AS clu_application_no,
      
          CASE
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'PENDINGAPPLICATIONPAYMENT','PENDINGFORPAYMENT','PENDING_PAYMENT',
                  'PENDINGPAYMENT','PENDING_FOR_PAYMENT','PENDING_PAYMENT_FOR_DEMAND',
                  'PENDING_FOR_DEMAND_PAYMENT','PENDING_PAYMENT_FOR_APPLICATION',
                  'PENDING_APPL_FEE','PENDING_FOR_APPLICATION_FEE',
                  'PENDING_SANC_FEE_PAYMENT','PENDINGSANCTIONPAYMENT'
              ) THEN 'Payment Pending'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN ('PAYMENT_DONE','POST_PAYMENT_INPROGRESS')
              THEN 'Payment Completed'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'VERIFICATION_PENDING','PENDINGVERIFICATION','PENDING_FOR_VERIFICATION',
                  'LEVEL2_DOCUMENTVERIFY','LEVEL3_VERIFICATION_PENDING','LEVEL4_VERIFICATION_PENDING',
                  'ATP_VERIFICATION_PENDING','EO_VERIFICATION_PENDING','JC_VERIFICATION_PENDING',
                  'MTP_VERIFICATION_PENDING','ADC_VERIFICATION_PENDING','MC_VERIFICATION_PENDING',
                  'STP_VERIFICATION_PENDING'
              ) THEN 'Verification Pending'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'VERIFICATION_INPROGRESS','DOC_VERIFICATION_INPROGRESS',
                  'NOC_VERIFICATION_INPROGRESS'
              ) THEN 'Verification In Progress'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'PENDING_FOR_DOCUMENT_VERIFICATION','PENDING_FOR_DOCUMENT_VERIFY',
                  'PENDINGDOCVERIFICATION','DOC_VERIFICATION_PENDING',
                  'DOCUMENTVERIFY','DOCUMENTVERIFY_MTP/ME','DOCUMENTVERIFY_ATP_HQ',
                  'DOCUMENTVERIFY_ATP/AME','DOCUMENTVERIFY_JC','DOCUMENTVERIFY_JE/BI',
                  'DOCUMENTVERIFY_DM','DOCUMENTVERIFY_EO','DOCUMENTVERIFY_STP_HQ',
                  'DOCUMENTVERIFY_STP(FIELD)'
              ) THEN 'Document Verification Pending'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'PENDING_FOR_FIELD_INSPECTION','PENDING_FOR_FIELDINSPECTION',
                  'FIELDINSPECTION_INPROGRESS','FIELDINSPECTION',
                  'PENDING_FOR_INSPECTION','INSPECTION_REPORT_PENDING',
                  'VENUE_INSPECTION'
              ) THEN 'Field Inspection'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'PENDINGFORAPPROVAL','PENDINGAPPROVAL','APPROVAL_PENDING',
                  'PENDING_FOR_APPROVAL','PENDING_APPROVAL_FOR_CONNECTION',
                  'ATPHQ_APPROVAL_PENDING','MTPHQ_APPROVAL_PENDING',
                  'STPHQ_APPROVAL_PENDING','CTPHQ_APPROVAL_PENDING'
              ) THEN 'Approval Pending'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN ('APPROVAL_INPROGRESS')
              THEN 'Approval In Progress'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'CITIZEN_ACTION_REQUIRED','CITIZENACTIONREQUIRED',
                  'PENDING_FOR_CITIZEN_ACTION','CITIZENACTIONREQUIRED-DV',
                  'CITIZEN_ACTION_PENDING_AT_DOC_VERIF',
                  'CITIZEN_ACTION_PENDING_AT_FI_VERIF',
                  'CITIZEN_ACTION_PENDING_AT_NOC_VERIF'
              ) THEN 'Citizen Action Required'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'CITIZEN_APPROVAL_INPROCESS',
                  'POST_PAYMENT_CITIZEN_APPROVAL_INPROCESS'
              ) THEN 'Citizen Approval In Process'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) = 'PENDING_FOR_CONNECTION_ACTIVATION'
              THEN 'Connection Activation Pending'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) = 'CONNECTION_ACTIVATED'
              THEN 'Connection Activated'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'PENDING_REQUEST_FOR_DISCONNECTION',
                  'PENDING_DISCONNECTION_FIELD_INSPECTION'
              ) THEN 'Disconnection Process'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'PENDINGFORASSIGNMENT','PENDINGFORREASSIGNMENT'
              ) THEN 'Pending Assignment'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'PENDING_FOR_SETTLEMENT','PENDING_FOT_SETLEMENT','FORWARD_FOT_SETLEMENT'
              ) THEN 'Settlement Pending'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) = 'ESIGN_PENDING'
              THEN 'E-Sign Pending'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) = 'E-SIGNED'
              THEN 'E-Signed'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) = 'CHALLAN_GENERATED'
              THEN 'Challan Generated'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) = 'REFUND_COMPLETED'
              THEN 'Refund Completed'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) = 'PULLED_BACK'
              THEN 'Pulled Back'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'CLOSEDAFTERRESOLUTION','CLOSEDAFTERREJECTION','RL_CLOSED'
              ) THEN 'Closed'
      
              ELSE UPPER(TRIM(ls.applicationstatus))
          END AS final_status,
      
          TO_CHAR(TO_TIMESTAMP(st.docverify_time / 1000), 'DD-MM-YYYY') AS document_verify_on,
          TO_CHAR(TO_TIMESTAMP(st.final_time / 1000), 'DD-MM-YYYY') AS finalstatus_on,
      
          CASE
              WHEN st.final_time IS NOT NULL AND st.docverify_time IS NOT NULL
                  THEN FLOOR((st.final_time - st.docverify_time) / 86400000)
              WHEN st.docverify_time IS NOT NULL AND st.final_time IS NULL
                  THEN FLOOR((EXTRACT(EPOCH FROM NOW()) * 1000 - st.docverify_time) / 86400000)
              ELSE NULL
          END AS sla_days,
      
          CASE
              WHEN st.final_time IS NOT NULL AND st.docverify_time IS NOT NULL THEN
                  CASE
                      WHEN (st.final_time - st.docverify_time) > sla.businessservicesla THEN 'BREACHED'
                      ELSE 'MET'
                  END
              WHEN st.docverify_time IS NOT NULL AND st.final_time IS NULL THEN 'IN-PROGRESS'
              ELSE 'AWAITING DOCVERIFY'
          END AS sla_status,
      
          ad.employee_name AS employee_name,
          ad.employee_code AS employee_code
      
      FROM eg_clu n
      INNER JOIN eg_clu_details d ON n.id = d.cluid
      INNER JOIN ulb_data u_data ON u_data.ulb_code = n.tenantid
      LEFT JOIN status_times st ON n.applicationno = st.uuid
      LEFT JOIN latest_status ls ON n.applicationno = ls.uuid
      LEFT JOIN sla_data sla
          ON sla.businessservice = (d.additionaldetails::jsonb -> 'applicationDetails' ->> 'businessService')
      LEFT JOIN assignee_details ad ON n.applicationno = ad.businessid
      
      WHERE UPPER(TRIM(ls.applicationstatus)) NOT IN ('APPLY','INITIATED','PENDINGPAYMENT')
  orderby:  ORDER BY n.applicationno,n.createdtime DESC, tenantid, final_status
      
- reportName: ReceiptRegisterCLU
  decryptionPathId: LAYOUTREPORTS
  summary: Details of collector register in CLU service
  version: 1.0.0
  moduleName: rainmaker-obpas_clu
  additionalConfig:
