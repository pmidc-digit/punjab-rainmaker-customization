    source: obpas_clu
    isMandatory: false
    searchClause: AND u.ulb_code= $ulb 
  - name: applicationstatus
    label: Application Status
    type: singlevaluelist
    pattern: list://DOCUMENTVERIFY_JC:Dodumentverify JC,PROFESSIONALACTIONREQUIRED:Professional Action Required,ATP_VERIFICATION_PENDING:ATP Verification Pending,DOCUMENTVERIFY_MTP/ME:Document Verify MTP/ME, E-SIGNED:E-SIGNED,FIELDINSPECTION_INPROGRESS:Field Inspection InProgress,ATPHQ_APPROVAL_PENDING:ATPHQ Approval Pending,PENDINGPAYMENT:Pending Payment,APPROVAL_PENDING:Approval Pending,MTP_VERIFICATION_PENDING:MTP Verification Pending,DOCUMENTVERIFY_DM:Document Verify DM,DOCUMENTVERIFY_JE/BI:Document Verify JE/BI,INITIATED:Initiated,DOCUMENTVERIFY_EO:Document Verify EO,PENDINGAPPROVAL:Pending Approval,PENDINGSANCTIONPAYMENT:Pendoing Snaction Paymnet,CANCELLED:Cancelled,REJECTED:Rejected,APPROVED:Approved,ADC_VERIFICATION_PENDING:ADC Verification Pending,DOC_VERIFICATION_PENDING:Document Verification Pending,EO_VERIFICATION_PENDING:EO Verification Pending,STP_VERIFICATION_PENDING:STP Verification Pending,PENDINGAPPLICATIONPAYMENT:Application Payment Pending,INSPECTION_REPORT_PENDING:Inspection Report Pending
    source: obpas_clu
    isMandatory: false
    searchClause: AND sc.applicationstatus = $applicationstatus
  - name: ULB_Type
    label: ULB Type
    type: singlevaluelist
    pattern: list://Municipal Council:Municipal Council,Municipal Corporation:Municipal Corporation,Nagar Panchayat:Nagar Panchayat
    source: obpas_clu 
    wrapper: true
    isMandatory: false
    searchClause: AND sc.ulb_type = $ULB_Type
  query: |
    WITH wf_history AS (
         SELECT
           wf.businessid AS uuid,
           wf.businessservice,
           wf.tenantid,
           wf.createdtime,
           wf.lastmodifiedtime,
           st.applicationstatus,
           st.state,
           st.sla AS state_sla
           FROM eg_wf_processinstance_v2 wf
           JOIN eg_wf_state_v2 st ON wf.status = st.uuid
           WHERE wf.businessservice IN ('CLU_MC','CLU_MC_HIGH','CLU_MC_OTH','CLU_NP','CLU_NP_HIGH','CLU_NP_OTH')
           and st.applicationstatus not in ('CANCELLED','CITIZENACTIONREQUIRED')
           ),
      inspection_time AS (
        SELECT
           uuid,
           MAX(CASE  WHEN applicationstatus = 'FIELDINSPECTION_INPROGRESS'  THEN createdtime  END
           ) AS inspection_start
          FROM wf_history
          GROUP BY uuid
           ),
      latest_status AS (
         SELECT DISTINCT ON (uuid)
           uuid,
           businessservice,
           tenantid,state AS current_state,
           applicationstatus ,
           lastmodifiedtime
           FROM wf_history
           ORDER BY uuid, lastmodifiedtime DESC
           ),
      sla_data AS (
         SELECT
           businessservice, businessservicesla
           FROM eg_wf_businessservice_v2
           WHERE businessservice IN ('CLU_MC','CLU_MC_HIGH','CLU_MC_OTH','CLU_NP','CLU_NP_HIGH','CLU_NP_OTH')
           ),
      sla_calc AS (
         SELECT
           ls.uuid,
           ls.tenantid,
           ls.businessservice,ls.applicationstatus,
           it.inspection_start,
           ls.lastmodifiedtime,
           sla.businessservicesla,ad.additionaldetails::jsonb -> 'siteDetails' ->> 'ulbType' AS ulb_type,
           CASE WHEN(ls.lastmodifiedtime - it.inspection_start) > sla.businessservicesla  THEN 'BREACHED' ELSE 'MET'
           END AS timeline_status
           FROM latest_status ls
           JOIN inspection_time it ON ls.uuid = it.uuid
           JOIN sla_data sla  ON sla.businessservice = ls.businessservice
           INNER JOIN eg_clu c ON (c.applicationno = ls.uuid OR c.id::text = ls.uuid)
           INNER JOIN eg_clu_details ad ON c.id = ad.cluid
           WHERE it.inspection_start IS NOT NULL 
           )
       SELECT
          u.district,
          u.name_of_ulb,
          CASE 
            WHEN sc.applicationstatus = 'DOCUMENTVERIFY_JC' THEN 'Document Verify JC'
            WHEN sc.applicationstatus = 'PROFESSIONALACTIONREQUIRED' THEN 'Professional Action Required'
            WHEN sc.applicationstatus = 'ATP_VERIFICATION_PENDING' THEN 'ATP Verification Pending'
            WHEN sc.applicationstatus = 'DOCUMENTVERIFY_MTP/ME' THEN 'Document Verify MTP/ME'
            WHEN sc.applicationstatus = 'E-SIGNED' THEN 'E-Signed'
            WHEN sc.applicationstatus = 'REJECTED' THEN 'Rejected'
            WHEN sc.applicationstatus = 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In Progress'
            WHEN sc.applicationstatus = 'ATPHQ_APPROVAL_PENDING' THEN 'ATPHQ Approval Pending'
            WHEN sc.applicationstatus = 'PENDINGPAYMENT' THEN 'Pending Payment'
            WHEN sc.applicationstatus = 'ATP_VERIFICATION_PENDING' THEN 'ATP Verification Pending'
            WHEN sc.applicationstatus = 'APPROVAL_PENDING' THEN 'Approval Pending'
            WHEN sc.applicationstatus = 'MTP_VERIFICATION_PENDING' THEN 'MTP Verification Pending'
            WHEN sc.applicationstatus = 'DOCUMENTVERIFY_JE/BI' THEN 'Document Verify JE/BI'
            WHEN sc.applicationstatus = 'INITIATED' THEN 'Initiated'
            WHEN sc.applicationstatus = 'INSPECTION_REPORT_PENDING' THEN 'Inspection Report Pending'
            WHEN sc.applicationstatus = 'PENDINGAPPLICATIONPAYMENT' THEN 'Application Payment Pending'
            WHEN sc.applicationstatus = 'STP_VERIFICATION_PENDING' THEN 'STP Verification Pending'
            WHEN sc.applicationstatus = 'EO_VERIFICATION_PENDING' THEN 'EO Verification Pending'
            WHEN sc.applicationstatus = 'DOC_VERIFICATION_PENDING' THEN 'Document Verification Pending'
            WHEN sc.applicationstatus = 'ADC_VERIFICATION_PENDING' THEN 'ADC Verification Pending'
            WHEN sc.applicationstatus = 'APPROVED' THEN 'Approved'
            WHEN sc.applicationstatus = 'REJECTED' THEN 'Rejected'
            WHEN sc.applicationstatus = 'CANCELLED' THEN 'Cancelled'
            WHEN sc.applicationstatus = 'PENDINGSANCTIONPAYMENT' THEN 'Sanction Payment Pending'
            WHEN sc.applicationstatus = 'PENDINGAPPROVAL' THEN 'Pending Approval'
            WHEN sc.applicationstatus = 'DOCUMENTVERIFY_EO' THEN 'EO Document Verification'
           ELSE sc.applicationstatus
           END AS localized_status,
          sc.uuid as fileno,sc.ulb_type,
          'CLU' as modulename,
          FLOOR((sc.lastmodifiedtime - sc.inspection_start) / 86400000) AS days_taken
          FROM sla_calc sc
          JOIN ulb_data u ON sc.tenantid = u.ulb_code
          WHERE sc.timeline_status = 'BREACHED'     
  groupby: GROUP BY u.district, u.name_of_ulb ,sc.applicationstatus,sc.uuid,sc.ulb_type,sc.lastmodifiedtime,sc.inspection_start
  orderby: ORDER BY days_taken,u.district, u.name_of_ulb,sc.applicationstatus,sc.uuid,sc.ulb_type DESC  

- reportName: officers_wise_pendency
  summary: officers wise  Pendency Trend Analysis - Last 7 Days
  version: 1.0.0
  moduleName: rainmaker-obpas_clu
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: Officer_Designation
    label: Officer Designation
    type: string
    source: obpas_clu
    total: false
  - name: day1
    label: Day 1
    type: string
    source: obpas_clu
    total: true
  - name: day2
    label: Day 2
    type: string
    source: obpas_clu
    total: true
  - name: day3
    label: Day 3
    type: string
    source: obpas_clu
    total: true
  - name: day4
    label: Day 4
    type: string
    source: obpas_clu
    total: true
  - name: day5
    label: Day 5
    type: string
    source: obpas_clu
    total: true
  - name: day6
    label: Day 6
    type: string
    source: obpas_clu
    total: true                     
  searchParams:
  - name: fromDate
    label: Date
    type: epoch
    source: obpas_clu
    isMandatory: true
    searchClause: AND 1=1     
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_clu
    isMandatory: false
    searchClause: AND tenantid = $ulb
  - name: ULB_Type
    label: ULB Type
    type: singlevaluelist
    pattern: list://Municipal Council:Municipal Council,Municipal Corporation:Municipal Corporation,Nagar Panchayat:Nagar Panchayat
    source: obpas_clu 
    wrapper: true
    isMandatory: false
    searchClause: AND ulb_type = $ULB_Type
  - name: district
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_clu
    isMandatory: false
    searchClause: AND district = $district
  query: |
    WITH params AS (
        SELECT
          to_timestamp($fromDate / 1000.0) AT TIME ZONE 'Asia/Kolkata' AS base_ts,
          (to_timestamp($fromDate / 1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS base_dt
      ),
      
      latest_assignee AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid,
          wf.tenantid,
          d.name AS designation_code
        FROM eg_wf_processinstance_v2 wf
        LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
        LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
        INNER JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
        INNER JOIN designation d ON d.code = a.designation
        WHERE wf.businessservice in ('CLU_MC','CLU_MC_HIGH','CLU_MC_OTH','CLU_NP','CLU_NP_HIGH','CLU_NP_OTH')
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      ),
      
      wf_data AS (
        SELECT
          la.tenantid,
          u.district, 
          ad.additionaldetails::jsonb -> 'siteDetails' ->> 'ulbType' AS ulb_type, 
          la.designation_code,
          (to_timestamp(p.lastmodifiedtime/1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS created_date
        FROM latest_assignee la
        JOIN eg_clu p
          ON p.id::text = la.businessid OR p.applicationno = la.businessid
        INNER JOIN eg_clu_details ad ON p.id = ad.cluid -- JSON table join
        INNER JOIN ulb_data u ON u.ulb_code = la.tenantid
        WHERE p.applicationstatus not in ('PROFESSIONALACTIONREQUIRED','E-SIGNED','PENDINGPAYMENT', 'INITIATED','CANCELLED','REJECTED', 'APPROVED', 'PENDINGAPPLICATIONPAYMENT')
      ),
      
      date_list AS (
        SELECT (base_dt - offs) AS dt
        FROM params, generate_series(0,7) AS g(offs)  
      ),
      
      agg AS (
        SELECT
          d.dt,
          w.tenantid,w.district,
          w.ulb_type,
          w.designation_code,
          COUNT(w.created_date) AS cnt
        FROM date_list d
        INNER JOIN wf_data w ON w.created_date = d.dt
        GROUP BY d.dt,w.tenantid, w.designation_code, w.district, w.ulb_type
      )
      
      SELECT
        COALESCE(designation_code, 'UNASSIGNED') AS officer_designation,
        COALESCE(NULLIF(MAX(CASE WHEN dt = (SELECT base_dt FROM params)     THEN cnt END), 0)::TEXT, '') AS day1,
        COALESCE(NULLIF(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 1 THEN cnt END), 0)::TEXT, '') AS day2,
        COALESCE(NULLIF(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 2 THEN cnt END), 0)::TEXT, '') AS day3,
        COALESCE(NULLIF(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 3 THEN cnt END), 0)::TEXT, '') AS day4,
        COALESCE(NULLIF(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 4 THEN cnt END), 0)::TEXT, '') AS day5,
        COALESCE(NULLIF(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 5 THEN cnt END), 0)::TEXT, '') AS day6,
        COALESCE(NULLIF(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 6 THEN cnt END), 0)::TEXT, '') AS day7
      FROM agg where 1=1 
      
  groupby:  GROUP BY designation_code    
  orderby:  ORDER BY officer_designation
    
- reportName: FilesNearTimelineBreachSummary
  summary: Summary list of district-ulb wise application upcoming  breached its SLA for next 7 days 
  version: 1.0.0
  moduleName: rainmaker-obpas_clu
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: district
    label: District
    type: string
    source: obpas_clu
    total: false
  - name: name_of_ulb
    label: ULB Name
    type: string
    source: obpas_clu
    total: false
  - name: day1
    label: Day 1
    type: string
    source: obpas_clu
    total: true 
  - name: day2
    label: Day 2
    type: string
    source: obpas_clu
    total: true
  - name: day3
    label: Day 3
    type: string
    source: obpas_clu
    total: true
  - name: day4
    label: Day 4
    type: string
    source: obpas_clu
    total: true
  - name: day5
    label: Day 5
    type: string
    source: obpas_clu
    total: true
  - name: day6
    label: Day 6
    type: string
    source: obpas_clu
    total: true
  - name: total_upcoming_breaches
    label: Total Upcoming Breaches 
    type: string
    source: obpas_clu
    total: true
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_clu
    isMandatory: true
    searchClause: AND 1=1
  - name: district
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_clu
    isMandatory: false
    searchClause: AND u.district = $district
  - name: tenant
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_clu
    isMandatory: false
    searchClause: AND u.ulb_code= $tenant
  query: |
      WITH params AS (
        SELECT
            (to_timestamp($fromDate / 1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS report_dt
        ),
       wf_detailed AS (
        SELECT
           wf.businessid AS applicationno,
           wf.tenantid,
           wf.businessservice,
           UPPER(st.applicationstatus) AS applicationstatus,
           wf.createdtime,
           wf.lastmodifiedtime
           FROM eg_wf_processinstance_v2 wf
           JOIN eg_wf_state_v2 st ON wf.status = st.uuid
           WHERE wf.businessservice in ('CLU_MC','CLU_MC_HIGH','CLU_MC_OTH','CLU_NP','CLU_NP_HIGH','CLU_NP_OTH') AND st.applicationstatus not in ('INITIATED','CANCELLED')
        ),
       status_times AS (
        SELECT
          applicationno,
          tenantid,
          businessservice,
          MIN(createdtime) FILTER ( WHERE applicationstatus = 'FIELDINSPECTION_INPROGRESS' ) AS sla_start_time,
          MAX(lastmodifiedtime) FILTER ( WHERE applicationstatus IN ( 'APPROVED','REJECTED','PENDINGPAYMENT','BLOCKED')) AS final_time
          FROM wf_detailed
          GROUP BY applicationno, tenantid, businessservice
          ), 
       sla_master AS (
        SELECT
          businessservice,
          businessservicesla
          FROM eg_wf_businessservice_v2
          ),
       sla_calc AS (
        SELECT
          st.applicationno,
          st.tenantid,
          st.businessservice,
          st.sla_start_time,
          st.final_time,
          (to_timestamp( (st.sla_start_time + sm.businessservicesla) /1000.0) AT TIME ZONE 'Asia/Kolkata') AS sla_breach_ts
          FROM status_times st
          JOIN sla_master sm ON sm.businessservice = st.businessservice
          WHERE st.sla_start_time IS NOT NULL
           ),
       upcoming_breaches AS (
        SELECT
         tenantid,
         businessservice,
         sla_breach_ts::date AS breach_date
         FROM sla_calc sc
         JOIN params p ON TRUE
         WHERE sc.final_time IS NULL 
          AND sc.sla_breach_ts::date
          BETWEEN p.report_dt AND p.report_dt + INTERVAL '7 day'
           )
        SELECT
          u.district,
          u.name_of_ulb,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt)   AS day1,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '1 day') AS day2,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '2 day') AS day3,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '3 day') AS day4,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '4 day') AS day5,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '5 day') AS day6,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '6 day') AS day7,
          COUNT(*) AS total_upcoming_breaches
          FROM upcoming_breaches ub
          JOIN ulb_data u ON ub.tenantid = u.ulb_code
          JOIN params p ON TRUE    
             WHERE 1=1  
  groupby: GROUP BY u.district, u.name_of_ulb
  orderby: ORDER BY u.district, u.name_of_ulb DESC  
    
