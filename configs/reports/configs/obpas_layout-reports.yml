---
ReportDefinitions:
- reportName: ApplicationDetailReportlayout
  decryptionPathId: LAYOUTREPORTS
  summary: Details of applicant in layout service
  version: 1.0.0
  moduleName: rainmaker-obpas_layout
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: tenant
    label: TenantId
    type: string
    source: obpas_layout
    total: false
  - name: applicationno
    label: Application Number
    type: string
    source: obpas_layout
    total: false
  - name: applicationstatus
    label: Application Status
    type: string
    source: obpas_layout
    total: false
  - name: vasikadate
    label: Vasika Date
    type: string
    source: obpas_layout
    total: false
  - name: vasikanumber
    label: Vasika Number
    type: string
    source: obpas_layout
    total: false
  - name: plot_no
    label: Plot Number
    type: string
    source: obpas_layout
    total: false
  - name: khasra_no
    label: Khasra Number
    type: string
    source: obpas_layout
    total: false
  - name: village_name
    label: Village Name
    type: string 
    source: obpas_layout
    total: false
  - name: ULB_type
    label: ULB Type
    type: string
    source: obpas_layout
    total: false
  - name: road_type
    label: Road Type
    type: string
    source: obpas_layout
    total: false
  - name: site_address
    label: Site Address
    type: string
    source: obpas_layout
    total: false
  - name: specification_plot_area
    label: Specification Plot Area
    type: number
    source: obpas_layout
    total: false
  - name: building_status
    label: Building Status
    type: string
    source: obpas_layout
    total: false
  - name: net_plot_area
    label: Net Plot Area
    type: number
    source: obpas_layout
    total: false
  - name: road_widening_area
    label: Area Left For Road Widening
    type: number
    source: obpas_layout
    total: false
  - name: road_width
    label: Road Width At Site
    type: number
    source: obpas_layout
    total: false
  - name: building_category
    label: Building Category
    type: string
    source: obpas_layout
    total: false
  - name: applicant_name
    label: Applicant Name
    type: string
    source: obpas_layout
    total: false
  - name: applicant_mobile
    label: Applicant Mobile
    type: string
    source: obpas_layout
    total: false
  - name: professional_name
    label: Professional Name
    type: string
    source: obpas_layout
    total: false
  - name: professional_reg_id
    label: Professional Registration ID
    type: string
    source: obpas_layout
    total: false
  - name: professional_mobile
    label: Professional Mobile
    type: string
    source: obpas_layout
    total: false
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_layout
    isMandatory: false
    searchClause: and n.createdtime >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_layout
    isMandatory: false
    searchClause: and n.createdtime <= $toDate
  - name: ulb
    label: ULB
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_layout
    wrapper: true
    isMandatory: false
    searchClause: AND n.tenantid = $ulb
  - name: applicationstatus
    label: Application Status
    type: singlevaluelist
    pattern: 'list://DOCUMENTVERIFY_ATP/AME: Document Verify ATP/AME,DOCUMENTVERIFY_JC:Document Verify JC ,PROFESSIONALACTIONREQUIRED:professional Action Required ,DOCUMENTVERIFY_MTP/ME:Document Verify MTP/ME,FIELDINSPECTION_INPROGRESS:Field Inspection In Progress ,PENDINGPAYMENT:Pending Payment,DOCUMENTVERIFY_DM:Document Verify DM,DOCUMENTVERIFY_JE/BI:Document Verify JE/BI,INITIATED:Initiated,DOCUMENTVERIFY_EO:Document Verify EO,PENDINGAPPROVAL:Pending Approval,PENDINGSANCTIONPAYMENT:Pending Sanction Payment ,APPROVED:Approved ,INSPECTION_REPORT_PENDING:Inspection Report Pending,PENDINGAPPLICATIONPAYMENT:Pending Application Payment'
    source: obpas_layout
    wrapper: true
    isMandatory: false
    searchClause: AND n.applicationstatus = $applicationstatus
  - name: ULB_Type
    label: ULB Type
    type: singlevaluelist
    pattern: list://Municipal Council:Municipal Council,Municipal Corporation:Municipal Corporation,Nagar Panchayat:Nagar Panchayat
    source: obpas_layout
    wrapper: true
    isMandatory: false
    searchClause: AND ad.additionaldetails::jsonb -> 'siteDetails'-> 'ulbName' ->'city' ->> 'ulbType' = $ULB_Type
  - name: district_name
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_layout
    wrapper: true
    isMandatory: false
    searchClause: AND u.district  = $district_name 
  query: >
      select n.applicationno,n.applicationstatus,n.vasikadate,n.vasikanumber,split_part(n.tenantid,'.',2) as tenant,
             ad.additionaldetails::jsonb -> 'siteDetails' -> 'zone' ->> 'name' AS zone_name,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'plotNo' AS plot_no,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'wardNo' AS ward_no,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'khasraNo' AS khasra_no,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'villageName' AS village_name,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'hadbastNo' AS hadbast_no,
             ad.additionaldetails::jsonb -> 'siteDetails' -> 'ulbName' ->'city' ->> 'ddrName'  AS DDR_Name,
             ad.additionaldetails::jsonb -> 'siteDetails'->> 'ulbType'  AS ULB_Type,
             ad.additionaldetails::jsonb -> 'siteDetails' -> 'ulbName' ->'city'->> 'ulbGrade'  AS ULB_Grade,
             ad.additionaldetails::jsonb -> 'siteDetails' -> 'ulbName'->'city'->> 'regionName'  AS Region_Name,
             ad.additionaldetails::jsonb -> 'siteDetails' -> 'roadType' ->> 'name' AS road_type,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'proposedSiteAddress' AS site_address,
             ad.additionaldetails::jsonb -> 'siteDetails' -> 'layoutNonSchemeType' ->'name' AS layout_Non_Scheme_Type,
             ad.additionaldetails::jsonb -> 'siteDetails' -> 'ulbName' ->'city'->>'districtName'  AS district_name,
             ad.additionaldetails::jsonb -> 'siteDetails' -> 'buildingStatus' ->> 'name' AS building_status,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'specificationPlotArea' AS specification_plot_area,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'netPlotAreaAfterWidening' AS net_plot_area,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'areaLeftForRoadWidening' AS road_widening_area,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'roadWidthAtSite' AS road_width,
             ad.additionaldetails::jsonb -> 'siteDetails' -> 'buildingCategory' ->> 'name' AS building_category,
             ad.additionaldetails::jsonb -> 'applicationDetails' ->> 'applicantOwnerOrFirmName' AS applicant_name,
             ad.additionaldetails::jsonb -> 'applicationDetails' ->> 'applicantMobileNumber' AS applicant_mobile,
             ad.additionaldetails::jsonb -> 'applicationDetails' ->> 'professionalName' AS professional_name,
             ad.additionaldetails::jsonb -> 'applicationDetails' ->> 'professionalRegId' AS professional_reg_id,
             ad.additionaldetails::jsonb -> 'applicationDetails' ->> 'professionalMobileNumber' AS professional_mobile
          FROM eg_layout n
          LEFT JOIN eg_layout_details ad ON ad.layoutid = n.id
          inner join ulb_data u on u.ulb_code=n.tenantid
         WHERE n.applicationstatus not in ('INITIATED', 'CANCELLED','CITIZENACTIONREQUIRED') and n.tenantid != 'pb.testing'
  groupby: GROUP BY n.applicationno,n.applicationstatus, n.vasikadate, n.vasikanumber,ad.additionaldetails,n.tenantid
  orderby: ORDER BY n.vasikadate;
  
- reportName: CollectionsReportlayout
  decryptionPathId: LAYOUTREPORTS
  summary: Collections
  version: 1.0.0
  moduleName: rainmaker-obpas_layout
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: tenant
    label: TenantId
    type: string
    source: obpas_layout
    total: false
  - name: applicationno
    label: Application Number
    type: string
    source: obpas_layout
    total: false
  - name: name
    label: Name
    type: string
    source: obpas_layout
    total: false
  - name: mobilenumber
    label: Mobile Number
    type: string
    source: obpas_layout
    total: false
  - name: businessservice
    label: Businessservice
    type: string
    source: obpas_layout
    total: false
  - name: applicationstatus
    label: Application Status
    type: string
    source: obpas_layout
    total: false
  - name: collector_code
    label: Collector Code
    type: string
    source: obpas_layout
    total: false
  - name: cash_amount
    label: Cash Amount
    type: string
    source: obpas_layout
    total: true
  - name: cheque_amount
    label: Cheque Amount
    type: string
    source: obpas_layout
    total: true
  - name: card_amount
    label: Card Amount
    type: string
    source: obpas_layout
    total: true
  - name: dd_amount
    label: DD Amount
    type: string
    source: obpas_layout
    total: true
  - name: neft_amount
    label: NEFT Amount
    type: string
    source: obpas_layout
    total: true
  - name: rtgs_amount
    label: RTGS Amount
    type: string
    source: obpas_layout
    total: true
  - name: online_amount
    label: Online Amount
    type: string
    source: obpas_layout
    total: true
  - name: amountpaid
    label: Amount Paid
    type: string
    source: obpas_layout
    total: true
  - name: payment_date
    label: Payment Date
    type: string
    source: obpas_layout
    total: false
  searchParams:
  - name: fromDate
    label: from Date
    type: epoch
    source: obpas_layout
    isMandatory: false
    searchClause: AND createdtime >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_layout
    isMandatory: false
    searchClause: AND createdtime <= $toDate
  - name: collector_code
    label: Collector Code
    type: string
    source: obpas_layout
    isMandatory: false
    searchClause: AND collector_code = $collector_code
  query: |
      WITH current_holder AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid AS applicationno,
          u.name AS employee_name,
          e.code AS assignee_code,
          UPPER(st.applicationstatus) AS current_stage
        FROM eg_wf_processinstance_v2 wf
        JOIN eg_wf_state_v2 st ON wf.status = st.uuid
        LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
        LEFT JOIN eg_user u ON u.uuid = wa.assignee
        LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
        WHERE  wf.businessservice in ('Layout_mcl_up','Layout_mcl_abv','Layout_mco_abv','Layout_mcUp')
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      ),
      
      unique_transactions AS (
        SELECT
          p.id AS transaction_id,
          p.createdtime,
          pd.amountpaid,
          CASE WHEN upper(p.paymentmode) IN ('CASH','OFFLINE_CASH') THEN pd.amountpaid ELSE 0 END AS cash_amount,
          CASE WHEN upper(p.paymentmode) = 'CHEQUE' THEN pd.amountpaid ELSE 0 END AS cheque_amount,
          CASE WHEN upper(p.paymentmode) IN ('CARD','DEBIT_CARD','CREDIT_CARD','OFFLINE_CARD') THEN pd.amountpaid ELSE 0 END AS card_amount,
          CASE WHEN upper(p.paymentmode) = 'DD' THEN pd.amountpaid ELSE 0 END AS dd_amount,
          CASE WHEN upper(p.paymentmode) IN ('NEFT','OFFLINE_NEFT') THEN pd.amountpaid ELSE 0 END AS neft_amount,
          CASE WHEN upper(p.paymentmode) IN ('RTGS','OFFLINE_RTGS','NEFT_RTGS') THEN pd.amountpaid ELSE 0 END AS rtgs_amount,
          CASE WHEN upper(p.paymentmode) = 'ONLINE' THEN pd.amountpaid ELSE 0 END AS online_amount,
          COALESCE(emp.code, 'SELF') AS collector_code,
          a.id AS layout_id,
          a.applicationno,
          a.applicationstatus,
          u_applicant.name,
          u_applicant.mobilenumber,
          ch.employee_name AS assignee_employee,
          ch.assignee_code   AS assignee_code,split_part(a.tenantid,'.',2) as tenant,
          bill.consumercode  AS bill_consumercode,
          CASE WHEN a.applicationno IS NULL THEN 'NO_MATCH_IN_EG_LAYOUT' ELSE 'MATCHED' END AS match_status
        FROM egcl_paymentdetail pd
        JOIN egcl_payment p ON pd.paymentid = p.id
        LEFT JOIN egcl_bill bill ON bill.id = pd.billid
        LEFT JOIN eg_layout a ON trim(bill.consumercode) = trim(a.applicationno)
                           OR trim(bill.consumercode) = trim(a.id::text)
        LEFT JOIN eg_layout_owner o ON o.layoutid = a.id
        LEFT JOIN eg_user u_applicant ON u_applicant.uuid = o.uuid
        LEFT JOIN eg_layout_details d ON d.layoutid = a.id
        LEFT JOIN eg_user u ON u.id::text = p.createdby::text
        LEFT JOIN eg_hrms_employee emp ON emp.uuid::text = u.uuid::text
        LEFT JOIN current_holder ch ON ch.applicationno = a.applicationno OR ch.applicationno = a.id::text
        WHERE pd.businessservice = 'layout'
          AND upper(p.paymentstatus) != 'CANCELLED'
          
      )
      
      SELECT
        to_char(to_timestamp(createdtime / 1000),'DD-MM-YYYY HH24:MI:SS') AS payment_date,
        applicationno,
        bill_consumercode,tenant,
        name,
        mobilenumber,
        'LAYOUT' AS businessservice,
        applicationstatus,
        collector_code,
        cash_amount, cheque_amount, card_amount, dd_amount, neft_amount, rtgs_amount, online_amount, amountpaid
      FROM unique_transactions where tenant != 'testing'
  orderby: ORDER BY createdtime DESC 
  
- reportName: SLAReportlayout
  decryptionPathId: LAYOUTREPORTS
  summary: SLA report for layout service
  version: 1.0.0
  moduleName: rainmaker-obpas_layout
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: tenantid
    label: tenantid
    type: string
    source: obpas_layout
    total: false
  - name: layout_application_no
    label: Application Number
    type: string
    source: obpas_layout
    total: false
  - name: document_verify_on
    label: Document Verified On
    type: string
    source: obpas_layout
    total: false
  - name: finalstatus_on
    label: Approval / Rejection On
    type: string
    source: obpas_layout
    total: false
  - name: final_status
    label: Application status
    type: string
    source: obpas_layout
    total: false
  - name: sla_status
    label: sla status
    type: string
    source: obpas_layout
    total: false
  - name: sla_days
    label: SLA Days 
    type: string
    source: obpas_layout
    total: false
  - name: employee_name
    label: employee_name
    type: string
    source: obpas_layout
    total: false
  - name: employee_code
    label: Employee Code / Current Holder Code
    type: string
    source: obpas_layout
    total: false
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_layout
    isMandatory: false
    searchClause: AND n.createdtime >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_layout
    isMandatory: false
    searchClause: AND n.createdtime <= $toDate
  query: |
      -- Use CTE to force query plan, compute & use CTE later     
      WITH wf_detailed AS (
          SELECT 
              wf.businessid AS uuid,                                 
              UPPER(st.applicationstatus) AS applicationstatus,
              wf.createdtime,
              wf.lastmodifiedtime,
              wf.businessservicesla,
              wf.tenantid,
              wf.id AS processinstanceid
          FROM eg_wf_processinstance_v2 wf
          JOIN eg_wf_state_v2 st ON wf.status = st.uuid
          WHERE wf.businessservice IN ('Layout_mcl_up','Layout_mcl_abv','Layout_mco_abv','Layout_mcUp')
      ),
      status_times AS (
          SELECT
              uuid,
              MAX(CASE WHEN applicationstatus = 'FIELDINSPECTION_INPROGRESS' THEN createdtime END) AS docverify_time,
              MAX(CASE WHEN applicationstatus IN ('APPROVED','REJECTED','PENDINGSANCTIONPAYMENT') THEN lastmodifiedtime END) AS final_time
          FROM wf_detailed
          GROUP BY uuid
      ),
      latest_status AS (
          SELECT uuid, applicationstatus
          FROM (
              SELECT uuid, applicationstatus, lastmodifiedtime,
                  ROW_NUMBER() OVER (PARTITION BY uuid ORDER BY lastmodifiedtime DESC NULLS LAST) AS rn
              FROM wf_detailed
          ) x
          WHERE rn = 1
      ),
      sla_data AS (
          SELECT businessservice, businessservicesla
          FROM eg_wf_businessservice_v2
          WHERE businessservice IN ('Layout_mcl_up','Layout_mcl_abv','Layout_mco_abv','Layout_mcUp')
      ),
      assignee_details AS (
          SELECT DISTINCT ON (wf.businessid)
              wf.businessid,
              e.code AS employee_code,
              u.name AS employee_name
          FROM eg_wf_processinstance_v2 wf
          JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
          JOIN eg_hrms_employee e ON e.uuid = wa.assignee
          JOIN eg_user u ON e.uuid = u.uuid
          WHERE wf.businessservice IN ('Layout_mcl_up','Layout_mcl_abv','Layout_mco_abv','Layout_mcUp')
          ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      )
      SELECT
          split_part(n.tenantid,'.',2) AS tenantid,
          n.applicationno AS layout_application_no,
      
          CASE
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'PENDINGAPPLICATIONPAYMENT','PENDINGFORPAYMENT','PENDING_PAYMENT',
                  'PENDINGPAYMENT','PENDING_FOR_PAYMENT','PENDING_PAYMENT_FOR_DEMAND',
                  'PENDING_FOR_DEMAND_PAYMENT','PENDING_PAYMENT_FOR_APPLICATION',
                  'PENDING_APPL_FEE','PENDING_FOR_APPLICATION_FEE',
                  'PENDING_SANC_FEE_PAYMENT','PENDINGSANCTIONPAYMENT'
              ) THEN 'Payment Pending'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN ('PAYMENT_DONE','POST_PAYMENT_INPROGRESS')
              THEN 'Payment Completed'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'VERIFICATION_PENDING','PENDINGVERIFICATION','PENDING_FOR_VERIFICATION',
                  'LEVEL2_DOCUMENTVERIFY','LEVEL3_VERIFICATION_PENDING','LEVEL4_VERIFICATION_PENDING'
              ) THEN 'Verification Pending'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'VERIFICATION_INPROGRESS','DOC_VERIFICATION_INPROGRESS',
                  'NOC_VERIFICATION_INPROGRESS'
              ) THEN 'Verification In Progress'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'PENDING_FOR_DOCUMENT_VERIFICATION','PENDING_FOR_DOCUMENT_VERIFY',
                  'PENDINGDOCVERIFICATION','DOC_VERIFICATION_PENDING',
                  'DOCUMENTVERIFY','DOCUMENTVERIFY_MTP/ME','DOCUMENTVERIFY_ATP_HQ',
                  'DOCUMENTVERIFY_ATP/AME','DOCUMENTVERIFY_JC','DOCUMENTVERIFY_JE/BI',
                  'DOCUMENTVERIFY_DM','DOCUMENTVERIFY_EO','DOCUMENTVERIFY_STP_HQ',
                  'DOCUMENTVERIFY_STP(FIELD)'
              ) THEN 'Document Verification Pending'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'PENDING_FOR_FIELD_INSPECTION','PENDING_FOR_FIELDINSPECTION',
                  'FIELDINSPECTION_INPROGRESS','FIELDINSPECTION',
                  'PENDING_FOR_INSPECTION','INSPECTION_REPORT_PENDING'
              ) THEN 'Field Inspection'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'PENDINGFORAPPROVAL','PENDINGAPPROVAL','APPROVAL_PENDING',
                  'PENDING_FOR_APPROVAL'
              ) THEN 'Approval Pending'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) = 'APPROVAL_INPROGRESS'
              THEN 'Approval In Progress'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'CITIZEN_ACTION_REQUIRED','CITIZENACTIONREQUIRED',
                  'PENDING_FOR_CITIZEN_ACTION'
              ) THEN 'Citizen Action Required'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) = 'CONNECTION_ACTIVATED'
              THEN 'Connection Activated'
      
              WHEN UPPER(TRIM(ls.applicationstatus)) IN (
                  'CLOSEDAFTERRESOLUTION','CLOSEDAFTERREJECTION','RL_CLOSED'
              ) THEN 'Closed'
      
              ELSE UPPER(TRIM(ls.applicationstatus))
          END AS final_status,
      
          TO_CHAR(TO_TIMESTAMP(st.docverify_time/1000),'DD-MM-YYYY') AS document_verify_on,
          TO_CHAR(TO_TIMESTAMP(st.final_time/1000),'DD-MM-YYYY') AS finalstatus_on,   
      
          CASE
              WHEN st.final_time IS NOT NULL AND st.docverify_time IS NOT NULL
                  THEN FLOOR((st.final_time-st.docverify_time)/86400000)
              WHEN st.docverify_time IS NOT NULL AND st.final_time IS NULL
                  THEN FLOOR((EXTRACT(EPOCH FROM NOW())*1000-st.docverify_time)/86400000)
              ELSE NULL
          END AS sla_days,
      
          CASE
              WHEN st.final_time IS NOT NULL AND st.docverify_time IS NOT NULL THEN
                  CASE
                      WHEN (st.final_time-st.docverify_time) > sla.businessservicesla THEN 'BREACHED'
                      ELSE 'MET'
                  END
              WHEN st.docverify_time IS NOT NULL AND st.final_time IS NULL
                  THEN 'IN-PROGRESS'
              ELSE 'AWAITING DOCVERIFY'
          END AS sla_status,
      
          ad.employee_name AS employee_name,
          ad.employee_code AS employee_code
      
      FROM eg_layout n
      LEFT JOIN status_times st ON n.applicationno = st.uuid
      LEFT JOIN latest_status ls ON n.applicationno = ls.uuid
      JOIN sla_data sla ON sla.businessservice IN ('Layout_mcl_up','Layout_mcl_abv','Layout_mco_abv','Layout_mcUp')
      LEFT JOIN assignee_details ad ON n.applicationno = ad.businessid
      WHERE UPPER(TRIM(ls.applicationstatus)) NOT IN ('APPLY','INITIATED','PENDINGPAYMENT') and n.tenantid != 'pb.testing'        
  orderby:  ORDER BY n.createdtime DESC, tenantid, final_status          
  
