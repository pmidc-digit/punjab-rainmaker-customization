           JOIN eg_wf_state_v2 st ON wf.status = st.uuid
           WHERE wf.businessservice IN ('Layout_mcl_up','Layout_mcl_abv','Layout_mco_abv','Layout_mcUp')
           and st.applicationstatus not in ('CANCELLED','CITIZENACTIONREQUIRED')
           ),
      inspection_time AS (
        SELECT
           uuid,
           MAX(CASE  WHEN applicationstatus = 'FIELDINSPECTION_INPROGRESS'  THEN createdtime  END
           ) AS inspection_start
          FROM wf_history
          GROUP BY uuid
           ),
      latest_status AS (
         SELECT DISTINCT ON (uuid)
           uuid,
           businessservice,
           tenantid,state AS current_state,
           applicationstatus ,
