- reportName: officers_wise_pendency
  summary: officers wise  Pendency Trend Analysis - Last 7 Days
  version: 1.0.0
  moduleName: rainmaker-obpas_layout
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: Officer_Designation
    label: Officer Designation
    type: string
    source: obpas_layout
    total: false
  - name: day0
    label: Day 0
    type: string
    source: obpas_layout
    total: true
  - name: day1
    label: Day 1
    type: string
    source: obpas_layout
    total: true
  - name: day2
    label: Day 2
    type: string
    source: obpas_layout
    total: true
  - name: day3
    label: Day 3
    type: string
    source: obpas_layout
    total: true
  - name: day4
    label: Day 4
    type: string
    source: obpas_layout
    total: true
  - name: day5
    label: Day 5
    type: string
    source: obpas_layout
    total: true
  - name: day6
    label: Day 6
    type: string
    source: obpas_layout
    total: true                     
  searchParams:
  - name: fromDate
    label: Date
    type: epoch
    source: obpas_layout
    isMandatory: true
    searchClause: AND 1=1     
  - name: ulb
    label: ulb
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_layout
    isMandatory: false
    searchClause: AND tenantid = $ulb
  query: |
    WITH params AS (
        SELECT
          to_timestamp($fromDate / 1000.0) AT TIME ZONE 'Asia/Kolkata' AS base_ts,
          (to_timestamp($fromDate / 1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS base_dt
      ),
      
      latest_assignee AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid,
          wf.tenantid,
          d.name AS designation_code
        FROM eg_wf_processinstance_v2 wf
        LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
        LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
        INNER JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
        INNER JOIN designation d ON d.code = a.designation
        WHERE wf.businessservice in ('Layout_mcl_up','Layout_mcl_abv','Layout_mco_abv','Layout_mcUp')
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      ),
      
      wf_data AS (
        SELECT
          la.tenantid,
          la.designation_code,
          (to_timestamp(p.lastmodifiedtime/1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS created_date
        FROM latest_assignee la
        JOIN eg_layout p
          ON p.id::text = la.businessid OR p.applicationno = la.businessid
        WHERE p.applicationstatus in ('JC_VERIFICATION_PENDING','MTP_VERIFICATION_PENDING','PENDINGAPPROVAL', 'DOCUMENTVERIFY','EO_VERIFICATION_PENDING','INSPECTION_REPORT_PENDING', 'ATP_VERIFICATION_PENDING', 'FIELDINSPECTION_INPROGRESS')
      ),
      
      date_list AS (
        SELECT (base_dt - offs) AS dt
        FROM params, generate_series(0,7) AS g(offs)  
      ),
      
      agg AS (
        SELECT
          d.dt,
          w.tenantid,
          w.designation_code,
          COUNT(w.created_date) AS cnt
        FROM date_list d
        LEFT JOIN wf_data w ON w.created_date = d.dt
        GROUP BY d.dt,w.tenantid, w.designation_code
      )
      
      SELECT
        COALESCE(designation_code, 'UNASSIGNED') AS officer_designation,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params)     THEN cnt END),0) AS day0,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 1 THEN cnt END),0) AS day1,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 2 THEN cnt END),0) AS day2,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 3 THEN cnt END),0) AS day3,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 4 THEN cnt END),0) AS day4,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 5 THEN cnt END),0) AS day5,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 6 THEN cnt END),0) AS day6,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 7 THEN cnt END),0) AS day7
      FROM agg where 1=1
  groupby:  GROUP BY designation_code
  orderby:  ORDER BY officer_designation
    
