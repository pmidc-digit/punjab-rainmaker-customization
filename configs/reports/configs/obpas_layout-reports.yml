    source: obpas_layout
    total: false
  - name: manualreceiptdate
    label: Manual Receipt Date
    type: string
    source: obpas_layout
    total: false
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_layout
    isMandatory: false
    searchClause: AND pd.receiptdate >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_layout
    isMandatory: false
    searchClause: AND pd.receiptdate <= $toDate
  - name: receiptNumber
    label: Receipt Number
    type: string
    source: obpas_layout
    isMandatory: false
    searchClause: AND pd.receiptnumber like $receiptNumber
  - name: paymentMode
    label: Payment Mode
    type: singlevaluelist
    pattern: 'list://CASH:CASH,CHEQUE:CHEQUE,DD:DD,ONLINE:ONLINE,CARD:CARD,OFFLINE_NEFT:OFFLINE NEFT'
    source: obpas_layout
    isMandatory: false
    searchClause: AND payment.paymentmode like $paymentMode
  query: |
      SELECT
          pd.receiptnumber AS receiptno,split_part(pd.tenantid,'.',2) as tenant,
          bill.consumercode AS connectionno,
          TO_CHAR(
              TO_TIMESTAMP(pd.receiptdate / 1000) AT TIME ZONE 'Asia/Kolkata',
              'DD-MM-YYYY'
          ) AS receiptdate,
          pd.businessservice AS service,
          usr.name AS collectorname,
          TO_CHAR(
              TO_TIMESTAMP(payment.instrumentdate / 1000) AT TIME ZONE 'Asia/Kolkata',
              'DD-MM-YYYY'
          ) AS transactiondate,
          payment.instrumentnumber,
          usr.name AS ownername1,
          pd.amountpaid,
          payment.paymentmode,
          payment.paymentstatus,
          usr.id AS user,
          pd.manualreceiptnumber,
          pd.manualreceiptdate
      FROM egcl_paymentdetail pd
      INNER JOIN egcl_bill bill 
          ON bill.id = pd.billid 
          --AND pd.tenantid = $tenantid
      INNER JOIN egcl_payment payment 
          ON payment.id = pd.paymentid
      LEFT JOIN eg_layout a 
          ON bill.consumercode = a.applicationno
      LEFT JOIN eg_layout_owner o  
          ON o.uuid = a.id
      LEFT JOIN eg_layout_details d 
          ON d.layoutid = a.id
      LEFT JOIN eg_user usr 
          ON usr.id = payment.createdby::integer
      WHERE
          pd.businessservice = 'layout'
          AND payment.paymentstatus != 'CANCELLED' and pd.tenantid != 'pb.testing'
  orderby: ORDER BY pd.receiptdate DESC;
- reportName: officers_with_highest_pendency
  summary: Top 7 officers with Highest Pendency
  version: 1.0.0
  moduleName: rainmaker-obpas_layout
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: ulb_name
    label: ULB Name
    type: string
    source: obpas_layout
    total: false
  - name: Officer_Designation
    label: Officer Designation
    type: string
    source: obpas_layout
    total: false
  - name: pending_files
    label: Pending Files
    type: string
    source: obpas_layout
    total: true
  searchParams:
  - name: businessservice
    label: Business Service
    type: singlevaluelist
    pattern: list://Layout_mcl_up:Layout_mcl_up,Layout_mcl_abv:Layout_mcl_abv,Layout_mco_abv:Layout_mco_abv,Layout_mcUp:Layout_mcUp
    source: obpas_layout
    isMandatory: false
    searchClause: AND businessservice = $businessservice
  - name: ulb
    label: ULB
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_layout
    isMandatory: false
    searchClause: AND tenantid = $ulb
  - name: district_name
    label: District
    type: singlevaluelist
    pattern: list://Roopnagar:Roopnagar,Moga:Moga,Fazilka:Fazilka,Ludhiana:Ludhiana,kapurthala:kapurthala,Patiala:Patiala,SAS Nagar:SAS Nagar,Ferozepur:Ferozepur,Bathinda:Bathinda,Mansa:Mansa,Pathankot:Pathankot,Hoshiarpur:Hoshiarpur,:Kapurthala:Kapurthala,Jalandhar:Jalandhar,Gurdaspur:Gurdaspur,Barnala:Barnala,SBS Nagar:SBS Nagar,Amritsar:Amritsar,Sangrur:Sangrur,Fatehgarh Sahib:Fatehgarh Sahib,Malerkotla:Malerkotla,Tarn Taran:Tarn Taran,Sri Muktsar Sahib:Sri Muktsar Sahib
    source: obpas_layout
    wrapper: true
    isMandatory: false
    searchClause: AND u.district  = $district_name
  query: >
      WITH latest_assignee AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid,st.applicationstatus,
          wf.tenantid,
          wf.businessservice,
          d.name AS designation_code
        FROM eg_wf_processinstance_v2 wf
        JOIN eg_wf_state_v2 st    ON wf.status = st.uuid
        LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
        LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
        inner JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
        inner join designation d on a.designation = d.code
         WHERE wf.businessservice in ('Layout_mcl_up','Layout_mcl_abv','Layout_mco_abv','Layout_mcUp')
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      ),    
      pending_files AS (
        SELECT
          id::text AS layout_id,
          applicationno,
          tenantid,
          status
        FROM eg_layout
        WHERE status NOT IN (
            'INITIATED',
            'CANCELLED'
          )
      ),    
      merged AS (
        SELECT
          la.tenantid, 
          INITCAP(REPLACE(la.tenantid, 'pb.', '')) AS ulb_name,
          la.designation_code,
          la.businessservice,
          COUNT(DISTINCT p.layout_id) AS pending_files
        FROM latest_assignee la
        LEFT JOIN pending_files p
          ON (
               p.layout_id = la.businessid
            OR p.applicationno = la.businessid
          )
        GROUP BY la.tenantid, INITCAP(REPLACE(la.tenantid, 'pb.', '')), la.designation_code, la.businessservice
      )      

      SELECT
        ROW_NUMBER() OVER (ORDER BY pending_files DESC) AS Serial_No,
        ulb_name ,businessservice,
        designation_code as Officer_Designation,
        pending_files 
      FROM merged  m

      inner join ulb_data u on u.name_of_ulb=m.ulb_name

      where  designation_code <> 'Clerk' and designation_code <> 'Accountant' 
  orderby: ORDER BY pending_files DESC limit 7
    
- reportName: BeyondTimelineSummary
  summary: Summary of district-ulb wise application which breached its SLA
  version: 1.0.0
  moduleName: rainmaker-obpas_layout
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: district
    label: District
    type: string
    source: obpas_layout
    total: false
  - name: name_of_ulb
    label: ULB Name
    type: string
    source: obpas_layout
    total: false
  - name: beyond_timeline_count
    label: Beyond Timeline Count
    type: string
    source: obpas_layout
    total: false
  searchParams:
  - name: district
    label: District
    type: singlevaluelist
    pattern: list://Roopnagar:Roopnagar,Moga:Moga,Fazilka:Fazilka,Faridkot:Faridkot,Ludhiana:Ludhiana,kapurthala:kapurthala,Patiala:Patiala,SAS Nagar:SAS Nagar,Ferozepur:Ferozepur,Bathinda:Bathinda,Mansa:Mansa,Pathankot:Pathankot,Hoshiarpur:Hoshiarpur,Kapurthala:Kapurthala,Jalandhar:Jalandhar,Gurdaspur:Gurdaspur,Barnala:Barnala,SBS Nagar:SBS Nagar,Amritsar:Amritsar,Sangrur:Sangrur,Fatehgarh Sahib:Fatehgarh Sahib,Malerkotla:Malerkotla,Tarn Taran:Tarn Taran,Sri Muktsar Sahib:Sri Muktsar Sahib
    source: obpas_layout
    isMandatory: false
    searchClause: AND u.district = $district
  - name: ulb
    label: ULB
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_layout
    isMandatory: false
    searchClause: AND u.ulb_code= $ulb
  - name: businessservice
    label: Businesservice
    type: singlevaluelist
    pattern: list://Layout_mcl_up:Layout_mcl_up,Layout_mcl_abv:Layout_mcl_abv,Layout_mco_abv:Layout_mco_abv,Layout_mcUp:Layout_mcUp
    source: obpas_layout
    isMandatory: false
    searchClause: AND sc.businessservice = $businessservice
  query: >
    WITH wf_detailed AS (
         SELECT
           wf.businessid AS uuid,
           wf.businessservice,UPPER(st.applicationstatus) AS applicationstatus,
           wf.tenantid,
           wf.createdtime,
           wf.lastmodifiedtime,
           st.state,
           st.sla AS state_sla
           FROM eg_wf_processinstance_v2 wf
           JOIN eg_wf_state_v2 st ON wf.status = st.uuid
           WHERE wf.businessservice IN ('Layout_mcl_up','Layout_mcl_abv','Layout_mco_abv','Layout_mcUp')
           and st.applicationstatus not in ('CANCELLED')         
       ),
      inspection_time AS (
          SELECT
           uuid,
             MAX(CASE  WHEN applicationstatus = 'FIELDINSPECTION_INPROGRESS'  THEN createdtime  END
              ) AS inspection_start
           FROM wf_detailed
          GROUP BY uuid
          ), 
      latest_status AS (
         SELECT DISTINCT ON (uuid)
           uuid,
           businessservice,
           tenantid,
           applicationstatus ,
           state AS current_state,
           lastmodifiedtime
           FROM wf_detailed
           ORDER BY uuid, lastmodifiedtime DESC
           ),
      sla_data AS (
         SELECT
           businessservice, businessservicesla
           FROM eg_wf_businessservice_v2
           WHERE businessservice IN ('Layout_mcl_up','Layout_mcl_abv','Layout_mco_abv','Layout_mcUp')
           ),
      sla_calc AS (
         SELECT
           ls.uuid,
           ls.tenantid,
           ls.businessservice,
           it.inspection_start,
           ls.lastmodifiedtime,
           sla.businessservicesla,
           CASE WHEN(ls.lastmodifiedtime - it.inspection_start) > sla.businessservicesla  THEN 'BREACHED' ELSE 'MET'
           END AS timeline_status
           FROM latest_status ls
           JOIN inspection_time it ON ls.uuid = it.uuid
           JOIN sla_data sla  ON sla.businessservice = ls.businessservice
           WHERE it.inspection_start IS NOT NULL
           )
       SELECT
          u.district,
          u.name_of_ulb,
          COUNT(CASE WHEN sc.timeline_status = 'MET' THEN 1 END) AS met_count,
          COUNT(CASE WHEN sc.timeline_status = 'BREACHED' THEN 1 END) AS beyond_timeline_count
          FROM sla_calc sc
          JOIN ulb_data u ON sc.tenantid = u.ulb_code
          WHERE 1=1
  groupby: GROUP BY u.district, u.name_of_ulb
  orderby: ORDER BY u.district, u.name_of_ulb DESC

