    label: Businesservice
    type: singlevaluelist
    pattern: list://Layout_mcl_up:Layout_mcl_up,Layout_mcl_abv:Layout_mcl_abv,Layout_mco_abv:Layout_mco_abv,Layout_mcUp:Layout_mcUp
