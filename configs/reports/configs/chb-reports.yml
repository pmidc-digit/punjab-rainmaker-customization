        INNER JOIN egcl_payment payment ON payment.id = pd.paymentid
        LEFT JOIN eg_chb_booking_detail b ON b.booking_no = bill.consumercode
        LEFT JOIN eg_chb_applicant_detail a ON a.booking_id = b.booking_id
        LEFT JOIN eg_chb_owner o ON o.booking_id=b.booking_id
        LEFT JOIN eg_user u_applicant ON u_applicant.uuid = o.uuid   
        LEFT JOIN eg_user usr ON usr.id = payment.createdby::integer  
        WHERE pd.businessservice = 'chb-services'
        AND payment.paymentstatus != 'CANCELLED'
        and pd.tenantid not in ('pb.testing')
    orderby: ORDER BY pd.receiptdate DESC;  
