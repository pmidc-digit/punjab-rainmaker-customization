---
ReportDefinitions:
  - reportName: ApplicationDetailReportNOC
    summary: Details of file for NOC  per ULB
    version: 1.0.0
    moduleName: rainmaker-obpas_noc
    sourceColumns:
      - name: applicationno
        label: Application Number
        type: string
        source: obpas_noc
        total: false
      - name: application_status_localized
        label: Application Status
        type: string
        source: obpas_noc
        total: false
      - name: vasikadate
        label: Vasika Date
        type: string
        source: obpas_noc
        total: false
      - name: vasikanumber
        label: Vasika Number
        type: string
        source: obpas_noc
        total: false
      - name: zone_name
        label: Zone Name
        type: string
        source: obpas_noc
        total: false  
      - name: plot_no
        label: Plot Number
        type: string
        source: obpas_noc
        total: false
      - name: khasra_no
        label: Khasra Number
        type: string
        source: obpas_noc
        total: false
      - name: village_name
        label: Village Name
        type: string
        source: obpas_noc
        total: false
      - name: ULB_type
        label: ULB Type
        type: string
        source: obpas_noc
        total: false
      - name: site_address
        label: Site Address
        type: string
        source: obpas_noc
        total: false
      - name: district_name
        label: District Name
        type: string
        source: obpas_noc
        total: false
      - name: building_status
        label: Building Status
        type: string
        source: obpas_noc
        total: false
      - name: net_plot_area
        label: Net Plot Area
        type: string
        source: obpas_noc
        total: false
      - name: building_category
        label: Building Category
        type: string
        source: obpas_noc
        total: false
      - name: applicant_name
        label: Applicant Name
        type: string
        source: obpas_noc
        total: false
      - name: applicant_mobile
        label: Applicant Mobile
        type: string
        source: obpas_noc
        total: false
      - name: professional_name
        label: Professional Name
        type: string
        source: obpas_noc
        total: false
      - name: professional_reg_id
        label: Professional Registration ID
        type: string
        source: obpas_noc
        total: false
      - name: professional_mobile
        label: Professional Mobile
        type: string
        source: obpas_noc
        total: false
    searchParams:
      - name: fromDate
        label: From Date
        type: epoch
        source: obpas_noc
        isMandatory: false
        searchClause: and n.createdtime >= $fromDate
      - name: toDate
        label: To Date
        type: epoch
        source: obpas_noc
        isMandatory: false
        searchClause: and n.createdtime <= $toDate
      - name: ulb
        label: ULB Name
        type: singlevaluelist
        pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
        source: obpas_noc
        wrapper: true
        isMandatory: false
        searchClause: AND n.tenantid = $ulb
      - name: applicationstatus
        label: Application Status
        type: singlevaluelist
        pattern: 'list://INITIATED:Initiated,FIELDINSPECTION_INPROGRESS:Field Inspection In Progress ,DOCUMENTVERIFY:Document Verify ,ATP_VERIFICATION_PENDING: ATP Verification Pending,MTP_VERIFICATION_PENDING: MTP Verification Pending,JC_VERIFICATION_PENDING:JC Verification Pending ,INSPECTION_REPORT_PENDING:Inspection Report Pending ,EO_VERIFICATION_PENDING: EO Verification Pending,LEVEL2_DOCUMENTVERIFY:Level 2 Document Verify,PENDINGAPPROVAL: Pending Approval,APPROVED:Approved,CANCELLED:Cancelled ,REJECTED:Rejected,PENDINGPAYMENT:Pending Payment,CITIZENACTIONREQUIRED:Citizen Action Required,E-SIGNED:E-Signed'
        source: obpas_noc
        wrapper: true
        isMandatory: false
        searchClause: AND n.applicationstatus = $applicationstatus
      - name: ULB_Type
        label: ULB Type
        type: singlevaluelist
        pattern: list://Municipal Council:Municipal Council,Municipal Corporation:Municipal Corporation,Nagar Panchayat:Nagar Panchayat
        source: obpas_noc
        wrapper: true
        isMandatory: false
        searchClause: AND ad.additionaldetails::jsonb -> 'siteDetails'-> 'ulbName' ->'city' ->> 'ulbType' = $ULB_Type
      - name: district_name
        label: District
        type: singlevaluelist
        pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
        source: obpas_noc
        wrapper: true
        isMandatory: false
        searchClause: AND u.district  = $district_name
      - name: building_category
        label: Building Category
        type: singlevaluelist
        pattern: list://Residential Plotted:Residential Plotted,Residential Independent Floors:Residential Independent Floors,Commercial:Commercial,Industrial / Warehouse Building:Industrial / Warehouse Building
        source: obpas_noc
        wrapper: true
        isMandatory: false
        searchClause: AND ad.additionaldetails::jsonb -> 'siteDetails' ->> 'specificationBuildingCategory' = $building_category
    query: >
         SELECT 
           n.applicationno,
           CASE n.applicationstatus
              WHEN 'INITIATED' THEN 'Application Initiated'
              WHEN 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In-Progress'
              WHEN 'DOCUMENTVERIFY' THEN 'Document Verification'
              WHEN 'LEVEL2_DOCUMENTVERIFY' THEN 'Level 2 Document Verification'
              WHEN 'ATP_VERIFICATION_PENDING' THEN 'Pending ATP Verification'
              WHEN 'MTP_VERIFICATION_PENDING' THEN 'Pending MTP Verification'
              WHEN 'JC_VERIFICATION_PENDING' THEN 'Pending JC Verification'
              WHEN 'EO_VERIFICATION_PENDING' THEN 'Pending EO Verification'
              WHEN 'PENDINGAPPROVAL' THEN 'Pending Approval'
              WHEN 'CITIZENACTIONREQUIRED' THEN 'Citizen Action Required'
              WHEN 'PENDINGPAYMENT' THEN 'Pending Payment'
              WHEN 'APPROVED' THEN 'Approved'
              WHEN 'REJECTED' THEN 'Rejected'
              WHEN 'CANCELLED' THEN 'Cancelled'
              WHEN 'INSPECTION_REPORT_PENDING' THEN 'Inspection Report Pending'
              WHEN 'E-SIGNED' THEN 'E-Signed'
              ELSE n.applicationstatus 
             END AS application_status_localized,
             n.vasikadate,
             n.vasikanumber,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'zone'  AS zone_name,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'plotNo' AS plot_no,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'wardNo' AS ward_no,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'khasraNo' AS khasra_no,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'villageName' AS village_name,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'hadbastNo' AS hadbast_no,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'ulbType' AS ULB_Type,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'proposedSiteAddress' AS site_address,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'district'  AS district_name,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'buildingStatus'  AS building_status,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'specificationPlotArea' AS specification_plot_area,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'netPlotAreaAfterWidening' AS net_plot_area,
             ad.additionaldetails::jsonb -> 'siteDetails' ->> 'specificationBuildingCategory'  AS building_category,
             ad.additionaldetails::jsonb -> 'applicationDetails' -> 'owners' -> 0 ->> 'ownerOrFirmName' AS applicant_name,
             ad.additionaldetails::jsonb -> 'applicationDetails' -> 'owners' -> 0 ->> 'mobileNumber' AS applicant_mobile, 
             ad.additionaldetails::jsonb -> 'applicationDetails' ->> 'professionalName' AS professional_name,
             ad.additionaldetails::jsonb -> 'applicationDetails' ->> 'professionalRegId' AS professional_reg_id,
             ad.additionaldetails::jsonb -> 'applicationDetails' ->> 'professionalMobileNumber' AS professional_mobile
            FROM eg_noc n
            INNER JOIN eg_noc_details ad ON ad.nocid = n.id
            INNER JOIN ulb_data u ON u.ulb_code = n.tenantid
            Where n.tenantid !='pb.testing' and n.applicationno not like 'PB/%' AND (ad.additionaldetails::text not LIKE '%isMigrationTrue%'  OR ad.additionaldetails IS NULL)
    groupby: GROUP BY n.createdtime,n.applicationno,n.applicationstatus, n.vasikadate, n.vasikanumber,ad.additionaldetails
    orderby: ORDER BY n.createdtime desc;
    
  - reportName: SLAReportNOC
    decryptionPathId: LAYOUTREPORTS
    summary: SLA report for noc service
    version: 1.0.0
    moduleName: rainmaker-obpas_noc
    additionalConfig:
      print:
        pdfPageSize: A4
    sourceColumns:
      - name: tenantid
        label: ULB Name 
        type: string
        source: obpas_noc
        total: false
      - name: noc_application_no
        label: Application Number
        type: string
        source: obpas_noc
        total: false
      - name: field_inspection_on
        label: Field Inspection On
        type: string
        source: obpas_noc
        total: false
      - name: finalstatus_on
        label: Approval / Rejection On
        type: string
        source: obpas_noc
        total: false
      - name: final_status_localized
        label: Application status
        type: string
        source: obpas_noc
        total: false
      - name: sla_status
        label: SLA Status
        type: string
        source: obpas_noc
        total: false
      - name: sla_days
        label: SLA Days
        type: string
        source: obpas_noc
        total: false
      - name: employee_name
        label: Employee Name
        type: string
        source: obpas_noc
        total: false
      - name: employee_code
        label: Employee Code / Current Holder Code
        type: string
        source: obpas_noc
        total: false
    searchParams:
      - name: fromDate
        label: From Date
        type: epoch
        source: obpas_noc
        isMandatory: false
        searchClause: AND n.createdtime >= $fromDate
      - name: toDate
        label: To Date
        type: epoch
        source: obpas_noc
        isMandatory: false
        searchClause: AND n.createdtime <= $toDate
      - name: district_name
        label: District
        type: singlevaluelist
        pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
        source: obpas_noc
        wrapper: true
        isMandatory: false
        searchClause: AND u.district  = $district_name
      - name: ulb
        label: ULB Name
        type: singlevaluelist
        pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
        source: obpas_noc
        wrapper: true
        isMandatory: false
        searchClause: AND u.ulb_code= $ulb
    query: >
      -- Use CTE to force query plan, compute & use CTE later     
       WITH wf_detailed AS (
         SELECT 
           wf.businessid AS uuid, 
           wf.businessservice,
           UPPER(st.applicationstatus) AS applicationstatus,
           wf.createdtime,
           wf.lastmodifiedtime,
           wf.businessservicesla,
           wf.tenantid,
           wf.id AS processinstanceid
          FROM eg_wf_processinstance_v2 wf
          JOIN eg_wf_state_v2 st ON wf.status = st.uuid
          WHERE  wf.businessservice IN ('NOC_MC','NOC_NP')                      
          ),
        status_times AS (
             SELECT
                uuid,
                MAX(CASE WHEN applicationstatus = 'FIELDINSPECTION_INPROGRESS' THEN createdtime END) AS docverify_time,
                MAX(CASE WHEN applicationstatus IN ('APPROVED','REJECTED','E-SIGNED') THEN lastmodifiedtime END) AS final_time
              FROM wf_detailed
              GROUP BY uuid
             ),
        latest_status AS (
              SELECT uuid, applicationstatus
                 FROM (
                      SELECT uuid, applicationstatus, lastmodifiedtime,
                         ROW_NUMBER() OVER (PARTITION BY uuid ORDER BY lastmodifiedtime DESC NULLS LAST) AS rn
                          FROM wf_detailed
                        ) x WHERE rn = 1
                     ),
        sla_data AS (
            SELECT businessservice,businessservicesla
            FROM eg_wf_businessservice_v2
            WHERE businessservice IN ('NOC_MC','NOC_NP')
           ),
        assignee_details AS (
             SELECT DISTINCT ON (wf.businessid)
                 wf.businessid,
                 e.code AS employee_code,
                 u.name AS employee_name
              FROM eg_wf_processinstance_v2 wf
              JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
              JOIN eg_hrms_employee e ON e.uuid = wa.assignee
              JOIN eg_user u ON e.uuid = u.uuid
               WHERE  wf.businessservice IN ('NOC_MC','NOC_NP')
              ORDER BY wf.businessid,wf.lastmodifiedtime DESC
               )
         SELECT
            split_part(n.tenantid,'.',2) AS tenantid,
             n.applicationno AS noc_application_no,                 
             CASE UPPER(ls.applicationstatus)
               WHEN 'INITIATED' THEN 'Initiated'
               WHEN 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In-Progress'
               WHEN 'DOCUMENTVERIFY' THEN 'Document Verification'
               WHEN 'ATP_VERIFICATION_PENDING' THEN 'Pending ATP Verification'
               WHEN 'MTP_VERIFICATION_PENDING' THEN 'Pending MTP Verification'
               WHEN 'JC_VERIFICATION_PENDING' THEN 'Pending JC Verification'
               WHEN 'EO_VERIFICATION_PENDING' THEN 'Pending EO Verification'
               WHEN 'PENDINGAPPROVAL' THEN 'Pending Approval'
               WHEN 'CITIZENACTIONREQUIRED' THEN 'Citizen Action Required'
               WHEN 'PENDINGPAYMENT' THEN 'Pending Payment'
               WHEN 'APPROVED' THEN 'Approved'
               WHEN 'REJECTED' THEN 'Rejected'
               WHEN 'CANCELLED' THEN 'Cancelled'
               WHEN 'INSPECTION_REPORT_PENDING' THEN 'Inspection Report Pending'
               WHEN 'E-SIGNED' THEN 'E-Signed'
               ELSE ls.applicationstatus 
              END AS final_status_localized,
             ad.additionaldetails::jsonb -> 'applicationDetails' -> 'owners' -> 0 ->> 'ownerOrFirmName' AS applicant_name,
             ad.additionaldetails::jsonb -> 'applicationDetails' -> 'owners' -> 0 ->> 'mobileNumber' AS applicant_mobile,
            TO_CHAR(TO_TIMESTAMP(st.docverify_time/1000),'DD-MM-YYYY') AS field_inspection_on,
            TO_CHAR(TO_TIMESTAMP(st.final_time/1000),'DD-MM-YYYY') AS finalstatus_on,   
            CASE
              WHEN st.final_time IS NOT NULL AND st.docverify_time IS NOT NULL
               THEN FLOOR((st.final_time-st.docverify_time)/86400000)
              WHEN st.docverify_time IS NOT NULL AND st.final_time IS NULL
               THEN FLOOR((EXTRACT(EPOCH FROM NOW())*1000-st.docverify_time)/86400000)
             ELSE NULL
            END AS sla_days,
            CASE
               WHEN st.final_time IS NOT NULL AND st.docverify_time IS NOT NULL THEN
            CASE WHEN (st.final_time-st.docverify_time) > sla.businessservicesla THEN 'Breached'
                 ELSE 'Met' END
                WHEN st.docverify_time IS NOT NULL AND st.final_time IS NULL
                THEN  
            CASE WHEN (EXTRACT(EPOCH FROM NOW()) * 1000 - st.docverify_time) > sla.businessservicesla THEN 'Breached'
            ELSE 'In-Progress' END
               ELSE 'Awaiting Field Inspection'
            END AS sla_status,
            asn.employee_name AS employee_name,
            asn.employee_code AS employee_code
            FROM eg_noc n
            INNER JOIN eg_noc_details ad ON ad.nocid = n.id
            LEFT JOIN status_times st ON n.applicationno = st.uuid
            LEFT JOIN latest_status ls ON n.applicationno = ls.uuid
            inner join ulb_data u on u.ulb_code=n.tenantid
            JOIN sla_data sla ON sla.businessservice in ('NOC_MC','NOC_NP')
            LEFT JOIN assignee_details asn ON n.applicationno = asn.businessid
            WHERE UPPER(ls.applicationstatus) NOT IN ('INITIATED','CANCELLED') and n.tenantid !='pb.testing'
       			and n.applicationno not like 'PB/%' AND (ad.additionaldetails::text not LIKE '%isMigrationTrue%'  OR ad.additionaldetails IS NULL)
    orderby: ORDER BY n.createdtime DESC
    
  - reportName: officers_with_highest_pendency
    summary: Top 7 officers with Highest Pendency
    version: 1.0.0
    moduleName: rainmaker-obpas_noc
    additionalConfig:
      print:
        pdfPageSize: A4
    sourceColumns:
      - name: ulb_name
        label: ULB Name
        type: string
        source: obpas_noc
        total: false
      - name: Officer_Designation
        label: Officer Designation
        type: string
        source: obpas_noc
        total: false
      - name: pending_files
        label: Pending Files
        type: string
        source: obpas_noc
        total: true
    searchParams:
      - name: businessservice
        label: ULB Type
        type: singlevaluelist
        pattern: list://NOC_MC:Municipal Corporation,NOC_NP:Municipal Council,NOC_NP:Nagar Panchayat
        source: obpas_noc
        isMandatory: false
        searchClause: AND businessservice = $businessservice
      - name: ulb
        label: ULB Name
        type: singlevaluelist
        pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
        source: obpas_noc
        isMandatory: false
        searchClause: AND tenantid = $ulb
      - name: district_name
        label: District
        type: singlevaluelist
        pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
        source: obpas_noc
        wrapper: true
        isMandatory: false
        searchClause: AND u.district  = $district_name
    query: >
      WITH latest_assignee AS (
              SELECT DISTINCT ON (wf.businessid)
                wf.businessid,st.applicationstatus,
                wf.tenantid,
                wf.businessservice,
                d.name AS designation_code
              FROM eg_wf_processinstance_v2 wf
              JOIN eg_wf_state_v2 st    ON wf.status = st.uuid
              LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
              LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
              inner JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
              inner join designation d on a.designation = d.code
               WHERE wf.businessservice in ('NOC_MC','NOC_NP')
              ORDER BY wf.businessid, wf.lastmodifiedtime DESC
            ),    
            merged AS (
              SELECT
                la.tenantid, 
                la.designation_code,
                la.businessservice,
      		  --la.businessid
                COUNT(DISTINCT la.businessid) AS pending_files
              FROM latest_assignee la
              WHERE la.applicationstatus NOT IN ('E-SIGNED', 'CITIZENACTIONREQUIRED', 'APPROVED', 'REJECTED', 'CANCELLED', 'INITIATED', 'PENDINGPAYMENT')
              GROUP BY la.tenantid, la.designation_code, la.businessservice
            )      
            SELECT
               u.name_of_ulb as ulb_name,
              m.designation_code as Officer_Designation,
              m.pending_files
            FROM merged m
            inner join ulb_data u on u.ulb_code = m.tenantid
            where m.designation_code <> 'Clerk' and m.designation_code <> 'Accountant' and m.designation_code <>'Additional Local Registrar'
    orderby: ORDER BY pending_files DESC limit 7
    
  - reportName: BeyondTimelineSummary
    summary: Summary of district-ulb wise application which breached its SLA
    version: 1.0.0
    moduleName: rainmaker-obpas_noc
    additionalConfig:
      print:
        pdfPageSize: A4
    sourceColumns:
      - name: district
        label: District
        type: string
        source: obpas_noc
        total: false
      - name: name_of_ulb
        label: ULB Name
        type: string
        source: obpas_noc
        total: false
      - name: beyond_timeline_count
        label: Beyond Timeline Count
        type: string
        source: obpas_noc
        total: false
    searchParams:
      - name: district
        label: District
        type: singlevaluelist
        pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
        source: obpas_noc
        isMandatory: false
        searchClause: AND u.district = $district
      - name: ulb
        label: ULB Name
        type: singlevaluelist
        pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
        source: obpas_noc
        isMandatory: false
        searchClause: AND u.ulb_code= $ulb
      - name: businessservice
        label: ULB Type
        type: singlevaluelist
        pattern: list://NOC_MC:Municipal Corporation,NOC_NP:Nagar Panchayat,NOC_NP:Municipal Council
        source: obpas_noc
        isMandatory: false
        searchClause: AND sc.businessservice = $businessservice
    query: >
      WITH wf_detailed AS (
         SELECT
           wf.businessid AS uuid,
           wf.businessservice,UPPER(st.applicationstatus) AS applicationstatus,
           wf.tenantid,
           wf.createdtime,
           wf.lastmodifiedtime,
           st.state,
           st.sla AS state_sla
           FROM eg_wf_processinstance_v2 wf
           JOIN eg_wf_state_v2 st ON wf.status = st.uuid
           WHERE wf.businessservice IN ('NOC_MC','NOC_NP')
           and st.applicationstatus not in ('CANCELLED')         
       ),
      inspection_time AS (
          SELECT
           uuid,
             MAX(CASE  WHEN applicationstatus = 'FIELDINSPECTION_INPROGRESS'  THEN createdtime  END
              ) AS inspection_start
           FROM wf_detailed
          GROUP BY uuid
          ), 
      latest_status AS (
         SELECT DISTINCT ON (uuid)
           uuid,
           businessservice,
           tenantid,
           applicationstatus ,
           state AS current_state,
           lastmodifiedtime
           FROM wf_detailed
           ORDER BY uuid, lastmodifiedtime DESC
           ),
      sla_data AS (
         SELECT
           businessservice, businessservicesla
           FROM eg_wf_businessservice_v2
           WHERE businessservice IN ('NOC_MC','NOC_NP')
           ),
      sla_calc AS (
         SELECT
           ls.uuid,
           ls.tenantid,
           ls.businessservice,
           it.inspection_start,
           ls.lastmodifiedtime,
           sla.businessservicesla,
           CASE WHEN(ls.lastmodifiedtime - it.inspection_start) > sla.businessservicesla  THEN 'BREACHED' ELSE 'MET'
           END AS timeline_status
           FROM latest_status ls
           JOIN inspection_time it ON ls.uuid = it.uuid
           JOIN sla_data sla  ON sla.businessservice = ls.businessservice
           WHERE it.inspection_start IS NOT NULL
           )
       SELECT
          u.district,
          u.name_of_ulb,
          COUNT(CASE WHEN sc.timeline_status = 'MET' THEN 1 END) AS met_count,
          COUNT(CASE WHEN sc.timeline_status = 'BREACHED' THEN 1 END) AS beyond_timeline_count
          FROM sla_calc sc
          JOIN ulb_data u ON sc.tenantid = u.ulb_code
          WHERE 1=1 
    groupby: GROUP BY u.district, u.name_of_ulb
    orderby: ORDER BY u.district, u.name_of_ulb DESC

  - reportName: DetailedListBeyondTimelineSummary
    summary: Summary of district-ulb wise application which breached its SLA
    version: 1.0.0
    moduleName: rainmaker-obpas_noc
    additionalConfig:
      print:
        pdfPageSize: A4
    sourceColumns:
    - name: district
      label: District
      type: string
      source: obpas_noc
      total: false
    - name: name_of_ulb
      label: ULB Name
      type: string
      source: obpas_noc
      total: false
    - name: modulename
      label: Module Name
      type: string
      source: obpas_noc
      total: false
    - name: applicationstatus
      label: Application Status
      type: string
      source: obpas_noc
      total: false
    - name: fileno
      label: File Number
      type: string
      source: obpas_noc
      total: false
    searchParams:
    - name: district
      label: District
      type: singlevaluelist
      pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
      source: obpas_noc
      isMandatory: false
      searchClause: AND u.district = $district
    - name: ulb
      label: ULB Name
      type: singlevaluelist
      pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
      source: obpas_noc
      isMandatory: false
      searchClause: AND u.ulb_code= $ulb 
    - name: applicationstatus
      label: Application Status
      type: singlevaluelist
      pattern: 'list://INITIATED:Initiated,FIELDINSPECTION_INPROGRESS:Field Inspection In Progress ,DOCUMENTVERIFY:Document Verify ,ATP_VERIFICATION_PENDING: ATP Verification Pending,MTP_VERIFICATION_PENDING: MTP Verification Pending,JC_VERIFICATION_PENDING:JC Verification Pending , INSPECTION_REPORT_PENDING:Inspection Report Pending , EO_VERIFICATION_PENDING: EO Verification Pending,LEVEL2_DOCUMENTVERIFY:Level 2 Document Verify,PENDINGAPPROVAL: Pending Approval,APPROVED:Approved,CANCELLED:Cancelled , REJECTED:Rejected,PENDINGPAYMENT:Pending Payment,CITIZENACTIONREQUIRED:Citizen Action Required,E-SIGNED:E-Signed'
      source: obpas_noc
      isMandatory: false
      searchClause: AND sc.applicationstatus = $applicationstatus
    - name: businessservice
      label: ULB Type
      type: singlevaluelist
      pattern: list://NOC_MC:Municipal Corporation,NOC_NP:Nagar Panchayat,NOC_NP:Municipal Council
      source: obpas_noc
      isMandatory: false
      searchClause: AND sc.businessservice = $businessservice
    query: |
      WITH wf_history AS (
               SELECT
                 wf.businessid AS uuid,
                 wf.businessservice,
                 wf.tenantid,
                 wf.createdtime,
                 wf.lastmodifiedtime,
                 st.applicationstatus,
                 st.state,
                 st.sla AS state_sla
                 FROM eg_wf_processinstance_v2 wf
                 JOIN eg_wf_state_v2 st ON wf.status = st.uuid
                 WHERE wf.businessservice IN ('NOC_MC','NOC_NP')
                 and st.applicationstatus not in ('CANCELLED','CITIZENACTIONREQUIRED')
                 ),
            first_stage_time AS (
               SELECT
                 uuid,
                 MIN(createdtime) AS first_stage_start
                 FROM wf_history
                 WHERE applicationstatus NOT IN ('INITIATED', 'PENDINGPAYMENT')
                 GROUP BY uuid
                 ),
            latest_status AS (
               SELECT DISTINCT ON (uuid)
                 uuid,
                 businessservice,
                 tenantid,
                 state AS current_state,
                 applicationstatus,
                 lastmodifiedtime
                 FROM wf_history
                 ORDER BY uuid, lastmodifiedtime DESC
                 ),
            sla_data AS (
               SELECT
                 businessservice, businessservicesla
                 FROM eg_wf_businessservice_v2
                 WHERE businessservice IN ('NOC_MC','NOC_NP')
                 ),
            sla_calc AS (
               SELECT
                 ls.uuid,
                 ls.tenantid,
                 ls.businessservice,
                 ls.applicationstatus,
                 fs.first_stage_start,
                 ls.lastmodifiedtime,
                 sla.businessservicesla,
                 CASE WHEN sla.businessservicesla IS NOT NULL AND (ls.lastmodifiedtime - fs.first_stage_start) > sla.businessservicesla THEN 'BREACHED' ELSE 'MET'
                 END AS timeline_status
                 FROM latest_status ls
                 JOIN first_stage_time fs ON ls.uuid = fs.uuid
                 JOIN sla_data sla ON sla.businessservice = ls.businessservice
                 --WHERE ls.applicationstatus NOT IN ('E-SIGNED', 'CITIZENACTIONREQUIRED', 'APPROVED', 'REJECTED', 'CANCELLED', 'INITIATED', 'PENDINGPAYMENT')
                 )
             SELECT
                u.district,
                u.name_of_ulb,
                CASE sc.applicationstatus
                   WHEN 'INITIATED' THEN 'Application Initiated'
                   WHEN 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In-Progress'
                   WHEN 'DOCUMENTVERIFY' THEN 'Document Verification'
                   WHEN 'LEVEL2_DOCUMENTVERIFY' THEN 'Level 2 Document Verification'
                   WHEN 'ATP_VERIFICATION_PENDING' THEN 'Pending ATP Verification'
                   WHEN 'MTP_VERIFICATION_PENDING' THEN 'Pending MTP Verification'
                   WHEN 'JC_VERIFICATION_PENDING' THEN 'Pending JC Verification'
                   WHEN 'EO_VERIFICATION_PENDING' THEN 'Pending EO Verification'
                   WHEN 'PENDINGAPPROVAL' THEN 'Pending Approval'
                   WHEN 'CITIZENACTIONREQUIRED' THEN 'Citizen Action Required'
                   WHEN 'PENDINGPAYMENT' THEN 'Pending Payment'
                   WHEN 'APPROVED' THEN 'Approved'
                   WHEN 'REJECTED' THEN 'Rejected'
                   WHEN 'CANCELLED' THEN 'Cancelled'
                   WHEN 'INSPECTION_REPORT_PENDING' THEN 'Inspection Report Pending'
                   WHEN 'E-SIGNED' THEN 'E-Signed'
                   ELSE sc.applicationstatus 
                END AS applicationstatus,
                sc.uuid as fileno,
                'NOC' as modulename
                FROM sla_calc sc
                JOIN ulb_data u ON sc.tenantid = u.ulb_code
                WHERE sc.timeline_status = 'BREACHED'  and sc.uuid not like 'PB/%'    
    groupby: GROUP BY u.district, u.name_of_ulb ,sc.applicationstatus,sc.uuid
    orderby: ORDER BY u.district, u.name_of_ulb,sc.applicationstatus,sc.uuid DESC  

  - reportName: officers_wise_pendency
    summary: officers wise  Pendency Trend Analysis - Last 7 Days
    version: 1.0.0
    moduleName: rainmaker-obpas_noc
    additionalConfig:
      print:
        pdfPageSize: A4
    sourceColumns:
    - name: Officer_Designation
      label: Officer Designation
      type: string
      source: obpas_noc
      total: false
    - name: day1
      label: Day 1
      type: string
      source: obpas_noc
      total: true
    - name: day2
      label: Day 2
      type: string
      source: obpas_noc
      total: true
    - name: day3
      label: Day 3
      type: string
      source: obpas_noc
      total: true
    - name: day4
      label: Day 4
      type: string
      source: obpas_noc
      total: true
    - name: day5
      label: Day 5
      type: string
      source: obpas_noc
      total: true
    - name: day6
      label: Day 6
      type: string
      source: obpas_noc
      total: true  
    - name: day7
      label: Day 7
      type: string
      source: obpas_noc
      total: true                     
    searchParams:
    - name: fromDate
      label: Date
      type: epoch
      source: obpas_noc
      isMandatory: true
      searchClause: AND 1=1     
    - name: ulb
      label: ULB Name
      type: singlevaluelist
      pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
      source: obpas_noc
      isMandatory: false
      searchClause: AND tenantid = $ulb
    query: |
      WITH params AS (
        SELECT
          to_timestamp($fromDate / 1000.0) AT TIME ZONE 'Asia/Kolkata' AS base_ts,
          (to_timestamp($fromDate / 1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS base_dt
      ),
      
      latest_assignee AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid,
          wf.tenantid,
          d.name AS designation_code
        FROM eg_wf_processinstance_v2 wf
        LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
        LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
        INNER JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
        INNER JOIN designation d ON d.code = a.designation
        WHERE wf.businessservice in ('NOC_NP','NOC_MC')
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      ),
      
      wf_data AS (
        SELECT
          la.tenantid,
          la.designation_code,
          (to_timestamp(p.lastmodifiedtime/1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS created_date
        FROM latest_assignee la
        JOIN eg_noc p
          ON p.id::text = la.businessid OR p.applicationno = la.businessid
        WHERE p.applicationstatus in ('JC_VERIFICATION_PENDING','MTP_VERIFICATION_PENDING','PENDINGAPPROVAL', 'DOCUMENTVERIFY','EO_VERIFICATION_PENDING','INSPECTION_REPORT_PENDING', 'ATP_VERIFICATION_PENDING', 'FIELDINSPECTION_INPROGRESS')
      ),
      
      date_list AS (
        SELECT (base_dt - offs) AS dt
        FROM params, generate_series(0,7) AS g(offs)  
      ),
      
      agg AS (
        SELECT
          d.dt,
          w.tenantid,
          w.designation_code,
          COUNT(w.created_date) AS cnt
        FROM date_list d
        LEFT JOIN wf_data w ON w.created_date = d.dt
        GROUP BY d.dt,w.tenantid, w.designation_code
      )
      
      SELECT
        COALESCE(designation_code, 'UNASSIGNED') AS officer_designation,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params)     THEN cnt END),0) AS day1,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 1 THEN cnt END),0) AS day2,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 2 THEN cnt END),0) AS day3,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 3 THEN cnt END),0) AS day4,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 4 THEN cnt END),0) AS day5,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 5 THEN cnt END),0) AS day6,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 6 THEN cnt END),0) AS day7
      FROM agg where 1=1
    groupby:  GROUP BY designation_code
    orderby:  ORDER BY officer_designation
    
