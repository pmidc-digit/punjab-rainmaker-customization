          INNER JOIN egcl_payment payment ON payment.id = pd.paymentid
          LEFT JOIN eg_ptr_registration r ON r.applicationnumber = bill.consumercode
          LEFT JOIN eg_ptr_owner o  ON o.ptrregistrationid = r.id
          LEFT JOIN eg_user u_owner ON u_owner.uuid = o.uuid      
          LEFT JOIN eg_user usr  ON usr.id = payment.createdby::integer  
