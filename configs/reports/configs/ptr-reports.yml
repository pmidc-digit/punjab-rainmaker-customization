    - name: service
      label: service
      type: string
      source: ptr
      total: false
    - name: collectorname
      label: collectorname
      type: string
      source: ptr
      total: false
    - name: transactiondate
      label: transactiondate
      type: string
      source: ptr
      total: false
    - name: instrumentnumber
      label: instrumentnumber
      type: string
      source: ptr
      total: false
    - name: payername
      label: payername
      type: string
      source: ptr
      total: false
    - name: amountpaid
      label: amountpaid
      type: string
      source: ptr
      total: false
    - name: paymentmode
      label: paymentmode
      type: string
      source: ptr
      total: false
    - name: paymentstatus
      label: paymentstatus
      type: string
      source: ptr
      total: false
    - name: ownername1
      label: ownername1
      type: string
      source: ptr
      total: false
    - name: user
      label: user
      type: string
      source: ptr
      total: false
    - name: manualreceiptnumber
      label: manualreceiptnumber
      type: string
      source: ptr
      total: false
    - name: manualreceiptdate
      label: manualreceiptdate
      type: string
      source: ptr
      total: false
    searchParams:
    - name: fromDate
      label: fromDate
      type: epoch
      source: ptr
      isMandatory: true
      searchClause: AND pd.receiptdate >= $fromDate
    - name: toDate
      label: toDate
      type: epoch
      source: ptr
      isMandatory: true
      searchClause: AND pd.receiptdate <= $toDate
    - name: receiptno
      label: receiptno
      type: string
      source: ptr
      isMandatory: false
      searchClause: AND pd.receiptnumber like $receiptno
    - name: paymentMode
      label: paymentMode
      type: singlevaluelist
      pattern: 'list://CASH:CASH,CHEQUE:CHEQUE,DD:DD,ONLINE:ONLINE,CARD:CARD,OFFLINE_NEFT:OFFLINE NEFT'
      source: ptr
      isMandatory: false
      searchClause: AND payment.paymentmode like $paymentMode
    query: |
      -- Use CTE to force query plan, compute & use CTE later
      SELECT
            pd.receiptnumber AS receiptno,
            bill.consumercode AS connectionno,
            TO_CHAR(TO_TIMESTAMP(pd.receiptdate / 1000) AT TIME ZONE 'Asia/Kolkata','DD-MM-YYYY') AS receiptdate1,
            'pet-services' AS service,              
            usr.name AS collectorname,
            TO_CHAR( TO_TIMESTAMP(payment.instrumentdate / 1000) AT TIME ZONE 'Asia/Kolkata', 'DD-MM-YYYY') AS transactiondate,
            payment.instrumentnumber,
            u_owner.name AS payername,
            pd.amountpaid,
            payment.paymentmode,
            payment.paymentstatus,
            u_owner.name AS ownername1,
            usr.id AS user,
            pd.manualreceiptnumber,
            pd.manualreceiptdate

          FROM egcl_paymentdetail pd
          INNER JOIN egcl_bill bill ON bill.id = pd.billid AND pd.tenantid = $tenantid
          INNER JOIN egcl_payment payment ON payment.id = pd.paymentid
          LEFT JOIN eg_ptr_registration r ON r.applicationnumber = bill.consumercode
          LEFT JOIN eg_ptr_owner o  ON o.ptrregistrationid = r.id
          LEFT JOIN eg_user u_owner ON u_owner.uuid = o.uuid      
          LEFT JOIN eg_user usr  ON usr.id = payment.createdby::integer  -- Collector
          WHERE
              bill.tenantid = $tenantid
              AND pd.businessservice = 'pet-services'
              AND payment.paymentstatus != 'CANCELLED'
    orderby: ORDER BY pd.receiptdate DESC;  

