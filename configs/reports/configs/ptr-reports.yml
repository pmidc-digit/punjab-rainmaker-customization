        total: false
      - name: clinicname
        label: clinicname
        type: string
        source: ptr
        total: false
      - name: status
        label: status
        type: string
        source: ptr
        total: false
      - name: assignee_employee
        label: assignee_employee
        type: string
        source: ptr
        total: false
      - name: assignee_code
        label: assignee_code
        type: string
        source: ptr
        total: false
    searchParams:
      - name: applicationtype
        label: applicationtype
        type: singlevaluelist
        pattern: list://NEWAPPLICATION:NEWAPPLICATION,RENEWAPPLICATION:RENEWAPPLICATION
        source: ptr
        isMandatory: true
        searchClause: AND r.applicationtype = $applicationtype
      - name: status
        label: status
        type: singlevaluelist
        pattern: list://INITIATED:INITIATED,DOCUMENTVERIFY:DOCUMENTVERIFY,PENDINGAPPROVAL:PENDINGAPPROVAL,PENDINGPAYMENT:PENDINGPAYMENT,APPROVED:APPROVED,REJECTED:REJECTED,CITIZENACTIONREQUIRED:CITIZENACTIONREQUIRED
        source: ptr
        isMandatory: false
        searchClause: AND r.status = $status
      - name: fromDate
        label: fromDate
        type: epoch
        source: ptr
        isMandatory: true
        searchClause: AND r.createdtime >= $fromDate
      - name: toDate
        label: toDate
        type: epoch
        source: ptr
        isMandatory: true
        searchClause: AND r.createdtime<=$toDate
    query: |
      -- Use CTE to force query plan, compute & use CTE later
       WITH current_holder AS (
            SELECT DISTINCT ON (wf.businessid)
                wf.businessid AS applicationnumber,
                u.name AS assignee_employee,
                e.code AS assignee_code
              FROM eg_wf_processinstance_v2 wf
              JOIN eg_wf_state_v2 st ON wf.status = st.uuid
              LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
              LEFT JOIN eg_user u ON u.uuid = wa.assignee
              LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
              WHERE wf.tenantid = $tenantid
              AND wf.businessservice = 'ptr'
               ORDER BY wf.businessid, wf.lastmodifiedtime DESC
              )
         SELECT
           r.applicationnumber, r.status, pd.petname, pd.pettype,
           pd.breedtype, pd.petage, pd.petgender, pd.petcolor, pd.identificationmark,
           pd.vaccinationnumber, pd.doctorname, pd.clinicname, u.mobilenumber, u.name,
           ch.assignee_employee, ch.assignee_code
          FROM eg_ptr_registration AS r
           LEFT JOIN eg_ptr_owner AS o ON o.ptrregistrationid = r.id
           LEFT JOIN eg_ptr_petdetails AS pd ON r.id = pd.petdetailsid
           LEFT JOIN eg_user AS u ON u.uuid = o.uuid
           LEFT JOIN current_holder ch ON ch.applicationnumber = r.applicationnumber
            WHERE  r.tenantid = $tenantid
            
  - reportName: CollectionsReport
    decryptionPathId: PETREPORTS
    summary: Collections
    version: 1.0.0
    moduleName: rainmaker-ptr
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: applicationno
        label: applicationno
        type: string
        source: ptr
        total: false
      - name: name
        label: name
        type: string
        source: ptr
        total: false
      - name: mobilenumber
        label: mobilenumber
        type: string
        source: ptr
        total: false
      - name: businessservice
        label: businessservice
        type: string
        source: ptr
        total: false
      - name: status
        label: status
        type: string
        source: ptr
        total: false
      - name: collector_code
        label: collector_code
        type: string
        source: ptr
        total: false
      - name: cash_amount
        label: cash_amount
        type: string
        source: ptr
        total: true
      - name: cheque_amount
        label: cheque_amount
        type: string
        source: ptr
        total: true
      - name: card_amount
        label: card_amount
        type: string
        source: ptr
        total: true
      - name: dd_amount
        label: dd_amount
        type: string
        source: ptr
        total: true
      - name: neft_amount
        label: neft_amount
        type: string
        source: ptr
        total: true
      - name: rtgs_amount
        label: rtgs_amount
        type: string
        source: ptr
        total: true
      - name: online_amount
        label: online_amount
        type: string
        source: ptr
        total: true
      - name: amountpaid
        label: amountpaid
        type: string
        source: ptr
        total: true
      - name: PaymentDate
        label: PaymentDate
        type: string
        source: ptr
        total: false
    searchParams:
      - name: collector_code
        label: collector_code
        type: string
        source: ptr
        isMandatory: false
        searchClause: AND collector_code = $collector_code
      - name: fromDate
        label: fromDate
        type: epoch
        source: ptr
        isMandatory: true
        searchClause: AND createdtime >= $fromDate
      - name: toDate
        label: toDate
        type: epoch
        source: ptr
        isMandatory: true
        searchClause: AND createdtime <= $toDate
    query: >
      -- Use CTE to force query plan, compute & use CTE later

      WITH current_holder AS (
            SELECT DISTINCT ON (wf.businessid)
                 wf.businessid AS applicationno,
                 u.name AS employee_name,
                 e.code AS assignee_code,
                 UPPER(st.applicationstatus) AS current_stage
               FROM eg_wf_processinstance_v2 wf
               JOIN eg_wf_state_v2 st ON wf.status = st.uuid
               LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
               LEFT JOIN eg_user u ON u.uuid = wa.assignee
               LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
               WHERE wf.tenantid = $tenantid
               AND wf.businessservice = 'pet-services'
              ORDER BY wf.businessid, wf.lastmodifiedtime DESC
               ),
        unique_transactions AS (
            SELECT
                 p.id AS transaction_id,
                 p.createdtime,
                 p.totalamountpaid AS amountpaid,
                 CASE WHEN p.paymentmode IN ('CASH','OFFLINE_CASH') THEN p.totalamountpaid ELSE 0 END AS cash_amount,
                 CASE WHEN p.paymentmode = 'CHEQUE' THEN p.totalamountpaid ELSE 0 END AS cheque_amount,
                 CASE WHEN p.paymentmode IN ('CARD','DEBIT_CARD','CREDIT_CARD','OFFLINE_CARD') THEN p.totalamountpaid ELSE 0 END AS card_amount,
                 CASE WHEN p.paymentmode = 'DD' THEN p.totalamountpaid ELSE 0 END AS dd_amount,
                 CASE WHEN p.paymentmode IN ('NEFT','OFFLINE_NEFT') THEN p.totalamountpaid ELSE 0 END AS neft_amount,
                 CASE WHEN p.paymentmode IN ('RTGS','OFFLINE_RTGS','NEFT_RTGS') THEN p.totalamountpaid ELSE 0 END AS rtgs_amount,
                 CASE WHEN p.paymentmode = 'ONLINE' THEN p.totalamountpaid ELSE 0 END AS online_amount,
                 COALESCE(emp.code, 'SELF') AS collector_code,
                 r.applicationnumber AS applicationno,
                 r.status,
                'pet-services' AS businessservice,
                 u_cust.name AS name,
                 u_cust.mobilenumber AS mobilenumber,
                 ch.employee_name AS assignee_employee,
                 ch.assignee_code AS assignee_code
             FROM egcl_paymentdetail pd
            JOIN egcl_payment p ON pd.paymentid = p.id
            JOIN egcl_bill bill ON bill.id = pd.billid
            JOIN eg_ptr_registration r ON r.applicationnumber = bill.consumercode
            LEFT JOIN eg_ptr_owner o ON o.ptrregistrationid= r.id
            LEFT JOIN eg_user u_cust ON u_cust.uuid = o.uuid
            LEFT JOIN eg_user u ON u.id::text = p.createdby::text
            LEFT JOIN eg_hrms_employee emp ON emp.uuid::text = u.uuid::text
            LEFT JOIN current_holder ch ON ch.applicationno = r.applicationnumber
             WHERE p.paymentstatus != 'CANCELLED'
              AND pd.businessservice = 'pet-services'
              AND p.tenantid = $tenantid
              )
          SELECT 
             applicationno,name,mobilenumber,businessservice,status,collector_code,
             assignee_code,cash_amount,cheque_amount,card_amount,
             dd_amount,neft_amount,rtgs_amount,online_amount,amountpaid,
             TO_CHAR(TO_TIMESTAMP(createdtime / 1000),'DD-MM-YYYY HH24:MI:SS') AS "PaymentDate"
           FROM unique_transactions
           WHERE 1 = 1
    orderby: ORDER BY createdtime DESC;
    
  - reportName: SLAReport
    decryptionPathId: PETREPORTS
    summary: Sla report for ptr service
    version: 1.0.0
    moduleName: rainmaker-ptr
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: tenantid
        label: tenantid
        type: string
        source: ptr
        total: false
      - name: applicationnumber
        label: Application number
        type: string
        source: ptr
        total: false
      - name: applicationstatus
        label: Application status
        type: string
        source: ptr
        total: false
      - name: documentverify_on
        label: documentverify_on
        type: string
        source: ptr
        total: false
      - name: finalstatus_on
        label: finalstatus_on
        type: string
        source: ptr
        total: false
      - name: sla_days
        label: sla_days
        type: string
        source: ptr
        total: false
      - name: sla_status
        label: sla_status
        type: string
        source: ptr
        total: false
      - name: assigned_employee_name
        label: assigned_employee_name
        type: string
        source: ptr
        total: false
      - name: assigned_employee_code
        label: assigned_employee_code
        type: string
        source: ptr
        total: false
    searchParams:
      - name: fromDate
        label: fromDate
        type: epoch
        source: ptr
        isMandatory: true
        searchClause: AND ptr.createdtime >= $fromDate
      - name: toDate
        label: toDate
        type: epoch
        source: ptr
        isMandatory: true
        searchClause: AND ptr.createdtime <= $toDate
    query: >
      -- Use CTE to force query plan, compute & use CTE later

      WITH wf_detailed AS (
       SELECT 
        wf.businessid AS uuid, UPPER(st.applicationstatus) AS applicationstatus, wf.createdtime,
        wf.lastmodifiedtime,  wf.businessservicesla, wf.tenantid, wf.id AS processinstanceid
        FROM eg_wf_processinstance_v2 wf
        JOIN eg_wf_state_v2 st ON wf.status = st.uuid
        WHERE wf.tenantid = $tenantid
        AND wf.businessservice = 'ptr'
       ),
      status_times AS (
       SELECT
        uuid,
        MAX(CASE WHEN applicationstatus = 'DOCUMENTVERIFY' THEN createdtime END) AS docverify_time,
        MAX(CASE WHEN applicationstatus IN ('APPROVED', 'REJECTED') THEN lastmodifiedtime END) AS final_time
       FROM wf_detailed
       GROUP BY uuid
      ),

      latest_status AS (
       SELECT uuid, applicationstatus
        FROM (
          SELECT
            uuid, applicationstatus, lastmodifiedtime,
            ROW_NUMBER() OVER (PARTITION BY uuid ORDER BY lastmodifiedtime DESC NULLS LAST) AS rn
           FROM wf_detailed
         ) z
         WHERE rn = 1
        ),
      sla_data AS (
       SELECT
        bs.businessservice, bs.businessservicesla
       FROM eg_wf_businessservice_v2 bs
        WHERE bs.businessservice = 'ptr'
       ),
      assignee_details AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid, e.code AS employee_code, u.name AS employee_name
         FROM eg_wf_processinstance_v2 wf
         JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
         JOIN eg_hrms_employee e ON e.uuid = wa.assignee
         JOIN eg_user u ON e.uuid = u.uuid  
         WHERE wf.tenantid = $tenantid
         AND wf.businessservice = 'ptr'
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
          )
       SELECT
         split_part(ptr.tenantid, '.', 2) AS tenantid, ptr.applicationnumber AS applicationnumber, ls.applicationstatus,
         TO_CHAR(TO_TIMESTAMP(st.docverify_time / 1000), 'DD-MM-YYYY') AS documentverify_on,
         TO_CHAR(TO_TIMESTAMP(st.final_time / 1000), 'DD-MM-YYYY') AS finalstatus_on,
         CASE 
            WHEN st.final_time IS NOT NULL AND st.docverify_time IS NOT NULL
              THEN FLOOR((st.final_time - st.docverify_time) / 86400000)
            WHEN st.docverify_time IS NOT NULL
              THEN FLOOR((EXTRACT(EPOCH FROM NOW()) * 1000 - st.docverify_time) / 86400000)
          ELSE NULL
         END AS sla_days,
         CASE
            WHEN st.final_time IS NOT NULL AND st.docverify_time IS NOT NULL THEN
               CASE
                WHEN (st.final_time - st.docverify_time) > sla.businessservicesla THEN 'BREACHED'
                ELSE 'MEET'
            END
             WHEN st.docverify_time IS NOT NULL AND st.final_time IS NULL
              THEN 'IN-PROGRESS'
             ELSE 'AWAITING DOCVERIFY'
         END AS sla_status,
          ae.employee_name AS assigned_employee_name, ae.employee_code AS assigned_employee_code
         FROM eg_ptr_registration ptr
         LEFT JOIN status_times st ON ptr.applicationnumber = st.uuid
         LEFT JOIN latest_status ls ON ptr.applicationnumber = ls.uuid
         JOIN sla_data sla ON 'ptr' = sla.businessservice
         LEFT JOIN assignee_details ae ON ptr.applicationnumber = ae.businessid
         WHERE UPPER(ls.applicationstatus) NOT IN ('APPLY', 'INITIATED', 'PENDINGPAYMENT')
    orderby: ORDER BY ptr.createdtime DESC, tenantid, ls.applicationstatus; 
    
  - reportName: ReceiptRegisterPET
    decryptionPathId: PETREPORTS
    summary: Details of collector register in pet service
    version: 1.0.0
    moduleName: rainmaker-ptr
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
    - name: receiptno
      label: receiptno
      type: string
      source: ptr
      total: false
    - name: connectionno
      label: connectionno
      type: string
      source: ptr
