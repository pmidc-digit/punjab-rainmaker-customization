               WHERE wf.businessservice = 'ptr'
               ORDER BY wf.businessid, wf.lastmodifiedtime DESC
            )
        SELECT 
           r.applicationnumber AS applicationnumber,
           u.mobilenumber AS mobilenumber,
           -- COALESCE(o.address, o.permanentaddress, NULL) AS "Address",
