        source: ptr
        total: false
      - name: petgender
        label: petgender
        type: string
        source: ptr
        total: false
      - name: petage
        label: petage
        type: string
        source: ptr
        total: false
      - name: petcolor
        label: petcolor
        type: string
        source: ptr
        total: false
      - name: breedtype
        label: breedtype
        type: string
        source: ptr
        total: false
      - name: identificationmark
        label: identificationmark
        type: string
        source: ptr
        total: false
      - name: vaccinationnumber
        label: vaccinationnumber
