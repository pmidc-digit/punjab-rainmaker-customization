  - reportName: StateCollectionsReport
    decryptionPathId: RLREPORTS  
    summary: Collections
    version: 1.0.0
    moduleName: rainmaker-rl
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: tenantid
        label: Ulb Name
        type: string
        source: rl
        total: false
      - name: applicationno
        label: Application Number
        type: string
        source: rl
        total: false
      - name: name
        label: Name
        type: string
        source: rl
        total: false
      - name: mobilenumber
        label: Mobile Number
        type: string
        source: rl
        total: false
      - name: businessservice
        label: businessservice
        type: string
        source: rl
        total: false
      - name: current_stage
        label: Application Status
        type: string
        source: rl
        total: false
      - name: cash_amount
        label: Cash Amount
        type: string
        source: rl
        total: true
      - name: cheque_amount
        label: Cheque Amount
        type: string
        source: rl
        total: true
      - name: card_amount
        label: Card Amount
        type: string
        source: rl
        total: true
      - name: dd_amount
        label: DD Amount
        type: string
        source: rl
        total: true
      - name: neft_amount
        label: NEFT Amount
        type: string
        source: rl
        total: true
      - name: rtgs_amount
        label: RTGS Amount
        type: string
        source: rl
        total: true
      - name: online_amount
        label: Online Amount
        type: string
        source: rl
        total: true
      - name: amountpaid
        label: Amount Paid
        type: string
        source: rl
        total: true
      - name: PaymentDate
        label: Payment Date
        type: string
        source: rl
        total: false
    searchParams:
      - name: fromDate
        label: From Date
        type: epoch
        source: rl
        isMandatory: true
        searchClause: AND createdtime >= $fromDate
      - name: toDate
        label: To Date
        type: epoch
        source: rl
        isMandatory: true
        searchClause: AND createdtime <= $toDate
      - name: ulb
        label: ULB Name
        type: singlevaluelist
        pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
        source: rl
        isMandatory: false
        searchClause: AND tenantid = $ulb
    query: >
      -- Use CTE to force query plan, compute & use CTE later
       WITH current_holder AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid AS applicationno,
          wf.tenantid AS tenantid, 
          u.name AS employee_name,
          e.code AS assignee_code,
          UPPER(st.applicationstatus) AS current_stage
         FROM eg_wf_processinstance_v2 wf
         JOIN eg_wf_state_v2 st ON wf.status = st.uuid
         LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
         LEFT JOIN eg_user u ON u.uuid = wa.assignee
         LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
         WHERE wf.businessservice IN ('RENT_AND_LEASE_LG','RENT_N_LEASE_NEW')
         ORDER BY wf.businessid, wf.lastmodifiedtime DESC
        ),
        unique_transactions AS (
         SELECT
          p.id AS transaction_id,
          p.createdtime,
          p.tenantid AS tenantid,  
          pd.amountpaid,
          CASE WHEN p.paymentmode IN ('CASH','OFFLINE_CASH') THEN pd.amountpaid ELSE 0 END AS cash_amount,
          CASE WHEN p.paymentmode = 'CHEQUE' THEN pd.amountpaid ELSE 0 END AS cheque_amount,
          CASE WHEN p.paymentmode IN ('CARD','DEBIT_CARD','CREDIT_CARD','OFFLINE_CARD') THEN pd.amountpaid ELSE 0 END AS card_amount,
          CASE WHEN p.paymentmode = 'DD' THEN pd.amountpaid ELSE 0 END AS dd_amount,
          CASE WHEN p.paymentmode IN ('NEFT','OFFLINE_NEFT') THEN pd.amountpaid ELSE 0 END AS neft_amount,
          CASE WHEN p.paymentmode IN ('RTGS','OFFLINE_RTGS','NEFT_RTGS') THEN pd.amountpaid ELSE 0 END AS rtgs_amount,
          CASE WHEN p.paymentmode = 'ONLINE' THEN pd.amountpaid ELSE 0 END AS online_amount,
          COALESCE(emp.code, 'SELF') AS collector_code,
          r.application_number AS applicationno,
          r.status,
          'Rent & Lease' AS businessservice,
          u_cust.name AS name,
          u_cust.mobilenumber AS mobilenumber,
          ch.employee_name AS assignee_employee,
          ch.assignee_code AS assignee_code , ch.current_stage AS current_stage
          FROM egcl_paymentdetail pd
          JOIN egcl_payment p ON pd.paymentid = p.id
          JOIN egcl_bill bill ON bill.id = pd.billid
          JOIN eg_rl_allotment r ON r.application_number = bill.consumercode
          INNER JOIN public.eg_rl_owner_info o ON o.allotment_id= r.id
          LEFT JOIN eg_user u_cust ON u_cust.uuid = o.user_uuid
          LEFT JOIN eg_user u ON u.id::text = p.createdby::text
          LEFT JOIN eg_hrms_employee emp ON emp.uuid::text = u.uuid::text
          LEFT JOIN current_holder ch ON ch.applicationno = r.application_number
          WHERE pd.businessservice = 'rl-services'
          AND p.paymentstatus != 'CANCELLED'
        ) 
       SELECT
        applicationno,
        name,tenantid,
        mobilenumber,
        'Rent & Lease' AS businessservice,status,
        current_stage ,
        collector_code,
        cash_amount,
        cheque_amount,
        card_amount,
        dd_amount,
        neft_amount,
        rtgs_amount,
        online_amount,
        amountpaid,
        to_char(to_timestamp(createdtime / 1000),'DD-MM-YYYY HH24:MI:SS') AS PaymentDate
        FROM unique_transactions
        WHERE 1=1
    orderby: ORDER BY createdtime DESC

