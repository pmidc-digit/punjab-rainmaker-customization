        total: false
      - name: ownername1
        label: Owner Name
        type: string
        source: rl
        total: false
      - name: manualreceiptnumber
        label: Manual Receipt Number
        type: string
        source: rl
        total: false
      - name: manualreceiptdate
        label: Manual Receipt Date
        type: string
        source: rl
        total: false
    searchParams:
      - name: fromDate
        label: From Date
        type: epoch
        source: rl
        isMandatory: true
        searchClause: AND pd.receiptdate >= $fromDate
      - name: toDate
        label: To Date
        type: epoch
        source: rl
        isMandatory: true
        searchClause: AND pd.receiptdate <= $toDate
      - name: receiptno
        label: Receipt Number
        type: string
        source: rl
        isMandatory: false
        searchClause: AND pd.receiptnumber like $receiptno
      - name: paymentMode
        label: Payment Mode
        type: singlevaluelist
        pattern: list://CASH:CASH,CHEQUE:CHEQUE,DD:DD,ONLINE:ONLINE,CARD:CARD,OFFLINE_NEFT:OFFLINE NEFT
        source: rl
        isMandatory: false
        searchClause: AND payment.paymentmode like $paymentMode
    query: >
      -- Use CTE to force query plan, compute & use CTE later
       SELECT
        pd.receiptnumber AS receiptno,
        bill.consumercode AS connectionno,
        TO_CHAR(TO_TIMESTAMP(pd.receiptdate / 1000) AT TIME ZONE 'Asia/Kolkata','DD-MM-YYYY') AS receiptdate,
        'Rent & lease' AS service,
        usr.name AS collectorname,
        TO_CHAR(TO_TIMESTAMP(payment.instrumentdate / 1000) AT TIME ZONE 'Asia/Kolkata','DD-MM-YYYY') AS transactiondate,
        payment.instrumentnumber AS instrumentnumber,
        u_owner.name AS payername,
        pd.amountpaid,
        payment.paymentmode,
        payment.paymentstatus,
        u_owner.name AS ownername1,
        usr.id AS user,
        usr.name  AS ownername1,
        pd.amountpaid AS amountpaid,
        payment.paymentmode AS paymentmode,
        payment.paymentstatus AS paymentstatus,
        pd.manualreceiptnumber,
        pd.manualreceiptdate
       FROM egcl_paymentdetail pd
       INNER JOIN egcl_bill bill ON bill.id = pd.billid AND pd.tenantid = $tenantid
       INNER JOIN egcl_payment payment ON payment.id = pd.paymentid
       JOIN eg_rl_allotment r ON r.application_number = bill.consumercode
       INNER JOIN public.eg_rl_owner_info o ON o.allotment_id= r.id
       LEFT JOIN eg_user u_owner ON u_owner.uuid = o.user_uuid      
       LEFT JOIN eg_user usr  ON usr.id = payment.createdby::integer
       WHERE bill.tenantid = $tenantid
        AND pd.businessservice = 'rl-services'
    orderby: ORDER BY pd.receiptdate DESC;
    
