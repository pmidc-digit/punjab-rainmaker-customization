        pd.receiptnumber AS receiptno,
        bill.consumercode AS connectionno,
        TO_CHAR(TO_TIMESTAMP(pd.receiptdate / 1000) AT TIME ZONE 'Asia/Kolkata','DD-MM-YYYY') AS receiptdate,
        'Rent & lease' AS service,
        usr.name AS collectorname,
        TO_CHAR(TO_TIMESTAMP(payment.instrumentdate / 1000) AT TIME ZONE 'Asia/Kolkata','DD-MM-YYYY') AS transactiondate,
        payment.instrumentnumber AS instrumentnumber,
        u_owner.name AS payername,
        pd.amountpaid,bill.tenantid,
        payment.paymentmode,
        payment.paymentstatus,
        u_owner.name AS ownername1,
        usr.id AS user,
        usr.name  AS ownername1,
        pd.amountpaid AS amountpaid,
        payment.paymentmode AS paymentmode,
        payment.paymentstatus AS paymentstatus,
        pd.manualreceiptnumber,
        pd.manualreceiptdate
       FROM egcl_paymentdetail pd
       INNER JOIN egcl_bill bill ON bill.id = pd.billid 
       INNER JOIN egcl_payment payment ON payment.id = pd.paymentid
       JOIN eg_rl_allotment r ON r.application_number = bill.consumercode
       INNER JOIN public.eg_rl_owner_info o ON o.allotment_id= r.id
       LEFT JOIN eg_user u_owner ON u_owner.uuid = o.user_uuid      
       LEFT JOIN eg_user usr  ON usr.id = payment.createdby::integer
       WHERE  pd.businessservice = 'rl-services'
    orderby: ORDER BY pd.receiptdate DESC;


  - reportName: RLdetailreport
    summary: Details of application in Rent & Lease service 
    version: 1.0.0
    moduleName: rainmaker-rl
    additionalConfig:
      print:
        pdfPageSize: A4
    sourceColumns:
      - name: tenant_id
        label: tenant_id
        type: string
        source: rl
        total: false
      - name: status
        label: Application Status
        type: string
        source: rl
        total: false
      - name: property_id
        label: Property Id
        type: string
        source: rl
        total: false
      - name: application_type
        label: application_type
        type: string
        source: rl
        total: false
      - name: application_number
        label: application_number
        type: string
        source: rl
        total: false      
    searchParams:
      - name: status
        label: Application Status
        type: singlevaluelist
        pattern: 'list://INITIATED:Initiated,FORWARD_FOT_SETLEMENT:Forward For Settlement,CLOSED:Closed, APPROVED:Approved,PENDINGFORAPPROVAL:Pending For Approval , PENDING_FOR_DOCUMENT_VERIFY:Pending For Document Verify,PENDING_FOR_PAYMENT:Pending For Payment,PENDING_REQUEST_FOR_DISCONNECTION:Pending Request For Disconnection'
        source: rl
        isMandatory: false
        searchClause: AND r.status = $status
      - name: ulb
        label: ULB
        type: singlevaluelist
        pattern: 'http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name'
        source: rl
        isMandatory: false
        searchClause: AND r.tenant_id = $ulb

    query: |
        select tenant_id, status, property_id, application_type, application_number from public.eg_rl_allotment 
        where 1=1
 
        

      
