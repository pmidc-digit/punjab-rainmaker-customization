---
ReportDefinitions:
  - reportName: Applicant Detail Report
    decryptionPathId: 
    summary: Details of applicant in ndc service
    version: 1.0.0
    moduleName: rainmaker-ndc
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: Applicant_name
        label: reports.ndc.Applicant_name
        type: string
        source: ndc
        total: false
      - name: mobile
        label: reports.ndc.mobile
        type: string
        source: ndc
        total: false
      - name: email
        label: reports.ndc.email
        type: string
        source: ndc
        total: false
      - name: tenantid
        label: reports.ndc.tenantid
        type: string
        source: ndc
        total: false
      - name: address
        label: reports.ndc.address
        type: string
        source: ndc
        total: false
      - name: applicationstatus
        label: reports.ndc.applicationstatus
        type: string
        source: ndc
        total: false
      - name: applicantid
        label: reports.ndc.applicantid
        type: string
        source: ndc
        total: false
      - name: dueamount
        label: reports.ndc.dueamount
        type: string
        source: ndc
        total: true
      - name: consumercode
        label: reports.ndc.consumercode
        type: string
        source: ndc
        total: false
      - name: businessservice
        label: reports.ndc.businessservice
        type: string
        source: ndc
        total: false
      - name: sla_status
        label: reports.ndc.sla_status
        type: string
        source: ndc
        total: false
      - name: startdate
        label: reports.ndc.startdate
        type: string
        source: ndc
        total: false
      - name: enddate
        label: reports.ndc.enddate
        type: string
        source: ndc
        total: false
    searchParams:
      - name: fromDate
        label: reports.ndc.fromDate
        type: epoch
        source: ndc
        isMandatory: true
        searchClause: AND a.createdtime >= $fromDate
      - name: toDate
        label: reports.ndc.toDate
        type: epoch
        source: ndc
        isMandatory: true
        searchClause: AND a.lastmodifiedtime <= $toDate
      - name: tenantid
        label: reports.ndc.tenantid
        type: epoch
        source: ndc
        isMandatory: false
        searchClause: AND a.tenantid = $tenantid
    query: >
      -- Use CTE to force query plan, compute & use CTE later
      SELECT
      CONCAT(a.firstname, ' ', a.lastname) AS applicant_name ,a.mobile,a.email , 
      a.tenantid,a.address,
      TO_CHAR(TO_TIMESTAMP(a.createdtime / 1000), 'YYYY-MM-DD') AS start_date,
      a.applicationstatus,TO_CHAR(TO_TIMESTAMP(COALESCE(a.lastmodifiedtime, a.createdtime) / 1000), 'YYYY-MM-DD') AS end_date,
      CASE 
        WHEN (EXTRACT(EPOCH FROM (TO_TIMESTAMP(COALESCE(a.lastmodifiedtime, a.createdtime) / 1000)) - TO_TIMESTAMP(a.createdtime / 1000)) / 86400) > 10 THEN 'Breach'
        ELSE 'Meet'
      END AS sla_status,
      d.businessservice,d.consumercode,d.applicantid,d.dueamount 
      FROM
      eg_ndc_applicants a
      JOIN eg_ndc_details d ON a.uuid = d.applicantid
      WHERE
       a.tenantid = $tenantid
       --TO_CHAR(TO_TIMESTAMP(a.createdtime / 1000), 'YYYY-MM') = TO_CHAR(NOW(), 'YYYY-MM')
  - reportName: CollectionsReport
    summary: Collections
    version: 1.0.0
    moduleName: rainmaker-ndc
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: month
        label: reports.ndc.month
        type: string
        source: ndc
        total: false
      - name: totalamount
        label: reports.pt.totalamount
        type: string
        source: ndc
        total: false
      - name: totalcount
        label: reports.ndc.totalcount
        type: string
        source: ndc
        total: false
      - name: online
        label: reports.ndc.online
        type: string
        source: ndc
        total: true
      - name: cash
        label: reports.ndc.cash
        type: string
        source: ndc
        total: true
      - name: cheque
        label: reports.ndc.cheque
        type: string
        source: ndc
        total: true
      - name: dd
        label: reports.ndc.dd
        type: string
        source: ndc
        total: true
      - name: card
        label: reports.ndc.card
        type: string
        source: ndc
        total: true
      - name: neft
        label: reports.ndc.neft
        type: string
        source: ndc
        total: true
      - name: rtgs
        label: reports.ndc.rtgs
        type: string
        source: ndc
        total: true
      - name: po
        label: reports.ndc.po
        type: string
        source: ndc
        total: true
    searchParams:
      - name: tenantid
        label: reports.ndc.tenantid
        type: epoch
        source: ndc
        isMandatory: false
        searchClause: AND payment.tenantid = $tenantid
      - name: businessservice
        label: reports.ndc.businessservice
        type: epoch
        source: ndc
        isMandatory: true
        searchClause: AND pd.businessservice = $businessservice
    query: >
      -- Use CTE to force query plan, compute & use CTE later

      SELECT 
      DATE_TRUNC('month', TO_TIMESTAMP(payment.createdtime / 1000) AT TIME ZONE 'Asia/Kolkata') AS month,
      SUM(payment.totalamountpaid) AS totalamount,
      COUNT(payment.totalamountpaid) AS totalcount,
      SUM(CASE WHEN payment.paymentmode = 'ONLINE' THEN payment.totalamountpaid ELSE 0 END) AS online,
      SUM(CASE WHEN payment.paymentmode = 'CASH' THEN payment.totalamountpaid ELSE 0 END) AS cash,
      SUM(CASE WHEN payment.paymentmode = 'CHEQUE' THEN payment.totalamountpaid ELSE 0 END) AS cheque,
      SUM(CASE WHEN payment.paymentmode = 'DD' THEN payment.totalamountpaid ELSE 0 END) AS dd,
      SUM(CASE WHEN payment.paymentmode = 'CARD' THEN payment.totalamountpaid ELSE 0 END) AS card,
      SUM(CASE WHEN payment.paymentmode = 'OFFLINE_RTGS' THEN payment.totalamountpaid ELSE 0 END) AS rtgs,
      SUM(CASE WHEN payment.paymentmode = 'OFFLINE_NEFT' THEN payment.totalamountpaid ELSE 0 END) AS neft,
      SUM(CASE WHEN payment.paymentmode = 'POTAL_ORDER' THEN payment.totalamountpaid ELSE 0 END) AS po
      FROM 
      egcl_paymentdetail pd
      JOIN 
      egcl_payment payment ON pd.paymentid = payment.id
      JOIN 
      egcl_bill bill ON bill.id = pd.billid
      JOIN 
      eg_ndc_details ndc ON ndc.consumercode = bill.consumercode
      WHERE 
      payment.paymentstatus != 'CANCELLED'
      AND payment.tenantid = $tenantid  
      AND pd.businessservice = $businessservice       
    groupby: DATE_TRUNC('month', TO_TIMESTAMP(payment.createdtime / 1000) AT TIME ZONE 'Asia/Kolkata')
    orderby: ORDER BY month
