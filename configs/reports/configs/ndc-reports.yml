---
ReportDefinitions:
- reportName: ApplicationDetailReport
  decryptionPathId: ALL_ACCESS
  summary: Details of applicant in ndc service
  version: 1.0.0
  moduleName: rainmaker-ndc
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: name
    label: name
    type: string
    source: ndc
    total: false
  - name: mobilenumber
    label: mobilenumber
    type: string
    source: ndc
    total: false
  - name: emailid
    label: emailid
    type: string
    source: ndc
    total: false
  - name: tenantid
    label: tenantid
    type: string
    source: ndc
    total: false
  - name: address
    label: address
    type: string
    source: ndc
    total: false
  - name: action
    label: action
    type: string
    source: ndc
    total: false
  - name: consumercode
    label: consumercode
    type: string
    source: ndc
    total: false
  - name: applicationstatus
    label: applicationstatus
    type: string
    source: ndc
    total: false
  - name: businessservice
    label: businessservice
    type: string
    source: ndc
    total: false
  - name: dueamount
    label: dueamount
    type: string
    source: ndc
    total: true
  - name: applicationid
    label: applicationid
    type: string
    source: ndc
    total: false
  - name: status
    label: status
    type: string
    source: ndc
    total: false
  searchParams:
  - name: fromDate
    label: fromDate
    type: epoch
    source: ndc
    isMandatory: true
    searchClause: AND a.createdtime >= $fromDate
  - name: toDate
    label: toDate
    type: epoch
    source: ndc
    isMandatory: true
    searchClause: AND a.createdtime <= $toDate
  - name: tenantid
    label: tenantid
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: ndc
    wrapper: true
    isMandatory: true
    searchClause: AND a.tenantid = $tenantid
  query: |
      -- Use CTE to force query plan, compute & use CTE later
      SELECT 
        u.name, u.mobilenumber, u.emailid ,ua.address,a.tenantid,
        a.action, d.consumercode, a.applicationstatus, d.businessservice, 
        d.applicationid, d.dueamount, d.status
      FROM  eg_user  u
      JOIN eg_ndc_owner AS o ON u.uuid = o.uuid
      JOIN eg_ndc_details AS d ON o.ndcapplicationuuid = d.applicationid
      JOIN eg_ndc_application AS a ON a.uuid = o.ndcapplicationuuid
      LEFT JOIN eg_user_address AS ua ON ua.userid = u.id
      WHERE 1=1
- reportName: CollectionsReport
  summary: Collections
  version: 1.0.0
  moduleName: rainmaker-ndc
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: collector_code
    label: collector_code
    type: string
    source: ndc
    total: false
  - name: payment_mode
    label: payment_mode
    type: string
    source: ndc
    total: false
  - name: total_amount
    label: total_amount
    type: string
    source: ndc
    total: true
  - name: total_count
    label: total_count
    type: string
    source: ndc
    total: false
  searchParams:
  - name: tenantid
    label: tenantid
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: ndc
    wrapper: true
    isMandatory: true
    searchClause: AND tenantid = $tenantid
  - name: collector_code
    label: collector_code
    type: string
    source: ndc
    isMandatory: false
    searchClause: AND collector_code = $collector_code
  - name: fromdate
    label: fromdate
    type: epoch
    source: ndc
    isMandatory: true
    searchClause: AND createdtime BETWEEN $fromdate
  - name: todate
    label: todate
    type: epoch
    source: ndc
    isMandatory: true
    searchClause: AND $todate
  query: |
      -- Use CTE to force query plan, compute & use CTE later
      WITH unique_transactions AS (
       SELECT
         p.id AS transaction_id, p.createdtime,p.totalamountpaid,
         CASE
         WHEN p.paymentmode IN ('POSTAL_ORDER','POTAL_ORDER') THEN 'POSTAL_ORDER'
         WHEN p.paymentmode IN ('RTGS','OFFLINE_RTGS','NEFT_RTGS') THEN 'OFFLINE_RTGS'
         WHEN p.paymentmode IN ('NEFT','OFFLINE_NEFT') THEN 'OFFLINE_NEFT'
         WHEN p.paymentmode IN ('CASH','OFFLINE_CASH') THEN 'CASH'
         WHEN p.paymentmode IN ('CARD','DEBIT_CARD','CREDIT_CARD','OFFLINE_CARD') THEN 'CARD'
         WHEN p.paymentmode IN ('ONLINE') THEN 'ONLINE'
         ELSE p.paymentmode
         END AS mode_norm,
         emp.code AS collector_code, pd.businessservice, p.tenantid
       FROM egcl_paymentdetail pd
       JOIN egcl_payment p ON pd.paymentid = p.id
       JOIN egcl_bill bill ON bill.id = pd.billid
       JOIN eg_ndc_details ndc ON ndc.consumercode = bill.consumercode
       LEFT JOIN eg_user u ON u.id::text = p.createdby::text
       LEFT JOIN eg_hrms_employee emp  ON emp.uuid::text = u.uuid::text
       WHERE p.paymentstatus != 'CANCELLED'
       AND p.tenantid =$tenantid
       AND p.createdtime BETWEEN $fromdate AND $todate
       AND 1=1
       )
       SELECT
       COALESCE(collector_code, 'SELF') AS collector_code,  
       mode_norm AS payment_mode,
       SUM(totalamountpaid) AS total_amount,
       COUNT(transaction_id) AS total_count
       FROM unique_transactions
       WHERE collector_code = $collector_code
       -- AND businessservice = 'WS'
  groupby: GROUP BY collector_code, mode_norm
  orderby: ORDER BY collector_code, total_amount DESC
- reportName: SLAReport
  summary: Sla report for ndc service
  version: 1.0.0
  moduleName: rainmaker-ndc
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: tenantid
    label: tenantid
    type: string
    source: ndc
    total: false
  - name: Applicationnumber
    label: Applicationnumber
    type: string
    source: ndc
    total: false
  - name: Applicationstatus
    label: Applicationstatus
    type: string
    source: ndc
    total: false
  - name: documentverify_on
    label: documentverify_on
    type: string
    source: ndc
    total: false
  - name: finalstatus_on
    label: finalstatus_on
    type: string
    source: ndc
    total: false
  - name: sla_days
    label: sla_days
    type: string
    source: ndc
    total: false
  - name: sla_status
    label: sla_status
    type: string
    source: ndc
    total: false
  searchParams:
  - name: fromDate
    label: fromDate
    type: epoch
    source: ndc
    isMandatory: true
    searchClause: AND ndc.createdtime >= $fromDate
  - name: toDate
    label: toDate
    type: epoch
    source: ndc
    isMandatory: true
    searchClause: AND ndc.createdtime <= $toDate
  - name: tenantid
    label: tenantid
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: ndc
    wrapper: true
    isMandatory: true
    searchClause: AND ndc.tenantid = $tenantid
  query: |
      -- Use CTE to force query plan, compute & use CTE later
      WITH wf_detailed AS (
       SELECT 
        wf.businessid AS uuid,st.applicationstatus,wf.createdtime,wf.lastmodifiedtime
       FROM eg_wf_processinstance_v2 wf
       JOIN eg_wf_state_v2 st  ON wf.status = st.uuid
       WHERE wf.tenantid = $tenantid
          AND wf.businessservice = 'ndc-services' 
          ),
       status_times AS (
         SELECT 
           uuid, MAX(CASE WHEN upper(applicationstatus) = 'DOCUMENTVERIFY' THEN createdtime  END) AS docverify_time,
           MAX(CASE WHEN upper(applicationstatus) IN ('APPROVED','REJECTED') THEN lastmodifiedtime END) AS final_time
         FROM wf_detailed
         GROUP BY uuid
         ),
       sla_data AS (
       SELECT
        bs.businessservice,
        bs.businessservicesla
       FROM eg_wf_businessservice_v2 bs
       WHERE bs.businessservice = 'ndc-services'
       )
       SELECT 
        ndc.tenantid,ndc.uuid AS Applicationnumber,ndc.applicationstatus,
        TO_CHAR( TO_TIMESTAMP(st.docverify_time / 1000), 'DD-MM-YYYY') AS documentverify_on,
        TO_CHAR( TO_TIMESTAMP(st.final_time / 1000), 'DD-MM-YYYY') AS finalstatus_on,
        CASE
          WHEN st.final_time IS NOT NULL AND st.docverify_time IS NOT NULL 
            THEN  FLOOR ((st.final_time - st.docverify_time) / 86400000)
          WHEN st.docverify_time IS NOT NULL
             THEN FLOOR((EXTRACT(EPOCH FROM NOW()) * 1000 - st.docverify_time) / 86400000)
          ELSE NULL
        END AS sla_days,
        CASE 
          WHEN st.final_time IS NOT NULL AND st.docverify_time IS NOT NULL 
           THEN 
            CASE 
             WHEN (st.final_time - st.docverify_time) > sla.businessservicesla THEN 'BREACHED'
             ELSE 'MEET'
            END
          WHEN st.docverify_time IS NOT NULL AND st.docverify_time IS NULL
            THEN 'IN-PROGRESS'
          ELSE 'AWAITING DOCVERIFY'
        END AS sla_status
       FROM eg_ndc_application ndc
       LEFT JOIN status_times st
        ON ndc.uuid = st.uuid
       JOIN sla_data sla
        ON 'ndc-services' = sla.businessservice
        WHERE upper(ndc.applicationstatus) IN ('REJECTED','APPROVED','DOCUMENTVERIFY')
  orderby: ORDER BY ndc.createdtime DESC ,tenantid,applicationstatus;
