- reportName: Pending_Files_Summary
  summary: Beyond Time Line Pending Files Summary
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: ulb_name
    label: ULB Name
    type: string
    source: obpas_bpa
    total: false  
  - name: Pending_Files
    label: Pending Files
    type: string
    source: obpas_bpa
    total: true 
  query: |
       SELECT 
           INITCAP(REPLACE(tenantid, 'pb.', '')) AS ulb_name,
           status,
           COUNT(*) AS Pending_Files
       FROM eg_bpa_buildingplan
       WHERE businessservice = 'BPA_LOW' and status IN (
           'VERIFICATION_INPROGRESS',
           'FIELDINSPECTION_INPROGRESS',
           'INSPECTION_REPORT_PENDING',
           'DOC_VERIFICATION_INPROGRESS')
  groupby: GROUP BY tenantid, status
  
- reportName: officers_with_highest_pendency
  summary: Top 7 officers with Highest Pendency
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: serial_no
    label: Serial No
    type: string
    source: obpas_bpa
    total: false
  - name: ulb_name
    label: ULB Name
    type: string
    source: obpas_bpa
    total: false
  - name: Officer_Designation
    label: Officer Designation
    type: string
    source: obpas_bpa
    total: false
  - name: pending_files
    label: Pending Files
    type: string
    source: obpas_bpa
    total: false  
  searchParams:    
  - name: businessservice
    label: Business Service
    type: singlevaluelist
    pattern: list://BPA_LOW%:BPA_LOW,BPA_NP_HIGH_OTH%:BPA_NP_HIGH_OTH,BPA_MC%:BPA_MC,BPA_NP%:BPA_NP,BPA_MC_HIGH_OTH%:BPA_MC_HIGH_OTH,BPA_NP_HIGH%:BPA_NP_HIG,BPA_MC_HIGH%:BPA_MC_HIGH
    source: pt
    isMandatory: true
    searchClause: AND 1=1 

  query: |
       WITH latest_assignee AS (
         SELECT DISTINCT ON (wf.businessid)
           wf.businessid,
           wf.tenantid,
           d.name AS designation_code
         FROM eg_wf_processinstance_v2 wf
         JOIN eg_wf_state_v2 st    ON wf.status = st.uuid
         LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
         LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
         inner JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
         inner join designation d on a.designation = d.code
          WHERE wf.businessservice in ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH')
          and wf.businessservice = $businessservice
         ORDER BY wf.businessid, wf.lastmodifiedtime DESC
       ),
       
       pending_files AS (
         SELECT
           id::text AS bp_id,
           applicationno,
           tenantid,
           status
         FROM eg_bpa_buildingplan
         WHERE businessservice = $businessservice
           AND status IN (
             'VERIFICATION_INPROGRESS',
             'FIELDINSPECTION_INPROGRESS',
             'INSPECTION_REPORT_PENDING',
             'DOC_VERIFICATION_INPROGRESS'
           )
       ),
       
       merged AS (
         SELECT
           INITCAP(REPLACE(la.tenantid, 'pb.', '')) AS ulb_name,
           la.designation_code,
           COUNT(DISTINCT p.bp_id) AS pending_files
         FROM latest_assignee la
         LEFT JOIN pending_files p
           ON (
                p.bp_id = la.businessid
             OR p.applicationno = la.businessid
           )
         GROUP BY la.tenantid, INITCAP(REPLACE(la.tenantid, 'pb.', '')), la.designation_code
       )
       
       SELECT
         ROW_NUMBER() OVER (ORDER BY pending_files DESC) AS Serial_No,
         ulb_name ,
         designation_code as Officer_Designation,
         pending_files 
       FROM merged where 1=1
  orderby:  ORDER BY pending_files DESC limit 7

- reportName: officers_wise_pendency
  summary: officers wise  Pendency Trend Analysis - Last 7 Days
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: Officer_Designation
    label: Officer Designation
    type: string
    source: obpas_bpa
    total: false
  - name: day0
    label: day0
    type: string
    source: obpas_bpa
    total: true
  - name: day1
    label: day1
    type: string
    source: obpas_bpa
    total: true
  - name: day2
    label: day2
    type: string
    source: obpas_bpa
    total: true
  - name: day3
    label: day3
    type: string
    source: obpas_bpa
    total: true
  - name: day4
    label: day4
    type: string
    source: obpas_bpa
    total: true
  - name: day5
    label: day5
    type: string
    source: obpas_bpa
    total: true
  - name: day6
    label: day6
    type: string
    source: obpas_bpa
    total: true                     
  searchParams:
  - name: fromDate
    label: Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND 1=1     
  - name: businessservice
    label: Business Service
    type: singlevaluelist
    pattern: list://BPA_LOW%:BPA_LOW,BPA_NP_HIGH_OTH%:BPA_NP_HIGH_OTH,BPA_MC%:BPA_MC,BPA_NP%:BPA_NP,BPA_MC_HIGH_OTH%:BPA_MC_HIGH_OTH,BPA_NP_HIGH%:BPA_NP_HIG,BPA_MC_HIGH%:BPA_MC_HIGH
    source: pt
    isMandatory: true
    searchClause: AND 1=1 
  query: |
      WITH latest_assignee AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid,
          d.name AS designation_code
        FROM eg_wf_processinstance_v2 wf
        JOIN eg_wf_state_v2 st ON wf.status = st.uuid
        LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
        LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
        JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
        JOIN designation d ON d.code = a.designation
        WHERE wf.businessservice = $businessservice
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      ),
      
      base AS (
          SELECT 
              la.designation_code,
              p.createdtime = $fromDate 
          FROM latest_assignee la
          JOIN eg_bpa_buildingplan p
            ON p.id::text = la.businessid OR p.applicationno = la.businessid
          WHERE p.businessservice = $businessservice
            AND p.status IN (
                'VERIFICATION_INPROGRESS',
                'FIELDINSPECTION_INPROGRESS',
                'INSPECTION_REPORT_PENDING',
                'DOC_VERIFICATION_INPROGRESS'
            )
            AND to_timestamp(p.createdtime/1000) >= (
                SELECT MAX(to_timestamp(createdtime/1000))::date - INTERVAL '6 days'
                FROM eg_bpa_buildingplan
                WHERE businessservice = $businessservice
            )
      ),
      
      daily_count AS (
          SELECT
              designation_code,
              action_date,
              COUNT(*) AS cnt
          FROM base
          GROUP BY designation_code, action_date
      ),
      
      max_date AS (
          SELECT MAX(to_timestamp(createdtime/1000))::date AS mdate
          FROM eg_bpa_buildingplan
          WHERE businessservice = $businessservice
      )
      
      SELECT 
          designation_code AS officer_designation,
          SUM(CASE WHEN action_date = to_char((SELECT mdate FROM max_date), 'YYYY-MM-DD') THEN cnt ELSE 0 END) AS "day0",
          SUM(CASE WHEN action_date = to_char((SELECT mdate FROM max_date) - INTERVAL '1 day', 'YYYY-MM-DD') THEN cnt ELSE 0 END) AS "day1",
          SUM(CASE WHEN action_date = to_char((SELECT mdate FROM max_date) - INTERVAL '2 day', 'YYYY-MM-DD') THEN cnt ELSE 0 END) AS "day2",
          SUM(CASE WHEN action_date = to_char((SELECT mdate FROM max_date) - INTERVAL '3 day', 'YYYY-MM-DD') THEN cnt ELSE 0 END) AS "day3",
          SUM(CASE WHEN action_date = to_char((SELECT mdate FROM max_date) - INTERVAL '4 day', 'YYYY-MM-DD') THEN cnt ELSE 0 END) AS "day4",
          SUM(CASE WHEN action_date = to_char((SELECT mdate FROM max_date) - INTERVAL '5 day', 'YYYY-MM-DD') THEN cnt ELSE 0 END) AS "day5",
          SUM(CASE WHEN action_date = to_char((SELECT mdate FROM max_date) - INTERVAL '6 day', 'YYYY-MM-DD') THEN cnt ELSE 0 END) AS "day6"
      FROM daily_count where 1=1
  groupby: GROUP BY designation_code
  orderby: ORDER BY officer_designation  
  
  
