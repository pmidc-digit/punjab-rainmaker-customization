    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_bpa
    isMandatory: false
    searchClause: AND g.ulb_district = $district
  - name: tenant
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: AND tenantid = $tenant 
  query: |
      WITH combined_modules AS (
          -- 1. Modules Stack with Filters
          SELECT tenantid, status as applicationstatus, 'Building Plan' as module 
          FROM eg_bpa_buildingplan 
          WHERE tenantid != 'pb.testing' 
            AND createdby != '9ff4f498-46b0-4d7b-b833-874a8b1d0c27'
          
          UNION ALL
          
          SELECT n.tenantid, n.applicationstatus, 'NOC' as module 
          FROM eg_noc n 
          inner join eg_noc_details nd on nd.nocid = n.id
          WHERE n.tenantid != 'pb.testing' 
            AND n.createdby != '9ff4f498-46b0-4d7b-b833-874a8b1d0c27'
            AND n.applicationno not LIKE 'PB/%' AND (nd.additionaldetails::text not LIKE '%isMigrationTrue%'  OR nd.additionaldetails IS NULL)
          
          UNION ALL
          
          SELECT tenantid, applicationstatus, 'CLU' as module 
          FROM eg_clu 
          WHERE tenantid != 'pb.testing' 
            AND createdby != '9ff4f498-46b0-4d7b-b833-874a8b1d0c27'
          
          UNION ALL
          
          SELECT tenantid, applicationstatus, 'Layout' as module 
          FROM eg_layout 
          WHERE tenantid != 'pb.testing' 
            AND createdby != '9ff4f498-46b0-4d7b-b833-874a8b1d0c27'
      ),
      ulb_metadata AS (
          -- 2. Metadata Join
          SELECT 
              m.tenantid,m.module,
              u.type as ulb_type,
              u.district as ulb_district,
              u.name_of_ulb,
              CASE WHEN UPPER(TRIM(m.applicationstatus)) = 'APPROVED' THEN 'Approved'
              WHEN UPPER(TRIM(m.applicationstatus)) = 'REJECTED' THEN 'Rejected'
              WHEN UPPER(TRIM(m.applicationstatus)) = 'CANCELLED' THEN 'Cancelled' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('E-SIGNED', 'E_SIGNED') THEN 'E- Signed'
              WHEN UPPER(TRIM(m.applicationstatus)) = 'INITIATED' THEN 'Initiated'
              WHEN UPPER(TRIM(m.applicationstatus)) = 'BLOCKED' THEN 'Blocked' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'PULLED_BACK' THEN 'Pulled Back'
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('PENDINGAPPROVAL', 'APPROVAL_PENDING') THEN 'Approval Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('ATP_VERIFICATION_PENDING', 'DOCUMENTVERIFY_ATP/AME','LEVEL3_VERIFICATION_PENDING') THEN 'ATP Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('MTP_VERIFICATION_PENDING', 'DOCUMENTVERIFY_MTP/ME','LEVEL4_VERIFICATION_PENDING') THEN 'MTP Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('EO_VERIFICATION_PENDING', 'DOCUMENTVERIFY_EO') THEN 'EO Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('JC_VERIFICATION_PENDING', 'DOCUMENTVERIFY_JC') THEN 'JC Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('CITIZENACTIONREQUIRED', 'CITIZEN_APPROVAL_INPROCESS', 'PROFESSIONAL_ACTION_REQUIRED', 'PROFESSIONALACTIONREQUIRED', 'CITIZEN APPROVAL IN PROCESS') THEN 'Citizen Action Required' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('FIELDINSPECTION_INPROGRESS', 'FIELD INSPECTION INPROGRESS') THEN 'Field Inspection In Progress' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'JE_VERIFICATION_PENDING' THEN 'JE Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'STP_VERIFICATION_PENDING' THEN 'STP Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'ADC_VERIFICATION_PENDING' THEN 'ADC Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'CTPHQ_APPROVAL_PENDING' THEN 'CTPHQ Approval Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('STPHQ_APPROVAL_PENDING', 'DOCUMENTVERIFY_STP_HQ') THEN 'STP(HQ) Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'MTPHQ_APPROVAL_PENDING' THEN 'MTP(HQ) Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('ATPHQ_APPROVAL_PENDING', 'DOCUMENTVERIFY_ATP_HQ') THEN 'ATP(HQ) Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'MC_VERIFICATION_PENDING' THEN 'MC Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('DOCUMENTVERIFY', 'DOC_VERIFICATION_PENDING', 'DOC_VERIFICATION_INPROGRESS') THEN 'Document Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'INSPECTION_REPORT_PENDING' THEN 'Inspection Report Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('PENDINGAPPLICATIONPAYMENT', 'PENDING_APPL_FEE', 'PENDINGPAYMENT') THEN 'Pending Application Payment' 
              WHEN UPPER(TRIM(m.applicationstatus)) IN ('PENDINGSANCTIONPAYMENT', 'PENDING_SANC_FEE_PAYMENT') THEN 'Pending Sanction Payment' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'DOCUMENTVERIFY_DM' THEN 'DM Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'DOCUMENTVERIFY_STP(FIELD)' THEN 'STP Field Verification Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'DRAWING_ESIGN_PENDING' THEN 'Drawing E-Sign Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'SANCTION_LETTER_ESIGN_PENDING' THEN 'Sanction Letter E-Sign Pending' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'INPROGRESS' THEN 'In Progress' 
              WHEN UPPER(TRIM(m.applicationstatus)) = 'VERIFICATION_INPROGRESS' THEN 'Verification In Progress'
            ELSE INITCAP(REPLACE(m.applicationstatus, '_', ' ')) 
        END as localized_status
          FROM combined_modules m
          LEFT JOIN ulb_data u ON m.tenantid = u.ulb_code 
      ),
      ulb_stats AS (
          -- 3. Diversity Check for Subtotals
          SELECT name_of_ulb, COUNT(DISTINCT localized_status) as distinct_statuses
          FROM ulb_metadata
          GROUP BY name_of_ulb
      ),
      final_grouping AS (
          -- 4. Rollup Aggregation logic
          SELECT 
              ulb_type,
              ulb_district,
              name_of_ulb,
              localized_status,
              COUNT(*) FILTER (WHERE module = 'Building Plan') as bpa_count,
              COUNT(*) FILTER (WHERE module = 'NOC') as noc_count,
              COUNT(*) FILTER (WHERE module = 'CLU') as clu_count,
              COUNT(*) FILTER (WHERE module = 'Layout') as layout_count,
              GROUPING(ulb_type, ulb_district, name_of_ulb, localized_status) as grp_level,
              
              -- Partitioning logic to hide duplicate labels
              ROW_NUMBER() OVER(PARTITION BY ulb_type ORDER BY ulb_district, name_of_ulb, localized_status) as type_row_num,
              ROW_NUMBER() OVER(PARTITION BY ulb_type, ulb_district ORDER BY name_of_ulb, localized_status) as dist_row_num,
              ROW_NUMBER() OVER(PARTITION BY name_of_ulb ORDER BY localized_status) as name_row_num
              
          FROM ulb_metadata
          GROUP BY ROLLUP(ulb_type, ulb_district, name_of_ulb, localized_status)
      )
      SELECT 
          -- 1. ULB Type (Sirf tab dikhe jab naya block shuru ho)
          CASE WHEN g.type_row_num = 1 AND g.grp_level = 0 THEN CASE WHEN UPPER(g.ulb_type) = 'NP' THEN 'Nagar Panchayat' ELSE g.ulb_type END ELSE '' END AS "ULB Type",
          
          -- 2. District (Sirf tab dikhe jab block badle)
          CASE WHEN g.dist_row_num = 1 AND g.grp_level = 0 THEN g.ulb_district ELSE '' END AS "District",
      
          -- 3. Serial Number (#)
          CASE WHEN g.name_row_num = 1 AND g.grp_level = 0 THEN 
              DENSE_RANK() OVER(ORDER BY g.ulb_type, g.ulb_district, g.name_of_ulb)::text ELSE '' END AS "Sno",
      
          -- 4. ULB Name
          CASE WHEN g.name_row_num = 1 AND g.grp_level = 0 THEN g.name_of_ulb ELSE '' END AS "ULB Name",
      
          -- 5. Application Status: Manual Mapping using CASE
          CASE 
              WHEN g.grp_level = 15 THEN 'GRAND TOTAL' 
              WHEN g.grp_level = 1 THEN 'Sub Total'
              ELSE g.localized_status
        END AS "Application Status",
        -- 6. Metrics (Counts)
        NULLIF(g.bpa_count, 0) AS "Building Plan",
        NULLIF(g.noc_count, 0) AS "NOC",
        NULLIF(g.clu_count, 0) AS "CLU",
        NULLIF(g.layout_count, 0) AS "Layout"
        FROM final_grouping g
        LEFT JOIN ulb_stats s ON g.name_of_ulb = s.name_of_ulb 
        WHERE 
        (g.grp_level = 0) 
        OR (g.grp_level = 1 AND s.distinct_statuses > 1) OR (g.grp_level = 15)
  orderby: ORDER BY g.ulb_type, g.ulb_district, g.name_of_ulb, g.grp_level, g.localized_status;
- reportName: OBPAS_Collection_Summary_Report
  summary: Transaction detail for OBPS Module 
