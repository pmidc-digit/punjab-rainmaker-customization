- reportName: UserLoginDetailReportBPA
  decryptionPathId: LAYOUTREPORTS
  summary: User login details with BPA, CLU, Layout & NOC
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A4

  sourceColumns:
  - name: user_uuid
    label: User uuid
    type: string
    source: obpas_bpa
    total: false

  - name: user_id
    label: User Id
    type: string
    source: obpas_bpa
    total: false

  - name: username
    label: User Name
    type: string
    source: obpas_bpa
    total: false

  - name: login_time
    label: Login Time
    type: string
    source: obpas_bpa
    total: false

  - name: logout_time
    label: Logout Time
    type: string
    source: obpas_bpa
    total: false

  - name: role_code
    label: Role Code
    type: string
    source: obpas_bpa
    total: false

  - name: name
    label: Name
    type: string
    source: obpas_bpa
    total: false

  - name: bpa_building
    label: BPA Building
    type: string
    source: obpas_bpa
    total: false

  - name: clu
    label: CLU
    type: string
    source: obpas_bpa
    total: false

  - name: layout
    label: Layout
    type: string
    source: obpas_bpa
    total: false

  - name: noc
    label: NOC
    type: string
    source: obpas_bpa
    total: false

  - name: bpa_tenantid
    label: BPA ULB
    type: string
    source: obpas_bpa
    total: false

  - name: clu_tenantid
    label: CLU ULB
    type: string
    source: obpas_bpa
    total: false

  - name: layout_tenantid
    label: LAYOUT ULB
    type: string
    source: obpas_bpa
    total: false

  - name: noc_tenantid
    label: NOC ULB
    type: string
    source: obpas_bpa
    total: false

  - name: bpa_applicationno
    label: BPA Application No
    type: string
    source: obpas_bpa
    total: false

  - name: clu_applicationno
    label: CLU Application No
    type: string
    source: obpas_bpa
    total: false

  - name: layout_applicationno
    label: Layout Application No
    type: string
    source: obpas_bpa
    total: false

  - name: noc_applicationno
    label: NOC Application No
    type: string
    source: obpas_bpa
    total: false

  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_bpa
    isMandatory: false
    searchClause: AND u.login_time >= $fromDate

  - name: toDate
    label: To Date
    type: epoch
    source: obpas_bpa
    isMandatory: false
    searchClause: AND u.login_time <= $toDate


  query: |
      SELECT DISTINCT ON (u.user_id)
              u.user_uuid,
              u.user_id,
              u.username,
              u.login_time::text  AS login_time,
              u.logout_time::text AS logout_time,
              us.role_code,
              eu.name,
              eu.username AS eg_username,
              (bpa.accountid IS NOT NULL)::text AS bpa_building,
              (clu.accountid IS NOT NULL)::text AS clu,
              (lay.accountid IS NOT NULL)::text AS layout,
              (noc.accountid IS NOT NULL)::text AS noc,
      
              bpa.tenantid    AS bpa_tenantid,
              clu.tenantid    AS clu_tenantid,
              lay.tenantid    AS layout_tenantid,
              noc.tenantid    AS noc_tenantid,
      
              bpa.applicationno AS bpa_applicationno,
              clu.applicationno AS clu_applicationno,
              lay.applicationno AS layout_applicationno,
              noc.applicationno AS noc_applicationno
      
          FROM user_sessions u
          INNER JOIN eg_userrole_v1 us
              ON u.user_id::text = us.user_id::text
          INNER JOIN eg_user eu
              ON eu.id = us.user_id
      
          LEFT JOIN (
              SELECT
                  accountid,
                  MIN(tenantid) AS tenantid,
                  MIN(applicationno) AS applicationno
              FROM public.eg_bpa_buildingplan
              WHERE tenantid <> 'pb.testing'
              GROUP BY accountid
          ) bpa ON bpa.accountid = eu.uuid
      
          LEFT JOIN (
              SELECT
                  accountid,
                  MIN(tenantid) AS tenantid,
                  MIN(applicationno) AS applicationno
              FROM public.eg_clu
              WHERE tenantid <> 'pb.testing'
              GROUP BY accountid
          ) clu ON clu.accountid = eu.uuid
      
          LEFT JOIN (
              SELECT
                  accountid,
                  MIN(tenantid) AS tenantid,
                  MIN(applicationno) AS applicationno
              FROM public.eg_layout
              WHERE tenantid <> 'pb.testing'
              GROUP BY accountid
          ) lay ON lay.accountid = eu.uuid
          LEFT JOIN (
              SELECT
                  accountid,
                  MIN(tenantid) AS tenantid,
                  MIN(applicationno) AS applicationno
              FROM public.eg_noc
              WHERE tenantid <> 'pb.testing'
              GROUP BY accountid
          ) noc ON noc.accountid = eu.uuid
             WHERE eu.active = true
      AND us.role_code IN (
          'BPA_ARCHITECT',
          'BPA_ENGINEER',
          'BPA_SUPERVISOR',
          'BPA_TOWNPLANNER'
      )
      AND u.login_time > (now() - INTERVAL '2 days')
          
  orderby: ORDER BY u.user_id, u.login_time DESC          


