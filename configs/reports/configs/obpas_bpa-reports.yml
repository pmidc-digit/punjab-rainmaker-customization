- reportName: ScrutinyCountReportBPA
  decryptionPathId: LAYOUTREPORTS
  summary: Scrutiny Count Report
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A1

  sourceColumns:
  - name: employee_name
    label: Name of Professional
    type: string
    source: obpas_bpa
    total: false
