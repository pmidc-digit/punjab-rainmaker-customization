---
ReportDefinitions:
- reportName: ApplicationDetailReportBPA
  decryptionPathId: LAYOUTREPORTS
  summary: Details of applicant in building Plan service
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: Tenant
    label: tenant
    type: string
    source: obpas_bpa
    total: false
  - name: name
    label: name
    type: string
    source: obpas_bpa
    total: false
  - name: mobilenumber
    label: mobilenumber
    type: string
    source: obpas_bpa
    total: false
  - name: applicationstatus
    label: applicationstatus
    type: string
    source: obpas_bpa
    total: false
  - name: businessservice
    label: businessservice
    type: string
    source: obpas_bpa
    total: false
  - name: applicationno
    label: applicationno
    type: string
    source: obpas_bpa
    total: false
  - name: employee_name
    label: employee_name
    type: string
    source: obpas_bpa
    total: false
  searchParams:
  - name: fromDate
    label: fromDate
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND a.createdtime >= $fromDate
  - name: toDate
    label: toDate
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND a.createdtime <= $toDate
  - name: businessservice
    label: Business Service
    type: singlevaluelist
    pattern: "list://BPA_LOW:Self_Certification"
    source: obpas_bpa
    isMandatory: false
    searchClause: AND ch.businessservice = $businessservice 
  query: |
      WITH current_holder AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid AS applicationno,
          split_part(wf.tenantid, '.', 2) AS tenant, 
          u.name AS assignee_name,
          e.code AS assignee_code,
          wf.businessservice,
          UPPER(st.applicationstatus) AS current_stage
        FROM eg_wf_processinstance_v2 wf
        JOIN eg_wf_state_v2 st    ON wf.status = st.uuid
        LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
        LEFT JOIN eg_user u       ON u.uuid = wa.assignee
        LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
        WHERE wf.businessservice in ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH')
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      )
      SELECT DISTINCT ON (o.applicationno)
        u.name,
        u.mobilenumber,
        o.status as applicationstatus,
        ch.tenant,
        'BPA' as businessservice,
        o.applicationno,
        ch.assignee_name  AS employee_name
      FROM  eg_bpa_document  a
      JOIN eg_bpa_buildingplan o   ON a.buildingplanid = o.id            
      JOIN eg_user u        ON u.uuid = o.accountid           
      LEFT JOIN current_holder ch ON ch.applicationno = o.applicationno
      WHERE 1=1
  orderby:  ORDER BY o.applicationno;

- reportName: CollectionsReportBPA
  decryptionPathId: LAYOUTREPORTS
  summary: Collections
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: Tenant
    label: tenant
    type: string
    source: obpas_bpa
    total: false
  - name: applicationno
    label: applicationno
    type: string
    source: obpas_bpa
    total: false
  - name: name
    label: name
    type: string
    source: obpas_bpa
