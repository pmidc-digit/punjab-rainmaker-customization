---
ReportDefinitions:
- reportName: ApplicationDetailReportBPA
  decryptionPathId: LAYOUTREPORTS
  summary: Details of applicant in building Plan service
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: tenant
    label: ULB Name
    type: string
    source: obpas_bpa
    total: false
  - name: applicant_name
    label: Applicant Name
    type: string
    source: obpas_bpa
    total: false
  - name: application_status
    label: Application Status
    type: string
    source: obpas_bpa
    total: false
  - name: applicationno
    label: Application Number
    type: string
    source: obpas_bpa
    total: false
  - name: building_usage
    label: Building Category
    type: string
    source: obpas_bpa
    total: false
  - name: district
    label: District
    type: string
    source: obpas_bpa
    total: false  
  - name: plot_area
    label: Plot Area
    type: string
    source: obpas_bpa
    total: false 
  - name: ulb_type
    label: ULB Type
    type: string
    source: obpas_bpa
    total: false     
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND createdtime >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND createdtime <= $toDate
  - name: businessservice
    label: Service
    type: singlevaluelist
    pattern: "list://BPA_LOW:Self_Certification"
    source: obpas_bpa
    isMandatory: false
    searchClause: AND businessservice = $businessservice 
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: and  tenantid = $ulb     
  query: |
      SELECT 
          applicationno,
          split_part(tenantid, '.', 2) AS tenant,
          -- Status Mapping Logic
          CASE 
              WHEN status = 'PENDING_APPL_FEE' THEN 'Pending Application Fee'
              WHEN status = 'CITIZEN_APPROVAL_PENDING' THEN 'Pending Citizen Approval'
              WHEN status = 'SEND_TO_CITIZEN' THEN 'Sent back to Citizen'
              WHEN status = 'INPROGRESS' THEN 'In Progress'
              WHEN status = 'PENDING_APPL_FEE_PAYMENT' THEN 'Pending Application Fee Payment'
              WHEN status = 'DOC_VERIFICATION_PENDING' THEN 'Document Verification Pending'
              WHEN status = 'FIELDINSPECTION_PENDING' THEN 'Field Inspection Pending'
              WHEN status = 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In-Progress'
              WHEN status = 'NOC_VERIFICATION_PENDING' THEN 'NOC Verification Pending'
              WHEN status = 'PENDINGAPPROVAL' THEN 'Pending Final Approval'
              WHEN status = 'PENDING_SANC_FEE_PAYMENT' THEN 'Pending Sanction Fee Payment'
              WHEN status = 'APPROVED' THEN 'Approved'
              WHEN status = 'REJECTED' THEN 'Rejected'
              WHEN status = 'LEVEL3_VERIFICATION_PENDING' THEN 'L3 Verification Pending'
              WHEN status = 'LEVEL4_VERIFICATION_PENDING' THEN 'L4 Verification Pending'
              WHEN status = 'JC_VERIFICATION_PENDING' THEN 'JC Verification Pending'
              WHEN status = 'MC_VERIFICATION_PENDING' THEN 'MC Verification Pending'
              WHEN status = 'ATPHQ_APPROVAL_PENDING' THEN 'ATP HQ Approval Pending'
              WHEN status = 'PENDINGINITIALVERIFICATION' THEN 'Pending Initial Verification'
              ELSE REPLACE(INITCAP(REPLACE(status, '_', ' ')), ' ', ' ')
          END AS application_status,
          (additionaldetails::jsonb)->>'usage' AS building_usage,
          (additionaldetails::jsonb)->>'stakeholderName' AS applicant_name,
          (additionaldetails::jsonb)->>'District' AS district,
          (additionaldetails::jsonb)->>'area' AS plot_area,
          (additionaldetails::jsonb)->>'architectName' AS architect_name,
          (additionaldetails::jsonb)->> 'Ulblisttype' AS ulb_type
      FROM eg_bpa_buildingplan  where 1=1
  orderby:  ORDER BY createdtime DESC;

- reportName: CollectionsReportBPA
  decryptionPathId: LAYOUTREPORTS
  summary: Collections
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
