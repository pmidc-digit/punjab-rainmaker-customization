    source: obpas_bpa
    total: false  
  - name: Pending_Files
    label: Pending Files
    type: string
    source: obpas_bpa
    total: true
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND eg_bpa_buildingplan.createdtime <= $fromDate     
  - name: district
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_bpa
    isMandatory: false
    searchClause: AND ulb_data.district = $district 
  - name: tenant_name
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: and eg_bpa_buildingplan.tenantid = $tenant_name
  query: |
       SELECT 
           ulb_data.district,
           INITCAP(REPLACE(eg_bpa_buildingplan.tenantid, 'pb.', '')) AS ulb_name,
           COUNT(*) AS Pending_Files
          FROM eg_bpa_buildingplan inner join ulb_data on eg_bpa_buildingplan.tenantid = ulb_data.ulb_code
          WHERE status IN (
            'APPROVAL_PENDING','ATPHQ_APPROVAL_PENDING','DOC_VERIFICATION_PENDING','EO_VERIFICATION_PENDING','FIELDINSPECTION_INPROGRESS',
             'INPROGRESS','INSPECTION_REPORT_PENDING','JC_VERIFICATION_PENDING','LEVEL3_VERIFICATION_PENDING',
             'LEVEL4_VERIFICATION_PENDING','MC_VERIFICATION_PENDING','MTPHQ_APPROVAL_PENDING',
             'PENDINGINITIALVERIFICATION','PENDINGVERIFICATION','STP_VERIFICATION_PENDING','STPHQ_APPROVAL_PENDING')
  groupby: GROUP BY eg_bpa_buildingplan.tenantid,ulb_data.district
  
- reportName: officers_with_highest_pendency
  summary: Top 7 officers with Highest Pendency
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: ulb_name
    label: ULB Name
    type: string
    source: obpas_bpa
    total: false
  - name: Officer_Designation
    label: Officer Designation
    type: string
    source: obpas_bpa
    total: false
  - name: pending_files
    label: Pending Files
    type: string
    source: obpas_bpa
    total: true  
  searchParams:    
  - name: businessservice
    label: Service
    type: singlevaluelist
    pattern: 'list://BPA_LOW:Self Certification'
    source: obpas_bpa
    isMandatory: false
    searchClause: AND businessservice = $businessservice
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: AND tenantid = $ulb
  query: |
       WITH latest_assignee AS (
         SELECT DISTINCT ON (wf.businessid)
           wf.businessid,
           wf.tenantid,
           wf.businessservice,
           d.name AS designation_code
         FROM eg_wf_processinstance_v2 wf
         JOIN eg_wf_state_v2 st    ON wf.status = st.uuid
         LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
         LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
         inner JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
         inner join designation d on a.designation = d.code
          WHERE wf.businessservice in ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH')
         ORDER BY wf.businessid, wf.lastmodifiedtime DESC
       ),
       
       pending_files AS (
         SELECT
           id::text AS bp_id,
           applicationno,
           tenantid,
           status
         FROM eg_bpa_buildingplan
         WHERE businessservice in ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH')
           AND status IN (
           'APPROVAL_PENDING','ATPHQ_APPROVAL_PENDING','DOC_VERIFICATION_PENDING','EO_VERIFICATION_PENDING','FIELDINSPECTION_INPROGRESS',
             'INPROGRESS','INSPECTION_REPORT_PENDING','JC_VERIFICATION_PENDING','LEVEL3_VERIFICATION_PENDING',
             'LEVEL4_VERIFICATION_PENDING','MC_VERIFICATION_PENDING','MTPHQ_APPROVAL_PENDING',
             'PENDINGINITIALVERIFICATION','PENDINGVERIFICATION','STP_VERIFICATION_PENDING','STPHQ_APPROVAL_PENDING'
           )
       ),
       
       merged AS (
         SELECT
           la.tenantid, 
           INITCAP(REPLACE(la.tenantid, 'pb.', '')) AS ulb_name,
           la.designation_code,
           la.businessservice,
           COUNT(DISTINCT p.bp_id) AS pending_files
         FROM latest_assignee la
         LEFT JOIN pending_files p
           ON (
                p.bp_id = la.businessid
             OR p.applicationno = la.businessid
           )
         GROUP BY la.tenantid, INITCAP(REPLACE(la.tenantid, 'pb.', '')), la.designation_code, la.businessservice
       )
       
       SELECT
         ROW_NUMBER() OVER (ORDER BY pending_files DESC) AS Serial_No,
         ulb_name ,businessservice,
         designation_code as Officer_Designation,
         pending_files 
       FROM merged where  designation_code <> 'Clerk'
  orderby:  ORDER BY pending_files DESC limit 7

- reportName: officers_wise_pendency
  summary: officers wise  Pendency Trend Analysis - Last 7 Days
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: Officer_Designation
    label: Officer Designation
    type: string
    source: obpas_bpa
    total: false
  - name: day0
    label: Day 1
    type: string
    source: obpas_bpa
    total: true
  - name: day1
    label: Day 2
    type: string
    source: obpas_bpa
    total: true
  - name: day2
    label: Day 3
    type: string
    source: obpas_bpa
    total: true
  - name: day3
    label: Day 4
    type: string
    source: obpas_bpa
    total: true
  - name: day4
    label: Day 5
    type: string
    source: obpas_bpa
    total: true
  - name: day5
    label: Day 6
    type: string
    source: obpas_bpa
    total: true
  - name: day6
    label: Day 7
    type: string
    source: obpas_bpa
    total: true                     
  searchParams:
  - name: fromDate
    label: Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND 1=1     
  - name: businessservice
    label: Service
    type: singlevaluelist
    pattern: list://BPA_LOW:Self Certification
    source: obpas_bpa
    isMandatory: false
    searchClause: AND businessservice = $businessservice
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: AND tenantid = $ulb
  query: |
      WITH params AS (
        SELECT
          to_timestamp($fromDate / 1000.0) AT TIME ZONE 'Asia/Kolkata' AS base_ts,
          (to_timestamp($fromDate / 1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS base_dt
      ),
      
      latest_assignee AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid,
          wf.tenantid,
          d.name AS designation_code
        FROM eg_wf_processinstance_v2 wf
        LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
        LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
        INNER JOIN eg_hrms_assignment a ON a.employeeid = e.uuid
        INNER JOIN designation d ON d.code = a.designation
        WHERE wf.businessservice in ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH')
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      ),
      
      wf_data AS (
        SELECT
          la.tenantid,
          la.designation_code,
          p.businessservice,
          (to_timestamp(p.createdtime/1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS created_date
        FROM latest_assignee la
        JOIN eg_bpa_buildingplan p
          ON p.id::text = la.businessid OR p.applicationno = la.businessid
        WHERE p.businessservice in ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH')
          AND p.status IN (
            'VERIFICATION_INPROGRESS',
            'FIELDINSPECTION_INPROGRESS',
            'INSPECTION_REPORT_PENDING',
            'DOC_VERIFICATION_INPROGRESS'
          )
      ),
      
      date_list AS (
        SELECT (base_dt - offs) AS dt
        FROM params, generate_series(0,7) AS g(offs)  
      ),
      
      agg AS (
        SELECT
          d.dt,
          w.tenantid,
          w.designation_code,
          w.businessservice,
          COUNT(w.created_date) AS cnt
        FROM date_list d
        LEFT JOIN wf_data w ON w.created_date = d.dt
        GROUP BY d.dt,w.tenantid, w.designation_code, w.businessservice
      )
      
      SELECT
        COALESCE(designation_code, 'UNASSIGNED') AS officer_designation,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params)     THEN cnt END),0) AS day0,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 1 THEN cnt END),0) AS day1,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 2 THEN cnt END),0) AS day2,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 3 THEN cnt END),0) AS day3,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 4 THEN cnt END),0) AS day4,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 5 THEN cnt END),0) AS day5,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 6 THEN cnt END),0) AS day6,
        COALESCE(MAX(CASE WHEN dt = (SELECT base_dt FROM params) - 7 THEN cnt END),0) AS day7,
        COALESCE(businessservice, 'UNKNOWN') AS businessservice
      FROM agg where 1=1
  groupby:  GROUP BY designation_code, businessservice
  orderby:  ORDER BY officer_designation

- reportName: BeyondTimelineSummary
  summary: Summary of district-ulb wise application which breached its SLA
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: district
    label: District
    type: string
    source: obpas_bpa
    total: false
  - name: name_of_ulb
    label: ULB Name
    type: string
    source: obpas_bpa
    total: false
  - name: total_breached_count
    label: Breached Count
    type: string
    source: obpas_bpa
    total: false  
  searchParams:
  - name: district
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_bpa
    isMandatory: false
    searchClause: AND u.district = $district
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: AND u.name_of_ulb= $ulb  
  - name: businessservice
    label: Service
    type: singlevaluelist
    pattern: "list://BPA_LOW:Self Certification"
    source: obpas_bpa
    isMandatory: false
    searchClause: AND sc.businessservice = $businessservice 
  query: |
      WITH wf_history AS (
          SELECT
              wf.businessid AS uuid,
              wf.businessservice,
              wf.tenantid,
              wf.createdtime,
              wf.lastmodifiedtime,
              UPPER(st.applicationstatus) AS applicationstatus,
              st.state,
              st.sla AS state_sla
          FROM eg_wf_processinstance_v2 wf
          JOIN eg_wf_state_v2 st ON wf.status = st.uuid
          WHERE wf.businessservice IN ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH')
      ),
      latest_status AS (
          SELECT DISTINCT ON (uuid)
              uuid,
              businessservice,
              tenantid,
              applicationstatus AS current_status,
              lastmodifiedtime
          FROM wf_history
          ORDER BY uuid, lastmodifiedtime DESC
      ),
      sla_entry AS (
          SELECT
              uuid,
              MIN(CASE 
                  WHEN businessservice = 'BPA_LOW' AND state = 'PENDINGINITIALVERIFICATION' THEN createdtime
                  WHEN businessservice != 'BPA_LOW' AND state = 'FIELDINSPECTION_INPROGRESS' THEN createdtime
                  ELSE NULL 
              END) AS sla_start_time,
              MAX(state_sla) AS sla_duration
          FROM wf_history
          GROUP BY uuid
      ),
      sla_calculation AS (
          SELECT
              ls.uuid,
              ls.tenantid,
              ls.lastmodifiedtime,
              CASE 
                  WHEN (ls.lastmodifiedtime - se.sla_start_time) > se.sla_duration THEN 'BREACHED'
                  WHEN ls.current_status in( 'APPROVED' ,'REJECTED','BLOCKED','PENDING_SANC_FEE_PAYMENT')THEN 'MET' 
                  ELSE 'WITHIN_SLA'
              END AS sla_status,
              ls.current_status
             
          FROM latest_status ls
          LEFT JOIN sla_entry se ON ls.uuid = se.uuid
          WHERE ls.current_status NOT IN ('INITIATED', 'PENDING_APPL_FEE', 'CITIZEN_APPROVAL_INPROCESS')
      ),
      ulb_latest_activity AS (
          -- Har ULB ka sabse latest status nikalne ke liye
          SELECT DISTINCT ON (tenantid)
              tenantid,
              current_status
          FROM sla_calculation
          ORDER BY tenantid, lastmodifiedtime DESC
      )
      SELECT
          u.district,
          u.name_of_ulb,
          COUNT(CASE WHEN sc.sla_status = 'MET' THEN 1 END) AS total_met_count,
          COUNT(CASE WHEN sc.sla_status = 'BREACHED' THEN 1 END) AS total_breached_count
      FROM sla_calculation sc
      JOIN ulb_data u ON sc.tenantid = u.ulb_code
      JOIN ulb_latest_activity ula ON u.ulb_code = ula.tenantid where 1=1
  groupby: GROUP BY u.district, u.name_of_ulb , ula.current_status                
  orderby: ORDER BY u.district, u.name_of_ulb DESC      

