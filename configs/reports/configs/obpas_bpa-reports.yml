  - name: day7
    label: Day 7
    type: string
    source: obpas_bpa
    total: true
  - name: total_upcoming_breaches
    label: Total Upcoming Breaches 
    type: string
    source: obpas_bpa
    total: true
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND 1=1
  - name: district
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_bpa
    isMandatory: false
    searchClause: AND u.district = $district
  - name: tenant
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: AND u.name_of_ulb= $tenant
  - name: businessservice
    label: Service
    type: singlevaluelist
    pattern: "list://BPA_LOW:Self Certification"
    source: obpas_bpa
    isMandatory: false
    searchClause: AND ub.businessservice = $businessservice 
  query: |
      WITH params AS (
        SELECT
            (to_timestamp($fromDate / 1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS report_dt
        ),
       wf_detailed AS (
        SELECT
           wf.businessid AS applicationno,
           wf.tenantid,
           wf.businessservice,
           UPPER(st.applicationstatus) AS applicationstatus,
           wf.createdtime,
           wf.lastmodifiedtime
           FROM eg_wf_processinstance_v2 wf
           JOIN eg_wf_state_v2 st ON wf.status = st.uuid
           WHERE wf.businessservice IN (
           'BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP',
           'BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH'
            )
        ),
       status_times AS (
        SELECT
          applicationno,
          tenantid,
          businessservice,
          MIN(createdtime) FILTER ( WHERE applicationstatus = 'FIELDINSPECTION_INPROGRESS' ) AS sla_start_time,
          MAX(lastmodifiedtime) FILTER ( WHERE applicationstatus IN ( 'APPROVED','REJECTED','BLOCKED','PENDING_SANC_FEE_PAYMENT' )) AS final_time
          FROM wf_detailed
          GROUP BY applicationno, tenantid, businessservice
          ), 
       sla_master AS (
        SELECT
          businessservice,
          businessservicesla
          FROM eg_wf_businessservice_v2
          ),
       sla_calc AS (
        SELECT
          st.applicationno,
          st.tenantid,
          st.businessservice,
          st.sla_start_time,
          st.final_time,
          (to_timestamp( (st.sla_start_time + sm.businessservicesla) / 1000.0) AT TIME ZONE 'Asia/Kolkata') AS sla_breach_ts
          FROM status_times st
          JOIN sla_master sm ON sm.businessservice = st.businessservice
          WHERE st.sla_start_time IS NOT NULL
           ),
       upcoming_breaches AS (
        SELECT
         tenantid,
         businessservice,
         sla_breach_ts::date AS breach_date
         FROM sla_calc sc
         JOIN params p ON TRUE
         WHERE sc.final_time IS NULL 
          AND sc.sla_breach_ts::date
          BETWEEN p.report_dt AND p.report_dt + INTERVAL '6 day'
           )
        SELECT
          u.district,
          u.name_of_ulb,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt)   AS day1,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '1 day') AS day2,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '2 day') AS day3,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '3 day') AS day4,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '4 day') AS day5,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '5 day') AS day6,
          COUNT(*) FILTER (WHERE breach_date = p.report_dt + INTERVAL '6 day') AS day7,
          COUNT(*) AS total_upcoming_breaches
          FROM upcoming_breaches ub
          JOIN ulb_data u ON ub.tenantid = u.ulb_code
          JOIN params p ON TRUE    
             WHERE 1=1 
  groupby: GROUP BY u.district, u.name_of_ulb
  orderby: ORDER BY u.district, u.name_of_ulb DESC   

- reportName: DetailedFilesNearTimelineBreach
  summary: Detailed File List of District-ULB wise Application Upcoming  Breached its SLA for next 7 days 
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A4
  sourceColumns:
  - name: district
    label: District
    type: string
    source: obpas_bpa
    total: false
  - name: name_of_ulb
    label: ULB Name
    type: string
    source: obpas_bpa
    total: false
  - name: localized_status
    label: Application Status
    type: string
    source: obpas_bpa
    total: false
  - name: fileno
    label: File Number
    type: string
    source: obpas_bpa
    total: false
  - name: modulename
    label: Module Name
    type: string
    source: obpas_bpa
    total: false
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND 1=1
  - name: district
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_bpa
    isMandatory: false
    searchClause: AND u.district = $district
  - name: tenant
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: AND u.name_of_ulb= $tenant 
  - name: businessservice
    label: Service
    type: singlevaluelist
    pattern: "list://BPA_LOW:Self Certification"
    source: obpas_bpa
    isMandatory: false
    searchClause: AND ub.businessservice = $businessservice 
  query: |
      WITH params AS (
          SELECT
              (to_timestamp(1769904000000 / 1000.0) AT TIME ZONE 'Asia/Kolkata')::date AS report_dt
          ),
          wf_detailed AS (
          SELECT
              wf.businessid AS uuid,
              wf.businessservice,
              wf.tenantid,
              UPPER(st.applicationstatus) AS applicationstatus,
              wf.createdtime,
              wf.lastmodifiedtime
              FROM eg_wf_processinstance_v2 wf
              JOIN eg_wf_state_v2 st ON wf.status = st.uuid
              WHERE wf.businessservice IN (
                  'BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP',
                  'BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH'
              )
          ),
          latest_status AS (
          SELECT DISTINCT ON (uuid)
              uuid,
              applicationstatus
              FROM wf_detailed
              ORDER BY uuid, lastmodifiedtime DESC
          ),
          status_times AS (
              SELECT
                  uuid,
                  tenantid,
                  businessservice,
                  -- Logic for BPA_LOW vs Others
                  MIN(CASE 
                      WHEN businessservice = 'BPA_LOW' AND applicationstatus = 'PENDINGINITIALVERIFICATION' 
                          THEN createdtime 
                      WHEN businessservice != 'BPA_LOW' AND applicationstatus = 'FIELDINSPECTION_INPROGRESS' 
                          THEN createdtime
                      ELSE NULL 
                  END) AS sla_start_time,
                  MAX(lastmodifiedtime) FILTER (  
                      WHERE applicationstatus IN ('APPROVED','REJECTED','BLOCKED','PENDING_SANC_FEE_PAYMENT') 
                  ) AS final_time
              FROM wf_detailed
              GROUP BY uuid, tenantid, businessservice
          ),
          sla_master AS (
          SELECT
              businessservice,
              businessservicesla
              FROM eg_wf_businessservice_v2
          ),
          sla_calc AS (
              SELECT
                  st.uuid,
                  st.tenantid,
                  st.businessservice,
                  ls.applicationstatus,
                  (to_timestamp((st.sla_start_time + sm.businessservicesla) / 1000.0) AT TIME ZONE 'Asia/Kolkata') AS sla_breach_ts
              FROM status_times st
              JOIN sla_master sm ON sm.businessservice = st.businessservice
              JOIN latest_status ls ON ls.uuid = st.uuid
              WHERE st.sla_start_time IS NOT NULL
              AND st.final_time IS NULL
          ),
          upcoming_breaches AS (
          SELECT
              sc.uuid,
              sc.tenantid,
              sc.businessservice,
              sc.applicationstatus,
              sc.sla_breach_ts::date AS breach_date
              FROM sla_calc sc
              JOIN params p ON TRUE
              WHERE sc.sla_breach_ts::date BETWEEN p.report_dt AND p.report_dt + INTERVAL '6 day'
          )
          SELECT
              u.district,
              u.name_of_ulb,
              -- Comprehensive Localization Mapping
              CASE 
                  WHEN ub.applicationstatus = 'CITIZEN_APPROVAL_PENDING' THEN 'Pending Citizen Approval'
                  WHEN ub.applicationstatus = 'SEND_TO_CITIZEN' THEN 'Sent back to Citizen'
                  WHEN ub.applicationstatus = 'INPROGRESS' THEN 'In Progress'
                  WHEN ub.applicationstatus = 'PENDING_APPL_FEE_PAYMENT' THEN 'Pending Application Fee Payment'
                  WHEN ub.applicationstatus = 'DOC_VERIFICATION_PENDING' THEN 'Document Verification Pending'
                  WHEN ub.applicationstatus = 'FIELDINSPECTION_PENDING' THEN 'Field Inspection Pending'
                  WHEN ub.applicationstatus = 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In-Progress'
                  WHEN ub.applicationstatus = 'NOC_VERIFICATION_PENDING' THEN 'NOC Verification Pending'
                  WHEN ub.applicationstatus = 'PENDINGAPPROVAL' THEN 'Pending Final Approval'
                  WHEN ub.applicationstatus = 'PENDING_SANC_FEE_PAYMENT' THEN 'Pending Sanction Fee Payment'
                  WHEN ub.applicationstatus = 'APPROVED' THEN 'Approved'
                  WHEN ub.applicationstatus = 'REJECTED' THEN 'Rejected'
                  WHEN ub.applicationstatus = 'BACK_FROM_DOC_VERIFICATION' THEN 'Sent Back from Doc Verification'
                  WHEN ub.applicationstatus = 'BACK_FROM_FI_VERIFICATION' THEN 'Sent Back from FI'
                  WHEN ub.applicationstatus = 'POST_PAYMENT_CITIZEN_APPROVAL_PENDING' THEN 'Pending Citizen Approval (Post-Payment)'
                  WHEN ub.applicationstatus = 'SENT_TO_ARCHITECT' THEN 'Sent to Architect'
                  WHEN ub.applicationstatus = 'INSPECTION_REPORT_PENDING' THEN 'Inspection Report Pending'
                  WHEN ub.applicationstatus = 'LEVEL3_VERIFICATION_PENDING' THEN 'L3 Verification Pending'
                  WHEN ub.applicationstatus = 'LEVEL4_VERIFICATION_PENDING' THEN 'L4 Verification Pending'
                  WHEN ub.applicationstatus = 'JC_VERIFICATION_PENDING' THEN 'JC Verification Pending'
                  WHEN ub.applicationstatus = 'MC_VERIFICATION_PENDING' THEN 'MC Verification Pending'
                  WHEN ub.applicationstatus = 'EO_VERIFICATION_PENDING' THEN 'EO Verification Pending'
                  WHEN ub.applicationstatus = 'PROFESSIONAL_ACTION_REQUIRED' THEN 'Professional Action Required'
                  WHEN ub.applicationstatus = 'ESIGN_PENDING' THEN 'E-Sign Pending'
                  WHEN ub.applicationstatus = 'ATPHQ_APPROVAL_PENDING' THEN 'ATP HQ Approval Pending'
                  WHEN ub.applicationstatus = 'MTPHQ_APPROVAL_PENDING' THEN 'MTP HQ Approval Pending'
                  WHEN ub.applicationstatus = 'STPHQ_APPROVAL_PENDING' THEN 'STP HQ Approval Pending'
                  WHEN ub.applicationstatus = 'APPROVAL_PENDING' THEN 'Approval Pending'
                  WHEN ub.applicationstatus = 'PENDINGINITIALVERIFICATION' THEN 'Pending Initial Verification'
                  WHEN ub.applicationstatus = 'BLOCKED' THEN 'Application Blocked'
                  ELSE REPLACE(INITCAP(REPLACE(ub.applicationstatus, '_', ' ')), ' ', ' ')
              END AS localized_status,
              ub.uuid as fileno,
              'Building Plan' as modulename
          FROM upcoming_breaches ub 
          JOIN ulb_data u ON ub.tenantid = u.ulb_code where 1=1
  groupby: GROUP BY u.district, u.name_of_ulb,ub.applicationstatus,ub.uuid
  orderby: ORDER BY u.district, u.name_of_ulb ,ub.applicationstatus,ub.uuid DESC        



