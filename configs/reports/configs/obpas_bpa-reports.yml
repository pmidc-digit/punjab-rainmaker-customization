           wf.createdtime,
           wf.lastmodifiedtime,
           st.applicationstatus,
           st.state,
           st.sla AS state_sla
           FROM eg_wf_processinstance_v2 wf
           JOIN eg_wf_state_v2 st ON wf.status = st.uuid
           WHERE wf.businessservice IN ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH')
           ),
      latest_status AS (
         SELECT DISTINCT ON (uuid)
           uuid,
           businessservice,
           tenantid,
           applicationstatus,
           createdtime,
           lastmodifiedtime
           FROM wf_history
           ORDER BY uuid, lastmodifiedtime DESC
           ),
      sla_entry AS (
         SELECT
           uuid,
           MIN(createdtime) AS sla_start_time,
           MAX(state_sla) AS sla_duration
           FROM wf_history
           WHERE state = 'DOC_VERIFICATION_PENDING'
           GROUP BY uuid
           ),
      sla_calculation AS (
         SELECT
           ls.uuid,
           ls.tenantid,
           ls.businessservice,
           ls.applicationstatus,
           ls.createdtime,
           CASE WHEN se.sla_start_time IS NULL THEN 'NOT_STARTED'
                WHEN (ls.lastmodifiedtime - se.sla_start_time) > se.sla_duration THEN 'BREACHED'
                WHEN ls.applicationstatus = 'APPROVED' THEN 'MET' ELSE 'WITHIN_SLA'
           END AS sla_status
           FROM latest_status ls
           LEFT JOIN sla_entry se ON ls.uuid = se.uuid
           WHERE ls.applicationstatus NOT IN ( 'INITIATED', 'PENDING_APPL_FEE', 'CITIZEN_APPROVAL_INPROCESS')
           )
       SELECT
          u.district,
          u.name_of_ulb,
          sc.applicationstatus,
          sc.uuid as fileno,
          'Building_Plan' as modulename
          FROM sla_calculation sc
          JOIN ulb_data u ON sc.tenantid = u.ulb_code
          WHERE sc.sla_status = 'BREACHED'
  orderby: ORDER BY u.district, u.name_of_ulb,sc.applicationstatus,sc.uuid DESC      

- reportName: FilesNearTimelineBreachSummary
  summary: Summary list of district-ulb wise application upcoming  breached its SLA for next 7 days 
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
