    label: Financial Month
    type: string
    source: obpas_bpa
    total: false
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_bpa
    isMandatory: false
    searchClause: AND pg.created_time >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_bpa
    isMandatory: false
    searchClause: AND pg.created_time <= $toDate
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    wrapper: true
    isMandatory: false
    searchClause: AND pg.tenant_id = $ulb
  - name: ulbtype
    label: ULB Type
    type: singlevaluelist
    pattern: 'list://Municipal Corporation:Municipal Corporation,Nagar Panchayat:Nagar Panchayat,Municipal Council:Municipal Council,Improvement Trust: Improvement Trust'
    source: obpas_bpa
    isMandatory: false
    searchClause: AND pg.additional_details->>'ulbType' = $ulbtype
  - name: district
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'
    source: obpas_bpa
    isMandatory: false
    searchClause: AND ud.district = $district
  - name: transactionstatus
    label: Transaction Status
    type: singlevaluelist
    pattern: 'list://SUCCESS:Success,FAILURE:Failure'
    source: obpas_bpa
    isMandatory: false
    searchClause: AND pg.txn_status = $transactionstatus
  - name: module
    label: Module Name
    type: singlevaluelist
    pattern: 'list://BPA.NC:Building Plan,CLU:CLU,LAYOUT:Layout,obpas_noc:NOC,BPAREG:Professional Registration'
    source: obpas_bpa
    wrapper: true
    isMandatory: false
    searchClause: AND bd.businessservice like $module || '%' 

  query: |
      SELECT 
      CASE 
        WHEN bd.businessservice = 'obpas_noc' THEN '102'
        WHEN bd.businessservice IN ('CLU.PAY1', 'CLU.PAY2') THEN '103'
        WHEN bd.businessservice = 'BPAREG' THEN '108'
        WHEN bd.businessservice LIKE '%LAYOUT%' THEN '105' 
        WHEN bd.businessservice LIKE 'BPA.NC%' THEN '101'
        ELSE bd.businessservice 
      END AS service_code,
      CASE 
        WHEN bd.businessservice LIKE 'BPA.NC%' THEN 'Building Plan'
        WHEN bd.businessservice LIKE 'CLU%' THEN 'CLU'
        WHEN bd.businessservice = 'obpas_noc' THEN 'NOC'
        WHEN bd.businessservice LIKE 'LAYOUT%' THEN 'Layout'
        WHEN bd.businessservice = 'BPAREG' THEN 'Professional Registration'
        ELSE 'OBPAS'
      END AS module_name,pg.name AS applicant_name,
      pg.txn_id AS transaction_id, 
      pg.txn_amount AS transaction_amount,
      pg.gateway,pg.gateway_txn_id,
      'Axis' AS bank_name, 
      Case
        WHEN pg.txn_status = 'SUCCESS' THEN 'Success'
        WHEN pg.txn_status = 'FAILURE' THEN 'Failure'
        ELSE pg.txn_status
        END AS transaction_status,
        pg.tenant_id AS ulb_code, 
       INITCAP(split_part(pg.tenant_id, '.', 2)) AS tenant_id,
       pg.additional_details->>'ulbName' AS ulb_name,
       pg.additional_details->>'ulbType' AS ulb_type,
       pg.consumer_code AS application_number, 
       pg.name, pg.mobile_number, 
       CASE 
        WHEN bd.businessservice = 'obpas_noc' THEN 'NOC'
        WHEN bd.businessservice = 'CLU.PAY1' THEN 'Pay 1'
        WHEN bd.businessservice = 'CLU.PAY2' THEN 'Pay 2'
        WHEN bd.businessservice = 'LAYOUT.PAY1' THEN 'Pay 1'
        WHEN bd.businessservice = 'LAYOUT.PAY2' THEN 'Pay 2'
        WHEN bd.businessservice = 'BPA.NC_APP_FEE' THEN 'Pay 1'
        WHEN bd.businessservice = 'BPA.NC_SAN_FEE' THEN 'Pay 2'
        WHEN bd.businessservice = 'BPAREG' THEN 'Professional Registration'
        ELSE bd.businessservice 
        END AS service_label, ud.district,
        to_char(to_timestamp(pg.created_time / 1000), 'DD-MM-YYYY HH24:MI:SS') AS created_date,
        to_char(to_timestamp(pg.created_time / 1000), 'YYYY') AS year,
        
        CASE 
           WHEN EXTRACT(MONTH FROM to_timestamp(pg.created_time / 1000)) >= 4 
           THEN to_char(to_timestamp(pg.created_time / 1000), 'YYYY') || '-' || to_char(to_timestamp(pg.created_time / 1000) + interval '1 year', 'YY')
           ELSE to_char(to_timestamp(pg.created_time / 1000) - interval '1 year', 'YYYY') || '-' || to_char(to_timestamp(pg.created_time / 1000), 'YY')
           END AS financial_year,
        TO_CHAR(TO_TIMESTAMP(pg.created_time / 1000), 'MM') AS month,
      
      TO_CHAR((MOD(EXTRACT(MONTH FROM TO_TIMESTAMP(pg.created_time / 1000))::INT - 4 + 12, 12) + 1), 'FM09') AS financial_month,
      TO_CHAR((MOD(EXTRACT(MONTH FROM TO_TIMESTAMP(pg.created_time / 1000))::INT - 4 + 12, 12) + 1), 'FM09') || ' - ' || TO_CHAR(TO_TIMESTAMP(pg.created_time / 1000), 'FMMonth') AS month_name,
      
        CASE 
        -- 1. CLU Module Statuses
         WHEN bd.businessservice LIKE 'CLU%' THEN 
          CASE clu.applicationstatus
            WHEN 'DOCUMENTVERIFY_JC' THEN 'Document Verify JC'
            WHEN 'PROFESSIONALACTIONREQUIRED' THEN 'Professional Action Required'
            WHEN 'ATP_VERIFICATION_PENDING' THEN 'ATP Verification Pending'
            WHEN 'DOCUMENTVERIFY_MTP/ME' THEN 'Document Verify MTP/ME'
            WHEN 'E-SIGNED' THEN 'E-Signed'
            WHEN 'REJECTED' THEN 'Rejected'
            WHEN 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In Progress'
            WHEN 'ATPHQ_APPROVAL_PENDING' THEN 'ATPHQ Approval Pending'
            WHEN 'PENDINGPAYMENT' THEN 'Pending Payment'
            WHEN 'APPROVAL_PENDING' THEN 'Approval Pending'
            WHEN 'MTP_VERIFICATION_PENDING' THEN 'MTP Verification Pending'
            WHEN 'DOCUMENTVERIFY_JE/BI' THEN 'Document Verify JE/BI'
            WHEN 'INITIATED' THEN 'Initiated'
            WHEN 'INSPECTION_REPORT_PENDING' THEN 'Inspection Report Pending'
            WHEN 'PENDINGAPPLICATIONPAYMENT' THEN 'Application Payment Pending'
            WHEN 'STP_VERIFICATION_PENDING' THEN 'STP Verification Pending'
            WHEN 'EO_VERIFICATION_PENDING' THEN 'EO Verification Pending'
            WHEN 'DOC_VERIFICATION_PENDING' THEN 'Document Verification Pending'
            WHEN 'ADC_VERIFICATION_PENDING' THEN 'ADC Verification Pending'
            WHEN 'APPROVED' THEN 'Approved'
            WHEN 'CANCELLED' THEN 'Cancelled'
            WHEN 'PENDINGSANCTIONPAYMENT' THEN 'Sanction Payment Pending'
            WHEN 'PENDINGAPPROVAL' THEN 'Pending Approval'
            WHEN 'DOCUMENTVERIFY_EO' THEN 'EO Document Verification'
            ELSE clu.applicationstatus
          END

         -- 2. Layout Module Statuses
         WHEN bd.businessservice LIKE '%LAYOUT%' THEN 
          CASE lay.applicationstatus
            WHEN 'PENDING_APPL_FEE' THEN 'Pending Application Fee'
            WHEN 'CITIZEN_APPROVAL_PENDING' THEN 'Pending Citizen Approval'
            WHEN 'SEND_TO_CITIZEN' THEN 'Sent back to Citizen'
            WHEN 'INPROGRESS' THEN 'In Progress'
            WHEN 'PENDING_APPL_FEE_PAYMENT' THEN 'Pending Application Fee Payment'
            WHEN 'DOC_VERIFICATION_PENDING' THEN 'Document Verification Pending'
            WHEN 'FIELDINSPECTION_PENDING' THEN 'Field Inspection Pending'
            WHEN 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In-Progress'
            WHEN 'NOC_VERIFICATION_PENDING' THEN 'NOC Verification Pending'
            WHEN 'PENDINGAPPROVAL' THEN 'Pending Final Approval'
            WHEN 'PENDING_SANC_FEE_PAYMENT' THEN 'Pending Sanction Fee Payment'
            WHEN 'APPROVED' THEN 'Approved'
            WHEN 'REJECTED' THEN 'Rejected'
            WHEN 'LEVEL3_VERIFICATION_PENDING' THEN 'L3 Verification Pending'
            WHEN 'LEVEL4_VERIFICATION_PENDING' THEN 'L4 Verification Pending'
            WHEN 'JC_VERIFICATION_PENDING' THEN 'JC Verification Pending'
            WHEN 'MC_VERIFICATION_PENDING' THEN 'MC Verification Pending'
            WHEN 'ATPHQ_APPROVAL_PENDING' THEN 'ATP HQ Approval Pending'
            WHEN 'PENDINGINITIALVERIFICATION' THEN 'Pending Initial Verification'
            ELSE REPLACE(INITCAP(REPLACE(lay.applicationstatus, '_', ' ')), ' ', ' ')
          END

         -- 3. NOC Module Statuses
         WHEN bd.businessservice = 'obpas_noc' THEN 
          CASE noc.applicationstatus
            WHEN 'INITIATED' THEN 'Application Initiated'
            WHEN 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In-Progress'
            WHEN 'DOCUMENTVERIFY' THEN 'Document Verification'
            WHEN 'LEVEL2_DOCUMENTVERIFY' THEN 'Level 2 Document Verification'
            WHEN 'ATP_VERIFICATION_PENDING' THEN 'Pending ATP Verification'
            WHEN 'MTP_VERIFICATION_PENDING' THEN 'Pending MTP Verification'
            WHEN 'JC_VERIFICATION_PENDING' THEN 'Pending JC Verification'
            WHEN 'EO_VERIFICATION_PENDING' THEN 'Pending EO Verification'
            WHEN 'PENDINGAPPROVAL' THEN 'Pending Approval'
            WHEN 'CITIZENACTIONREQUIRED' THEN 'Citizen Action Required'
            WHEN 'PENDINGPAYMENT' THEN 'Pending Payment'
            WHEN 'APPROVED' THEN 'Approved'
            WHEN 'REJECTED' THEN 'Rejected'
            WHEN 'CANCELLED' THEN 'Cancelled'
            WHEN 'INSPECTION_REPORT_PENDING' THEN 'Inspection Report Pending'
            WHEN 'E-SIGNED' THEN 'E-Signed'
            ELSE noc.applicationstatus 
          END

         WHEN bd.businessservice IN ('BPA.NC_APP_FEE','BPA.NC_SAN_FEE') THEN 
          CASE bpa.status
            WHEN 'PENDING_APPL_FEE' THEN 'Pending Application Fee'
            WHEN 'CITIZEN_APPROVAL_PENDING' THEN 'Pending Citizen Approval'
            WHEN 'SEND_TO_CITIZEN' THEN 'Sent back to Citizen'
            WHEN 'INPROGRESS' THEN 'In Progress'
            WHEN 'PENDING_APPL_FEE_PAYMENT' THEN 'Pending Application Fee Payment'
            WHEN 'DOC_VERIFICATION_PENDING' THEN 'Document Verification Pending'
            WHEN 'FIELDINSPECTION_PENDING' THEN 'Field Inspection Pending'
            WHEN 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In-Progress'
            WHEN 'NOC_VERIFICATION_PENDING' THEN 'NOC Verification Pending'
            WHEN 'PENDINGAPPROVAL' THEN 'Pending Final Approval'
            WHEN 'PENDING_SANC_FEE_PAYMENT' THEN 'Pending Sanction Fee Payment'
            WHEN 'APPROVED' THEN 'Approved'
            WHEN 'REJECTED' THEN 'Rejected'
            WHEN 'LEVEL3_VERIFICATION_PENDING' THEN 'L3 Verification Pending'
            WHEN 'LEVEL4_VERIFICATION_PENDING' THEN 'L4 Verification Pending'
            WHEN 'JC_VERIFICATION_PENDING' THEN 'JC Verification Pending'
            WHEN 'MC_VERIFICATION_PENDING' THEN 'MC Verification Pending'
            WHEN 'ATPHQ_APPROVAL_PENDING' THEN 'ATP HQ Approval Pending'
            WHEN 'PENDINGINITIALVERIFICATION' THEN 'Pending Initial Verification'
            ELSE REPLACE(INITCAP(REPLACE(bpa.status, '_', ' ')), ' ', ' ')
          END
        WHEN bd.businessservice = 'BPAREG' THEN
          CASE COALESCE(tl.status, tl.status)
            WHEN 'INITIATED' THEN 'Initiated'
            WHEN 'PENDINGPAYMENT' THEN 'Pending Payment'
            WHEN 'CITIZEN_ACTION_REQUIRED' THEN 'Citizen Action Required'
            WHEN 'PENDINGAPPROVAL' THEN 'Pending Final Approval'
            WHEN 'APPROVED' THEN 'Approved'
            WHEN 'REJECTED' THEN 'Rejected'
            WHEN 'CANCELLED' THEN 'Cancelled'
            WHEN 'INACTIVE' THEN 'Inactive'
            WHEN 'PENDINGDOCVERIFICATION' THEN 'Pending Document Verification'
            WHEN 'PENDINGVERIFICATION' THEN 'Pending Verification'
            WHEN 'PENDINGAPPROVAL' THEN 'Pending Final Approval'
            WHEN 'BLACKLISTED' THEN 'Blacklisted'
            WHEN 'EXPIRED' THEN 'Expired'
            ELSE REPLACE(INITCAP(REPLACE(COALESCE(tl.status, tl.status), '_', ' ')), ' ', ' ')
          END

         -- 6. Fallback block agar koi service mapping missing ho
         ELSE REPLACE(INITCAP(REPLACE(COALESCE(tl.status, bpa.status,clu.applicationstatus,noc.applicationstatus,lay.applicationstatus), '_', ' ')), ' ', ' ')
       END AS status_of_application
        FROM eg_pg_transactions pg 
        INNER JOIN egbs_bill_v1 bill ON bill.id = pg.bill_id
        INNER JOIN egbs_billdetail_v1 bd ON bd.billid = bill.id
        LEFT JOIN eg_bpa_buildingplan bpa ON pg.consumer_code = bpa.applicationno AND pg.tenant_id = bpa.tenantid 
        LEFT JOIN eg_clu clu ON pg.consumer_code = clu.applicationno AND pg.tenant_id = clu.tenantid 
        LEFT JOIN eg_layout lay ON pg.consumer_code = lay.applicationno AND pg.tenant_id = lay.tenantid 
        LEFT JOIN eg_noc noc ON pg.consumer_code = noc.applicationno AND pg.tenant_id = noc.tenantid 
        LEFT JOIN eg_tl_tradelicense tl ON pg.consumer_code = tl.applicationnumber AND pg.tenant_id = tl.tenantid
        LEFT JOIN ulb_data ud ON pg.tenant_id = ud.ulb_code 
        WHERE bd.businessservice IN ('obpas_noc','BPA.NC_APP_FEE','BPA.NC_SAN_FEE','BPAREG','CLU.PAY1','CLU.PAY2','LAYOUT.PAY1','LAYOUT.PAY2') 
        AND pg.tenant_id != 'pb.testing' 
  orderby: ORDER BY bd.businessservice, pg.created_time, pg.tenant_id;
  
