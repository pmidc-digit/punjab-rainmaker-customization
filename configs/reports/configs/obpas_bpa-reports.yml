    total: false
  - name: cheque_amount
    label: Cheque Amount
    type: string
    source: obpas_bpa
    total: true
  - name: card_amount
    label: Card Amount
    type: string
    source: obpas_bpa
    total: true
  - name: dd_amount
    label: DD Amount
    type: string
    source: obpas_bpa
    total: true
  - name: neft_amount
    label: NEFT Amount
    type: string
    source: obpas_bpa
    total: true
  - name: rtgs_amount
    label: RTGS Amount
    type: string
    source: obpas_bpa
    total: true
  - name: online_amount
    label: Online Amount
    type: string
    source: obpas_bpa
    total: true
  - name: amountpaid
    label: Amount Paid
    type: string
    source: obpas_bpa
    total: true
  - name: payment_date
    label: Payment Date
    type: string
    source: obpas_bpa
    total: false
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND createdtime >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND createdtime <= $toDate
  - name: businessservice
    label: Service
    type: singlevaluelist
    pattern: list://BPA_LOW:Self Certification
    source: obpas_bpa
    isMandatory: false
    searchClause: AND businessservice = $businessservice
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: and tenantid = $ulb     
  - name: collector_code
    label: Collector Code
    type: string
    source: obpas_bpa
    isMandatory: false
    searchClause: AND collector_code = $collector_code
  query: |
      WITH current_holder AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid AS applicationno,
          u.name AS employee_name,wf.tenantid,
          e.code AS assignee_code,
          wf.businessservice,
          UPPER(st.applicationstatus) AS current_stage
        FROM eg_wf_processinstance_v2 wf
        JOIN eg_wf_state_v2 st ON wf.status = st.uuid
        LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
        LEFT JOIN eg_user u ON u.uuid = wa.assignee
        LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
        WHERE wf.businessservice in   ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH') 
        ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      ),
      
      unique_transactions AS (
        SELECT
          p.id AS transaction_id,
          p.createdtime,split_part(p.tenantid, '.', 2) AS tenant, 
          pd.amountpaid,
          CASE WHEN upper(p.paymentmode) IN ('CASH','OFFLINE_CASH') THEN pd.amountpaid ELSE 0 END AS cash_amount,
          CASE WHEN upper(p.paymentmode) = 'CHEQUE' THEN pd.amountpaid ELSE 0 END AS cheque_amount,
          CASE WHEN upper(p.paymentmode) IN ('CARD','DEBIT_CARD','CREDIT_CARD','OFFLINE_CARD') THEN pd.amountpaid ELSE 0 END AS card_amount,
          CASE WHEN upper(p.paymentmode) = 'DD' THEN pd.amountpaid ELSE 0 END AS dd_amount,
          CASE WHEN upper(p.paymentmode) IN ('NEFT','OFFLINE_NEFT') THEN pd.amountpaid ELSE 0 END AS neft_amount,
          CASE WHEN upper(p.paymentmode) IN ('RTGS','OFFLINE_RTGS','NEFT_RTGS') THEN pd.amountpaid ELSE 0 END AS rtgs_amount,
          CASE WHEN upper(p.paymentmode) = 'ONLINE' THEN pd.amountpaid ELSE 0 END AS online_amount,
          COALESCE(emp.code, 'SELF') AS collector_code,
          a.id AS bpa_id,
          a.applicationno,
          a.status,
          u_applicant.name,
          u_applicant.mobilenumber,
          ch.employee_name AS assignee_employee,
          ch.assignee_code   AS assignee_code,
          bill.consumercode  AS bill_consumercode,
          ch.businessservice,
          CASE WHEN a.applicationno IS NULL THEN 'NO_MATCH_IN_EG_BPA' ELSE 'MATCHED' END AS match_status
        FROM egcl_paymentdetail pd
        JOIN egcl_payment p ON pd.paymentid = p.id
        LEFT JOIN egcl_bill bill ON bill.id = pd.billid
        LEFT JOIN eg_bpa_buildingplan a ON trim(bill.consumercode) = trim(a.applicationno)
                           OR trim(bill.consumercode) = trim(a.id::text)
        LEFT JOIN eg_user u_applicant ON u_applicant.uuid = a.accountid
        LEFT JOIN eg_user u ON u.id::text = p.createdby::text
        LEFT JOIN eg_hrms_employee emp ON emp.uuid::text = u.uuid::text
        LEFT JOIN current_holder ch ON ch.applicationno = a.applicationno OR ch.applicationno = a.id::text
        WHERE pd.businessservice in ('BPA.NC_APP_FEE','BPA.NC_SAN_FEE','BPAREG')
          AND upper(p.paymentstatus) != 'CANCELLED'
      )
      
      SELECT  
        to_char(to_timestamp(createdtime / 1000),'DD-MM-YYYY HH24:MI:SS') AS payment_date,
        applicationno,tenant,
        bill_consumercode,
        name,
        mobilenumber,
        'BPA' AS businessservice,
         status,
        collector_code,
        cash_amount, cheque_amount, card_amount, dd_amount, neft_amount, rtgs_amount, online_amount, amountpaid
      FROM unique_transactions where 1=1
  orderby: ORDER BY applicationno,createdtime DESC 
  
- reportName: SLAReportbpa
  decryptionPathId: LAYOUTREPORTS
  summary: SLA report for building_plan service
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: tenantid
    label: ULB Name
    type: string
    source: obpas_bpa
    total: false
  - name: bpa_application_no
    label: Application Number
    type: string
    source: obpas_bpa
    total: false
  - name: final_status
    label: Application Status
    type: string
    source: obpas_bpa
    total: false    
  - name: document_verify_on
    label: Document Verified On
    type: string
    source: obpas_bpa
    total: false
  - name: finalstatus_on
    label: Approval / Rejection On
    type: string
    source: obpas_bpa
    total: false
  - name: sla_status
    label: SLA status
    type: string
    source: obpas_bpa
    total: false
  - name: sla_days
    label: SLA Days 
    type: string
    source: obpas_bpa
    total: false
  - name: employee_name
    label: Employee Name
    type: string
    source: obpas_bpa
    total: false
  - name: employee_code
    label: Employee Code / Current Holder Code
    type: string
    source: obpas_bpa
    total: false
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND n.createdtime >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND n.createdtime <= $toDate
  - name: businessservice
    label: Business Service
    type: singlevaluelist
    pattern: list://BPA_LOW:Self Certification
    source: obpas_bpa
    isMandatory: false
    searchClause: AND sla.businessservice = $businessservice 
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: and  n.tenantid = $ulb      
  query: |
      WITH wf_detailed AS (
          SELECT 
              wf.businessid AS uuid,                                     
              UPPER(st.applicationstatus) AS applicationstatus,
              wf.createdtime,
              wf.lastmodifiedtime,
              wf.businessservice,
              wf.tenantid,
              wf.id AS processinstanceid
          FROM eg_wf_processinstance_v2 wf
          JOIN eg_wf_state_v2 st ON wf.status = st.uuid
          WHERE wf.businessservice IN ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH')                
      ),
      status_times AS (
          SELECT
              uuid,
              MAX(CASE 
                  WHEN businessservice = 'BPA_LOW' AND applicationstatus = 'PENDINGINITIALVERIFICATION' THEN createdtime 
                  WHEN businessservice != 'BPA_LOW' AND applicationstatus = 'FIELDINSPECTION_INPROGRESS' THEN createdtime 
                  ELSE NULL 
              END) AS docverify_time,
              
              MAX(CASE 
                  WHEN applicationstatus IN ('E-SIGNED','SANCTION_FEE_PENDING','APPROVED','REJECTED','PENDING_SANC_FEE_PAYMENT','BLOCKED') THEN lastmodifiedtime 
              END) AS final_time
          FROM wf_detailed
          GROUP BY uuid
      ),
      latest_status AS (
          SELECT uuid, applicationstatus
          FROM (
              SELECT uuid, applicationstatus, lastmodifiedtime,
              ROW_NUMBER() OVER (PARTITION BY uuid ORDER BY lastmodifiedtime DESC NULLS LAST) AS rn
              FROM wf_detailed
          ) x WHERE rn = 1
      ),
      sla_data AS (
          SELECT businessservice, businessservicesla
          FROM eg_wf_businessservice_v2
          WHERE businessservice IN ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH')
      ),
      assignee_details AS (
          SELECT DISTINCT ON (wf.businessid)
              wf.businessid,
              e.code AS employee_code,
              u.name AS employee_name
          FROM eg_wf_processinstance_v2 wf
          JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
          JOIN eg_hrms_employee e ON e.uuid = wa.assignee
          JOIN eg_user u ON e.uuid = u.uuid
          WHERE wf.businessservice IN ('BPA_LOW','BPA_NP_HIGH_OTH','BPA_MC','BPA_NP','BPA_MC_HIGH_OTH','BPA_NP_HIGH','BPA_MC_HIGH')
          ORDER BY wf.businessid, wf.lastmodifiedtime DESC
      )
      SELECT DISTINCT ON (n.applicationno)
          split_part(n.tenantid,'.',2) AS tenantid,
          n.applicationno AS bpa_application_no,                  
          
          -- Status Localization Mapping
          CASE 
              WHEN UPPER(ls.applicationstatus) = 'CITIZEN_APPROVAL_PENDING' THEN 'Pending Citizen Approval'
              WHEN UPPER(ls.applicationstatus) = 'SEND_TO_CITIZEN' THEN 'Sent back to Citizen'
              WHEN UPPER(ls.applicationstatus) = 'INPROGRESS' THEN 'In Progress'
              WHEN UPPER(ls.applicationstatus) = 'PENDING_APPL_FEE_PAYMENT' THEN 'Application Fee Pending'
              WHEN UPPER(ls.applicationstatus) = 'DOC_VERIFICATION_PENDING' THEN 'Doc Verification Pending'
              WHEN UPPER(ls.applicationstatus) = 'FIELDINSPECTION_PENDING' THEN 'Field Inspection Pending'
              WHEN UPPER(ls.applicationstatus) = 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In-Progress'
              WHEN UPPER(ls.applicationstatus) = 'NOC_VERIFICATION_PENDING' THEN 'NOC Verification Pending'
              WHEN UPPER(ls.applicationstatus) = 'PENDING_SANC_FEE_PAYMENT' THEN 'Sanction Fee Pending'
              WHEN UPPER(ls.applicationstatus) = 'APPROVED' THEN 'Approved'
              WHEN UPPER(ls.applicationstatus) = 'REJECTED' THEN 'Rejected'
              WHEN UPPER(ls.applicationstatus) = 'LEVEL3_VERIFICATION_PENDING' THEN 'L3 Verification Pending'
              WHEN UPPER(ls.applicationstatus) = 'LEVEL4_VERIFICATION_PENDING' THEN 'L4 Verification Pending'
              WHEN UPPER(ls.applicationstatus) = 'JC_VERIFICATION_PENDING' THEN 'JC Verification Pending'
              WHEN UPPER(ls.applicationstatus) = 'MC_VERIFICATION_PENDING' THEN 'MC Verification Pending'
              WHEN UPPER(ls.applicationstatus) = 'ATPHQ_APPROVAL_PENDING' THEN 'ATP HQ Approval Pending'
              WHEN UPPER(ls.applicationstatus) = 'PENDINGINITIALVERIFICATION' THEN 'Pending Initial Verification'
              ELSE REPLACE(INITCAP(REPLACE(ls.applicationstatus, '_', ' ')), ' ', ' ')
          END AS final_status,
          
          TO_CHAR(TO_TIMESTAMP(st.docverify_time/1000),'DD-MM-YYYY') AS document_verify_on,
          TO_CHAR(TO_TIMESTAMP(st.final_time/1000),'DD-MM-YYYY') AS finalstatus_on,   
          
          -- SLA Days Calculation
          CASE
              WHEN st.final_time IS NOT NULL AND st.docverify_time IS NOT NULL
                  THEN FLOOR((st.final_time - st.docverify_time)/86400000)
              WHEN st.docverify_time IS NOT NULL AND st.final_time IS NULL
                  THEN FLOOR((EXTRACT(EPOCH FROM NOW())*1000 - st.docverify_time)/86400000)
              ELSE NULL
          END AS sla_days,
          
          -- SLA Status Breach Logic
          CASE
              WHEN st.docverify_time IS NOT NULL AND st.final_time IS NOT NULL THEN
                  CASE WHEN (st.final_time - st.docverify_time) > sla.businessservicesla THEN 'BREACHED' ELSE 'MET' END
              WHEN st.docverify_time IS NOT NULL AND st.final_time IS NULL THEN
                  CASE WHEN (EXTRACT(EPOCH FROM NOW()) * 1000 - st.docverify_time) > sla.businessservicesla THEN 'BREACHED' ELSE 'IN-PROGRESS' END
              ELSE 'AWAITING START'
          END AS sla_status,
          
          ad.employee_name,
          ad.employee_code
      FROM eg_bpa_buildingplan n
      LEFT JOIN status_times st ON n.applicationno = st.uuid
      LEFT JOIN latest_status ls ON n.applicationno = ls.uuid
      JOIN sla_data sla ON n.businessservice = sla.businessservice
      LEFT JOIN assignee_details ad ON n.applicationno = ad.businessid
      WHERE UPPER(COALESCE(ls.applicationstatus, '')) NOT IN ('CITIZEN_APPROVAL_INPROCESS','PENDING_APPL_FEE','INITIATED')
  orderby:  ORDER BY n.applicationno,n.createdtime DESC

- reportName: ReceiptRegisterbpa
  decryptionPathId: LAYOUTREPORTS
  summary: Details of collector register in building_plan service
  version: 1.0.0
  moduleName: rainmaker-obpas_bpa
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: Tenant
    label: ULB Name
    type: string
    source: obpas_bpa
    total: false
  - name: receiptno
    label: Receipt Number
    type: string
    source: obpas_bpa
    total: false
  - name: applicationno
    label: Application Number
    type: string
    source: obpas_bpa
    total: false
  - name: receiptdate
    label: Receipt Date
    type: string
    source: obpas_bpa
    total: false
  - name: service
    label: Module Name
    type: string
    source: obpas_bpa
    total: false
  - name: transactiondate
    label: Transaction Date
    type: string
    source: obpas_bpa
    total: false
  - name: transaction_id
    label: Transaction Id
    type: string
    source: obpas_bpa
    total: false
  - name: ownername1
    label: Owner Name
    type: string
    source: obpas_bpa
    total: false
  - name: amountpaid
    label: Amount Paid
    type: string
    source: obpas_bpa
    total: true
  - name: paymentmode
    label: Payment Mode
    type: string
    source: obpas_bpa
    total: false
  - name: paymentstatus
    label: Payment Status
    type: string
    source: obpas_bpa
    total: false
  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND pd.receiptdate >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_bpa
    isMandatory: true
    searchClause: AND pd.receiptdate <= $toDate
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: and  pd.tenantid = $ulb      
  - name: receiptNumber
    label: Receipt Number
    type: string
    source: obpas_bpa
    isMandatory: false
    searchClause: AND pd.receiptnumber like $receiptNumber
  - name: paymentMode
    label: Payment Mode
    type: singlevaluelist
    pattern: 'list://CASH:CASH,CHEQUE:CHEQUE,DD:DD,ONLINE:ONLINE,CARD:CARD,OFFLINE_NEFT:OFFLINE NEFT'
    source: obpas_bpa
    isMandatory: false
    searchClause: AND payment.paymentmode like $paymentMode     
  query: |
      SELECT
          pd.receiptnumber AS receiptno,
          bill.consumercode AS applicationno,
          split_part(pd.tenantid, '.', 2) AS tenant,
          TO_CHAR(
              TO_TIMESTAMP(pd.receiptdate / 1000) AT TIME ZONE 'Asia/Kolkata',
              'DD-MM-YYYY'
          ) AS receiptdate,
          pd.businessservice ,
          'Building Plan' AS service,
          TO_CHAR(
              TO_TIMESTAMP(payment.instrumentdate / 1000) AT TIME ZONE 'Asia/Kolkata',
              'DD-MM-YYYY'
          ) AS transactiondate,
          payment.instrumentnumber AS transaction_id,
          usr.name AS ownername1,
          pd.amountpaid,
          payment.paymentmode,
          payment.paymentstatus
      FROM egcl_paymentdetail pd
      INNER JOIN egcl_bill bill 
          ON bill.id = pd.billid 
      INNER JOIN egcl_payment payment 
          ON payment.id = pd.paymentid
      LEFT JOIN eg_bpa_buildingplan a 
          ON bill.consumercode = a.applicationno
      LEFT JOIN eg_user usr 
          ON usr.id = payment.createdby::integer
      WHERE
          pd.businessservice in ('BPA.NC_APP_FEE','BPA.NC_SAN_FEE','BPAREG')
          AND payment.paymentstatus != 'CANCELLED'
  orderby: ORDER BY pd.receiptdate DESC;

