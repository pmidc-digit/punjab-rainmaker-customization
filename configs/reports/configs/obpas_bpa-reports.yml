  searchParams:
  - name: fromDate
    label: From Date
    type: epoch
    source: obpas_bpa
    isMandatory: false
    searchClause: AND pg.created_time >= $fromDate
  - name: toDate
    label: To Date
    type: epoch
    source: obpas_bpa
    isMandatory: false
    searchClause: AND pg.created_time <= $toDate
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    wrapper: true
    isMandatory: false
    searchClause: AND bpa.tenantid = $ulb
  - name: ulbtype
    label: ULB Type
    type: singlevaluelist
    pattern: 'list://Municipal Corporation:Municipal Corporation,Nagar Panchayat:Nagar Panchayat,Municipal Council:Municipal Council,Improvement Trust: Improvement Trust'
    source: obpas_bpa
    isMandatory: false
    searchClause: AND pg.additional_details->>'ulbType' = $ulbtype
  - name: district
    label: District
    type: singlevaluelist
    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_bpa
    isMandatory: false
    searchClause: AND ud.district = $district
  - name: transactionstatus
    label: Transaction Status
    type: singlevaluelist
    pattern: 'list://SUCCESS:Success,FAILURE:Failure'
    source: obpas_bpa
    isMandatory: false
    searchClause: AND pg.txn_status = $transactionstatus

  query: |
      SELECT 
      CASE 
        WHEN bd.businessservice = 'BPA.NC_APP_FEE' THEN '101'
        WHEN bd.businessservice = 'BPA.NC_SAN_FEE' THEN '101'
        ELSE bd.businessservice 
      END AS service_code,pg.gateway_txn_id,
      'BPA' AS module_name, pg.txn_id AS transaction_id, pg.txn_amount AS transaction_amount,
      pg.gateway, 'Axis' AS bank_name, 
      CASE 
        WHEN pg.txn_status = 'SUCCESS' THEN 'Success'
        WHEN pg.txn_status = 'FAILURE' THEN 'Failure'
        ELSE pg.txn_status 
      END AS transaction_status,
      pg.tenant_id AS ulb_code, INITCAP(SPLIT_PART(pg.tenant_id, '.', 2)) AS tenant_id, pg.additional_details->>'ulbName' AS ulb_name,
      pg.additional_details->>'ulbType' AS ulb_type,pg.consumer_code AS application_number, pg.name AS applicant_name, pg.mobile_number, 
      CASE 
        WHEN bd.businessservice = 'BPA.NC_APP_FEE' THEN 'Pay 1'
        WHEN bd.businessservice = 'BPA.NC_SAN_FEE' THEN 'Pay 2'
        ELSE bd.businessservice 
      END AS service_label,ud.district,
      TO_CHAR(TO_TIMESTAMP(pg.created_time / 1000), 'DD-MM-YYYY HH24:MI:SS') AS created_date, TO_CHAR(TO_TIMESTAMP(pg.created_time / 1000), 'YYYY') AS year,
      TO_CHAR(TO_TIMESTAMP(pg.created_time / 1000), 'MM') AS month,
      
      TO_CHAR((MOD(EXTRACT(MONTH FROM TO_TIMESTAMP(pg.created_time / 1000))::INT - 4 + 12, 12) + 1), 'FM09') AS financial_month,
      TO_CHAR((MOD(EXTRACT(MONTH FROM TO_TIMESTAMP(pg.created_time / 1000))::INT - 4 + 12, 12) + 1), 'FM09') || ' - ' || TO_CHAR(TO_TIMESTAMP(pg.created_time / 1000), 'FMMonth') AS month_name,
      
      CASE 
        WHEN EXTRACT(MONTH FROM TO_TIMESTAMP(pg.created_time / 1000)) >= 4 
        THEN TO_CHAR(TO_TIMESTAMP(pg.created_time / 1000), 'YYYY') || '-' || TO_CHAR(TO_TIMESTAMP(pg.created_time / 1000) + INTERVAL '1 year', 'YY')
        ELSE TO_CHAR(TO_TIMESTAMP(pg.created_time / 1000) - INTERVAL '1 year', 'YYYY') || '-' || TO_CHAR(TO_TIMESTAMP(pg.created_time / 1000), 'YY')
      END AS financial_year,
      CASE 
              WHEN bpa.status = 'PENDING_APPL_FEE' THEN 'Pending Application Fee'
              WHEN bpa.status = 'CITIZEN_APPROVAL_PENDING' THEN 'Pending Citizen Approval'
              WHEN bpa.status = 'SEND_TO_CITIZEN' THEN 'Sent back to Citizen'
              WHEN bpa.status = 'INPROGRESS' THEN 'In Progress'
              WHEN bpa.status = 'PENDING_APPL_FEE_PAYMENT' THEN 'Pending Application Fee Payment'
              WHEN bpa.status = 'DOC_VERIFICATION_PENDING' THEN 'Document Verification Pending'
              WHEN bpa.status = 'FIELDINSPECTION_PENDING' THEN 'Field Inspection Pending'
              WHEN bpa.status = 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In-Progress'
              WHEN bpa.status = 'NOC_VERIFICATION_PENDING' THEN 'NOC Verification Pending'
              WHEN bpa.status = 'PENDINGAPPROVAL' THEN 'Pending Final Approval'
              WHEN bpa.status = 'PENDING_SANC_FEE_PAYMENT' THEN 'Pending Sanction Fee Payment'
              WHEN bpa.status = 'APPROVED' THEN 'Approved'
              WHEN bpa.status = 'REJECTED' THEN 'Rejected'
              WHEN bpa.status = 'LEVEL3_VERIFICATION_PENDING' THEN 'L3 Verification Pending'
              WHEN bpa.status = 'LEVEL4_VERIFICATION_PENDING' THEN 'L4 Verification Pending'
              WHEN bpa.status = 'JC_VERIFICATION_PENDING' THEN 'JC Verification Pending'
              WHEN bpa.status = 'MC_VERIFICATION_PENDING' THEN 'MC Verification Pending'
              WHEN bpa.status = 'ATPHQ_APPROVAL_PENDING' THEN 'ATP HQ Approval Pending'
              WHEN bpa.status = 'PENDINGINITIALVERIFICATION' THEN 'Pending Initial Verification'
              ELSE REPLACE(INITCAP(REPLACE(bpa.status, '_', ' ')), ' ', ' ')
            END AS status_of_application,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_APP_FEE' AND dd_sub.taxheadcode = 'BPA_BUILDING_APPLICATION_FEES'), 0) AS pay1_bpa_building_application_fees,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_APP_FEE' AND dd_sub.taxheadcode = 'BPA_PROCESSING_FEES'), 0) AS pay1_bpa_processing_fees,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_APP_FEE' AND dd_sub.taxheadcode = 'BPA_BOUNDARY_WALL_FEES'), 0) AS pay1_bpa_boundary_wall_fees,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_APP_FEE' AND dd_sub.taxheadcode = 'BPA_OTHER_CHARGES'), 0) AS pay1_bpa_other_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_BUILDING_APPLICATION_FEES'), 0) AS pay2_bpa_building_application_fees,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_PROCESSING_FEES'), 0) AS pay2_bpa_processing_fees,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_BOUNDARY_WALL_FEES'), 0) AS pay2_bpa_boundary_wall_fees,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_CLUBBING_CHARGES'), 0) AS pay2_bpa_clubbing_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_CLU_CHARGES'), 0) AS pay2_bpa_clu_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_EXTERNAL_DEVELOPMENT_CHARGES'), 0) AS pay2_bpa_external_development_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_GAUSHALA_CHARGES_CESS'), 0) AS pay2_bpa_gaushala_charges_cess,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_LABOUR_CESS'), 0) AS pay2_bpa_labour_cess,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_MALBA_CHARGES'), 0) AS pay2_bpa_malba_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_MINING_CHARGES'), 0) AS pay2_bpa_mining_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_OTHER_CHARGES'), 0) AS pay2_bpa_other_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_PURCHASABLE_FAR_CHARGES'), 0) AS pay2_bpa_purchasable_far_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_RAIN_WATER_HARVESTING_CHARGES'), 0) AS pay2_bpa_rain_water_harvesting_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_SUB-DIVISION_CHARGES'), 0) AS pay2_bpa_sub_division_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_URBAN_DEVELOPMENT_CESS'), 0) AS pay2_bpa_urban_development_cess,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'BPA_WATER_CHARGES'), 0) AS pay2_bpa_water_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'ADJ_BPA_EXTERNAL_DEVELOPMENT_CHARGES'), 0) AS pay2_adj_bpa_external_development_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'ADJ_BPA_OTHER_CHARGES'), 0) AS pay2_adj_bpa_other_charges,
            COALESCE((SELECT SUM(dd_sub.taxamount) FROM egbs_demanddetail_v1 dd_sub WHERE dd_sub.demandid = bd.demandid AND bd.businessservice = 'BPA.NC_SAN_FEE' AND dd_sub.taxheadcode = 'ADJ_BPA_WATER_CHARGES'), 0) AS pay2_adj_bpa_water_charges
            FROM eg_pg_transactions pg 
            INNER JOIN egbs_bill_v1 bill ON bill.id = pg.bill_id
            INNER JOIN egbs_billdetail_v1 bd ON bd.billid = bill.id
            LEFT JOIN eg_bpa_buildingplan bpa ON pg.consumer_code = bpa.applicationno AND pg.tenant_id = bpa.tenantid
            LEFT JOIN ulb_data ud ON pg.tenant_id = ud.ulb_code 
            WHERE bd.businessservice IN ('BPA.NC_APP_FEE', 'BPA.NC_SAN_FEE') 
            AND pg.tenant_id != 'pb.testing' 
  orderby: ORDER BY application_number, created_date;


