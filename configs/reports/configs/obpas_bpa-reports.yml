  query: |
      SELECT initcap(ulb_schema) AS ulb_schema,
          applicant_name AS employee_name,mobilenumber,
          COUNT(*) FILTER (WHERE status = 'Accepted')     AS accepted_count,
          COUNT(*) FILTER (WHERE status = 'Not Accepted') AS not_accepted_count,
          COUNT(*)                                        AS total_count
          from edcr_cross_ulb_result
  groupby: GROUP BY ulb_schema,applicant_name,mobilenumber          
