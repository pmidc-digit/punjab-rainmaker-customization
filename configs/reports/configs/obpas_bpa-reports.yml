    pattern: 'list://Amritsar:Amritsar,Barnala:Barnala,Bathinda:Bathinda,Faridkot:Faridkot,Fatehgarh Sahib:Fatehgarh Sahib,Fazilka:Fazilka,Ferozepur:Ferozepur,Gurdaspur:Gurdaspur,Hoshiarpur:Hoshiarpur,Jalandhar:Jalandhar,Kapurthala:Kapurthala,Ludhiana:Ludhiana,Malerkotla:Malerkotla,Mansa:Mansa,Moga:Moga,Pathankot:Pathankot,Patiala:Patiala,Roopnagar:Roopnagar,SAS Nagar:SAS Nagar,SBS Nagar:SBS Nagar,Sangrur:Sangrur,Sri Muktsar Sahib:Sri Muktsar Sahib,Tarn Taran:Tarn Taran'    
    source: obpas_bpa
    isMandatory: false
    searchClause: AND ulb_data.district = $district 
  - name: ulb
    label: ULB Name
    type: singlevaluelist
    pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=tenant&masterName=tenants|$.MdmsRes.tenant.tenants.*.code|$.MdmsRes.tenant.tenants.*.name
    source: obpas_bpa
    isMandatory: false
    searchClause: and  bpa.tenantid = $ulb 
  - name: businessservice
    label: Service
    type: singlevaluelist
    pattern: 'list://BPA_LOW:Self Certification'
    source: obpas_bpa
    isMandatory: false
    searchClause: AND bpa.businessservice = = $businessservice
  query: |
      SELECT 
         ulb_data.district,
         bpa.applicationno,
         bpa.edcrnumber,
         CASE 
           WHEN UPPER(bpa.status) = 'PENDING_APPL_FEE' THEN 'Pending Application Fees'
           WHEN UPPER(bpa.status) = 'CITIZEN_APPROVAL_PENDING' THEN 'Pending Citizen Approval'
           WHEN UPPER(bpa.status) = 'SEND_TO_CITIZEN' THEN 'Sent back to Citizen'
           WHEN UPPER(bpa.status) = 'INPROGRESS' THEN 'In Progress'
           WHEN UPPER(bpa.status) = 'PENDING_APPL_FEE_PAYMENT' THEN 'Application Fee Pending'
           WHEN UPPER(bpa.status) = 'DOC_VERIFICATION_PENDING' THEN 'Document Verification Pending'
           WHEN UPPER(bpa.status) = 'FIELDINSPECTION_PENDING' THEN 'Field Inspection Pending'
           WHEN UPPER(bpa.status) = 'FIELDINSPECTION_INPROGRESS' THEN 'Field Inspection In-Progress'
           WHEN UPPER(bpa.status) = 'NOC_VERIFICATION_PENDING' THEN 'NOC Verification Pending'
           WHEN UPPER(bpa.status) = 'PENDING_SANC_FEE_PAYMENT' THEN 'Sanction Fee Pending'
           WHEN UPPER(bpa.status) = 'APPROVED' THEN 'Approved'
           WHEN UPPER(bpa.status) = 'REJECTED' THEN 'Rejected'
           WHEN UPPER(bpa.status) = 'LEVEL3_VERIFICATION_PENDING' THEN 'L3 Verification Pending'
           WHEN UPPER(bpa.status) = 'LEVEL4_VERIFICATION_PENDING' THEN 'L4 Verification Pending'
           WHEN UPPER(bpa.status) = 'JC_VERIFICATION_PENDING' THEN 'JC Verification Pending'
           WHEN UPPER(bpa.status) = 'MC_VERIFICATION_PENDING' THEN 'MC Verification Pending'
           WHEN UPPER(bpa.status) = 'ATPHQ_APPROVAL_PENDING' THEN 'ATP HQ Approval Pending'
           WHEN UPPER(bpa.status) = 'PENDINGINITIALVERIFICATION' THEN 'Pending Initial Verification'
           ELSE REPLACE(INITCAP(REPLACE(bpa.status, '_', ' ')), ' ', ' ')
          END AS localized_status,
          split_part(bpa.tenantid, '.', 2) AS tenant,
          'Building Plan' AS businessservice 
          FROM eg_bpa_buildingplan bpa 
          INNER JOIN ulb_data ON bpa.tenantid = ulb_data.ulb_code 
          WHERE 1=1 
  orderby : ORDER BY ulb_data.district, bpa.tenantid, bpa.applicationno;

