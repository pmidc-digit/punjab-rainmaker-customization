        total: false
      - name: booking_date
        label: Booking Date
        type: string
        source: adv
        total: false
      - name: booking_from_time
        label: Booking From Time
        type: string
        source: adv
        total: false
      - name: booking_to_time
        label: Booking To Time
        type: string
        source: adv
        total: false
      - name: status
        label: Status
        type: string
        source: adv
        total: false
    searchParams:
      - name: fromDate
        label: fromDate
        type: epoch
        source: adv
        isMandatory: true
        searchClause: AND c.booking_date >= to_timestamp($fromDate / 1000)
      - name: toDate
        label: toDate
        type: epoch
        source: adv
        isMandatory: true
        searchClause: AND c.booking_date <= to_timestamp($toDate / 1000)
    query: >
      -- Use CTE to force query plan, compute & use CTE later
       SELECT 
           split_part(b.tenant_id, '.', 2) AS tenantId ,b.booking_no, b.receipt_no , 
           a.applicant_name , a.applicant_mobile_no,
           ad.address_line_1 , ad.pincode ,
           c.add_type , c.location , c.face_area , c.booking_date , c.booking_from_time , 
           c.booking_to_time,c.status
         FROM eg_adv_booking_detail b
          INNER JOIN eg_adv_applicant_detail a on a.booking_id=b.booking_id
          INNER JOIN eg_adv_address_detail ad on ad.applicant_detail_id = a.applicant_detail_id
          INNER JOIN eg_adv_cart_detail c on c.booking_id=b.booking_id
          WHERE  c.status='BOOKED' 
            AND b.tenant_id= $tenantid
    orderby: ORDER BY c.booking_date
    
  - reportName: CollectionsReport
    decryptionPathId: ADVREPORTS  
    summary: Collections
    version: 1.0.0
    moduleName: rainmaker-adv
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: applicationno
        label: applicationno
        type: string
        source: adv
        total: false
      - name: name
        label: name
        type: string
        source: adv
        total: false
      - name: mobilenumber
        label: mobilenumber
        type: string
        source: adv
        total: false
      - name: businessservice
        label: businessservice
        type: string
        source: adv
        total: false
      - name: current_stage
        label: current_stage
        type: string
        source: adv
        total: false
      - name: cash_amount
        label: cash_amount
        type: string
        source: adv
        total: true
      - name: cheque_amount
        label: cheque_amount
        type: string
        source: adv
        total: true
      - name: card_amount
        label: card_amount
        type: string
        source: adv
        total: true
      - name: dd_amount
        label: dd_amount
        type: string
        source: adv
        total: true
      - name: neft_amount
        label: neft_amount
        type: string
        source: adv
        total: true
      - name: rtgs_amount
        label: rtgs_amount
        type: string
        source: adv
        total: true
      - name: online_amount
        label: online_amount
        type: string
        source: adv
        total: true
      - name: amountpaid
        label: amountpaid
        type: string
        source: adv
        total: true
      - name: PaymentDate
        label: PaymentDate
        type: string
        source: adv
        total: false
    searchParams:
      - name: fromDate
        label: fromDate
        type: epoch
        source: adv
        isMandatory: true
        searchClause: AND createdtime >= $fromDate
      - name: toDate
        label: toDate
        type: epoch
        source: adv
        isMandatory: true
        searchClause: AND createdtime <= $toDate
    query: >
      -- Use CTE to force query plan, compute & use CTE later
       WITH current_holder AS (
        SELECT DISTINCT ON (wf.businessid)
          wf.businessid AS applicationno,
          u.name AS employee_name,
          e.code AS assignee_code,
          UPPER(st.applicationstatus) AS current_stage
         FROM eg_wf_processinstance_v2 wf
         JOIN eg_wf_state_v2 st ON wf.status = st.uuid
         LEFT JOIN eg_wf_assignee_v2 wa ON wf.id = wa.processinstanceid
         LEFT JOIN eg_user u ON u.uuid = wa.assignee
         LEFT JOIN eg_hrms_employee e ON e.uuid = wa.assignee
         WHERE wf.tenantid = $tenantid
         AND wf.businessservice = 'ADV'
         ORDER BY wf.businessid, wf.lastmodifiedtime DESC
        ),
        unique_transactions AS (
         SELECT
          p.id AS transaction_id,
          p.createdtime,
          pd.amountpaid,
          CASE WHEN p.paymentmode IN ('CASH','OFFLINE_CASH') THEN pd.amountpaid ELSE 0 END AS cash_amount,
          CASE WHEN p.paymentmode = 'CHEQUE' THEN pd.amountpaid ELSE 0 END AS cheque_amount,
          CASE WHEN p.paymentmode IN ('CARD','DEBIT_CARD','CREDIT_CARD','OFFLINE_CARD') THEN pd.amountpaid ELSE 0 END AS card_amount,
          CASE WHEN p.paymentmode = 'DD' THEN pd.amountpaid ELSE 0 END AS dd_amount,
          CASE WHEN p.paymentmode IN ('NEFT','OFFLINE_NEFT') THEN pd.amountpaid ELSE 0 END AS neft_amount,
          CASE WHEN p.paymentmode IN ('RTGS','OFFLINE_RTGS','NEFT_RTGS') THEN pd.amountpaid ELSE 0 END AS rtgs_amount,
          CASE WHEN p.paymentmode = 'ONLINE' THEN pd.amountpaid ELSE 0 END AS online_amount,
          COALESCE(emp.code, 'SELF') AS collector_code,
          adv.booking_no AS applicationno,
          a.applicant_name AS name,
          a.applicant_mobile_no AS mobilenumber,
          ch.employee_name AS assignee_employee,
          ch.assignee_code AS assignee_code , ch.current_stage AS current_stage
          FROM egcl_paymentdetail pd
          JOIN egcl_payment p ON pd.paymentid = p.id
          JOIN egcl_bill bill ON bill.id = pd.billid
          JOIN eg_adv_booking_detail adv ON bill.consumercode = adv.booking_no
          JOIN eg_adv_applicant_detail a ON a.booking_id = adv.booking_id
          LEFT JOIN eg_user u ON u.id::text = p.createdby::text
          LEFT JOIN eg_hrms_employee emp ON emp.uuid::text = u.uuid::text
          LEFT JOIN current_holder ch ON ch.applicationno = adv.booking_no
          WHERE pd.businessservice = 'adv-services'
          AND p.paymentstatus != 'CANCELLED'
          AND p.tenantid = $tenantid
          ) 
       SELECT
        applicationno,
        name,
        mobilenumber,
        'ADV' AS businessservice,
        current_stage ,
        collector_code,
        cash_amount,
        cheque_amount,
        card_amount,
        dd_amount,
        neft_amount,
        rtgs_amount,
        online_amount,
        amountpaid,
        to_char(to_timestamp(createdtime / 1000),'DD-MM-YYYY HH24:MI:SS') AS paymentdate
        FROM unique_transactions
        WHERE 1=1
    orderby: ORDER BY createdtime DESC
    
