  - reportName: ReceiptRegisterADV
    decryptionPathId: ADVREPORTS
    summary: Details of collector register in ADV service
    version: 1.0.0
    moduleName: rainmaker-adv
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: receiptno
        label: receiptno
        type: string
        source: adv
        total: false
      - name: connectionno
        label: connectionno
        type: string
        source: adv
        total: false
      - name: receiptdate
        label: receiptdate
        type: string
        source: adv
        total: false
      - name: service
        label: service
        type: string
        source: adv
        total: false
      - name: collectorname
        label: collectorname
        type: string
        source: adv
        total: false
      - name: transactiondate
        label: transactiondate
        type: string
        source: adv
        total: false
      - name: instrumentnumber
        label: instrumentnumber
        type: string
        source: adv
        total: false
      - name: payername
        label: payername
        type: string
        source: adv
        total: false
      - name: amountpaid
        label: amountpaid
        type: string
        source: adv
        total: false
      - name: paymentmode
        label: paymentmode
        type: string
        source: adv
        total: false
      - name: paymentstatus
        label: paymentstatus
        type: string
        source: adv
        total: false
      - name: ownername1
        label: ownername1
        type: string
        source: adv
        total: false
      - name: user
        label: user
        type: string
        source: adv
        total: false
      - name: manualreceiptnumber
        label: manualreceiptnumber
        type: string
        source: adv
        total: false
      - name: manualreceiptdate
        label: manualreceiptdate
        type: string
        source: adv
        total: false
    searchParams:
      - name: fromDate
        label: fromDate
        type: epoch
        source: adv
        isMandatory: true
        searchClause: AND pd.receiptdate >= $fromDate
      - name: toDate
        label: toDate
        type: epoch
        source: adv
        isMandatory: true
        searchClause: AND pd.receiptdate <= $toDate
      - name: receiptno
        label: receiptno
        type: string
        source: adv
        isMandatory: false
        searchClause: AND pd.receiptnumber like $receiptno
      - name: paymentMode
        label: paymentMode
        type: singlevaluelist
        pattern: list://CASH:CASH,CHEQUE:CHEQUE,DD:DD,ONLINE:ONLINE,CARD:CARD,OFFLINE_NEFT:OFFLINE
          NEFT
        source: adv
        isMandatory: false
        searchClause: AND payment.paymentmode like $paymentMode
    query: >
      -- Use CTE to force query plan, compute & use CTE later
       SELECT
        pd.receiptnumber AS receiptno,
        bill.consumercode AS connectionno,
        TO_CHAR(TO_TIMESTAMP(pd.receiptdate / 1000) AT TIME ZONE 'Asia/Kolkata','DD-MM-YYYY') AS receiptdate,
        'ADVERTISEMENT' AS service,
        usr.name AS collectorname,
        TO_CHAR(TO_TIMESTAMP(payment.instrumentdate / 1000) AT TIME ZONE 'Asia/Kolkata','DD-MM-YYYY') AS transactiondate,
        payment.instrumentnumber AS instrumentnumber,
        a.applicant_name AS payername,
        usr.id AS user,
        usr.name  AS ownername1,
        pd.amountpaid AS amountpaid,
        payment.paymentmode AS paymentmode,
        payment.paymentstatus AS paymentstatus,
        pd.manualreceiptnumber,
        pd.manualreceiptdate
       FROM eg_adv_booking_detail b
       INNER JOIN eg_adv_applicant_detail a ON a.booking_id = b.booking_id
       INNER JOIN eg_adv_address_detail ad ON ad.applicant_detail_id = a.applicant_detail_id
       INNER JOIN eg_adv_cart_detail c ON c.booking_id = b.booking_id
       JOIN egcl_bill bill ON bill.consumercode = b.booking_no AND bill.tenantid = b.tenant_id
       JOIN egcl_paymentdetail pd ON pd.billid = bill.id 
       JOIN egcl_payment payment ON payment.id = pd.paymentid
       LEFT JOIN eg_user usr ON usr.id = payment.createdby::integer
       WHERE b.tenant_id = $tenantid
       AND payment.paymentstatus != 'CANCELLED'
    orderby: ORDER BY pd.receiptdate DESC

