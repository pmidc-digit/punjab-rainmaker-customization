        label: receiptdate
        type: string
        source: adv
        total: false
      - name: service
        label: service
        type: string
        source: adv
        total: false
      - name: collectorname
        label: collectorname
        type: string
        source: adv
        total: false
      - name: transactiondate
        label: transactiondate
        type: string
        source: adv
        total: false
      - name: instrumentnumber
        label: instrumentnumber
        type: string
        source: adv
