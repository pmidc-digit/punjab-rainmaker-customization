  - reportName: StateReceiptRegisterADV
    decryptionPathId: ADVREPORTS
    summary: Details of collector register in ADV service
    version: 1.0.0
    moduleName: rainmaker-adv
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: receiptno
