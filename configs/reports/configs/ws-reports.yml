        source: ws
        total: false     
      - name: billid
        label: Bill Id
        type: string
        source: ws
        total: false
      - name: totalamount
        label: totalamount
        type: string
        source: ws
        total: true
      - name: consumercode
        label: consumercode
        type: string
        source: ws
        total: false    
      - name: localityname
        label: localityname
        type: string
        source: ws
        total: false
      - name: localitycode
        label: localitycode
        type: string
        source: ws
        total: false 
      - name: zonecode
        label: zonecode
        type: string
        source: ws
        total: false 
      - name: blockcode
        label: blockcode
        type: string
        source: ws
        total: false        
      - name: wc_status
        label: wc_status
        type: string
        source: ws
        total: false 
      - name: landarea
        label: landarea
        type: string
        source: ws
        total: false    
      - name: bill_status
        label: bill_status
        type: string
        source: ws
        total: false
    searchParams:
      - name: localityArray
        label: zoneList
        type: boundarylist
        source: pt
        isMandatory: false
        searchClause: AND bm.localitycode IN ($localityArray)         
    query:
      WITH latest_bill AS (
          SELECT 
              bill.*,
              ROW_NUMBER() OVER (
                  PARTITION BY bill.consumercode 
                  ORDER BY bill.fromperiod DESC
              ) AS rn
          FROM egbs_billdetail_v1 bill
          WHERE bill.businessservice = 'WS'
        and bill.tenantid = $tenantid
      )
      SELECT 
          to_char(
              (to_timestamp(lb.fromperiod / 1000) AT TIME ZONE 'Asia/Kolkata'),
              'YYYY-MM'
          ) || '-' ||
          to_char(
              (to_timestamp(lb.toperiod / 1000) AT TIME ZONE 'Asia/Kolkata'),
              'YYYY-MM'
          ) AS finyear,
          pt.usagecategory,
          wc.connectionno,
          wc.property_id,
          lb.billid,
          lb.totalamount,
          lb.consumercode,
        bm.localityname,bm.localitycode,bm.zonecode,bm.blockcode,
          wc.status AS wc_status,
          pt.landarea,
          b.status AS bill_status
      FROM eg_ws_connection wc JOIN eg_pt_property pt  ON wc.property_id = pt.propertyid AND pt.status IN ('ACTIVE', 'PENDINGWS')
      JOIN eg_pt_address  pa ON pt.id = pa.propertyid and pa.tenantid = $tenantid
      JOIN  eg_bndry_mohalla bm  ON pa.locality = bm.localitycode and pa.tenantid = bm.tenantid 
      JOIN latest_bill lb     ON lb.consumercode = wc.connectionno
          AND lb.rn = 1           
      JOIN egbs_bill_v1 b     ON lb.billid = b.id and b.tenantid = $tenantid
      WHERE wc.tenantid = $tenantid
        AND wc.connectionno IS NOT NULL
        AND wc.status = 'Active'

