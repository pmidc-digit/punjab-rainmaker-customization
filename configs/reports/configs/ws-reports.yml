              AND tenantid = $tenantid
        ) 
        AND wc.status = 'Active' 
        --AND wc.tenantid = $tenantid 
        AND ws.connectiontype = 'Metered'  
        AND wc.connectionno IS NOT NULL)j2,
        
           -------------- under 5 Marla
        
            (SELECT COUNT(wc.connectionno) AS waterunder5Marla
             FROM eg_ws_connection wc 
             WHERE wc.property_id IN 
                 (SELECT propertyid 
                  FROM eg_pt_property 
                  WHERE landarea BETWEEN 0 AND 125 
                    AND status IN ('ACTIVE', 'PENDINGWS') 
                    --AND usagecategory = 'RESIDENTIAL' 
                    AND tenantid = $tenantid) 
               --AND wc.status = 'Active' 
               --AND wc.tenantid = $tenantid 
               AND wc.connectionno IS NOT NULL) l,
        
            (SELECT COUNT(sc.connectionno) AS Sewunder5Marla
             FROM eg_sw_connection sc 
