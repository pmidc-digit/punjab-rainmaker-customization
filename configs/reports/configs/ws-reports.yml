                    AND tenantid = $tenantid) 
               AND wc.status = 'Active' 
               --AND wc.tenantid = $tenantid 
               AND wc.connectionno IS NOT NULL) i,
        
            (SELECT COUNT(distinct sc.connectionno) AS totalActiveCommsew
             FROM eg_sw_connection sc 
             WHERE sc.property_id IN 
                 (SELECT propertyid 
                  FROM eg_pt_property 
                  WHERE landarea >=0 
                    AND status IN ('ACTIVE', 'PENDINGWS') 
                   AND usagecategory NOT IN ('RESIDENTIAL') 
                    AND tenantid = $tenantid) 
               AND sc.status = 'Active' 
               --AND sc.tenantid = $tenantid 
               AND sc.connectionno IS NOT NULL) j,
        
        (SELECT COUNT( distinct wc.connectionno) as TotalMetCommConn 
        FROM eg_ws_connection wc 
        JOIN eg_ws_service ws ON wc.id = ws.connection_id 
        WHERE wc.property_id IN (
            SELECT propertyid 
            FROM eg_pt_property 
