- reportName: WSNew_Connection_Fee_Report
  decryptionPathId: ReceiptRegisterShort_V2
  summary:  WS New Connection Fee Report
  version: 1.0.0
  moduleName: rainmaker-ws
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: tenantid
    label: tenantid
    type: string
    source: ws
    total: false
  - name: applicationno
    label: applicationno
    type: string
    source: ws
    total: false
  - name: connectionno
    label: connectionno
    type: string
    source: ws
    total: false
  - name: receiptdate
    label: receiptdate
    type: string
    source: ws
    total: false
  - name: receiptnumber
    label: receiptnumber
    type: string
    source: ws
    total: false
  - name: amount
    label: amount
    type: string
    source: ws
    total: false
  - name: instrumenttype
    label: instrumenttype
    type: string
    source: ws
    total: false
  - name: transactionnumber
    label: transactionnumber
    type: string
    source: ws
    total: false
  - name: securityfee
    label: securityfee
    type: string
    source: ws
    total: false
  - name: connectionfee
    label: connectionfee
    type: string
    source: ws
    total: false
  - name: othefee
    label: othefee
    type: string
    source: ws
    total: false
  - name: roadcutting
    label: roadcutting
    type: string
    source: ws
    total: false
  - name: usagetype
    label: usagetype
    type: string
    source: ws
    total: false
  - name: ledgerid
    label: ledgerid
    type: string
    source: ws
    total: false
  - name: ownername
    label: ownername
    type: string
    source: ws
    total: false
  - name: connectioncategory
    label: connectioncategory
    type: string
    source: ws
    total: false
  - name: propertyid
    label: propertyid
    type: string
    source: ws
    total: false
  - name: plotsize
    label: plotsize
    type: string
    source: ws
    total: false
  - name: address
    label: address
    type: string
    source: ws
    total: false
  - name: g8issuedate
    label: g8issuedate
    type: string
    source: ws
    total: false
  - name: g8receiptno
    label: g8receiptno
    type: string
    source: ws
    total: false
  - name: collectorname
    label: approvedby
    type: string
    source: ws
    total: false
  - name: approvaldate
    label: approvaldate
    type: string
    source: ws
    total: false
  searchParams:
  - name: fromDate
    label: fromDate
    type: epoch
    source: pt
    isMandatory: true
    searchClause: AND pd.receiptdate >= $fromDate
  - name: toDate
    label: reports.pt.toDate
    type: epoch
    source: pt
    isMandatory: true
    searchClause: AND pd.receiptdate <= $toDate
  query: |
    WITH receipt_breakup AS (
    SELECT
        pd.id AS pdid,                    
        SUM(CASE WHEN taxheadcode LIKE 'WS_SECURITY_DEPOSIT' THEN adjustedamount ELSE 0 END) AS securityfee, 
        SUM(CASE WHEN taxheadcode LIKE 'WS_CONNECTION_FEE' THEN adjustedamount ELSE 0 END) AS connectionfee, 
        SUM(CASE WHEN taxheadcode LIKE 'WS_OTHER_FEE' THEN adjustedamount ELSE 0 END) AS othefee, 
        SUM(CASE WHEN taxheadcode LIKE 'WS_ROAD_CUTTING_CHARGE' THEN adjustedamount ELSE 0 END) AS roadcutting                    
    FROM egcl_billaccountdetail AS bad
    INNER JOIN egcl_billdetial AS bd ON bd.id = bad.billdetailid
    INNER JOIN egcl_paymentdetail AS pd ON pd.billid = bd.billid
    INNER JOIN egcl_payment AS payment ON pd.paymentid = payment.id                  
    WHERE payment.tenantid =$tenantid 
      AND payment.paymentstatus != 'CANCELLED' 
      AND pd.businessservice = 'WS.ONE_TIME_FEE'
      AND pd.receiptdate >= $fromDate 
      AND pd.receiptdate <= $toDate
    GROUP BY pdid
    )
    SELECT 
    pd.tenantid AS tenantid,
    pd.id,
    TO_CHAR(TO_TIMESTAMP(pd.receiptdate / 1000) AT TIME ZONE 'Asia/Kolkata', 'DD-MM-YYYY') AS receiptdate,
    pd.receiptnumber,
    payment.totalamountpaid AS amount, 
    payment.paymentmode AS instrumenttype, 
    payment.transactionnumber,
    receipt_breakup.*,
    TO_CHAR(TO_TIMESTAMP(pd.manualreceiptdate / 1000) AT TIME ZONE 'Asia/Kolkata', 'DD-MM-YYYY') AS g8issuedate, 
    pd.manualreceiptnumber AS g8receiptno,
    ws.additionaldetails->>'waterSubUsageType' as usageType,
    ws.additionaldetails->>'ledgerId' as ledgerid,
    ws.connectionno as connectionno,
    ws.applicationno as applicationno,
    pt.propertyid as propertyid,
    pt.landarea as plotsize,
    concat(doorno,',',buildingname,',',street,',',city) as address,
    ws.additionaldetails->>'connectionCategory' as connectioncategory,
    ws.additionaldetails->>'ownerName' as ownername,
    eu.name as collectorname,
    TO_CHAR(TO_TIMESTAMP(pi.lastmodifiedtime / 1000) AT TIME ZONE 'Asia/Kolkata', 'DD-MM-YYYY') as approvaldate
    FROM egcl_paymentdetail pd
    INNER JOIN egcl_payment payment ON pd.paymentid = payment.id
    INNER JOIN egcl_bill bill ON bill.id = pd.billid
    INNER JOIN receipt_breakup ON receipt_breakup.pdid = pd.id
    INNER JOIN eg_ws_connection ws ON ws.applicationno = bill.consumercode
    inner join eg_pt_property pt on (ws.property_id=pt.propertyid and pt.status!='INACTIVE')
    inner join eg_pt_address pta on (pta.propertyid=pt.id)
    inner join eg_wf_processinstance_v2 pi on (pi.businessid=ws.applicationno and pi.action='APPROVE_FOR_CONNECTION')
    inner join eg_user eu on eu.uuid=pi.lastmodifiedby
    WHERE payment.paymentstatus != 'CANCELLED'
    AND pd.businessservice = 'WS.ONE_TIME_FEE'
    AND payment.tenantid =$tenantid
  orderby:  ORDER BY pd.receiptdate DESC;
    
