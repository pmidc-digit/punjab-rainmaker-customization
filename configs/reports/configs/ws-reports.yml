        source: ws
        isMandatory: true
        searchClause: AND pd.receiptdate >= $fromDate
      - name: toDate
        label: To Date
        type: epoch
        source: ws
        isMandatory: true
        searchClause: AND pd.receiptdate <= $toDate       
      - name: localityArray
        label: zoneList
        type: boundarylist
        source: ws
        isMandatory: false
        searchClause: AND pta.locality IN ($localityArray)
    query: |
       -------- Query for water
       WITH receipt_breakup AS (
       SELECT
           pd.id AS pdid,                    
           SUM(CASE WHEN taxheadcode LIKE 'WS_SECURITY_DEPOSIT' THEN adjustedamount ELSE 0 END) AS securityfee, 
           SUM(CASE WHEN taxheadcode LIKE 'WS_CONNECTION_FEE' THEN adjustedamount ELSE 0 END) AS connectionfee, 
           SUM(CASE WHEN taxheadcode LIKE 'WS_OTHER_FEE' THEN adjustedamount ELSE 0 END) AS othefee, 
           SUM(CASE WHEN taxheadcode LIKE 'WS_ROAD_CUTTING_CHARGE' THEN adjustedamount ELSE 0 END) AS roadcutting                    
       FROM egcl_billaccountdetail AS bad
       INNER JOIN egcl_billdetial AS bd ON bd.id = bad.billdetailid
       INNER JOIN egcl_paymentdetail AS pd ON pd.billid = bd.billid
       INNER JOIN egcl_payment AS payment ON pd.paymentid = payment.id                  
       WHERE payment.tenantid =$tenantid 
         AND payment.paymentstatus != 'CANCELLED' 
         AND pd.businessservice = 'WS.ONE_TIME_FEE'
         AND pd.receiptdate >= $fromDate 
          AND pd.receiptdate <= $toDate
       GROUP BY pdid
       )
       SELECT 
       pd.tenantid AS tenantid,
       pd.id,
       TO_CHAR(TO_TIMESTAMP(pd.receiptdate / 1000) AT TIME ZONE 'Asia/Kolkata', 'DD-MM-YYYY') AS receiptdate,
       pd.receiptnumber,
       payment.totalamountpaid AS amount, 
       payment.paymentmode AS instrumenttype, 
       payment.transactionnumber,
       receipt_breakup.*,
       TO_CHAR(TO_TIMESTAMP(pd.manualreceiptdate / 1000) AT TIME ZONE 'Asia/Kolkata', 'DD-MM-YYYY') AS g8issuedate, 
       pd.manualreceiptnumber AS g8receiptno,
       ws.additionaldetails->>'waterSubUsageType' as usageType,
       ws.additionaldetails->>'ledgerId' as ledgerid,
       ws.connectionno as connectionno,
       ws.applicationno as applicationno,
       pt.propertyid as propertyid,
       pt.landarea as plotsize,
       concat(doorno,',',buildingname,',',street,',',city) as addrespayment.payername,payment.mobilenumber,
       ws.additionaldetails->>'connectionCategory' as connectioncategory,
       ws.additionaldetails->>'ownerName' as ownernampta.locality,
       eu.name as collectorname,
       TO_CHAR(TO_TIMESTAMP(pi.lastmodifiedtime / 1000) AT TIME ZONE 'Asia/Kolkata', 'DD-MM-YYYY') as approvaldate
       FROM egcl_paymentdetail pd
       INNER JOIN egcl_payment payment ON pd.paymentid = payment.id
       INNER JOIN egcl_bill bill ON bill.id = pd.billid
       INNER JOIN receipt_breakup ON receipt_breakup.pdid = pd.id
       INNER JOIN eg_ws_connection ws ON ws.applicationno = bill.consumercode
       inner join eg_pt_property pt on (ws.property_id=pt.propertyid and pt.status!='INACTIVE')
       inner join eg_pt_address pta on (pta.propertyid=pt.id)
       inner join eg_wf_processinstance_v2 pi on (pi.businessid=ws.applicationno and pi.action='APPROVE_FOR_CONNECTION')
       inner join eg_user eu on eu.uuid=pi.lastmodifiedby
       WHERE payment.paymentstatus != 'CANCELLED'
       AND pd.businessservice = 'WS.ONE_TIME_FEE'
       AND payment.tenantid =$tenantid
    orderby: ORDER BY pd.receiptdate DESC
  - reportName: WSQuaterly_Bill_Not_Generate
    summary: Ws Quarterly Bill Not Generate Report
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig: null
    print:
      pdfPageSize: A1
    sourceColumns:
      - name: consumercode
        label: Consumercode
        type: string
        source: ws
        total: false
      - name: payername
        label: Name
        type: string
        source: ws
        total: false
      - name: payeraddress
        label: Address
        type: string
        source: ws
        total: false
      - name: mobilenumber
        label: Mobile
        type: string
        source: ws
        total: false
      - name: usagecategories
        label: Category
        type: string
        source: ws
        total: false
      - name: connectiontypes
        label: Connection Type
        type: string
        source: ws
        total: false
      - name: zonenames
        label: Zone Name
        type: string
        source: ws
        total: false
      - name: blocknames
        label: Ward Name
        type: string
        source: ws
        total: false                                
      - name: localitynames
        label: Locality
        type: string
        source: ws
        total: false
      - name: bill_statuses
        label: Bill Status
        type: string
        source: ws
        total: false        
      - name: landarea
        label: Land Area
        type: string
        source: ws
        total: false
      - name: propertyids
        label: PropertyID
        type: string
        source: ws
        total: false        
      - name: finyears
        label: FinYears
        type: string
        source: ws
        total: false
    searchParams:
      - name: fromDate
        label: From Date
        type: epoch
        source: ws
        isMandatory: true
        searchClause: AND 1=1
      - name: toDate
        label: To Date
        type: epoch
        source: ws
        isMandatory: true
        searchClause: AND 1=1  
      - name: usagecategory
        label: Category
        type: singlevaluelist
        pattern: 'list://RESIDENTIAL:RESIDENTIAL,NONRESIDENTIAL.COMMERCIAL:NONRESIDENTIAL.COMMERCIAL,NONRESIDENTIAL.INSTITUTIONAL:NONRESIDENTIAL.INSTITUTIONAL,NONRESIDENTIAL:NONRESIDENTIAL,NONRESIDENTIAL.OTHERS:NONRESIDENTIAL.OTHERS,MIXED:MIXED'
        source: ws
        isMandatory: false
        searchClause: AND cte.usagecategory = $usagecategory
      - name: connectiontype
        label: Connection Type
        type: singlevaluelist
        pattern: list://Non Metered:Non Metered,Metered:Metered
        source: ws
        isMandatory: false
        searchClause: AND cte.connectiontype = $connectiontype
      - name: localityArray
        label: zoneList
        type: boundarylist
        source: ws
        isMandatory: false
        searchClause: AND cte.localitycode IN ($localityArray)
    query: |
       WITH exclude_codes AS (
           SELECT DISTINCT bill.consumercode
           FROM egbs_billdetail_v1 bill
           WHERE bill.businessservice = 'WS'
          AND to_char(to_timestamp(bill.fromperiod / 1000) AT TIME ZONE 'Asia/Kolkata', 'YYYY-MM-DD') = to_char(to_timestamp($fromDate/ 1000) AT TIME ZONE 'Asia/Kolkata', 'YYYY-MM-DD')
         AND to_char(to_timestamp(bill.toperiod / 1000) AT TIME ZONE 'Asia/Kolkata', 'YYYY-MM-DD') = to_char(to_timestamp($toDate/ 1000) AT TIME ZONE 'Asia/Kolkata', 'YYYY-MM-DD')
       ),
       cte AS (
           SELECT 
               to_char((to_timestamp(bill.fromperiod / 1000) AT TIME ZONE 'Asia/Kolkata'), 'YYYY-MM') 
               || '-' || 
               to_char((to_timestamp(bill.toperiod / 1000) AT TIME ZONE 'Asia/Kolkata'), 'YYYY-MM') AS finyear,
               pt.usagecategory,
               bill.consumercode,
               b.status AS bill_status,b.payername,b.payeraddress,b.mobilenumber,
               ct.connectiontype,
       	    bill.fromperiod,
       	    bill.toperiod,
               ebm.zonename,
               ebm.blockname,
               ebm.localityname,
       	    ebm.localitycode,
               pt.landarea,
               pt.propertyid
           FROM eg_ws_connection wc 
           JOIN eg_pt_property pt 
               ON wc.property_id = pt.propertyid
              AND wc.status IN ('Active') 
              AND pt.status IN ('ACTIVE', 'PENDINGWS')
           JOIN eg_ws_service ct 
               ON wc.id = ct.connection_id
           JOIN eg_bndry_mohalla ebm 
               ON wc.locality = ebm.localitycode 
              AND wc.tenantid = ebm.tenantid
           JOIN egbs_billdetail_v1 bill 
               ON bill.consumercode = wc.connectionno 
              AND bill.businessservice = 'WS'
           JOIN egbs_bill_v1 b 
               ON bill.billid = b.id
              AND bill.businessservice = 'WS'
           WHERE wc.tenantid = $tenantid
             AND pt.usagecategory IN (
                   'RESIDENTIAL', 'NONRESIDENTIAL.COMMERCIAL',
                   'NONRESIDENTIAL.INSTITUTIONAL', 'MIXED',
                   'NONRESIDENTIAL', 'NONRESIDENTIAL.INDUSTRIAL',
                   'NONRESIDENTIAL.OTHERS'
               )
             AND bill.consumercode NOT IN (SELECT consumercode FROM exclude_codes)
             AND (
                   (ct.connectiontype = 'Non Metered' AND pt.landarea > 125)
                   OR (ct.connectiontype = 'Metered')
                 )
       )
       SELECT  
           consumercode,
           STRING_AGG(DISTINCT payername, ', ') AS payername,
       	STRING_AGG(DISTINCT payeraddress, ', ') AS payeraddress,
       	STRING_AGG(DISTINCT mobilenumber, ', ') AS mobilenumber,
           STRING_AGG(DISTINCT usagecategory, ', ') AS usagecategories,
           STRING_AGG(DISTINCT bill_status, ', ') AS bill_statuses,
           STRING_AGG(DISTINCT connectiontype, ', ') AS connectiontypes,
           STRING_AGG(DISTINCT zonename, ', ') AS zonenames,
       	STRING_AGG(DISTINCT localitycode, ', ') AS localitycode,
           STRING_AGG(DISTINCT blockname, ', ') AS blocknames,
           STRING_AGG(DISTINCT localityname, ', ') AS localitynames,
           MAX(landarea) AS landarea,
       	MAX(fromperiod) AS fromperiod,
       	MAX(toperiod) AS toperiod,
           STRING_AGG(DISTINCT propertyid, ', ') AS propertyids,
       	STRING_AGG(DISTINCT finyear, ', ') AS finyears
       FROM cte
       WHERE bill_status IN ('PAID', 'ACTIVE', 'PARTIALLY_PAID')
    groupby: GROUP BY consumercode
    orderby: ORDER BY consumercode 
    
