  - reportName: OutstandingArrears
    summary: Outstanding Arrears Report
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: consumercode
        label: consumercode
        type: string
        source: ws
        total: false
      - name: businessservice
        label: Business Service
        type: string
        source: ws
        total: false
      - name: total_demand
        label: Total Demand
        type: string
        source: ws
        total: true
      - name: balance
        label: Balance
        type: string
        source: ws
        total: true     
      - name: max_taxperiodto_date
        label: Max taxperiod todate
        type: epoch
        source: ws
        total: false
    searchParams:
      - name: connectionType
        label: connectionType
        type: singlevaluelist
        pattern: list://WS%:Water,SW%:Sewerage
        source: ws
        isMandatory: true
        searchClause: AND 1=1
      - name: toDate
        label: To Date
        type: epoch
        source: ws
        isMandatory: true
        searchClause: AND 1=1        
    query:
      WITH demand AS (
           SELECT 
               dd.consumercode,
               dd.businessservice,
               SUM(dt.taxamount) AS total_demand,
               MAX(dd.taxperiodto) as max_taxperiodto_date
           FROM egbs_demand_v1 dd
           JOIN egbs_demanddetail_v1 dt
             ON dd.id = dt.demandid
           JOIN eg_ws_connection sw
             ON sw.connectionno = dd.consumercode
           WHERE dd.tenantid = $tenantid
             AND dd.businessservice like $connectionType
             AND dd.status = 'ACTIVE'
             AND sw.status = 'Active'
 
         AND  dd.taxperiodto <= $toDate
           GROUP BY dd.consumercode, dd.businessservice
           HAVING SUM(dt.taxamount) <> 0
       ),
       payment AS (
           SELECT 
               bill.consumercode AS connectionno,     
               bill.businessservice AS service,   
               SUM(pd.amountpaid) AS total_amt_paid
           FROM egcl_paymentdetail pd
           INNER JOIN egcl_bill bill 
               ON bill.id = pd.billid 
              AND pd.tenantid = $tenantid
           INNER JOIN egcl_payment payment 
               ON payment.id = pd.paymentid
       
         where pd.receiptdate <= $toDate
             AND bill.businessservice like $connectionType
       and payment.paymentstatus != 'CANCELLED'
           GROUP BY bill.consumercode, bill.businessservice
       )
       SELECT 
           d.consumercode,
           d.businessservice,
           d.total_demand,
            COALESCE(p.total_amt_paid, 0) AS total_amt_paid,
           (d.total_demand - COALESCE(p.total_amt_paid, 0)) AS balance,
           d.max_taxperiodto_date
       FROM demand d
       LEFT JOIN payment p
         ON d.consumercode = p.connectionno
        AND d.businessservice = p.service  

  - reportName: SWTotal_Bill_Generate
    summary: SW Total Bill Generate Report
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: finyear
        label: finyear
        type: string
        source: ws
        total: false
      - name: usagecategory
        label: usagecategory
        type: string
        source: ws
        total: false
      - name: connectionno
        label: Connection No
        type: string
        source: ws
        total: false
      - name: property_id
        label: Property id
        type: string
        source: ws
        total: false    
      - name: billid
        label: Bill Id
        type: string
        source: ws
        total: false
      - name: totalamount
        label: totalamount
        type: string
        source: ws
        total: true
      - name: consumercode
        label: consumercode
        type: string
        source: ws
        total: false    
      - name: localityname
        label: localityname
        type: string
        source: ws
        total: false
      - name: localitycode
        label: localitycode
        type: string
        source: ws
        total: false 
      - name: zonecode
        label: zonecode
        type: string
        source: ws
        total: false 
      - name: blockcode
        label: blockcode
        type: string
        source: ws
        total: false       
      - name: wc_status
        label: wc_status
        type: string
        source: ws
        total: false 
      - name: landarea
        label: landarea
        type: string
        source: ws
        total: false    
      - name: bill_status
        label: bill_status
        type: string
        source: ws
        total: false
    searchParams:
      - name: localityArray
        label: zoneList
        type: boundarylist
        source: pt
        isMandatory: false
        searchClause: AND bm.localitycode IN ($localityArray)    
    query:
      WITH latest_bill AS (
          SELECT 
              bill.*,
              ROW_NUMBER() OVER (
                  PARTITION BY bill.consumercode 
                  ORDER BY bill.fromperiod DESC
              ) AS rn
          FROM egbs_billdetail_v1 bill
          WHERE bill.businessservice = 'SW'
        and bill.tenantid = $tenantid
      )
      SELECT 
          to_char(
              (to_timestamp(lb.fromperiod / 1000) AT TIME ZONE 'Asia/Kolkata'),
              'YYYY-MM'
          ) || '-' ||
          to_char(
              (to_timestamp(lb.toperiod / 1000) AT TIME ZONE 'Asia/Kolkata'),
              'YYYY-MM'
          ) AS finyear,
          pt.usagecategory,
          wc.connectionno,
          wc.property_id,
          lb.billid,
          lb.totalamount,
          lb.consumercode,
        bm.localityname,bm.localitycode,bm.zonecode,bm.blockcode,
          wc.status AS wc_status,
          pt.landarea,
          b.status AS bill_status
      FROM eg_sw_connection wc JOIN eg_pt_property pt  ON wc.property_id = pt.propertyid AND pt.status IN ('ACTIVE', 'PENDINGWS')
      JOIN eg_pt_address  pa ON pt.id = pa.propertyid and pa.tenantid = $tenantid
      JOIN  eg_bndry_mohalla bm  ON pa.locality = bm.localitycode and pa.tenantid = bm.tenantid 
      JOIN latest_bill lb     ON lb.consumercode = wc.connectionno
          AND lb.rn = 1           
      JOIN egbs_bill_v1 b     ON lb.billid = b.id and b.tenantid = $tenantid
      WHERE wc.tenantid = $tenantid
        AND wc.connectionno IS NOT NULL
        AND wc.status = 'Active' 

