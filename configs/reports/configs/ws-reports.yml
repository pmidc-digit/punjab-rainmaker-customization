- reportName: SWTotal_Bill_Generate
  summary: SW Total Bill Generate Report
  version: 1.0.0
  moduleName: rainmaker-ws
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
    - name: finyear
      label: finyear
      type: string
      source: ws
      total: false
    - name: usagecategory
      label: usagecategory
      type: string
      source: ws
      total: false
    - name: connectionno
      label: Connection No
      type: string
      source: ws
      total: false
    - name: property_id
      label: Property id
      type: string
      source: ws
      total: false    
    - name: billid
      label: Bill Id
      type: string
      source: ws
      total: false
    - name: totalamount
      label: totalamount
      type: string
      source: ws
      total: true
    - name: consumercode
      label: consumercode
      type: string
      source: ws
      total: false    
    - name: localityname
      label: localityname
      type: string
      source: ws
      total: false 
    - name: wc_status
      label: wc_status
      type: string
      source: ws
      total: false 
    - name: landarea
      label: landarea
      type: string
      source: ws
      total: false    
    - name: bill_status
      label: bill_status
      type: string
      source: ws
      total: false                                                
  query:
    WITH latest_bill AS (
        SELECT 
            bill.*,
            ROW_NUMBER() OVER (
                PARTITION BY bill.consumercode 
                ORDER BY bill.fromperiod DESC
            ) AS rn
        FROM egbs_billdetail_v1 bill
        WHERE bill.businessservice = 'SW'
      and bill.tenantid = $tenantid
    )
    SELECT 
        to_char(
            (to_timestamp(lb.fromperiod / 1000) AT TIME ZONE 'Asia/Kolkata'),
            'YYYY-MM'
        ) || '-' ||
        to_char(
            (to_timestamp(lb.toperiod / 1000) AT TIME ZONE 'Asia/Kolkata'),
            'YYYY-MM'
        ) AS finyear,
        pt.usagecategory,
        wc.connectionno,
        wc.property_id,
        lb.billid,
        lb.totalamount,
        lb.consumercode,
      bm.localityname,
        wc.status AS wc_status,
        pt.landarea,
        b.status AS bill_status
    FROM eg_sw_connection wc JOIN eg_pt_property pt  ON wc.property_id = pt.propertyid AND pt.status IN ('ACTIVE', 'PENDINGWS')
    JOIN eg_pt_address  pa ON pt.id = pa.propertyid and pa.tenantid = $tenantid
    JOIN  eg_bndry_mohalla bm  ON pa.locality = bm.localitycode and pa.tenantid = bm.tenantid 
    JOIN latest_bill lb     ON lb.consumercode = wc.connectionno
        AND lb.rn = 1           
    JOIN egbs_bill_v1 b     ON lb.billid = b.id and b.tenantid = $tenantid
    WHERE wc.tenantid = $tenantid
      AND wc.connectionno IS NOT NULL
      AND wc.status = 'Active' 
