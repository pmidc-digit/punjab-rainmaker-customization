- reportName: Water_SewerageBillingReport
  decryptionPathId: ULBPTDataDumpReport_V2
  summary: Water Sewerage Billing Report
  version: 1.0.0
  moduleName: rainmaker-ws
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: blockname
    label: blockname
    type: string
    source: ws
    total: false
  - name: localityname
    label: localityname
    type: string
    source: ws
    total: false
  - name: locality
    label: locality
    type: string
    source: ws
    total: false
  - name: status
    label: status
    type: string
    source: ws
    total: false
  - name: service_type
    label: service_type
    type: string
    source: ws
    total: false
  - name: fromDate
    label: fromDate
    type: string
    source: ws
    total: false
  - name: end_date
    label: end_date
    type: string
    source: ws
    total: false
  - name: createddate
    label: createddate
    type: string
    source: ws
    total: false
  - name: connection_count
    label: connection_count
    type: string
    source: ws
    total: false
  searchParams:
  - name: fromDate
    label: fromDate
    type: epoch
    source: pt
    isMandatory: true
    searchClause: AND billingcyclestartdate >= $fromDate
  query: |
    WITH WS_Billing_cte AS (
      -- Water Service Data
      SELECT 
        'Water' AS service_type,
        bm.blockname,
        bm.localityname,
        ws.locality,
        ws.status,
        ws.billingcyclestartdate,
        TO_CHAR((TO_TIMESTAMP(ws.billingcyclestartdate / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS fromDate,
        TO_CHAR((TO_TIMESTAMP(ws.billingcycleenddate / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS end_date,
        TO_CHAR((TO_TIMESTAMP(ws.createdtime / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS createddate,
        COALESCE(conn.connection_count, 0) AS connection_count
      FROM eg_bndry_mohalla bm
      LEFT JOIN eg_ws_scheduler ws
        ON TRIM(ws.locality) = TRIM(bm.localitycode)
        AND ws.tenantid = $tenantid
      INNER JOIN (
        SELECT 
          locality,
          COUNT(connectionno) AS connection_count
        FROM eg_ws_connection
        WHERE tenantid = $tenantid
          AND connectionno IS NOT NULL
          AND status = 'Active'
        GROUP BY locality
      ) conn ON TRIM(conn.locality) = TRIM(bm.localitycode)
    
      UNION ALL
    
      -- Sewerage Service Data
      SELECT 
        'Sewerage' AS service_type,
        bm.blockname,
        bm.localityname,
        sw.locality,
        sw.status,
        sw.billingcyclestartdate,
        TO_CHAR((TO_TIMESTAMP(sw.billingcyclestartdate / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS fromDate,
        TO_CHAR((TO_TIMESTAMP(sw.billingcycleenddate / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS end_date,
        TO_CHAR((TO_TIMESTAMP(sw.createdtime / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS createddate,
        COALESCE(conn.connection_count, 0) AS connection_count
      FROM eg_bndry_mohalla bm
      LEFT JOIN eg_sw_scheduler sw
        ON TRIM(sw.locality) = TRIM(bm.localitycode)
        AND sw.tenantid = $tenantid
      INNER JOIN (
        SELECT 
          locality,
          COUNT(connectionno) AS connection_count
        FROM eg_sw_connection
        WHERE tenantid = $tenantid
          AND connectionno IS NOT NULL
          AND status = 'Active'
        GROUP BY locality
      ) conn ON TRIM(conn.locality) = TRIM(bm.localitycode)
    )
    
    SELECT * FROM WS_Billing_cte where billingcyclestartdate >= $fromDate  

- reportName:  SWDemandDetailReport
  decryptionPathId: ULBPTDataDumpReport_V2
  summary:  SW Demand Detail Report
  version: 1.0.0
  moduleName: rainmaker-ws
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: connectionno
    label: connectionno
    type: string
    source: ws
    total: false
  - name: finyear
    label: finyear
    type: string
    source: ws
    total: false
  - name: status
    label: status
    type: string
    source: ws
    total: false
  - name: demandupdateddate
    label: demandupdateddate
    type: string
    source: ws
    total: false
  - name: taxhead
    label: taxhead
    type: string
    source: ws
    total: false
  - name: taxamt
    label: taxamt
    type: string
    source: ws
    total: false
  - name: taxcoll
    label: taxcoll
    type: string
    source: ws
    total: false
  - name: balance
    label: balance
    type: string
    source: ws
    total: false
  - name: ispaymentcompleted
    label: ispaymentcompleted
    type: string
    source: ws
    total: false
  query: |
    SELECT 
    sw.connectionno,
    COALESCE(to_char((to_timestamp(d.taxperiodfrom/1000) at time zone 'Asia/Kolkata'),'YYYY-MM') || '-' || to_char((to_timestamp(d.taxperiodto/1000) at time zone 'Asia/Kolkata'),'YYYY-MM'), 'N/A') AS Finyear,
    d.status,
    to_timestamp(dd.createdtime/1000) at time zone 'Asia/Kolkata' AS DemandUpdateddate,
    dd.taxheadcode AS taxHead,
    dd.taxamount AS taxamt,
    dd.collectionamount AS taxcoll,
    (dd.taxamount - dd.collectionamount) AS balance,
    d.ispaymentcompleted
    FROM eg_sw_connection sw LEFT JOIN egbs_demand_v1 d ON sw.connectionno = d.consumercode AND d.tenantid = $tenantid AND d.businessservice = 'SW' AND d.taxperiodfrom >= '1704000082000' AND d.status != 'CANCELLED'
    LEFT JOIN egbs_demanddetail_v1 dd ON dd.demandid = d.id WHERE sw.tenantid = $tenantid 
    ORDER BY sw.connectionno;
    
