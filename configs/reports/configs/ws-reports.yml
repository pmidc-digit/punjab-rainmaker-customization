  - reportName: CollectionCountWaterSewerage
    decryptionPathId: ReceiptRegisterShort_V2
    summary: Collection Count WS-SW
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: totalwaterconnections
        label: reports.ws.totalwaterconnections
        type: string
        source: ws
        total: false
      - name: totalsewerageconnections
        label: reports.ws.totalsewerageconnections
        type: string
        source: ws
        total: false
      - name: totalwateractive
        label: reports.ws.totalwateractive
        type: string
        source: ws
        total: false
      - name: totalsewerageactive
        label: reports.ws.totalsewerageactive
        type: string
        source: ws
        total: false
      - name: totalactiveresidentialinwater
        label: reports.ws.totalactiveresidentialinwater
        type: string
        source: ws
        total: false
      - name: totalactiveresidentialinsewerage
        label: reports.ws.totalactiveresidentialinsewerage
        type: string
        source: ws
        total: false
      - name: totalactivenonresidentialinsewerage
        label: reports.ws.totalactivenonresidentialinsewerage
        type: string
        source: ws
        total: false
      - name: totalactivenonresidentialinwater
        label: reports.ws.totalactivenonresidentialinwater
        type: string
        source: ws
        total: false
      - name: totalmeteredconnections
        label: reports.ws.totalmeteredconnections
        type: string
        source: ws
        total: false
      - name: totalexemptedinwater
        label: reports.ws.totalexemptedinwater
        type: string
        source: ws
        total: false
      - name: totalexemptedinsewerage
        label: reports.ws.totalexemptedinsewerage
        type: string
        source: ws
        total: false
      - name: betweenfivemarlawater
        label: reports.ws.betweenfivemarlawater
        type: string
        source: ws
        total: false
      - name: betweenfivemarlasewerage
        label: reports.ws.betweenfivemarlasewerage
        type: string
        source: ws
        total: false
      - name: betweensixmarlawater
        label: reports.ws.betweensixmarlawater
        type: string
        source: ws
        total: false
      - name: betweensixandtenmarlasewerage
        label: reports.ws.betweensixandtenmarlasewerage
        type: string
        source: ws
        total: false
      - name: morethantenmarlawater
        label: reports.ws.morethantenmarlawater
        type: string
        source: ws
        total: false
      - name: morethantenmarlasewerage
        label: reports.ws.morethantenmarlasewerage
        type: string
        source: ws
        total: false
    query: >
      -- Use CTE to force query plan, compute & use CTE later
      SELECT a.totalwaterconnections, b.totalsewerageconnections, d.totalwateractive, e.totalsewerageactive, g.totalactiveresidentialinwater,
      h.totalactiveresidentialinsewerage, i.totalactivenonresidentialinsewerage, j.totalactivenonresidentialinwater, k.totalmeteredconnections,
      l.totalexemptedinwater, m.totalexemptedinsewerage, n.betweenfivemarlawater, o.betweenfivemarlasewerage, p.betweensixmarlawater, q.betweensixandtenmarlasewerage,
      r.morethantenmarlawater, s.morethantenmarlasewerage
      FROM (SELECT COUNT(wc.connectionno) AS totalwaterconnections FROM eg_ws_connection wc WHERE wc.tenantid = $tenantid AND wc.connectionno IS NOT NULL) a,
      (SELECT COUNT(sc.connectionno) AS totalsewerageconnections FROM eg_sw_connection sc WHERE sc.tenantid = $tenantid AND sc.connectionno IS NOT NULL) b,
      (SELECT COUNT(wc.connectionno) AS totalwateractive FROM eg_ws_connection wc WHERE wc.status = 'Active' AND wc.tenantid = $tenantid AND wc.connectionno IS NOT NULL) d,
      (SELECT COUNT(sc.connectionno) AS totalsewerageactive FROM eg_sw_connection sc WHERE sc.status = 'Active' AND sc.tenantid = $tenantid AND sc.connectionno IS NOT NULL) e,
      (SELECT COUNT(wc.connectionno) AS totalactiveresidentialinwater FROM eg_ws_connection wc WHERE wc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE status IN ('ACTIVE', 'PENDINGWS') AND usagecategory IN ('RESIDENTIAL' , 'MIXED')AND tenantid = $tenantid) AND wc.status = 'Active' AND wc.additionaldetails->>'unitUsageType'='RESIDENTIAL' AND wc.tenantid = $tenantid AND wc.connectionno IS NOT NULL) g,
      (SELECT COUNT(sc.connectionno) AS totalactiveresidentialinsewerage FROM eg_sw_connection sc WHERE sc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE status IN ('ACTIVE', 'PENDINGWS') AND usagecategory IN ('RESIDENTIAL','MIXED') AND tenantid = $tenantid) AND sc.status = 'Active' AND sc.tenantid = $tenantid AND sc.additionaldetails->>'unitUsageType'='RESIDENTIAL' OR sc.additionaldetails->>'unitUsageType'='null' AND sc.connectionno IS NOT NULL) h,
      (SELECT COUNT(sc.connectionno) AS totalactivenonresidentialinsewerage FROM eg_sw_connection sc WHERE sc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE status IN ('ACTIVE', 'PENDINGWS') AND usagecategory != 'RESIDENTIAL' AND tenantid = $tenantid) AND sc.status = 'Active' AND sc.tenantid = $tenantid AND sc.connectionno IS NOT NULL) i,
      (SELECT COUNT(wc.connectionno) AS totalactivenonresidentialinwater FROM eg_ws_connection wc WHERE wc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE status IN ('ACTIVE', 'PENDINGWS') AND usagecategory LIKE 'NONRESIDENTIAL%' AND tenantid = $tenantid) AND wc.status = 'Active' AND wc.tenantid = $tenantid AND wc.connectionno IS NOT NULL) j,
      (SELECT COUNT(wc.connectionno) AS totalmeteredconnections FROM eg_ws_connection wc JOIN eg_ws_service ws ON wc.id = ws.connection_id WHERE ws.connectiontype = 'Metered' AND wc.status = 'Active' AND wc.tenantid = $tenantid AND wc.connectionno IS NOT NULL) k,
      (SELECT COUNT(wc.connectionno) AS totalexemptedinwater FROM eg_ws_connection wc WHERE wc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE landarea BETWEEN 0 AND 125 AND status IN ('ACTIVE', 'PENDINGWS') AND usagecategory = 'RESIDENTIAL' AND tenantid = $tenantid) AND wc.status = 'Active' AND wc.tenantid = $tenantid AND wc.connectionno IS NOT NULL) l,
      (SELECT COUNT(sc.connectionno) AS totalexemptedinsewerage FROM eg_sw_connection sc WHERE sc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE landarea BETWEEN 0 AND 125 AND status IN ('ACTIVE', 'PENDINGWS') AND usagecategory = 'RESIDENTIAL' AND tenantid = $tenantid) AND sc.status = 'Active' AND sc.tenantid = $tenantid AND sc.connectionno IS NOT NULL) m,
      (SELECT COUNT(wc.connectionno) AS betweenfivemarlawater FROM eg_ws_connection wc WHERE wc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE landarea BETWEEN 0 AND 125 AND status IN ('ACTIVE', 'PENDINGWS') AND tenantid = $tenantid) AND wc.status = 'Active' AND wc.tenantid = $tenantid AND wc.connectionno IS NOT NULL) n,
      (SELECT COUNT(sc.connectionno) AS betweenfivemarlasewerage FROM eg_sw_connection sc WHERE sc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE landarea BETWEEN 0 AND 125 AND status IN ('ACTIVE', 'PENDINGWS') AND tenantid = $tenantid) AND sc.status = 'Active' AND sc.tenantid = $tenantid AND sc.connectionno IS NOT NULL) o,
      (SELECT COUNT(wc.connectionno) AS betweensixmarlawater FROM eg_ws_connection wc WHERE wc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE landarea BETWEEN 126 AND 250 AND status IN ('ACTIVE', 'PENDINGWS') AND tenantid = $tenantid) AND wc.status = 'Active' AND wc.tenantid = $tenantid AND wc.connectionno IS NOT NULL) p,
      (SELECT COUNT(sc.connectionno) AS betweensixandtenmarlasewerage FROM eg_sw_connection sc WHERE sc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE landarea BETWEEN 126 AND 250 AND status = 'ACTIVE' AND tenantid = $tenantid) AND sc.status = 'Active' AND sc.tenantid = $tenantid AND sc.connectionno IS NOT NULL) q,
      (SELECT COUNT(wc.connectionno) AS morethantenmarlawater FROM eg_ws_connection wc WHERE wc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE landarea >= 251 AND status IN ('ACTIVE', 'PENDINGWS') AND tenantid = $tenantid) AND wc.status = 'Active' AND wc.tenantid = $tenantid AND wc.connectionno IS NOT NULL) r,
      (SELECT COUNT(sc.connectionno) AS morethantenmarlasewerage FROM eg_sw_connection sc WHERE sc.property_id IN 
      (SELECT propertyid FROM eg_pt_property WHERE landarea >= 251 AND status IN ('ACTIVE', 'PENDINGWS') AND tenantid = $tenantid) AND sc.status = 'Active' AND sc.tenantid = $tenantid AND sc.connectionno IS NOT NULL) s

  - reportName: WsDefaulterReport
    summary: Ws Defaulter Report
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig: null
    print:
      pdfPageSize: A1
    sourceColumns:
    - name: consumercode
      label: reports.ws.consumercode
      type: string
      source: ws
      total: false
    - name: usagecategory
      label: reports.ws.usagecategory
      type: string
      source: ws
      total: false
    - name: amtpaid
      label: reports.ws.amtpaid
      type: string
      source: ws
      total: false
    - name: bill_status
      label: reports.ws.bill_status
      type: string
      source: ws
      total: false
    - name: locality
      label: reports.ws.locality
      type: string
      source: ws
      total: false
    - name: payeraddress
      label: reports.ws.payeraddress
      type: string
      source: ws
      total: false
    - name: mobilenumber
      label: reports.ws.mobilenumber
      type: string
      source: ws
      total: false
    - name: payername
      label: reports.ws.payername
      type: string
      source: ws
      total: false
    - name: finyear
      label: reports.ws.finyear
      type: string
      source: ws
      total: false
    searchParams:
    - name: financialYear
      label: Financial Year
      type: string
      source: ws
      isMandatory: true
    - name: minamount
      label: minimum amount
      type: string
      source: ws 
      isMandatory: true
    query: |
         WITH params AS (
         SELECT 
            $financialYear::TEXT AS finyear,
            to_timestamp((split_part($financialYear, '-', 1) || '-04-01'), 'YYYY-MM-DD') AT TIME ZONE 'Asia/Kolkata' AS start_date,
            to_timestamp(((CAST(split_part($financialYear, '-', 2) AS INTEGER) + 2000)::TEXT || '-03-31 23:59:59'), 'YYYY-MM-DD HH24:MI:SS') AT TIME ZONE 'Asia/Kolkata' AS end_date
          ), cte AS (
         SELECT
            pt.usagecategory, wc.connectionno, wc.property_id, wc.locality,
            bill.billid, bill.totalamount, wc.tenantid AS tenantid, bill.consumercode,
            wc.status AS wc_status, pt.landarea, b.payername AS payername, b.status AS bill_status,
            b.payeraddress, b.mobilenumber
         FROM eg_ws_connection wc
         JOIN eg_pt_property pt 
            ON wc.property_id = pt.propertyid
            AND wc.status = 'Active'
            AND pt.status IN ('ACTIVE', 'PENDINGWS')
         INNER JOIN egbs_billdetail_v1 bill 
            ON bill.consumercode = wc.connectionno
            AND wc.status = 'Active'
            AND bill.businessservice = 'WS'
         JOIN egbs_bill_v1 b  ON bill.billid = b.id
         JOIN params p ON TRUE
         WHERE  wc.connectionno IS NOT NULL
            AND bill.businessservice = 'WS'
            AND pt.usagecategory IN ('RESIDENTIAL', 'NONRESIDENTIAL.COMMERCIAL', 'MIXED')
            AND to_timestamp(bill.fromperiod / 1000) AT TIME ZONE 'Asia/Kolkata' BETWEEN p.start_date AND p.end_date
         )SELECT 
         cte.consumercode, params.finyear, cte.usagecategory, SUM(cte.totalamount) AS amtpaid,
         cte.bill_status, cte.locality, cte.payeraddress, cte.mobilenumber, cte.payername
         FROM  cte
         JOIN params ON TRUE
         WHERE  cte.bill_status NOT IN ('PAID', 'CANCELLED', 'EXPIRED')
    groupby: GROUP BY  cte.consumercode,params.finyear, cte.bill_status,cte.payername,
        cte.usagecategory, cte.locality, cte.mobilenumber, cte.payeraddress
        HAVING
        SUM(cte.totalamount) > $minamount


  - reportName: Water_Demand_Report
    summary: Water Demand Report- This report provides the number of water connections and the total demand generated for a specific quarter in a financial year.
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: quarter
        label: reports.ws.quarter
        type: string
        source: ws
        total: false
      - name: distinct_consumercode_count
        label: reports.ws.distinct_consumercode_count
        type: string
        source: ws
        total: true
      - name: UsageType
        label: reports.ws.UsageType
        type: string
        source: ws
        total: false
    searchParams:
      - name: fromfy
        label: From_FY
        type: singlevaluelist
        pattern: 'list://1617129000000:2021,1648665000000:2022,1680201000000:2023,1711823400000:2024,1743359400000:2025'
        source: ws
        isMandatory: true
        searchClause: and 1=1
      - name: tofy
        label: To_FY
        type: singlevaluelist
        pattern: 'list://1648665000000:2022,1680201000000:2023,1711823400000:2024,1743359400000:2025,1774895400000:2026'
        source: ws
        isMandatory: true
        searchClause: and 1=1
    query: |
        WITH quarterly_data AS (
        SELECT
         EXTRACT(YEAR FROM to_timestamp(d1.taxperiodfrom / 1000)) AS year,
          CASE
            WHEN EXTRACT(MONTH FROM to_timestamp(d1.taxperiodfrom / 1000)) BETWEEN 4 AND 6 THEN 'Quarter 1'
            WHEN EXTRACT(MONTH FROM to_timestamp(d1.taxperiodfrom / 1000)) BETWEEN 7 AND 9 THEN 'Quarter 2'
            WHEN EXTRACT(MONTH FROM to_timestamp(d1.taxperiodfrom / 1000)) BETWEEN 10 AND 12 THEN 'Quarter 3'
            ELSE 'Quarter 4'
            END AS quarter,
            to_char(to_timestamp(d1.taxperiodfrom / 1000), 'YYYY-MM-DD') AS tax_period_from_date,
            COUNT(DISTINCT d1.consumercode) AS distinct_consumercode_count,
            SUM(d2.taxamount) AS total_demand_amount,
            SUM(d2.collectionamount) AS total_collected_amount,
            SUM(d2.taxamount - d2.collectionamount ) AS arrears,
            d5.usagecategory AS UsageType
        FROM
        egbs_demand_v1 d1
        LEFT JOIN egbs_demanddetail_v1 d2 ON d1.id = d2.demandid
        LEFT JOIN eg_ws_connection d4 ON d4.connectionno = d1.consumercode
        LEFT JOIN eg_pt_property  d5 ON d4.property_id = d5.propertyid
        WHERE d1.taxperiodfrom::text >= $fromfy and d1.taxperiodfrom::text <= $tofy
        AND d1.tenantid = $tenantid
        AND d1.status != 'CANCELLED'
        AND d4.status = 'Active'
        AND d1.businessservice = 'WS'
        GROUP BY
        year, quarter, tax_period_from_date ,UsageType
        )

        SELECT
        year || '->' || quarter AS quarter,
        tax_period_from_date,
        COALESCE(CAST(total_demand_amount AS TEXT), 'No Tax amount') AS total_demand_amount,
        COALESCE(CAST(total_collected_amount AS TEXT), 'No Collection Amount') AS total_collected_amount,
        COALESCE(CAST(arrears AS TEXT), 'Nill') AS Arrears,
        COALESCE(CAST(distinct_consumercode_count AS TEXT), '0') AS distinct_consumercode_count,
        UsageType
        FROM
        quarterly_data where 1=1

  - reportName: Sewerage_Demand_Report
    summary: Sewerage Demand Report- This report provides the number of Sewerage connections and the total demand generated for a specific quarter in a financial year.
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: quarter
        label: reports.ws.quarter
        type: string
        source: ws
        total: false
      - name: distinct_consumercode_count
        label: reports.ws.distinct_consumercode_count
        type: string
        source: ws
        total: true
      - name: UsageType
        label: reports.ws.UsageType
        type: string
        source: ws
        total: false
    searchParams:
      - name: fromfy
        label: From_FY
        type: singlevaluelist
        pattern: 'list://1617129000000:2021,1648665000000:2022,1680201000000:2023,1711823400000:2024,1743359400000:2025'
        source: ws
        isMandatory: true
        searchClause: and 1=1
      - name: tofy
        label: To_FY
        type: singlevaluelist
        pattern: 'list://1648665000000:2022,1680201000000:2023,1711823400000:2024,1743359400000:2025,1774895400000:2026'
        source: ws
        isMandatory: true
        searchClause: and 1=1    
    query: |
       WITH quarterly_data AS (
       SELECT
        EXTRACT(YEAR FROM to_timestamp(d1.taxperiodfrom / 1000)) AS year,
        CASE
            WHEN EXTRACT(MONTH FROM to_timestamp(d1.taxperiodfrom / 1000)) BETWEEN 4 AND 6 THEN 'Quarter 1'
            WHEN EXTRACT(MONTH FROM to_timestamp(d1.taxperiodfrom / 1000)) BETWEEN 7 AND 9 THEN 'Quarter 2'
            WHEN EXTRACT(MONTH FROM to_timestamp(d1.taxperiodfrom / 1000)) BETWEEN 10 AND 12 THEN 'Quarter 3'
            ELSE 'Quarter 4'
        END AS quarter,
        COUNT(DISTINCT d1.consumercode) AS distinct_consumercode_count,
        d5.usagecategory AS UsageType
       FROM
        egbs_demand_v1 d1
        LEFT JOIN eg_sw_connection d4 ON d4.connectionno = d1.consumercode
        LEFT JOIN eg_sw_service ser ON d4.id = ser.connection_id
        LEFT JOIN eg_pt_property d5 ON d4.property_id = d5.propertyid
        WHERE d1.taxperiodfrom::text >= $fromfy and d1.taxperiodfrom::text <= $tofy
        AND d1.tenantid = $tenantid
        AND d1.status != 'CANCELLED'
        AND d1.businessservice = 'SW' and ser.connectiontype!='Metered'
        AND d5.usagecategory IS NOT NULL
        GROUP BY
        year, quarter, ser.connectiontype, d5.usagecategory
        )
        SELECT
        year || '->' || quarter AS quarter,
        COALESCE(CAST(distinct_consumercode_count AS TEXT), '0') AS distinct_consumercode_count,
        UsageType
        FROM
        quarterly_data
         where 1=1  

  - reportName: Water_SewerageBillingReport
    decryptionPathId: ULBPTDataDumpReport_V2
    summary: Water Sewerage Billing Report
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: blockname
        label: reports.ws.blockname
        type: string
        source: ws
        total: false
      - name: localityname
        label: reports.ws.localityname
        type: string
        source: ws
        total: false
      - name: locality
        label: reports.ws.locality
        type: string
        source: ws
        total: false
      - name: status
        label: reports.ws.status
        type: string
        source: ws
        total: false
      - name: service_type
        label: reports.ws.service_type
        type: string
        source: ws
        total: false
      - name: fromDate
        label: reports.ws.fromDate
        type: string
        source: ws
        total: false
      - name: end_date
        label: reports.ws.end_date
        type: string
        source: ws
        total: false
      - name: createddate
        label: reports.ws.createddate
        type: string
        source: ws
        total: false
      - name: connection_count
        label: reports.ws.connection_count
        type: string
        source: ws
        total: false
    searchParams:
      - name: fromDate
        label: reports.pt.fromDate
        type: epoch
        source: pt
        isMandatory: true
        searchClause: AND billingcyclestartdate >= $fromDate
    query: |
       WITH WS_Billing_cte AS (
         -- Water Service Data
         SELECT 
           'Water' AS service_type,
           bm.blockname,
           bm.localityname,
           ws.locality,
           ws.status,
           ws.billingcyclestartdate,
           TO_CHAR((TO_TIMESTAMP(ws.billingcyclestartdate / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS fromDate,
           TO_CHAR((TO_TIMESTAMP(ws.billingcycleenddate / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS end_date,
           TO_CHAR((TO_TIMESTAMP(ws.createdtime / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS createddate,
           COALESCE(conn.connection_count, 0) AS connection_count
         FROM eg_bndry_mohalla bm
         LEFT JOIN eg_ws_scheduler ws
           ON TRIM(ws.locality) = TRIM(bm.localitycode)
           AND ws.tenantid = $tenantid
         INNER JOIN (
           SELECT 
             locality,
             COUNT(connectionno) AS connection_count
           FROM eg_ws_connection
           WHERE tenantid = $tenantid
             AND connectionno IS NOT NULL
             AND status = 'Active'
           GROUP BY locality
         ) conn ON TRIM(conn.locality) = TRIM(bm.localitycode)
       
         UNION ALL
       
         -- Sewerage Service Data
         SELECT 
           'Sewerage' AS service_type,
           bm.blockname,
           bm.localityname,
           sw.locality,
           sw.status,
           sw.billingcyclestartdate,
           TO_CHAR((TO_TIMESTAMP(sw.billingcyclestartdate / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS fromDate,
           TO_CHAR((TO_TIMESTAMP(sw.billingcycleenddate / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS end_date,
           TO_CHAR((TO_TIMESTAMP(sw.createdtime / 1000) AT TIME ZONE 'Asia/Kolkata'), 'DD-MM-YYYY') AS createddate,
           COALESCE(conn.connection_count, 0) AS connection_count
         FROM eg_bndry_mohalla bm
         LEFT JOIN eg_sw_scheduler sw
           ON TRIM(sw.locality) = TRIM(bm.localitycode)
           AND sw.tenantid = $tenantid
         INNER JOIN (
           SELECT 
             locality,
             COUNT(connectionno) AS connection_count
           FROM eg_sw_connection
           WHERE tenantid = $tenantid
             AND connectionno IS NOT NULL
             AND status = 'Active'
           GROUP BY locality
         ) conn ON TRIM(conn.locality) = TRIM(bm.localitycode)
       )
       
       SELECT * FROM WS_Billing_cte where billingcyclestartdate >= $fromDate

  - reportName: WSQuaterly_Bill_Generate
    summary: Ws Quarterly Bill Generate Report
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig: null
    print:
      pdfPageSize: A1
    sourceColumns:
      - name: consumercode
        label: Consumercode
        type: string
        source: ws
        total: false
      - name: payername
        label: Name
        type: string
        source: ws
        total: false
      - name: Address
        label: payeraddress
        type: string
        source: ws
        total: false
      - name: localityname
        label: Locality
        type: string
        source: ws
        total: false
      - name: blockcode
        label: Ward No
        type: string
        source: ws
        total: false
      - name: zonecode
        label: Zone No
        type: string
        source: ws
        total: false
      - name: mobilenumber
        label: Mobile
        type: string
        source: ws
        total: false
      - name: amtpaid
        label: Bill Amount
        type: string
        source: ws
        total: false
      - name: usagecategory
        label: Category
        type: string
        source: ws
        total: false
      - name: connectiontype
        label: Connection Type
        type: string
        source: ws
        total: false
      - name: landarea
        label: Land Area
        type: string
        source: ws
        total: false
      - name: bill_status
        label: Bill Status
        type: string
        source: ws
        total: false
    searchParams:
      - name: fromDate
        label: From Date
        type: epoch
        source: ws
        isMandatory: true
        searchClause: AND cte.fromperiod >= $fromDate
      - name: toDate
        label: To Date
        type: epoch
        source: ws
        isMandatory: true
        searchClause: AND cte.toperiod <= $toDate       
      - name: usagecategory
        label: Category
        type: singlevaluelist
        pattern: 'list://RESIDENTIAL:RESIDENTIAL,NONRESIDENTIAL.COMMERCIAL:NONRESIDENTIAL.COMMERCIAL,NONRESIDENTIAL.INSTITUTIONAL:NONRESIDENTIAL.INSTITUTIONAL,NONRESIDENTIAL:NONRESIDENTIAL,NONRESIDENTIAL.OTHERS:NONRESIDENTIAL.OTHERS,MIXED:MIXED'
        source: ws
        isMandatory: false
        searchClause: AND cte.usagecategory = $usagecategory
      - name: connectiontype
        label: Connection Type
        type: singlevaluelist
        pattern: list://Non Metered:Non Metered,Metered:Metered
        source: ws
        isMandatory: false
        searchClause: AND cte.connectiontype = $connectiontype
      - name: localityArray
        label: zoneList
        type: boundarylist
        source: ws
        isMandatory: false
        searchClause: AND cte.localitycode IN ($localityArray)
    query: |
       --------Water
       WITH cte AS (
           SELECT
               bill.businessservice,   
               to_char((to_timestamp(bill.fromperiod / 1000) AT TIME ZONE 'Asia/Kolkata'), 'YYYY-MM') 
               || '-' || 
               to_char((to_timestamp(bill.toperiod / 1000) AT TIME ZONE 'Asia/Kolkata'), 'YYYY-MM') AS finyear,
               pt.usagecategory,
               wc.connectionno,
               bill.totalamount,
               bill.consumercode,
               bill.billno,b.payername,b.payeraddress,b.mobilenumber,
               b.status AS bill_status,
               ct.connectiontype,
               ebm.zonename,
               ebm.blockname,
               ebm.zonecode,
               ebm.blockcode,
               ebm.localityname,
               ebm.localitycode,
               pt.landarea,
               bill.fromperiod,
               bill.toperiod,
               pt.propertyid
           FROM eg_ws_connection wc 
           JOIN eg_pt_property pt ON wc.property_id = pt.propertyid 
               AND wc.status IN ('Active', 'Inactive') 
               AND pt.status IN ('ACTIVE', 'PENDINGWS')
           JOIN eg_ws_service ct ON wc.id = ct.connection_id
           JOIN eg_bndry_mohalla ebm ON wc.locality = ebm.localitycode AND wc.tenantid = ebm.tenantid
           JOIN egbs_billdetail_v1 bill 
               ON bill.consumercode = wc.connectionno 
               AND bill.businessservice = 'WS'
           JOIN egbs_bill_v1 b 
               ON bill.billid = b.id
               AND bill.businessservice = 'WS'
           WHERE wc.tenantid = $tenantid
               AND pt.usagecategory IN (
                   'RESIDENTIAL', 'NONRESIDENTIAL.COMMERCIAL',
                   'NONRESIDENTIAL.INSTITUTIONAL', 'MIXED',
                   'NONRESIDENTIAL', 'NONRESIDENTIAL.INDUSTRIAL',
                   'NONRESIDENTIAL.OTHERS'
               )
       )
       
       SELECT
           cte.businessservice,  
           cte.consumercode,
           cte.payername,
           cte.payeraddress,
           cte.mobilenumber,
           cte.usagecategory,
           SUM(cte.totalamount) AS amtpaid,
           cte.bill_status,
           cte.billno,
           cte.connectiontype,
           cte.landarea,
           cte.zonename,
           cte.blockname,
           cte.zonecode,
           cte.blockcode,
           cte.localityname,
           cte.localitycode,
           cte.fromperiod,
           cte.toperiod,
           cte.propertyid,
           STRING_AGG(cte.finyear, ', ') AS finyear
       FROM cte
       WHERE cte.bill_status IN ('PAID', 'ACTIVE', 'PARTIALLY_PAID')
    groupby: GROUP BY cte.businessservice, cte.consumercode,cte.payername,cte.payeraddress,cte.mobilenumber,cte.usagecategory,cte.bill_status,cte.billno,
             cte.connectiontype,cte.landarea,cte.zonename,cte.blockname,cte.zonecode,cte.blockcode,cte.localityname,
             cte.localitycode,cte.fromperiod,cte.toperiod,cte.propertyid 

