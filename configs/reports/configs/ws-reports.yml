        ) 
        --AND wc.status = 'Active' 
        --AND wc.tenantid = $tenantid 
        AND ws.connectiontype = 'Metered'  
        AND wc.connectionno IS NOT NULL)h2,
    
        (SELECT COUNT( distinct wc.connectionno) as MeteredResActiveconn 
