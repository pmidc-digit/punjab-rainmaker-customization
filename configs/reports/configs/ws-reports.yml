- reportName: WSUserwise_Collection_Summary
  decryptionPathId: MiscReceiptULB_v2
  summary:  WS Userwise Collection Summary
  version: 1.0.0
  moduleName: rainmaker-ws
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: collectorname
    label: User Name 
    type: string
    source: ws
    total: false
  - name: Cash
    label: Cash Amount 
    type: string
    source: ws
    total: true
  - name: Cheque
    label: Cheque Amount
    type: string
    source: ws
    total: true
  - name: Card
    label: Card Amount
    type: string
    source: ws
    total: true
  - name: DD
    label: DD Amount
    type: string
    source: ws
    total: true
  - name: NEFT
    label: NEFT Amount
    type: string
    source: ws
    total: true
  - name: OFFLINE_RTGS
    label: RTGS Amount
    type: string
    source: ws
    total: true
  - name: ONLINE
    label: Online Amount (UPI/Netbanking)
    type: string
    source: ws
    total: true
  - name: total_amount
    label: Total Amount
    type: string
    source: ws
    total: true    
  searchParams:
  - name: fromDate
    label: FromDate
    type: epoch
    source: pt
    isMandatory: false
    searchClause: AND pd.receiptdate >= $fromDate
  - name: toDate
    label: ToDate
    type: epoch
    source: pt
    isMandatory: false
    searchClause: AND pd.receiptdate <= $toDate
  - name: collectortype
    label: User Type
    type: singlevaluelist
    pattern: 'list://CITIZEN:CITIZEN,EMPLOYEE:EMPLOYEE,SYSTEM:SYSTEM' 
    source: ws
    isMandatory: false
    searchClause: AND eu.type = $collectortype 
  - name: collectorname
    label: User Name
    type: singlevaluelist
    pattern: 'http://egov-hrms:8080/egov-hrms/employees/_search?tenantId=$tenantid&roles=WS_CEMP,WS_CLERK,SW_CEMP,SW_CLERK|$.Employees[*].user.id|$.Employees[*].user.name'
    source: ws
    wrapper: true
    isMandatory: false
    searchClause: AND eu.id::text = $collectorname
  query: |
    SELECT 
        eu.name AS collectorname,
        eu.type AS collectortype,
        COUNT(*) AS total_count,
        SUM(CASE WHEN payment.paymentmode = 'CASH' THEN pd.amountpaid ELSE 0 END) AS Cash,
        SUM(CASE WHEN payment.paymentmode = 'CHEQUE' THEN pd.amountpaid ELSE 0 END) AS Cheque,
        SUM(CASE WHEN payment.paymentmode = 'OFFLINE_NEFT' THEN pd.amountpaid ELSE 0 END) AS NEFT,
        SUM(CASE WHEN payment.paymentmode = 'CARD' THEN pd.amountpaid ELSE 0 END) AS CARD,
        SUM(CASE WHEN payment.paymentmode = 'OFFLINE_RTGS' THEN pd.amountpaid ELSE 0 END) AS OFFLINE_RTGS,
        SUM(CASE WHEN payment.paymentmode = 'DD' THEN pd.amountpaid ELSE 0 END) AS DD,
        SUM(CASE WHEN payment.paymentmode = 'ONLINE' THEN pd.amountpaid ELSE 0 END) AS ONLINE,
        SUM(CASE WHEN payment.paymentmode = 'QR_CODE' THEN pd.amountpaid ELSE 0 END) AS QR_CODE,
        SUM(CASE WHEN payment.paymentmode = 'POSTAL_ORDER' THEN pd.amountpaid ELSE 0 END) AS POSTAL_ORDER,
        SUM(pd.amountpaid) AS total_amount
    FROM egcl_paymentdetail pd
    INNER JOIN egcl_bill bill 
        ON bill.id = pd.billid
    INNER JOIN eg_user eu 
        ON eu.id::text = pd.createdby::text
    INNER JOIN egcl_payment payment 
        ON payment.id = pd.paymentid
    WHERE pd.tenantid = $tenantid 
      AND bill.status = 'ACTIVE' 
      AND eu.type IN ('EMPLOYEE','CITIZEN','SYSTEM') 
      AND pd.businessservice IN ('WS', 'WS.ONE_TIME_FEE') 
      AND payment.paymentstatus != 'CANCELLED'
  groupby: GROUP BY eu.name,eu.type
  orderby: ORDER BY eu.name 
     
