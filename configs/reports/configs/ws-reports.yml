- reportName: MeterReadingReport
  decryptionPathId: ULBPTDataDumpReport_V2
  summary: Meter Reading Report
  version: 1.0.0
  moduleName: rainmaker-ws
  additionalConfig:
    print:
      pdfPageSize: A1
  sourceColumns:
  - name: connectionno
    label: ConnectionNo
    type: string
    source: ws
    total: false

  - name: oldconnectionno
    label: Old ConnectionNo
    type: string
    source: ws
    total: false    
    
  - name: billingperiod
    label: Billing Period
    type: string
    source: ws
    total: false

  - name: propertyid
    label: Property Id
    type: string
    source: pt
    total: false


  - name: Connection_Status
    label: Connection Status
    type: string
    source: ws
    total: false

  - name: currentReading
    label: Current Reading
    type: string
    source: ws
    total: false

  - name: lastReading
    label: Last Reading
    type: string
    source: ws
    total: false
    
  - name: meterstatus
    label: Meter status
    type: string
    source: ws
    total: false

  - name: connectiontype
    label: Connection Type
    type: string
    source: ws
    total: false    

  - name: ownername
    label: Name
    type: string
    source: ws
    total: false

  - name: guardianname
    label: Guardian Name
    type: string
    source: ws
    total: false    

  - name: address
    label: Address
    type: string
    source: pt
    total: false

  - name: blockname
    label: Block Name
    type: string
    source: pt
    total: false

  - name: zonename
    label: Zone Name
    type: string
    source: pt
    total: false

  - name: zonecode
    label: Zone code
    type: string
    source: pt
    total: false

  - name: propertyusagetype
    label: Property Usagetype
    type: string
    source: pt
    total: false

  - name: propertytype
    label: Property Type
    type: string
    source: pt
    total: false
  searchParams:
  - name: usagecategory
    label: Category
    type: singlevaluelist
    pattern: 'list://RESIDENTIAL:RESIDENTIAL,NONRESIDENTIAL.COMMERCIAL:NONRESIDENTIAL.COMMERCIAL,NONRESIDENTIAL.INSTITUTIONAL:NONRESIDENTIAL.INSTITUTIOL,NRESIDENTIAL:NONRESIDENTIAL,NONRESIDENTIAL.OTHERS:NONRESIDENTIAL.OTHERS,MIXED:MIXED'
    source: ws
    isMandatory: false
    searchClause: AND pt.propertyusagetype = $usagecategory  
  - name: localityArray
    label: zoneList
    type: boundarylist
    source: pt
    wrapper: true
    isMandatory: false
    searchClause: AND pt.localitycode IN ($localityArray)
  query: |
    SELECT 
    conn.connectionno, 
    conn.oldconnectionno,
    MAX(mt.billingperiod) AS billingperiod,  
    MAX(pt.propertyid) AS propertyid,
    MAX(mt.currentreading) AS currentReading,
    MAX(mt.lastreading) AS lastReading,
    MAX(mt.meterstatus) AS meterstatus,
    MAX(ser.connectiontype) AS connectiontype,
    MAX(usr.name) AS ownername,
    MAX(usr.guardian) AS guardianname,
    MAX(pt.address) AS address, 
    MAX(pt.blockname) AS blockname,
    MAX(pt.zonename) AS zonename, 
    MAX(pt.zonecode) AS zonecode, 
    MAX(pt.propertyusagetype) AS propertyusagetype, 
    MAX(conn.status) AS Connection_Status,
    MAX(pt.propertytype) AS propertytype    FROM  eg_ws_meterreading AS mt
    INNER JOIN eg_ws_connection AS conn ON mt.connectionno = conn.connectionno 
    inner join  eg_ws_service ser on conn.id = ser.connection_id
    INNER JOIN report_properties AS pt ON pt.propertyid = conn.property_id  
    inner join eg_pt_property pro on pro.propertyid = pt.propertyid
    inner join eg_pt_owner ow on ow.propertyid = pro.id 
    inner join eg_user usr on usr.uuid = ow.userid 
    WHERE 
        conn.tenantid = $tenantid and ser.connectiontype = 'Metered' and  conn.status = 'Active'
    AND 
        mt.currentreadingdate = (
            SELECT MAX(currentreadingdate)
            FROM eg_ws_meterreading
            WHERE connectionno = mt.connectionno
        )
  groupby: GROUP BY  conn.connectionno, conn.oldconnectionno
  
