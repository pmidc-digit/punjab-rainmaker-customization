    summary: Dead/Dameged Meter Report   
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig: null
    print:
      pdfPageSize: A1
    sourceColumns:
      - name: connectionno
        label: ConnectionNo
        type: string
