        ) 
        --AND wc.status = 'Active' 
        --AND wc.tenantid = $tenantid 
        AND ws.connectiontype = 'Metered'  
        AND wc.connectionno IS NOT NULL)j1,
        
        (SELECT COUNT( distinct wc.connectionno) as TotalMetActiveCommConn 
        FROM eg_ws_connection wc 
        JOIN eg_ws_service ws ON wc.id = ws.connection_id 
        WHERE wc.property_id IN (
            SELECT propertyid 
