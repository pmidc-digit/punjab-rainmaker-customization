        - name: ws_time_penalty
          label: reports.ws.ws_time_penalty
          type: string
          source: ws
          total: false
        - name: user_charge
          label: reports.ws.user_charge
          type: string
          source: ws
          total: false
        - name: pendingamount
          label: reports.ws.pendingamount
          type: string
          source: ws
          total: true
        - name: tenantid
          label: reports.ws.tenantid
          type: string
          source: ws
          total: false
        - name: instrumenttype
          label: reports.ws.paymentMode
          type: string
          source: ws
          total: false
        - name: transactionnumber
          label: reports.ws.ddChequeTransactionNo
          type: string
          source: ws
          total: false
        - name: transactiondate
          label: reports.ws.ddChequeTransactionDate
          type: string
          source: ws
          total: false
        - name: bankname
          label: reports.ws.bankName
          type: string
          source: ws
          total: false
        - name: collectorname
          label: reports.ws.collectorname
          type: string
          source: ws
          total: false
        - name: financialyear
          label: reports.ws.financialyear
          type: string
          source: ws
          total: false
      searchParams:
        - name: fromDate
          label: reports.ws.fromDate
          type: epoch
          source: ws
          isMandatory: true
          searchClause: AND pd.receiptdate >= $fromDate
        - name: toDate
          label: reports.ws.toDate
          type: epoch
          source: ws
          isMandatory: true
          searchClause: AND pd.receiptdate <= $toDate
        - name: financialyear
          label: Financial Year
          type: singlevaluelist
          pattern: http://egov-mdms-service:8080/egov-mdms-service/v1/_get?tenantId=$tenantid&moduleName=egf-master&masterName=FinancialYear|$.MdmsRes.egf-master.FinancialYear.[?(@.module=='PT')].code|$.MdmsRes.egf-master.FinancialYear.[?(@.module=='PT')].name
          source: ws
          wrapper: true
          isMandatory: false
          searchClause: AND concat(to_char((To_timestamp(get_fromperiod(pd.billid)/1000)
            at time Zone 'Asia/Kolkata'),'YYYY'),'-',
            to_char((To_timestamp(get_toperiod(pd.billid)/1000) at time Zone
            'Asia/Kolkata'),'YY')) = $financialyear
        - name: paymentMode
          label: Payment Mode
          type: singlevaluelist
          pattern: list://CARD:Card,CASH:Cash,CHEQUE:Cheque,DD:DD,OFFLINE_NEFT:NEFT,OFFLINE_RTGS:RTGS,ONLINE:Online,POSTAL_ORDER:PostalOrder
          source: ws
          isMandatory: false
          searchClause: AND payment.paymentmode = $paymentMode
    query: >
      -- Use CTE to force query plan, compute & use CTE later

      WITH receipt_breakup AS (
                  SELECT
                    pd.id as pdid,
                 SUM(CASE WHEN taxheadcode LIKE 'WS_ADVANCE_CARRYFORWARD' THEN adjustedamount ELSE 0 END) as Advance, 
      SUM(CASE WHEN taxheadcode LIKE 'WS_CHARGE' THEN adjustedamount ELSE 0 END) as Water_Charge,  SUM(CASE WHEN taxheadcode LIKE 'WS_COMPOSITION_FEE' THEN adjustedamount ELSE 0 END) as Composition_Fee,  SUM(CASE WHEN taxheadcode LIKE 'WS_CONNECTION_FEE' THEN adjustedamount ELSE 0 END) as Connection_Fee,  SUM(CASE WHEN taxheadcode LIKE 'WS_FEE_ROUND_OFF' THEN adjustedamount ELSE 0 END) as Fee_Round_off ,  SUM(CASE WHEN taxheadcode LIKE 'WS_OTHER_FEE' THEN adjustedamount ELSE 0 END) as Other_Fee,  SUM(CASE WHEN taxheadcode LIKE 'WS_ROAD_CUTTING_CHARGE' THEN adjustedamount ELSE 0 END) as Road_Cutting_Charge,  SUM(CASE WHEN taxheadcode LIKE 'WS_Round_Off' THEN adjustedamount ELSE 0 END) as water_round_off,  SUM(CASE WHEN taxheadcode LIKE 'WS_SECURITY_DEPOSIT' THEN adjustedamount ELSE 0 END) as secuirty_dep,  SUM(CASE WHEN taxheadcode LIKE 'WS_SUPERVISION_CHARGE' THEN adjustedamount ELSE 0 END) as supervision_charge,  SUM(CASE WHEN taxheadcode LIKE 'WS_TAX_ADJUSTMENT' THEN adjustedamount ELSE 0 END) as tax_adjustment,  SUM(CASE WHEN taxheadcode LIKE 'WS_TIME_INTEREST' THEN adjustedamount ELSE 0 END) as WS_time_interest,  SUM(CASE WHEN taxheadcode LIKE 'WS_TIME_PENALTY' THEN adjustedamount ELSE 0 END) as Ws_time_penalty,  SUM(CASE WHEN taxheadcode LIKE 'WS_USER_CHARGE' THEN adjustedamount ELSE 0 END) as User_Charge 

                  FROM egcl_billaccountdetail as bad
                  INNER JOIN egcl_billdetial as bd on bd.id = bad.billdetailid
                  INNER JOIN egcl_paymentdetail as pd on pd.billid = bd.billid
                  INNER JOIN egcl_payment as payment on pd.paymentid=payment.id
                  WHERE payment.tenantid =  $tenantid and payment.paymentstatus != 'CANCELLED' and  pd.businessservice='WS.ONE_TIME_FEE'
                  AND pd.receiptdate >= $fromDate AND pd.receiptdate <= $toDate
                  GROUP BY pdid
      )

      SELECT 
        pd.tenantid AS tenantid,
        pd.id,
        pt.applicationno as consumercode,
        to_char((To_timestamp(pd.receiptdate/1000) at time Zone 'Asia/Kolkata'),'DD-MM-YYYY')  AS receiptdate,
        --payment.ifsccode AS bankname,
        concat(bank_branches.bank_name,' ',bank_branches.branch) as bankname,
        receiptnumber,
        payment.totalamountpaid as amount, 
        payment.paymentmode as instrumenttype, 
        payment.transactionnumber,
        concat(to_char((To_timestamp(get_fromperiod(pd.billid)/1000) at time Zone 'Asia/Kolkata'),'YYYY'),'-', to_char((To_timestamp(get_toperiod(pd.billid)/1000) at time Zone 'Asia/Kolkata'),'YY')) as financialyear, 
        to_char((To_timestamp(payment.instrumentdate/1000) at time Zone 'Asia/Kolkata'),'DD-MM-YYYY') AS transactiondate, 
        payment.totaldue - payment.totalamountpaid AS pendingamount,
        --Initcap(case when pt.usagecategory like '%.%' then split_part(pt.usagecategory,'.',2) else pt.usagecategory end) as usagetype,
        (case when eg_user.name is null then '30048|21Fj+c3k2ldB0X3AzIh7atXB' else eg_user.name end)  as collectorname,
        receipt_breakup.*,
        to_char((To_timestamp(pd.manualreceiptdate/1000) at time Zone 'Asia/Kolkata'),'DD-MM-YYYY') AS g8issuedate, 
        manualreceiptnumber as g8receiptno
      FROM egcl_paymentdetail pd Left outer join eg_user on eg_user.id = pd.createdby::INTEGER, egcl_payment payment left outer join bank_branches on bank_branches.ifsc=payment.ifsccode, 

      (select * from (select *,(row_number() over(partition by applicationno order by lastmodifiedtime desc)) as rw from eg_ws_connection  where tenantid=$tenantid) pts where rw=1) as pt,

      receipt_breakup, egcl_bill bill

      where pd.paymentid=payment.id and bill.id=pd.billid and payment.paymentstatus != 'CANCELLED' and pd.businessservice='WS.ONE_TIME_FEE' and payment.tenantid=$tenantid

      and pt.applicationno = bill.consumercode and receipt_breakup.pdid=pd.id ;


    
  - reportName: swseztapcollection
    decryptionPathId: MiscReceiptULB_v2
    summary:  SW EZTAP collection
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: collectorname
        label: reports.ws.collectorname
        type: string
        source: ws
        total: false
      - name: count
        label: reports.ws.count
        type: string
        source: ws
        total: true
      - name: sum
        label: reports.ws.sum
        type: string
        source: ws
        total: true
      - name: paymentmode
        label: reports.ws.paymentmode
        type: string
        source: ws
        total: false
    searchParams:
      - name: fromDate
        label: reports.pt.fromDate
        type: epoch
        source: pt
        isMandatory: false
        searchClause: AND pd.receiptdate >= $fromDate
      - name: toDate
        label: reports.pt.toDate
        type: epoch
        source: pt
        isMandatory: false
        searchClause: AND pd.receiptdate <= $toDate
    query: |
        select
          usr.name as collectorname,
          CASE WHEN paidby = 'EZETAP' THEN 'EZETAP' ELSE CASE WHEN payment.paymentmode!= 'CASH' THEN 'ONLINE' ELSE payment.paymentmode END END as paymentmode,
          SUM(pd.amountpaid) AS sum,
          COUNT(*) AS count
        from egcl_paymentdetail pd 
        inner join egcl_bill as bill on bill.id=pd.billid 
        inner join egcl_payment as payment on payment.id=pd.paymentid 
        inner join eg_user as usr on usr.id=payment.createdby::integer and payment.paymentstatus!='CANCELLED' 
        where payment.tenantid=$tenantid and pd.businessservice in ('WS','WS.ONE_TIME_FEE') and bill.status='ACTIVE'
    groupby: GROUP BY usr.name, CASE WHEN paidby = 'EZETAP' THEN 'EZETAP' ELSE CASE WHEN payment.paymentmode!= 'CASH' THEN 'ONLINE' ELSE payment.paymentmode END END
    orderby: ORDER BY  usr.name desc,CASE WHEN paidby = 'EZETAP' THEN 'EZETAP' ELSE CASE WHEN payment.paymentmode!= 'CASH' THEN 'ONLINE' ELSE payment.paymentmode END END
  
  - reportName: swzonewisecollection
    decryptionPathId: MiscReceiptULB_v2
    summary:  SW Zone Wise collection
    version: 1.0.0
    moduleName: rainmaker-ws
    additionalConfig:
      print:
        pdfPageSize: A1
    sourceColumns:
      - name: collectorname
        label: reports.ws.collectorname
        type: string
        source: ws
        total: false
      - name: count
        label: reports.ws.count
        type: string
        source: ws
        total: true
      - name: sum
        label: reports.ws.sum
        type: string
        source: ws
        total: true
      - name: paymentmode
        label: reports.ws.paymentmode
        type: string
        source: ws
        total: false
    searchParams:
      - name: fromDate
        label: reports.pt.fromDate
        type: epoch
        source: pt
        isMandatory: false
        searchClause: AND pd.receiptdate >= $fromDate
      - name: toDate
        label: reports.pt.toDate
        type: epoch
        source: pt
        isMandatory: false
        searchClause: AND pd.receiptdate <= $toDate
    query: |
        -- Use CTE to force query plan, compute & use CTE later 
        SELECT epd.tenantid, ep.paymentmode,sum(epd.amountpaid) as totalamount, ebm.zonename, usr.name AS collectorname
          FROM egcl_paymentdetail epd JOIN egcl_payment ep ON epd.paymentid = ep.id JOIN egcl_bill eb ON epd.billid = eb.id JOIN eg_sw_connection sw ON eb.consumercode = sw.applicationno
        JOIN eg_pt_property pt on (sw.property_id=pt.propertyid and pt.status!='INACTIVE')
        JOIN eg_user as usr ON usr.id=ep.createdby::integer and ep.paymentstatus!='CANCELLED'
        JOIN eg_pt_address pta on (pta.propertyid=pt.id)
        JOIN eg_bndry_mohalla ebm ON pta.locality = ebm.localitycode
        WHERE sw.tenantid = $tenantid and eb.status='ACTIVE'
        AND epd.businessservice in ('SW.ONE_TIME_FEE','SW')
    groupby: GROUP BY epd.tenantid,ep.paymentmode,ebm.zonename,usr.name

