          and status IN ('ACTIVE', 'PENDINGWS') 
              AND usagecategory IN ('RESIDENTIAL') 
              AND tenantid = $tenantid
        ) 
        AND wc.status = 'Active' 
        --AND wc.tenantid = $tenantid 
        AND ws.connectiontype = 'Metered'  
        AND wc.connectionno IS NOT NULL)h3,
        
           
           ------under 5 Marla Comm
           
           (SELECT COUNT(wc.connectionno) AS totalCommwater
             FROM eg_ws_connection wc 
             WHERE wc.property_id IN 
                 (SELECT propertyid 
                  FROM eg_pt_property 
                  WHERE landarea >=0 
