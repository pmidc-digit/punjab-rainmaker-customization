- reportName: WSSWCancelledReceiptRegister_V2
  decryptionPathId: CancelledReceiptRegister_V2
  summary: Receipt Register for cancelled Receipts
  version: 1.0.0
  moduleName: rainmaker-ws
  additionalConfig:
    print:
      pdfPageSize: "A1"
  sourceColumns:
  - name: receiptnumber
    label: reports.ws.receiptNo
    type: string
    source: ws
    total: false
  - name: receiptdate
    label: reports.ws.receiptDate
    type: string
    source: ws
    total: false
  - name: g8issuedate
    label: reports.ws.g8issuedate
    type: string
    source: ws
    total: false
  - name: g8receiptno
    label: reports.ws.g8receiptno
    type: string
    source: ws
    total: false  
  - name: amount
    label: reports.ws.amount
    type: string
    source: ws
    total: true
  - name: consumercode
    label: reports.ws.consumercode
    type: string
    source: ws
    total: false
  - name: instrumenttype
    label: reports.ws.paymentMode
    type: string
    source: ws
    total: false
  - name: transactionnumber
    label: reports.ws.ddChequeTransactionNo
    type: string
    source: ws
    total: false
  - name: transactiondate
    label: reports.ws.ddChequeTransactionDate
    type: string
    source: ws
    total: false
  - name: bankname
    label: reports.ws.bankName
    type: string
    source: ws
    total: false
  - name: collectorname
    label: reports.ws.collectorname
    type: string
    source: ws
    total: false
  - name: status
    label: reports.ws.status
    type: string
    source: ws
    total: false
  searchParams:
  - name: fromDate
    label: reports.pt.fromDate
    type: epoch
    source: pt
    isMandatory: false
    searchClause: AND pd.receiptdate >= $fromDate
  - name: toDate
    label: reports.pt.toDate
    type: epoch
    source: pt
    isMandatory: false
    searchClause: AND pd.receiptdate <= $toDate
  query: |
      -- Use CTE to force query plan, compute & use CTE later
      WITH receipt_breakup AS (
                  SELECT
                    pd.id as pdid,
                    SUM(CASE WHEN taxheadcode = 'PT_ADHOC_PENALTY' THEN adjustedamount ELSE 0 END) as adhocpenalty, 
                    SUM(CASE WHEN taxheadcode = 'PT_ADHOC_REBATE' THEN adjustedamount ELSE 0 END) as adhocrebate, 
                    SUM(CASE WHEN taxheadcode = 'PT_FIRE_CESS' THEN adjustedamount ELSE 0 END) as firecess, 
                    SUM(CASE WHEN taxheadcode = 'PT_CANCER_CESS' THEN adjustedamount ELSE 0 END) as cancercess, 
                    SUM(CASE WHEN taxheadcode = 'PT_TIME_INTEREST' THEN adjustedamount ELSE 0 END) as interest, 
                    SUM(CASE WHEN taxheadcode = 'PT_TIME_PENALTY' THEN adjustedamount ELSE 0 END) as penalty, 
                    SUM(CASE WHEN taxheadcode = 'PT_TIME_REBATE' THEN adjustedamount ELSE 0 END) as rebate,
                    SUM(CASE WHEN taxheadcode = 'PT_TAX' THEN bad.amount ELSE 0 END) as propertytax,
                    SUM(CASE WHEN taxheadcode = 'PT_TAX' THEN adjustedamount ELSE 0 END) as paidpropertytax, 
                    (SUM(CASE WHEN taxheadcode = 'PT_UNIT_USAGE_EXEMPTION' THEN bad.amount ELSE 0 END)
                    + SUM(CASE WHEN taxheadcode = 'PT_OWNER_EXEMPTION' THEN bad.amount ELSE 0 END) ) as exemption,
                    (SUM(CASE WHEN taxheadcode = 'PT_ROUNDOFF' THEN adjustedamount ELSE 0 END)
                    + SUM(CASE WHEN taxheadcode = 'PT_DECIMAL_CEILING_DEBIT' THEN adjustedamount ELSE 0 END)
                    + SUM(CASE WHEN taxheadcode = 'PT_DECIMAL_CEILING_CREDIT' THEN adjustedamount ELSE 0 END)) as adjustment
                  FROM egcl_billaccountdetail as bad
                  INNER JOIN egcl_billdetial as bd on bd.id = bad.billdetailid
                  INNER JOIN egcl_paymentdetail as pd on pd.billid = bd.billid
                  INNER JOIN egcl_payment as payment on pd.paymentid=payment.id
                  WHERE payment.tenantid = $tenantid and payment.paymentstatus = 'CANCELLED' and  pd.businessservice in ('WS','SW','WS.ONE_TIME_FEE','SW.ONE_TIME_FEE')
                  GROUP BY pdid
      )
      SELECT 
        pd.tenantid AS tenantid,
        pd.id,
        bill.consumercode as consumercode,
        to_char((To_timestamp(pd.receiptdate/1000) at time Zone 'Asia/Kolkata'),'DD-MM-YYYY')  AS receiptdate,
        --payment.ifsccode AS bankname,
        concat(bank_branches.bank_name,' ',bank_branches.branch) as bankname,
        receiptnumber,
        payment.totalamountpaid as amount,
        payment.instrumentstatus as status,
        payment.paymentmode as instrumenttype, 
        payment.transactionnumber,
        concat(to_char((To_timestamp(get_fromperiod(pd.billid)/1000) at time Zone 'Asia/Kolkata'),'YYYY'),'-', to_char((To_timestamp(get_toperiod(pd.billid)/1000) at time Zone 'Asia/Kolkata'),'YY')) as financialyear, 
        to_char((To_timestamp(payment.transactiondate/1000) at time Zone 'Asia/Kolkata'),'DD-MM-YYYY') AS transactiondate, 
        payment.totaldue - payment.totalamountpaid AS pendingamount,
        --Initcap(case when pt.usagecategory like '%.%' then split_part(pt.usagecategory,'.',2) else pt.usagecategory end) as usagetype,
        (case when eg_user.name is null then '30048|21Fj+c3k2ldB0X3AzIh7atXB' else eg_user.name end)  as collectorname,
        receipt_breakup.*,
        to_char((To_timestamp(pd.manualreceiptdate/1000) at time Zone 'Asia/Kolkata'),'DD-MM-YYYY') AS g8issuedate, 
        manualreceiptnumber as g8receiptno,
        bill.additionaldetails
      FROM egcl_paymentdetail pd Left outer join eg_user on eg_user.id = pd.createdby::INTEGER, egcl_payment payment left outer join bank_branches on bank_branches.ifsc=payment.ifsccode, receipt_breakup, egcl_bill bill
      --,(select string_agg(distinct propertyid,',') as propertyid, string_agg(distinct locality,',') as locality from eg_pt_address where tenantid=$tenantid group by propertyid ) pt_addr
      where pd.paymentid=payment.id and bill.id=pd.billid and payment.paymentstatus = 'CANCELLED' and pd.businessservice in ('WS','SW','WS.ONE_TIME_FEE','SW.ONE_TIME_FEE') and payment.tenantid=$tenantid 
      --and pt.propertyid = bill.consumercode 
      and receipt_breakup.pdid=pd.id 
      --and pt_addr.propertyid=pt.id 
  orderby: ORDER BY pd.receiptdate DESC;

