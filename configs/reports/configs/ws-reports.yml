      - name: balance
        label: reports.ws.balance
        type: string
        source: ws
        total: true
      - name: ispaymentcompleted
        label: reports.ws.ispaymentcompleted
        type: string
        source: ws
        total: false
    searchParams:
      - name: financialYear
        label: Financial Year
        type: singlevaluelist
        pattern: 'list://1585699200000|1617215399000:FY 2020-21,1617235200000|1648751399000:FY 2021-22,1648771200000|1680287399000:FY 2022-23,1680307200000|1711909799000:FY 2023-24,1711929600000|1743445799000:FY 2024-25,1743465600000|1774981799000:FY 2025-26'
        source: ws
        isMandatory: true
        searchClause: AND d.taxperiodfrom >= CAST(split_part($financialYear, '|', 1) AS BIGINT) AND d.taxperiodto <= CAST(split_part($financialYear, '|', 2) AS BIGINT)
    query: >
      select d.consumercode, sw.status connecitonstatus , ep.usagecategory, ep.landarea plotsize, ep.propertyid , ep.status propertystatus,  to_char((To_timestamp(d.taxperiodfrom/1000) at time Zone 'Asia/Kolkata'),'YYYY-MM') ||'-'|| to_char((To_timestamp(d.taxperiodto/1000) at time Zone 'Asia/Kolkata'),'YYYY-MM') as finyear,
      d.status demandstauts,  dd.taxheadcode, dd.taxamount as taxamt, dd.collectionamount as taxcoll, (dd.taxamount - dd.collectionamount) balance, d.ispaymentcompleted 
      from egbs_demanddetail_v1 dd, egbs_demand_v1 d , eg_ws_connection sw ,  eg_pt_property ep
      where dd.demandid=d.id 
      and d.status!='CANCELLED'
      and d.businessservice='WS'
      and dd.tenantid = $tenantid
      AND sw.connectionno = d.consumercode
      and sw.connectionno IS NOT NULL
      and sw.property_id = ep.propertyid 
      and ep.status != 'INACTIVE'
    orderby: order by d.consumercode, d.taxperiodfrom desc

