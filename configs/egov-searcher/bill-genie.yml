          - name: toperiod
            isMandatory: false
            jsonPath: $.searchCriteria.toPeriod
            operator: GE
          - name: b.status
            isMandatory: false
            jsonPath: $.searchCriteria.billActive
          - name: conn.property_id
            isMandatory: false
            jsonPath: $.searchCriteria.propertyId
      output:
        jsonFormat:
          ResponseInfo: {}
          Bills: []
