          ad.billdetail AS ad_billdetail, ad.glcode AS ad_glcode, ad.orderno AS
          ad_orderno, ad.accountdescription AS ad_accountdescription, ad.amount
          AS ad_amount, ad.adjustedamount AS ad_adjustedamount, ad.taxheadcode
          AS ad_taxheadcode, ad.demanddetailid, ad.isactualdemand AS
          ad_isactualdemand, ad.purpose AS ad_purpose, ad.additionaldetails as
