 - name: rentandleasebills
   isCustomerRowMapEnabled: true
   rowMapperKey: billsearch
   query:
    baseQuery: >-
      with bill_data as ( SELECT allot.status as
      conn_status,allot.property_id as pid,allot.application_number as
      application_no,allot.additional_details as conn_add,b.id AS b_id,
      b.mobilenumber, b.tenantid AS b_tenantid, b.payername AS b_payername,
      b.payeraddress AS b_payeraddress, b.payeremail AS b_payeremail,
      b.isactive AS b_isactive, b.iscancelled AS b_iscancelled, b.createdby
      AS b_createdby, b.status as b_status, b.filestoreid AS b_filestoreid,
      b.createddate AS b_createddate, b.lastmodifiedby AS b_lastmodifiedby,
      b.lastmodifieddate AS b_lastmodifieddate, bd.id AS bd_id, bd.billid AS
      bd_billid, bd.tenantid AS bd_tenantid, bd.businessservice AS
      bd_businessservice, bd.demandid, bd.fromperiod, bd.toperiod, bd.billno
      AS bd_billno, bd.billdate AS bd_billdate, bd.consumercode AS
      bd_consumercode, bd.consumertype AS bd_consumertype,
      bd.billdescription AS bd_billdescription, bd.displaymessage AS
      bd_displaymessage, bd.minimumamount AS bd_minimumamount,
      bd.totalamount AS bd_totalamount, bd.callbackforapportioning AS
      bd_callbackforapportioning, bd.expirydate AS bd_expirydate,
      bd.partpaymentallowed AS bd_partpaymentallowed, bd.isadvanceallowed as
      bd_isadvanceallowed, bd.collectionmodesnotallowed AS
      bd_collectionmodesnotallowed, bd.createddate as bd_createddate,
      b.additionaldetails as b_additionaldetails,  bd.additionaldetails as
      bd_additionaldetails, ad.id AS ad_id, ad.tenantid AS ad_tenantid,
      ad.billdetail AS ad_billdetail, ad.glcode AS ad_glcode, ad.orderno AS
      ad_orderno, ad.accountdescription AS ad_accountdescription, ad.amount
      AS ad_amount, ad.adjustedamount AS ad_adjustedamount, ad.taxheadcode
      AS ad_taxheadcode, ad.demanddetailid, ad.isactualdemand AS
      ad_isactualdemand, ad.purpose AS ad_purpose, ad.additionaldetails as
      ad_additionaldetails, NULL as ptadd_doorNo, NULL as ptadd_landmark, NULL as ptadd_city, NULL as ptadd_pincode, NULL as ptadd_locality, NULL as ptadd_street, NULL as ptadd_region, NULL as ptadd_plotno, NULL as ptadd_buildingname, NULL as ptadd_district, NULL as ptadd_state, NULL as ptadd_latitude, NULL as ptadd_longitude, usr.uuid as ptown_userid

      FROM (SELECT b_in.*, (b_in.mobilenumber || ',' || COALESCE(allot_in.additional_details->>'alternateMobileNumber', '')) as all_mobiles FROM egbs_bill_v1 b_in INNER JOIN egbs_billdetail_v1 bd_in ON b_in.id = bd_in.billid AND b_in.tenantid = bd_in.tenantid LEFT JOIN eg_rl_allotment allot_in ON bd_in.consumercode = allot_in.application_number) b INNER JOIN egbs_billdetail_v1 bd ON b.id = bd.billid AND b.tenantid = bd.tenantid INNER JOIN egbs_billaccountdetail_v1 ad ON bd.id = ad.billdetail AND bd.tenantid = ad.tenantid INNER JOIN eg_rl_allotment allot ON bd.consumercode = allot.application_number INNER JOIN eg_rl_owner_info owner ON owner.allotment_id = allot.id INNER JOIN eg_user usr ON owner.user_uuid = usr.uuid $where and allot.status IN ('PENDING_FOR_PAYMENT','APPROVED'))
      select * from bill_data inner join (select max(b_createddate) as maxcreateddate, bd_consumercode from bill_data group by bd_consumercode) as max ON max.maxcreateddate=b_createddate
   searchParams:
    condition: AND
    params:
    - name: b.tenantid
      isMandatory: true
      jsonPath: $.searchCriteria.tenantId
    - name: bd.consumercode
      isMandatory: false
      jsonPath: $.searchCriteria.consumerCode
      operator: =
    - name: bd.businessservice
      isMandatory: false
      jsonPath: $.searchCriteria.businesService
    - name: b.all_mobiles
      isMandatory: false
      operator: LIKE
      jsonPath: $.searchCriteria.mobileNumber
    - name: bd.billno
      isMandatory: false
