          - name: bd.consumercode
            isMandatory: false
            jsonPath: $.searchCriteria.consumerCode
            operator: =
          - name: bd.businessservice
            isMandatory: false
            jsonPath: $.searchCriteria.businesService
          - name: b.mobilenumber
            isMandatory: false
            jsonPath: $.searchCriteria.mobileNumber
          - name: bd.billno
            isMandatory: false
            operator: =
            jsonPath: $.searchCriteria.billNo
          - name: ptadd.locality
            isMandatory: false
            jsonPath: $.searchCriteria.locality
          - name: fromperiod
            isMandatory: false
            jsonPath: $.searchCriteria.fromPeriod
            operator: LE
          - name: toperiod
            isMandatory: false
            jsonPath: $.searchCriteria.toPeriod
            operator: GE
          - name: b.status
            isMandatory: false
            jsonPath: $.searchCriteria.billActive
          - name: conn.property_id
            isMandatory: false
            jsonPath: $.searchCriteria.propertyId
      output:
        jsonFormat:
          ResponseInfo: {}
          Bills: []
        outJsonPath: $.Bills
        responseInfoPath: $.ResponseInfo
