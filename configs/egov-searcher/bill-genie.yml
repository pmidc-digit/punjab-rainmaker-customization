    - name: integratedbills
      isCustomerRowMapEnabled: true
      rowMapperKey: billsearch
      query:
        baseQuery: >-
          WITH latest_meter AS (
            SELECT DISTINCT ON (mr.connectionno)
              mr.connectionno                     AS mr_connectionno,
              mr.lastreading                      AS mr_lastreading,
              mr.lastreadingdate                  AS mr_lastreadingdate,
              mr.currentreading                   AS mr_currentreading,
              mr.currentreadingdate               AS mr_currentreadingdate,
              mr.consumption                      AS mr_consumption,
              mr.meterstatus                      AS mr_meterstatus,
              mr.billingperiod                    AS mr_billingperiod
            FROM eg_ws_meterreading mr
            ORDER BY mr.connectionno, mr.currentreadingdate DESC
          ),
          bill_data AS (
            SELECT DISTINCT ON (ad.id)
              conn.status AS conn_status,
              conn.property_id AS propertyId,
              conn.oldConnectionNo AS oldPropertyId,
              conn.additionaldetails AS conn_add,
              pt.surveyid AS ledger_no,
              pt.landArea AS pt_plotsize,
              pt.usageCategory AS pt_usage,
              lm.mr_connectionno,
              lm.mr_lastreading,
              lm.mr_lastreadingdate,
              lm.mr_currentreading,
              lm.mr_currentreadingdate,
              lm.mr_consumption,
              lm.mr_meterstatus,
              lm.mr_billingperiod,

              b.id AS b_id,
              b.mobilenumber,
              b.tenantid AS b_tenantid,
              b.payername AS b_payername,
              b.payeraddress AS b_payeraddress,
              b.payeremail AS b_payeremail,
              b.isactive AS b_isactive,
              b.iscancelled AS b_iscancelled,
              b.createdby AS b_createdby,
              b.status AS b_status,
              b.filestoreid AS b_filestoreid,
              b.createddate AS b_createddate,
              b.lastmodifiedby AS b_lastmodifiedby,
              b.lastmodifieddate AS b_lastmodifieddate,

              bd.id AS bd_id,
              bd.billid AS bd_billid,
              bd.tenantid AS bd_tenantid,
              bd.businessservice AS bd_businessservice,
              bd.demandid,
              bd.fromperiod,
              bd.toperiod,
              bd.billno AS bd_billno,
              bd.billdate AS bd_billdate,
              bd.consumercode AS bd_consumercode,
              bd.consumertype AS bd_consumertype,
              bd.billdescription AS bd_billdescription,
              bd.displaymessage AS bd_displaymessage,
              bd.minimumamount AS bd_minimumamount,
              bd.totalamount AS bd_totalamount,
              bd.callbackforapportioning AS bd_callbackforapportioning,
              bd.expirydate AS bd_expirydate,
              bd.partpaymentallowed AS bd_partpaymentallowed,
              bd.isadvanceallowed AS bd_isadvanceallowed,
              bd.collectionmodesnotallowed AS bd_collectionmodesnotallowed,
              bd.createddate AS bd_createddate,
              b.additionaldetails AS b_additionaldetails,
              bd.additionaldetails AS bd_additionaldetails,

              ad.id AS ad_id,
              ad.tenantid AS ad_tenantid,
              ad.billdetail AS ad_billdetail,
              ad.glcode AS ad_glcode,
              ad.orderno AS ad_orderno,
              ad.accountdescription AS ad_accountdescription,
              ad.amount AS ad_amount,
              ad.adjustedamount AS ad_adjustedamount,
              ad.taxheadcode AS ad_taxheadcode,
              ad.demanddetailid,
              ad.isactualdemand AS ad_isactualdemand,
              ad.purpose AS ad_purpose,
              ad.additionaldetails AS ad_additionaldetails,

              ptadd.doorNo AS ptadd_doorNo,
              ptadd.landmark AS ptadd_landmark,
              ptadd.city AS ptadd_city,
              ptadd.pincode AS ptadd_pincode,
              ptadd.locality AS ptadd_locality,
              ptown.userid AS ptown_userid
            FROM egbs_bill_v1 b
            INNER JOIN egbs_billdetail_v1 bd
              ON b.id = bd.billid
            AND b.tenantid = bd.tenantid
            AND b.status = 'ACTIVE'
            INNER JOIN egbs_billaccountdetail_v1 ad
              ON bd.id = ad.billdetail
            AND bd.tenantid = ad.tenantid
            INNER JOIN eg_ws_connection conn
              ON bd.consumercode = conn.connectionno
            LEFT JOIN latest_meter lm
              ON lm.mr_connectionno = conn.connectionno
            INNER JOIN eg_pt_property pt
              ON conn.property_id = pt.propertyid
            INNER JOIN eg_pt_address ptadd
              ON ptadd.propertyid = pt.id
            INNER JOIN eg_pt_owner ptown
              ON ptown.propertyid = pt.id
            $where and conn.status = 'Active'
              AND b.status = 'ACTIVE'
              AND bd.businessservice IN ('WS','SW')
            ORDER BY ad.id, b.createddate DESC
          )
          SELECT bd.*, max.maxcreateddate, max.business
          FROM bill_data bd
          INNER JOIN (
            SELECT
              MAX(b_createddate) AS maxcreateddate,
              bd_businessservice AS business
            FROM bill_data
            GROUP BY bd_businessservice
          ) AS max
            ON max.business = bd.bd_businessservice
      searchParams:
        condition: AND
        params:
          - name: b.tenantid
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId
          - name: bd.consumercode
            isMandatory: false
            jsonPath: $.searchCriteria.consumerCode
          - name: b.mobilenumber
            isMandatory: false
            jsonPath: $.searchCriteria.mobileNumber
          - name: bd.billno
            isMandatory: false
            jsonPath: $.searchCriteria.billNo
          - name: ptadd.locality
            isMandatory: false
            jsonPath: $.searchCriteria.locality
          - name: fromperiod
            isMandatory: false
            jsonPath: $.searchCriteria.fromPeriod
            operator: LE
          - name: toperiod
            isMandatory: false
            jsonPath: $.searchCriteria.toPeriod
            operator: GE
          - name: b.status
            isMandatory: false
            jsonPath: $.searchCriteria.billActive
      output:
        jsonFormat:
          ResponseInfo: {}
          Bills: []
        outJsonPath: $.Bills
        responseInfoPath: $.ResponseInfo
