    - name: groupbills
      isCustomerRowMapEnabled: true
      rowMapperKey: billsearch
      query:
       baseQuery: >-
          WITH conn_data AS (
          SELECT 
           conn.connectionno,conn.status AS conn_status,conn.property_id AS pid, conn.oldConnectionNo AS oldpid,
           conn.additionaldetails AS conn_add,pt.id AS pt_id,ptadd.doorNo AS ptadd_doorNo,ptadd.landmark AS ptadd_landmark,
           ptadd.city AS ptadd_city, ptadd.pincode AS ptadd_pincode,ptadd.locality AS ptadd_locality, ptown.userid AS ptown_userid
          FROM 
           eg_ws_connection conn
           INNER JOIN eg_pt_property pt ON conn.property_id = pt.propertyid
           INNER JOIN eg_pt_address ptadd ON ptadd.propertyid = pt.id
           INNER JOIN eg_pt_owner ptown ON ptown.propertyid = pt.id
          WHERE 
           conn.status = 'Active' AND 
           conn.additionaldetails->>'groups' = $groups AND 
           conn.tenantid = $tenantid
           ),
          bill_data AS (
          SELECT 
            conn_data.*, b.id AS b_id, b.mobilenumber,b.tenantid AS b_tenantid,b.payername AS b_payername,
            b.payeraddress AS b_payeraddress,b.payeremail AS b_payeremail,b.isactive AS b_isactive,b.iscancelled AS b_iscancelled,
            b.createdby AS b_createdby,b.status AS b_status,b.filestoreid AS b_filestoreid, b.createddate AS b_createddate,
            b.lastmodifiedby AS b_lastmodifiedby, b.lastmodifieddate AS b_lastmodifieddate,bd.id AS bd_id, bd.billid AS bd_billid, bd.tenantid AS bd_tenantid,
            bd.businessservice AS bd_businessservice, bd.demandid,bd.fromperiod, bd.toperiod, bd.billno AS bd_billno, bd.billdate AS bd_billdate,
            bd.consumercode AS bd_consumercode, bd.consumertype AS bd_consumertype,bd.billdescription AS bd_billdescription, bd.displaymessage AS bd_displaymessage,
            bd.minimumamount AS bd_minimumamount, bd.totalamount AS bd_totalamount,bd.callbackforapportioning AS bd_callbackforapportioning,
            bd.expirydate AS bd_expirydate, bd.partpaymentallowed AS bd_partpaymentallowed,bd.isadvanceallowed AS bd_isadvanceallowed,
            bd.collectionmodesnotallowed AS bd_collectionmodesnotallowed,bd.createddate AS bd_createddate, b.additionaldetails AS b_additionaldetails,
            bd.additionaldetails AS bd_additionaldetails, ad.id AS ad_id,ad.tenantid AS ad_tenantid, ad.billdetail AS ad_billdetail,
            ad.glcode AS ad_glcode, ad.orderno AS ad_orderno,ad.accountdescription AS ad_accountdescription, ad.amount AS ad_amount,
            ad.adjustedamount AS ad_adjustedamount, ad.taxheadcode AS ad_taxheadcode,ad.demanddetailid, ad.isactualdemand AS ad_isactualdemand,
            ad.purpose AS ad_purpose, ad.additionaldetails AS ad_additionaldetails
          FROM 
            conn_data
            INNER JOIN egbs_bill_v1 b ON conn_data.connectionno = b.consumercode
            INNER JOIN egbs_billdetail_v1 bd ON b.id = bd.billid AND b.tenantid = bd.tenantid
            INNER JOIN egbs_billaccountdetail_v1 ad ON bd.id = ad.billdetail AND bd.tenantid = ad.tenantid
          WHERE 
            bd.businessservice = $businessservice AND 
            b.tenantid = $tenantid
             ),
          latest_bills AS (
            SELECT 
               MAX(b_createddate) AS maxcreateddate, bd_consumercode
             FROM bill_data
             GROUP BY bd_consumercode
                 )
             SELECT *
             FROM bill_data
             INNER JOIN latest_bills ON latest_bills.maxcreateddate = bill_data.b_createddate AND 
                latest_bills.bd_consumercode = bill_data.bd_consumercode;
      searchParams:
        condition: AND 
        params:
          - name: b.tenantid
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId
          - name: conn.additionaldetails->>'groups'
            isMandatory: true
            jsonPath: $.searchCriteria.groups
          - name: bd.businessservice
            isMandatory: true
            jsonPath: $.searchCriteria.businessservice
      output:
        jsonFormat:
          ResponseInfo: {}
          Bills: []
        outJsonPath: $.Bills
        responseInfoPath: $.ResponseInfo
      

