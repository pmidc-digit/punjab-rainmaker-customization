          - name: bd.billno
            isMandatory: false
            operator: =
            jsonPath: $.searchCriteria.billNo
          - name: ptadd.locality
            isMandatory: false
            jsonPath: $.searchCriteria.locality
          - name: fromperiod
            isMandatory: false
            jsonPath: $.searchCriteria.fromPeriod
