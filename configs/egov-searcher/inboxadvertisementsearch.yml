            operator: IN
          - name: booking.booking_no
            isMandatory: false
            jsonPath: $.searchCriteria.applicationNumber
          - name: pi.businessservice
            isMandatory: false
            jsonPath: $.searchCriteria.businessservice
          - name: assg.assignee
            isMandatory: false
            jsonPath: $.searchCriteria.assignee
          - name: booking.booking_status
            isMandatory: false
            operator: IN
            jsonPath: $.searchCriteria.bookingStatus
          - name: applicant.applicant_mobile_no
            isMandatory: false
            jsonPath: $.searchCriteria.mobileNumber
        pagination:
          noOfRecords: $.searchCriteria.noOfRecords
          offset: $.searchCriteria.offset
      output:
        jsonFormat: {"ResponseInfo": {},"totalCount": []}
        outJsonPath: $.totalCount
        responseInfoPath: $.ResponseInfo

