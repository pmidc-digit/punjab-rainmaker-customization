SearchDefinitions:
  moduleName: chb-services
  summary: Community Hall Booking Services Inbox API
  version: 1.0.0
  definitions:

    # ============================================================
    # 1. inboxchbsearch (ASC)
    # ============================================================
    - name: inboxchbsearch
      query:
        baseQuery: |
          SELECT row_to_json(result) FROM (
            SELECT DISTINCT(booking.booking_no),
                   pi.createdtime,
                   pi.status AS status_id,
                   ws.state AS status_name,
                   ws.applicationStatus,
                   booking.booking_id,
                   booking.tenant_id,
                   booking.booking_status,
                   booking.application_date,
                   booking.payment_date,
                   booking.community_hall_code,
                   booking.special_category,
                   booking.purpose,
                   booking.purpose_description,
                   applicant.applicant_name,
                   applicant.applicant_mobile_no,
                   applicant.applicant_email_id
            FROM eg_chb_booking_detail booking
            INNER JOIN eg_chb_applicant_detail applicant 
                ON applicant.booking_id = booking.booking_id
            INNER JOIN LATERAL (
                SELECT *
                FROM eg_wf_processinstance_v2 wf
                WHERE wf.businessid = booking.booking_no
                ORDER BY wf.createdtime ASC
                LIMIT 1
            ) pi ON TRUE
            LEFT JOIN eg_wf_state_v2 ws ON ws.uuid = pi.status

            /* conditional assignee join */
            LEFT JOIN eg_wf_assignee_v2 assg 
              ON pi.id = assg.processinstanceid

            $where

            ORDER BY pi.createdtime ASC
            $pagination
          ) result
        groupBy:
        orderBy:

      searchParams:
        condition: AND
        params:
          - name: booking.tenant_id
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId

          - name: booking.booking_id
            isMandatory: false
            jsonPath: $.searchCriteria.id

          - name: pi.status
            isMandatory: false
            jsonPath: $.searchCriteria.status
            operator: IN

          - name: booking.booking_no
            isMandatory: false
            jsonPath: $.searchCriteria.applicationNumber

          - name: pi.businessservice
            isMandatory: false
            jsonPath: $.searchCriteria.businessservice

          - name: assg.assignee
            isMandatory: false
            jsonPath: $.searchCriteria.assignee

          - name: booking.booking_status
            isMandatory: false
            jsonPath: $.searchCriteria.bookingStatus

          - name: applicant.applicant_mobile_no
            isMandatory: false
            jsonPath: $.searchCriteria.mobileNumber

          - name: booking.community_hall_code
            isMandatory: false
            jsonPath: $.searchCriteria.communityHallCode

          - name: booking.special_category
            isMandatory: false
            jsonPath: $.searchCriteria.specialCategory

          - name: booking.purpose
            isMandatory: false
            jsonPath: $.searchCriteria.purpose

        pagination:
          noOfRecords: $.searchCriteria.noOfRecords
          offset: $.searchCriteria.offset

      output:
        jsonFormat: {"ResponseInfo": {}, "bookingApplication": []}
        outJsonPath: $.bookingApplication
        responseInfoPath: $.ResponseInfo

    # ============================================================
    # 2. inboxchbsearchcount (NO pagination)
    # ============================================================
    - name: inboxchbsearchcount
      query:
        baseQuery: |
          SELECT row_to_json(result) FROM (
            SELECT COUNT(DISTINCT booking.booking_no) AS totalCount
            FROM eg_chb_booking_detail booking
            INNER JOIN eg_chb_applicant_detail applicant 
                ON applicant.booking_id = booking.booking_id
            INNER JOIN LATERAL (
                SELECT *
                FROM eg_wf_processinstance_v2 wf
                WHERE wf.businessid = booking.booking_no
                ORDER BY wf.createdtime DESC
                LIMIT 1
            ) pi ON TRUE

            LEFT JOIN eg_wf_assignee_v2 assg 
              ON pi.id = assg.processinstanceid

            $where
          ) result
        groupBy:
        orderBy:

      searchParams:
        condition: AND
        params:
          - name: booking.tenant_id
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId

          - name: booking.booking_id
            isMandatory: false
            jsonPath: $.searchCriteria.id

          - name: pi.status
            isMandatory: false
            jsonPath: $.searchCriteria.status
            operator: IN

          - name: booking.booking_no
            isMandatory: false
            jsonPath: $.searchCriteria.applicationNumber

          - name: pi.businessservice
            isMandatory: false
            jsonPath: $.searchCriteria.businessservice

          - name: assg.assignee
            isMandatory: false
            jsonPath: $.searchCriteria.assignee

          - name: booking.booking_status
            isMandatory: false
            jsonPath: $.searchCriteria.bookingStatus

          - name: applicant.applicant_mobile_no
            isMandatory: false
            jsonPath: $.searchCriteria.mobileNumber

          - name: booking.community_hall_code
            isMandatory: false
            jsonPath: $.searchCriteria.communityHallCode

          - name: booking.special_category
            isMandatory: false
            jsonPath: $.searchCriteria.specialCategory

          - name: booking.purpose
            isMandatory: false
            jsonPath: $.searchCriteria.purpose

        pagination:
          noOfRecords: $.searchCriteria.noOfRecords
          offset: $.searchCriteria.offset

      output:
        jsonFormat: {"ResponseInfo": {}, "totalCount": []}
        outJsonPath: $.totalCount
        responseInfoPath: $.ResponseInfo

