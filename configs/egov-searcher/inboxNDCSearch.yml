SearchDefinitions:
  moduleName: ndc-inbox
  summary: NDC Inbox Search API
  version: 1.0.0
  definitions:
    - name: inboxndcsearch
      query:
        baseQuery: >
          SELECT row_to_json(result) FROM (
            SELECT DISTINCT ON (a.uuid)
              a.uuid AS id,
              a.firstname AS fName,
              a.lastname AS lName,
              a.tenantid,
              a.mobile,
              a.email,
              a.address,
              a.applicationstatus,
              a.active,
              a.createdby AS a_createdby,
              a.lastmodifiedby AS a_lastmodifiedby,
              a.createdtime AS a_createdtime,
              a.lastmodifiedtime AS a_lastmodifiedtime,
              d.uuid AS d_uuid,
              d.applicantid AS d_applicantid,
              d.businessservice,
              d.consumercode,
              d.additionaldetails,
              d.dueamount,
              d.status AS d_status,
              pi.businessservice AS wf_businessservice,
              pi.action AS wf_action,
              pi.assigner AS wf_assigner,
              pi.status AS wf_status,
              pi.createdby AS wf_createdby,
              pi.lastmodifiedby AS wf_lastmodifiedby,
              assg.assignee AS wf_assignee
            FROM eg_ndc_applicants a
            LEFT JOIN eg_ndc_details d ON auuid. = d.applicantid
            INNER JOIN eg_wf_processinstance_v2 pi ON pi.businessid = a.uuid
            LEFT JOIN eg_wf_assignee_v2 assg ON pi.id = assg.processinstanceid
            $where
            AND pi.createdtime = (
              SELECT MAX(wf.createdtime)
              FROM eg_wf_processinstance_v2 wf
              WHERE wf.businessid = a.uuid
            )
            ORDER BY a.createdtime DESC
            $pagination
          ) result
      searchParams:
        condition: AND
        params:
          - name: a.tenantid
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId
          - name: a.uuid
            isMandatory: false
            jsonPath: $.searchCriteria.uuid
          - name: a.applicationstatus
            isMandatory: false
            jsonPath: $.searchCriteria.status
          - name: a.active
            isMandatory: false
            jsonPath: $.searchCriteria.active
          - name: a.mobile
            isMandatory: false
            jsonPath: $.searchCriteria.mobileNumber
          - name: d.businessservice
            isMandatory: false
            jsonPath: $.searchCriteria.businessservice
          - name: d.consumercode
            isMandatory: false
            jsonPath: $.searchCriteria.consumerCode
          - name: pi.status
            isMandatory: false
            jsonPath: $.searchCriteria.wfStatus
          - name: assg.assignee
            isMandatory: false
            jsonPath: $.searchCriteria.assignee
          - name: a.createdtime
            isMandatory: false
            jsonPath: $.searchCriteria.fromDate
          - name: a.createdtime
            isMandatory: false
            jsonPath: $.searchCriteria.toDate
          - name: concat(a.firstname, ' ', a.lastname)
            isMandatory: false
            jsonPath: $.searchCriteria.name
      pagination:
        noOfRecords: $.searchCriteria.noOfRecords
        offset: $.searchCriteria.offset
      output:
        jsonFormat: {"ResponseInfo": {}, "NDCApplications": []}
        outJsonPath: $.Services
        responseInfoPath: $.ResponseInfo

    - name: inboxndcsearchcount
      query:
        baseQuery: >
          SELECT COUNT(DISTINCT a.uuid) AS TotalCount
          FROM eg_ndc_applicants a
          LEFT JOIN eg_ndc_details d ON a.uuid = d.applicantid
          INNER JOIN eg_wf_processinstance_v2 pi ON pi.businessid = a.uuid
          LEFT JOIN eg_wf_assignee_v2 assg ON pi.id = assg.processinstanceid
          $where
          AND pi.createdtime = (
            SELECT MAX(wf.createdtime)
            FROM eg_wf_processinstance_v2 wf
            WHERE wf.businessid = a.uuid
          )
      searchParams:
        condition: AND
        params:
          - name: a.tenantid
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId
          - name: a.uuid
            isMandatory: false
            jsonPath: $.searchCriteria.uuid
          - name: a.applicationstatus
            isMandatory: false
            jsonPath: $.searchCriteria.status
          - name: a.active
            isMandatory: false
            jsonPath: $.searchCriteria.active
          - name: a.mobile
            isMandatory: false
            jsonPath: $.searchCriteria.mobileNumber
          - name: d.businessservice
            isMandatory: false
            jsonPath: $.searchCriteria.businessservice
          - name: d.consumercode
            isMandatory: false
            jsonPath: $.searchCriteria.consumerCode
          - name: pi.status
            isMandatory: false
            jsonPath: $.searchCriteria.wfStatus
          - name: assg.assignee
            isMandatory: false
            jsonPath: $.searchCriteria.assignee
          - name: a.createdtime
            isMandatory: false
            jsonPath: $.searchCriteria.fromDate
          - name: a.createdtime
            isMandatory: false
            jsonPath: $.searchCriteria.toDate
          - name: concat(a.firstname, ' ', a.lastname)
            isMandatory: false
            jsonPath: $.searchCriteria.name
      output:
        jsonFormat: {"ResponseInfo": {}, "TotalCount": {}}
        outJsonPath: $.TotalCount
        responseInfoPath: $.ResponseInfo

