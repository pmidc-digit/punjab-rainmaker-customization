SearchDefinitions:
  moduleName: noc-services
  summary: NOC Services Inbox API
  version: 1.0.0
  definitions:
    - name: inboxnocsearch
      query:
        baseQuery: |
          Select row_to_json(result) from (
            select DISTINCT(noc.applicationno), 
                   pi.createdtime, 
                   pi.status as status_id, 
                   noc.id,
                   noc.tenantid,
                   noc.status,
                   noc.createdby,
                   noc.lastmodifiedby,
                   noc.createdtime as application_date,
                   noc.lastmodifiedtime,
                   noc.applicationType,
                   noc.accountid
            from eg_noc as noc
            INNER JOIN eg_wf_processinstance_v2 pi ON pi.businessid = noc.applicationno
            LEFT JOIN eg_wf_assignee_v2 assg ON pi.id = assg.processinstanceid
            LEFT JOIN eg_noc_owner owner ON owner.nocid = noc.id
            LEFT JOIN eg_noc_details nd ON nd.nocid = noc.id
            LEFT JOIN LATERAL (
              SELECT COALESCE(nd.additionaldetails->>'isMigrationTrue', 'false') AS ismigrationtrue
            ) mig ON TRUE
            $where 
            AND pi.latest = TRUE
            order by noc.createdtime asc
            $pagination
          ) result
        groupBy:
        orderBy:
      searchParams:
        condition: AND
        params:
          - name: noc.tenantid
            isMandatory: true
            jsonPath: $.searchCriteria.tenantId
          - name: noc.id
            isMandatory: false
            jsonPath: $.searchCriteria.id
          - name: pi.status
            isMandatory: false
            jsonPath: $.searchCriteria.status
            operator: IN
          - name: noc.applicationNo
            isMandatory: false
            jsonPath: $.searchCriteria.applicationNo
          - name: pi.businessservice
            isMandatory: false
            jsonPath: $.searchCriteria.businessservice
          - name: assg.assignee
            isMandatory: false
            jsonPath: $.searchCriteria.assignee
          - name: noc.status
            isMandatory: false
            jsonPath: $.searchCriteria.nocStatus
          - name: noc.applicationType
            isMandatory: false
            jsonPath: $.searchCriteria.applicationType
          - name: noc.accountid
            isMandatory: false
            jsonPath: $.searchCriteria.accountId
          - name: noc.createdby
            isMandatory: false
            jsonPath: $.searchCriteria.userid
            operator: IN
          - name: owner.uuid
            isMandatory: false
            jsonPath: $.searchCriteria.ownerUuid
            operator: IN
          - name: mig.ismigrationtrue
            isMandatory: false
            jsonPath: $.searchCriteria.isMigrationTrue
        pagination:
          noOfRecords: $.searchCriteria.noOfRecords
          offset: $.searchCriteria.offset
      output:
        jsonFormat: {"ResponseInfo": {},"Noc": []}
        outJsonPath: $.Noc
        responseInfoPath: $.ResponseInfo

