          - name: ser.servicecode
            isMandatory: false
            jsonPath: $.searchCriteria.serviceCode
          - name: assg.assignee
            isMandatory: false
            jsonPath: $.searchCriteria.assignee
          - name: ads.locality
            isMandatory: false
            jsonPath: $.searchCriteria.locality
          - name: ser.accountid
            isMandatory: false
            jsonPath: $.searchCriteria.userid
          - name: pi.businessservice
            isMandatory: false
            jsonPath: $.searchCriteria.businessservice
          - name: ser.createdtime
