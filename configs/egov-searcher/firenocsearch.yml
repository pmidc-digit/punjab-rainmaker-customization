SearchDefinitions:
 moduleName: fn-services
 summary: Fire NOC Services Inbox API
 version: 1.0.0
 definitions:

 - name: inboxfnsearchasc
   query:
    baseQuery: Select row_to_json(result) from
          (
          select DISTINCT(fnd.firenocuuid) as uuid, fnd.applicationnumber as applicationnumber, fnd.createdtime as createdtime
          from eg_fn_firenocdetail as fnd
          INNER JOIN eg_fn_firenoc fn ON fnd.firenocuuid = fn.uuid
          INNER JOIN eg_fn_owner owner ON fnd.uuid = owner.firenocdetailsuuid
          INNER JOIN eg_fn_address addr ON fnd.uuid = addr.firenocdetailsuuid
          INNER JOIN eg_wf_processinstance_v2 pi ON pi.businessid = fnd.applicationnumber
          LEFT JOIN eg_wf_assignee_v2 assg ON pi.id = assg.processinstanceid
          $where
          AND pi.createdtime IN (select max(createdtime) from eg_wf_processinstance_v2 wf where wf.businessid = fnd.applicationnumber GROUP BY wf.businessid)
          order by fnd.createdtime asc $pagination
          ) result
    groupBy:
    orderBy:
   searchParams:
    condition: AND
    params:
    - name: fnd.tenantid
      isMandatory: true
      operator: ILIKE
      jsonPath: $.searchCriteria.tenantId
    - name: fnd.applicationnumber
      isMandatory: false
      jsonPath: $.searchCriteria.applicationNumber
    - name: fn.firenocnumber
      isMandatory: false
      jsonPath: $.searchCriteria.fireNOCNumber
    - name: fnd.firenoctype
      isMandatory: false
      jsonPath: $.searchCriteria.fireNOCType
    - name: fnd.firestationid
      isMandatory: false
      jsonPath: $.searchCriteria.fireStationId
    - name: addr.locality
      isMandatory: false
      jsonPath: $.searchCriteria.locality
    - name: assg.assignee
      isMandatory: false
      jsonPath: $.searchCriteria.assignee
    - name: pi.status
      isMandatory: false
      jsonPath: $.searchCriteria.status
    - name: owner.useruuid
      isMandatory: false
      jsonPath: $.searchCriteria.userid
    - name: pi.businessservice
      isMandatory: false
      jsonPath: $.searchCriteria.businessservice
    - name: fnd.financialyear
      isMandatory: false
      jsonPath: $.searchCriteria.financialYear
    pagination:
      noOfRecords: $.searchCriteria.noOfRecords
      offset: $.searchCriteria.offset
   output:
    jsonFormat: {"ResponseInfo": {},"FireNOCs": []}
    outJsonPath: $.FireNOCs
    responseInfoPath: $.ResponseInfo

