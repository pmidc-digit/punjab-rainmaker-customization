serviceMaps:
  serviceName: property-rate
  mappings:
  - version: 1.0
    description: Persists revenue property integration rates (Create)
    fromTopic: save-property-rate-topic
    isTransaction: true
    queryMaps:
    - query: INSERT INTO public.revenue_property_integration(id, propertyid, tenantid, districtid, tehsilid, village_id, isurban, segmentid, categoryid, subcategoryid, locality, unit, isproratacal, createdby, lastmodifiedby, createdtime, lastmodifiedtime) VALUES (?::uuid, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
      basePath: PropertyRates.*
      jsonMaps:
      - jsonPath: $.PropertyRates.*.id
      - jsonPath: $.PropertyRates.*.propertyId
      - jsonPath: $.PropertyRates.*.tenantId
      - jsonPath: $.PropertyRates.*.districtId
      - jsonPath: $.PropertyRates.*.tehsilId
      - jsonPath: $.PropertyRates.*.villageId
      - jsonPath: $.PropertyRates.*.isUrban
      - jsonPath: $.PropertyRates.*.segmentId
      - jsonPath: $.PropertyRates.*.categoryId
      - jsonPath: $.PropertyRates.*.subCategoryId
      - jsonPath: $.PropertyRates.*.locality
      - jsonPath: $.PropertyRates.*.unit
      - jsonPath: $.PropertyRates.*.isActive
      - jsonPath: $.PropertyRates.*.createdBy
      - jsonPath: $.PropertyRates.*.lastModifiedBy
      - jsonPath: $.PropertyRates.*.createdTime
      - jsonPath: $.PropertyRates.*.lastModifiedTime

  # ADDED: Update mapping
  - version: 1.0
    description: Updates existing revenue property integration rates
    fromTopic: update-property-rate-topic
    isTransaction: true
    queryMaps:
    - query: UPDATE public.revenue_property_integration SET districtid = ?, tehsilid = ?, village_id = ?, isurban = ?, segmentid = ?, categoryid = ?, subcategoryid = ?, locality = ?, unit = ?, isproratacal = ?, lastmodifiedby = ?, lastmodifiedtime = ? WHERE id = ?::uuid AND propertyid = ?;
      basePath: PropertyRates.*
      jsonMaps:
      - jsonPath: $.PropertyRates.*.districtId
      - jsonPath: $.PropertyRates.*.tehsilId
      - jsonPath: $.PropertyRates.*.villageId
      - jsonPath: $.PropertyRates.*.isUrban
      - jsonPath: $.PropertyRates.*.segmentId
      - jsonPath: $.PropertyRates.*.categoryId
      - jsonPath: $.PropertyRates.*.subCategoryId
      - jsonPath: $.PropertyRates.*.locality
      - jsonPath: $.PropertyRates.*.unit
      - jsonPath: $.PropertyRates.*.isActive
      - jsonPath: $.PropertyRates.*.lastModifiedBy
      - jsonPath: $.PropertyRates.*.lastModifiedTime
      # WHERE clause parameters
      - jsonPath: $.PropertyRates.*.id
      - jsonPath: $.PropertyRates.*.propertyId