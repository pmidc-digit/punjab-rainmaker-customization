serviceMaps:
  serviceName: challan-generation
  mappings:
    - version: 1.0.0
      description: Persists challan details in eg_challan  table
      fromTopic: save-challan-generation
      isTransaction: true
      queryMaps:

        - query: INSERT INTO eg_challan( id, accountid, tenantid, challanNo, businessService, referenceId, applicationStatus,taxPeriodFrom,taxPeriodTo, additionalDetail, createdby, lastmodifiedby, createdtime, lastmodifiedtime,description,filestoreid,challanstatus) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?,?,?,?);
          basePath: Challan
          jsonMaps:
            - jsonPath: $.Challan.id

            - jsonPath: $.Challan.citizen.uuid

            - jsonPath: $.Challan.tenantId

            - jsonPath: $.Challan.challanNo

            - jsonPath: $.Challan.businessService

            - jsonPath: $.Challan.referenceId

            - jsonPath: $.Challan.applicationStatus

            - jsonPath: $.Challan.taxPeriodFrom

            - jsonPath: $.Challan.taxPeriodTo

            - jsonPath: $.Challan.additionalDetail
              type: JSON
              dbType: JSONB

            - jsonPath: $.Challan.auditDetails.createdBy

            - jsonPath: $.Challan.auditDetails.lastModifiedBy

            - jsonPath: $.Challan.auditDetails.createdTime

            - jsonPath: $.Challan.auditDetails.lastModifiedTime

            - jsonPath: $.Challan.description

            - jsonPath: $.Challan.filestoreid
            - jsonPath: $.Challan.challanStatus

        - query: INSERT INTO eg_challanAddress( id, tenantid, doorno,plotNo,street,buildingName, latitude,longitude,locality, district, landmark,city,pincode, region, state,country, detail, challanId, createdby, lastmodifiedby, createdtime, lastmodifiedtime) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: Challan.address
          jsonMaps:
            - jsonPath: $.Challan.address.id

            - jsonPath: $.Challan.address.tenantId

            - jsonPath: $.Challan.address.doorNo

            - jsonPath: $.Challan.address.plotNo

            - jsonPath: $.Challan.address.street

            - jsonPath: $.Challan.address.buildingName

            - jsonPath: $.Challan.address.latitude

            - jsonPath: $.Challan.address.longitude

            - jsonPath: $.Challan.address.locality.code

            - jsonPath: $.Challan.address.district

            - jsonPath: $.Challan.address.landmark

            - jsonPath: $.Challan.address.city

            - jsonPath: $.Challan.address.pincode

            - jsonPath: $.Challan.address.region

            - jsonPath: $.Challan.address.state

            - jsonPath: $.Challan.address.country

            - jsonPath: $.Challan.address.detail

            - jsonPath: $.Challan.id

            - jsonPath: $.Challan.auditDetails.createdBy

            - jsonPath: $.Challan.auditDetails.lastModifiedBy

            - jsonPath: $.Challan.auditDetails.createdTime

            - jsonPath: $.Challan.auditDetails.lastModifiedTime






        - query: INSERT INTO eg_challan_citizen (uuid, tenantid, challanid, primaryrole,createdby, createdtime, lastmodifiedby, lastmodifiedtime) VALUES ( ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: Challan.citizen
          jsonMaps:
            - jsonPath: $.Challan.citizen.uuid
            - jsonPath: $.Challan.citizen.tenantId
            - jsonPath: $.Challan.id

            - jsonPath: $.Challan.citizen.primaryrole
              type: JSON
              dbType: JSONB




            - jsonPath: $.Challan.citizen.createdBy
            - jsonPath: $.Challan.citizen.createdDate
            - jsonPath: $.Challan.citizen.lastModifiedBy
            - jsonPath: $.Challan.citizen.lastModifiedDate



    - version: 1.0.0
      description: Update Challan details in eg_challan  table
      fromTopic: update-challan-generation
      isTransaction: true
      queryMaps:

        - query: UPDATE eg_challan SET applicationStatus = ?, taxPeriodFrom = ?,taxPeriodTo = ?, lastmodifiedby = ?,  lastmodifiedtime = ?,description = ?, additionalDetail = ?, filestoreid = ?, receiptnumber = ?, challanstatus = ? WHERE id=?;
          basePath: Challan
          jsonMaps:

            - jsonPath: $.Challan.applicationStatus

            - jsonPath: $.Challan.taxPeriodFrom

            - jsonPath: $.Challan.taxPeriodTo

            - jsonPath: $.Challan.auditDetails.lastModifiedBy

            - jsonPath: $.Challan.auditDetails.lastModifiedTime

            - jsonPath: $.Challan.description

            - jsonPath: $.Challan.additionalDetail
              type: JSON
              dbType: JSONB

            - jsonPath: $.Challan.filestoreid
            - jsonPath: $.Challan.receiptNumber
            - jsonPath: $.Challan.challanStatus

            - jsonPath: $.Challan.id


        - query: UPDATE eg_challanAddress SET tenantid = ?,doorno = ?,plotNo = ?,street = ?,buildingName = ?,latitude = ?,longitude = ?,locality = ?,district = ?,landmark = ?,city = ?,pincode= ?, region = ?,state = ?,country = ?,detail = ?,challanId = ?,lastmodifiedby = ?,lastmodifiedtime = ? WHERE id = ?

          basePath: Challan.address
          jsonMaps:

            - jsonPath: $.Challan.address.tenantId
            - jsonPath: $.Challan.address.doorNo
            - jsonPath: $.Challan.address.plotNo
            - jsonPath: $.Challan.address.street
            - jsonPath: $.Challan.address.buildingName
            - jsonPath: $.Challan.address.latitude
            - jsonPath: $.Challan.address.longitude
            - jsonPath: $.Challan.address.locality.code
            - jsonPath: $.Challan.address.district
            - jsonPath: $.Challan.address.landmark
            - jsonPath: $.Challan.address.city
            - jsonPath: $.Challan.address.pincode
            - jsonPath: $.Challan.address.region
            - jsonPath: $.Challan.address.state
            - jsonPath: $.Challan.address.country
            - jsonPath: $.Challan.address.detail
            - jsonPath: $.Challan.id
            - jsonPath: $.Challan.auditDetails.lastModifiedBy
            - jsonPath: $.Challan.auditDetails.lastModifiedTime
            - jsonPath: $.Challan.address.id




        - query: UPDATE eg_challan_citizen SET primaryrole = ?, lastmodifiedby = ?, lastmodifiedtime = ? WHERE uuid = ? AND tenantid = ?
          basePath: Challan.citizen
          jsonMaps:
            - jsonPath: $.Challan.citizen.primaryrole
              type: JSON
              dbType: JSONB

            - jsonPath: $.Challan.citizen.lastModifiedBy
            - jsonPath: $.Challan.citizen.lastModifiedDate

            - jsonPath: $.Challan.citizen.uuid
            - jsonPath: $.Challan.citizen.tenantId

        - query: INSERT INTO public.eg_challan_document_detail(document_detail_id, challan_id, document_type, filestore_id, createdby, lastmodifiedby, createdtime, lastmodifiedtime) VALUES (?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (document_detail_id) DO UPDATE SET challan_id = EXCLUDED.challan_id, document_type = EXCLUDED.document_type, filestore_id = EXCLUDED.filestore_id,createdby = EXCLUDED.createdby, lastmodifiedby = EXCLUDED.lastmodifiedby, createdtime = EXCLUDED.createdtime, lastmodifiedtime = EXCLUDED.lastmodifiedtime;

          basePath: Challan.documents.*
          jsonMaps:
           - jsonPath: $.Challan.documents.*.documentDetailId
           - jsonPath: $.Challan.documents.*.challanId
           - jsonPath: $.Challan.documents.*.documentType
           - jsonPath: $.Challan.documents.*.fileStoreId
           - jsonPath: $.Challan.auditDetails.createdBy
           - jsonPath: $.Challan.auditDetails.lastModifiedBy
           - jsonPath: $.Challan.auditDetails.createdTime
           - jsonPath: $.Challan.auditDetails.lastModifiedTime