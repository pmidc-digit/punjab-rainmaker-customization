 - version: 1.0
   name: GarbageConnection
   description: update ConnectionDetails in eg_gc_connection and eg_gc_service
   fromTopic: update-gc-workflow
   isTransaction: true
   queryMaps:

    - query: INSERT INTO eg_gc_connection_audit SELECT * FROM eg_gc_connection WHERE id = ?;
      basePath: $.GarbageConnection
      jsonMaps:
      - jsonPath: $.GarbageConnection.id

    - query: UPDATE eg_gc_connection SET applicationstatus=?, status=?, connectionno=?, action=?, lastModifiedBy=?, lastModifiedTime=?  WHERE id=?;
      basePath: $.GarbageConnection
      jsonMaps:

       - jsonPath: $.GarbageConnection.applicationStatus

       - jsonPath: $.GarbageConnection.status

       - jsonPath: $.GarbageConnection.connectionNo

       - jsonPath: $.GarbageConnection.processInstance.action

       - jsonPath: $.GarbageConnection.auditDetails.lastModifiedBy

       - jsonPath: $.GarbageConnection.auditDetails.lastModifiedTime

       - jsonPath: $.GarbageConnection.id

 - version: 1.0
   name: GarbageConnection
   description: save filestore ids
   fromTopic: save-gc-filestoreids
   isTransaction: true
   queryMaps:

    - query: INSERT INTO eg_gc_service_audit SELECT * FROM eg_gc_service WHERE connection_id = ?;
      basePath: $.GarbageConnection
      jsonMaps:
      - jsonPath: $.GarbageConnection.id

    - query: UPDATE eg_gc_service SET estimationfileStoreId = ?, sanctionfileStoreId = ?,estimationLetterDate = ?, appCreatedDate = ? WHERE connection_id=?;
      basePath: $.GarbageConnection
      jsonMaps:

      - jsonPath: $.GarbageConnection.additionalDetails.estimationFileStoreId

      - jsonPath: $.GarbageConnection.additionalDetails.sanctionFileStoreId

      - jsonPath: $.GarbageConnection.additionalDetails.estimationLetterDate

      - jsonPath: $.GarbageConnection.additionalDetails.appCreatedDate

      - jsonPath: $.GarbageConnection.id

 - version: 1.0

   description: Updates gc status for auto escalate

   fromTopic: gc-auto-escalation

   isTransaction: true

   queryMaps:
    - query: UPDATE eg_gc_connection SET applicationstatus=?, lastmodifiedby=?, lastmodifiedtime=? WHERE applicationno=? AND tenantId=?;

      basePath: ProcessInstances.*

      jsonMaps:

      - jsonPath: $.ProcessInstances.*.state.applicationStatus

      - jsonPath: $.ProcessInstances.*.auditDetails.lastModifiedBy

      - jsonPath: $.ProcessInstances.*.auditDetails.lastModifiedTime

      - jsonPath: $.ProcessInstances.*.businessId

      - jsonPath: $.ProcessInstances.*.tenantId

