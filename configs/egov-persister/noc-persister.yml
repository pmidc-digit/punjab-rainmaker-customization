serviceMaps:
  serviceName: noc-service
  version: 1.0.0
  mappings:
    - version: 1.0
      description: Create NOC entry
      fromTopic: save-noc-application
      isTransaction: true
      queryMaps:
        - query: >
            INSERT INTO eg_noc (
              id, applicationno, tenantid, status, createdby,
              lastmodifiedby, createdtime, lastmodifiedtime, nocno, applicationtype, noctype,
              accountid, applicationstatus
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.Noc
          jsonMaps:
            - jsonPath: $.Noc.id
            - jsonPath: $.Noc.applicationNo
            - jsonPath: $.Noc.tenantId
            - jsonPath: $.Noc.status
            - jsonPath: $.Noc.auditDetails.createdBy
            - jsonPath: $.Noc.auditDetails.lastModifiedBy
            - jsonPath: $.Noc.auditDetails.createdTime
            - jsonPath: $.Noc.auditDetails.lastModifiedTime
            - jsonPath: $.Noc.nocNo
            - jsonPath: $.Noc.applicationType
            - jsonPath: $.Noc.nocType
            - jsonPath: $.Noc.accountId
            - jsonPath: $.Noc.applicationStatus

        - query: >
            INSERT INTO eg_noc_auditdetails (
              id, applicationno, tenantid, status, createdby,
              lastmodifiedby, createdtime, lastmodifiedtime, nocno, applicationtype, noctype,
              accountid, applicationstatus
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.Noc
          jsonMaps:
            - jsonPath: $.Noc.id
            - jsonPath: $.Noc.applicationNo
            - jsonPath: $.Noc.tenantId
            - jsonPath: $.Noc.status
            - jsonPath: $.Noc.auditDetails.createdBy
            - jsonPath: $.Noc.auditDetails.lastModifiedBy
            - jsonPath: $.Noc.auditDetails.createdTime
            - jsonPath: $.Noc.auditDetails.lastModifiedTime
            - jsonPath: $.Noc.nocNo
            - jsonPath: $.Noc.applicationType
            - jsonPath: $.Noc.nocType
            - jsonPath: $.Noc.accountId
            - jsonPath: $.Noc.applicationStatus

        - query: >
            INSERT INTO eg_noc_document (
              uuid, documenttype, documentAttachment, documentuid, nocid, additionaldetails, createdby,
              lastmodifiedby, createdtime, lastmodifiedtime
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.Noc.documents.*
          jsonMaps:
            - jsonPath: $.Noc.documents.*.uuid
            - jsonPath: $.Noc.documents.*.documentType
            - jsonPath: $.Noc.documents.*.documentAttachment
            - jsonPath: $.Noc.documents.*.documentUid
            - jsonPath: $.Noc.documents.*.nocId
            - jsonPath: $.Noc.documents.*.additionalDetails
              type: JSON
              dbType: JSONB

            - jsonPath: $.Noc.documents.*.auditDetails.createdBy
            - jsonPath: $.Noc.documents.*.auditDetails.lastModifiedBy
            - jsonPath: $.Noc.documents.*.auditDetails.createdTime
            - jsonPath: $.Noc.documents.*.auditDetails.lastModifiedTime
        - query: >
            INSERT INTO eg_noc_details (
              id, nocid, additionaldetails, createdby, lastmodifiedby, createdtime, lastmodifiedtime, tenantid
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.Noc.nocDetails
          jsonMaps:
            - jsonPath: $.Noc.nocDetails.id
            - jsonPath: $.Noc.nocDetails.nocId
            - jsonPath: $.Noc.nocDetails.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.Noc.nocDetails.auditDetails.createdBy
            - jsonPath: $.Noc.nocDetails.auditDetails.lastModifiedBy
            - jsonPath: $.Noc.nocDetails.auditDetails.createdTime
            - jsonPath: $.Noc.nocDetails.auditDetails.lastModifiedTime
            - jsonPath: $.Noc.nocDetails.tenantId

            
        - query: > 
            INSERT INTO eg_noc_owner (
              id, tenantid, nocid, status, isprimaryowner,
              ownertype, ownershippercentage, institutionid, relationship,
              createdby, createdtime, lastmodifiedby, lastmodifiedtime, additionaldetails
            ) VALUES ( ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.Noc.owners.*

          jsonMaps:
            - jsonPath: $.Noc.owners.*.id
            - jsonPath: $.Noc.owners.*.tenantId
            - jsonPath: $.Noc.id  # nocid from eg_noc(id)
            - jsonPath: $.Noc.owners.*.status
            - jsonPath: $.Noc.owners.*.isPrimaryOwner
            - jsonPath: $.Noc.owners.*.type
            - jsonPath: $.Noc.owners.*.ownershipPercentage
            - jsonPath: $.Noc.owners.*.institutionId
            - jsonPath: $.Noc.owners.*.relationship
            - jsonPath: $.Noc.owners.*.createdBy
            - jsonPath: $.Noc.owners.*.createdDate
            - jsonPath: $.Noc.owners.*.lastModifiedBy
            - jsonPath: $.Noc.owners.*.lastModifiedDate
            - jsonPath: $.Noc.owners.*.additionalDetails
              type: JSON
              dbType: JSONB






    - version: 1.0
      description: Update NOC entry (strict UPDATE + auditdetails)
      fromTopic: update-noc-application
      isTransaction: true

      queryMaps:
        - query: >
            
             UPDATE eg_noc
              SET status = ?, applicationstatus = ?, nocno = ?,
              applicationtype = ?, noctype = ?,
              lastmodifiedby = ?, lastmodifiedtime = ?
              WHERE id = ?;

          basePath: $.Noc
          jsonMaps:
            - jsonPath: $.Noc.status
            - jsonPath: $.Noc.applicationStatus
            
            - jsonPath: $.Noc.nocNo
            - jsonPath: $.Noc.applicationType
            - jsonPath: $.Noc.nocType
            
            - jsonPath: $.Noc.auditDetails.lastModifiedBy
            - jsonPath: $.Noc.auditDetails.lastModifiedTime
            
            - jsonPath: $.Noc.id


            


        - query: >
             INSERT INTO eg_noc_auditdetails (
              id, applicationno, tenantid, status, createdby,
              lastmodifiedby, createdtime, lastmodifiedtime, nocno, applicationtype, noctype,
              accountid, applicationstatus
              ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.Noc
          jsonMaps:
            - jsonPath: $.Noc.id
            - jsonPath: $.Noc.applicationNo
            - jsonPath: $.Noc.tenantId
            - jsonPath: $.Noc.status
            - jsonPath: $.Noc.auditDetails.createdBy
            - jsonPath: $.Noc.auditDetails.lastModifiedBy
            - jsonPath: $.Noc.auditDetails.createdTime
            - jsonPath: $.Noc.auditDetails.lastModifiedTime
            - jsonPath: $.Noc.nocNo
            - jsonPath: $.Noc.applicationType
            - jsonPath: $.Noc.nocType
            - jsonPath: $.Noc.accountId
            - jsonPath: $.Noc.applicationStatus



        - query: >
             INSERT INTO eg_noc_document (
             uuid, documenttype,documentAttachment, documentuid, nocid,createdby,
             lastmodifiedby, createdtime, lastmodifiedtime
             ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)
              ON CONFLICT (uuid) DO UPDATE SET
               documenttype = EXCLUDED.documenttype,
               documentAttachment = EXCLUDED.documentAttachment,
               documentuid = EXCLUDED.documentuid,
               nocid = EXCLUDED.nocid,
               createdby = EXCLUDED.createdby,
               lastmodifiedby = EXCLUDED.lastmodifiedby,
               createdtime = EXCLUDED.createdtime,
               lastmodifiedtime = EXCLUDED.lastmodifiedtime;
          basePath: $.Noc.documents.*
          jsonMaps:
            - jsonPath: $.Noc.documents.*.uuid
            - jsonPath: $.Noc.documents.*.documentType
            - jsonPath: $.Noc.documents.*.documentAttachment
            - jsonPath: $.Noc.documents.*.documentUid
            - jsonPath: $.Noc.documents.*.nocId
            - jsonPath: $.Noc.documents.*.auditDetails.createdBy
            - jsonPath: $.Noc.documents.*.auditDetails.lastModifiedBy
            - jsonPath: $.Noc.documents.*.auditDetails.createdTime
            - jsonPath: $.Noc.documents.*.auditDetails.lastModifiedTime




        - query: >
             UPDATE eg_noc_details
             SET additionaldetails = ?, tenantid = ?,
             lastmodifiedby = ?, lastmodifiedtime = ?
             WHERE id = ?;
          basePath: $.Noc.nocDetails
          jsonMaps:

            - jsonPath: $.Noc.nocDetails.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.Noc.nocDetails.tenantId
            - jsonPath: $.Noc.nocDetails.auditDetails.lastModifiedBy
            - jsonPath: $.Noc.nocDetails.auditDetails.lastModifiedTime
            - jsonPath: $.Noc.nocDetails.id













    