    - topic: bpa-auto-escalation
      configKey: INDEX
      indexes:
        - name: bpa-auto-escalation-index
          type: general
          id: $.BPA.applicationNo, $.BPA.tenantId
          isBulk: false
          timeStampField: $.BPA.auditDetails.lastModifiedTime
          jsonPath: $
