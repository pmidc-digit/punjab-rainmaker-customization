    # Optional: Index for individual BPA documents
    - topic: save-bpa-buildingplan
      configKey: INDEX
      indexes:
        - name: bpa-document-index
          type: general
          id: $.BPA.documents.*.id, $.BPA.tenantId
          isBulk: true
          timeStampField: $.BPA.auditDetails.createdTime
          jsonPath: $.BPA.documents.*
          customJsonMapping:
            indexMapping:
              Document:
                id: id
                tenantId: tenantId
                buildingPlanId: buildingPlanId
                documentType: documentType
                fileStoreId: fileStoreId
                documentUid: documentUid
                additionalDetails: additionalDetails
                createdBy: createdBy
                lastModifiedBy: lastModifiedBy
                createdTime: createdTime
                lastModifiedTime: lastModifiedTime
              fieldMapping:
                - inJsonPath: $.id
                  outJsonPath: $.Document.id
                - inJsonPath: $.documentType
                  outJsonPath: $.Document.documentType
                - inJsonPath: $.fileStoreId
                  outJsonPath: $.Document.fileStoreId
                - inJsonPath: $.documentUid
                  outJsonPath: $.Document.documentUid
                - inJsonPath: $.additionalDetails
                  outJsonPath: $.Document.additionalDetails
                - inJsonPath: $['$parent'].BPA.id
                  outJsonPath: $.Document.buildingPlanId
                - inJsonPath: $['$parent'].BPA.tenantId
                  outJsonPath: $.Document.tenantId
                - inJsonPath: $['$parent'].BPA.auditDetails.createdBy
                  outJsonPath: $.Document.createdBy
                - inJsonPath: $['$parent'].BPA.auditDetails.lastModifiedBy
                  outJsonPath: $.Document.lastModifiedBy
                - inJsonPath: $['$parent'].BPA.auditDetails.createdTime
                  outJsonPath: $.Document.createdTime
                - inJsonPath: $['$parent'].BPA.auditDetails.lastModifiedTime
                  outJsonPath: $.Document.lastModifiedTime
