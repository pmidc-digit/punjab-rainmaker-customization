              fieldMapping:
                - inJsonPath: $.BPA.id
                  outJsonPath: $.Data.id
                - inJsonPath: $.BPA.tenantId
                  outJsonPath: $.Data.tenantId
                - inJsonPath: $.BPA.applicationNo
                  outJsonPath: $.Data.applicationNo
                - inJsonPath: $.BPA.approvalNo
                  outJsonPath: $.Data.approvalNo
                - inJsonPath: $.BPA.applicationDate
                  outJsonPath: $.Data.applicationDate
