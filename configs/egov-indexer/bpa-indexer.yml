                  outJsonPath: $.Data.edcrNumber
                - inJsonPath: $.BPA.landId
                  outJsonPath: $.Data.landId
                - inJsonPath: $.BPA.accountId
                  outJsonPath: $.Data.accountId
                - inJsonPath: $.BPA.businessService
