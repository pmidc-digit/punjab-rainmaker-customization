                - inJsonPath: $.BPA.status
                  outJsonPath: $.Data.status
                - inJsonPath: $.BPA.approvalDate
                  outJsonPath: $.Data.approvalDate
                - inJsonPath: $.BPA.additionalDetails
                  outJsonPath: $.Data.additionalDetails
                - inJsonPath: $.BPA.auditDetails.createdBy
                  outJsonPath: $.Data.createdBy
                - inJsonPath: $.BPA.auditDetails.lastModifiedBy
                  outJsonPath: $.Data.lastModifiedBy
                - inJsonPath: $.BPA.auditDetails.createdTime
                  outJsonPath: $.Data.createdTime
                - inJsonPath: $.BPA.auditDetails.lastModifiedTime
                  outJsonPath: $.Data.lastModifiedTime
                - inJsonPath: $.BPA.documents
                  outJsonPath: $.Data.documents

