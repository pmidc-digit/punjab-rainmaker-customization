
ServiceMaps:
  serviceName: bpa-services
  version: 1.0.0
  mappings:
    - topic: save-bpa-buildingplan
      configKey: INDEX
      indexes:
        - name: bpa-buildingplan-index
          type: general
          id: $.BPA.id, $.BPA.tenantId
          isBulk: false
          timeStampField: $.BPA.auditDetails.createdTime
          jsonPath: $
          customJsonMapping:
            indexMapping:
              Data:
                id: id
                tenantId: tenantId
                applicationNo: applicationNo
                approvalNo: approvalNo
                applicationDate: applicationDate
                edcrNumber: edcrNumber
                landId: landId
                accountId: accountId
                businessService: businessService
                status: status
                approvalDate: approvalDate
                additionalDetails: additionalDetails
                createdBy: createdBy
                lastModifiedBy: lastModifiedBy
                createdTime: createdTime
                lastModifiedTime: lastModifiedTime
                documents: documents
              fieldMapping:
                - inJsonPath: $.BPA.id
                  outJsonPath: $.Data.id
                - inJsonPath: $.BPA.tenantId
                  outJsonPath: $.Data.tenantId
                - inJsonPath: $.BPA.applicationNo
                  outJsonPath: $.Data.applicationNo
                - inJsonPath: $.BPA.approvalNo
                  outJsonPath: $.Data.approvalNo
                - inJsonPath: $.BPA.applicationDate
                  outJsonPath: $.Data.applicationDate
                - inJsonPath: $.BPA.edcrNumber
                  outJsonPath: $.Data.edcrNumber
                - inJsonPath: $.BPA.landId
