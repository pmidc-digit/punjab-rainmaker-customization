#                outJsonPath: $.Data.questions
#              - inJsonPath: $.sections.*.questions.*.question.uuid
#                outJsonPath: $.Data.questions
#              - inJsonPath: $.sections.*.questions.*.question.status
#                outJsonPath: $.Data.questions
#              - inJsonPath: $.sections.*.questions.*.question.type
#                outJsonPath: $.Data.questions
#              - inJsonPath: $.sections.*.questions.*.question.categoryId
#                outJsonPath: $.Data.questions
#              - inJsonPath: $.sections.*.questions.*.question.auditDetails
#                outJsonPath: $.Data.questions
#
