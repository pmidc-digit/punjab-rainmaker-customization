#                outJsonPath: $.Data.questionResponses.*.options
#              - inJsonPath: $.sections.*.questions.*.question.options.*.optionText
#                outJsonPath: $.Data.questionResponses.*.options
#              - inJsonPath: $.sections.*.questions.*.question.options.*.weightage
