    - topic: update-scorecard-survey-active
      configKey: INDEX
      indexes:
        - name: survey-entity-update-index
          type: general
          id: $.uuid, $.tenantId
          isBulk: true
          timeStampField: $.lastModifiedTime
          jsonPath: $
          customJsonMapping:
            indexMapping: {"Data":{"uuid": "uuid","tenantId": "tenantId","active": "active","lastModifiedBy": "lastModifiedBy","lastModifiedTime": "lastModifiedTime","auditDetails": {}}}
            fieldMapping:
              - inJsonPath: $.uuid
                outJsonPath: $.Data.uuid
              - inJsonPath: $.tenantId
                outJsonPath: $.Data.tenantId
              - inJsonPath: $.active
                outJsonPath: $.Data.active
              - inJsonPath: $.lastModifiedBy
                outJsonPath: $.Data.lastModifiedBy
              - inJsonPath: $.lastModifiedTime
                outJsonPath: $.Data.lastModifiedTime
              - inJsonPath: $.auditDetails
                outJsonPath: $.Data.auditDetails

    - topic: save-ss-answer
      configKey: INDEX
      indexes:
        - name: survey-answer-index
          type: general
          id: $.uuid, $.surveyResponseUuid
          isBulk: true
          timeStampField: $.auditDetails.createdTime
          jsonPath: $.SurveyResponse.answers.*
          customJsonMapping:
            indexMapping: {"Data":{"uuid": "uuid","questionUuid": "questionUuid","surveyResponseUuid": "surveyResponseUuid","sectionUuid": "sectionUuid","comments": "comments","auditDetails": {},"answerDetails": []}}
            fieldMapping:
              - inJsonPath: $.uuid
                outJsonPath: $.Data.uuid
              - inJsonPath: $.questionUuid
                outJsonPath: $.Data.questionUuid
              - inJsonPath: $.surveyResponseUuid
                outJsonPath: $.Data.surveyResponseUuid
              - inJsonPath: $.sectionUuid
                outJsonPath: $.Data.sectionUuid
              - inJsonPath: $.comments
                outJsonPath: $.Data.comments
              - inJsonPath: $.auditDetails
                outJsonPath: $.Data.auditDetails
              - inJsonPath: $.answerDetails.*.uuid
                outJsonPath: $.Data.answerDetails
              - inJsonPath: $.answerDetails.*.answerUuid
                outJsonPath: $.Data.answerDetails
              - inJsonPath: $.answerDetails.*.answerType
                outJsonPath: $.Data.answerDetails
              - inJsonPath: $.answerDetails.*.answerContent
                outJsonPath: $.Data.answerDetails
              - inJsonPath: $.answerDetails.*.weightage
                outJsonPath: $.Data.answerDetails
              - inJsonPath: $.answerDetails.*.comments
                outJsonPath: $.Data.answerDetails
              - inJsonPath: $.answerDetails.*.auditDetails
                outJsonPath: $.Data.answerDetails